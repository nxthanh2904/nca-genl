ộ Tokenizer hiện đại của LLM (như BPE hoặc WordPiece) lại sử dụng phương pháp **Subword Tokenization** thay vì Whole-word Tokenization?\n   * *Đáp án:* Để giữ kích thước bộ từ điển (Vocabulary) hợp lý trong khi **giảm đáng kể vấn đề Out-of-Vocabulary (OOV)** đối với các từ hiếm, từ ghép phức tạp hoặc từ mới thông qua việc tách và ghép các mảnh từ con (và có thể kết hợp byte-level fallback để bao phủ rộng hơn tùy thiết kế tokenizer).\n4. **Câu 4:** Một công ty truyền thông muốn xây dựng một công cụ tự động phân loại hàng triệu bình luận của độc giả thành 3 nhãn: *Tích cực, Tiêu cực, Trung lập* (Sentiment Analysis), đồng thời trích xuất tên các nhân vật và địa danh được nhắc đến trong bài báo (NER). Biến thể kiến trúc Transformer nào là phù hợp và hiệu quả về mặt chi phí tính toán nhất?\n   * *Đáp án:* **Encoder-only (như BERT, RoBERTa)** vì cơ chế Bidirectional Self-Attention đọc hiểu ngữ cảnh hai chiều trái-phải cùng lúc, rất hiệu quả cho các bài toán hiểu và phân tích ngôn ngữ (NLU).\n5. **Câu 5:** Trong công thức Scaled Dot-Product Attention $\\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$, tại sao tích vô hướng $QK^T$ lại được chia cho $\\sqrt{d_k}$ trước khi đưa vào hàm Softmax?\n   * *Đáp án:* Để **giữ phương sai của tích vô hướng $QK^T$ không phình quá lớn khi số chiều $d_k$ cao**, tránh đẩy hàm Softmax vào vùng bão hòa có đạo hàm rất nhỏ gây ra hiện tượng **triệt tiêu đạo hàm (Vanishing Gradients)**.\n6. **Câu 6:** Một mô hình sử dụng kiến trúc **Mixture of Experts (MoE)** như Mixtral 8x7B có tổng cộng khoảng 47 tỷ tham số nhưng chi phí tính toán FLOPs trên mỗi token lại tương đương một mô hình ~13 tỷ tham số. Cơ chế nào giúp đạt được điều này?\n   * *Đáp án:* Nhờ một **Mạng định tuyến (Router / Gating Network)** chỉ chọn kích hoạt một số ít chuyên gia (**Top-K Experts**, ví dụ 2 trên 8 mạng FFN) cho mỗi token thay vì tính toán qua toàn bộ các mạng FFN của mô hình.\n"},{"id":"mod05","file":"Module_05_Model_Selection.md","badge":"MODULE 05","shortTitle":"Model Selection \u0026 Evaluation","domain":"Experimentation (22%)","weight":"Exp \u0026 Data","icon":"🎯","content":"# Module 5: Model Selection (Phương pháp Đánh giá và Lựa chọn Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 5 (Thuộc Domain \"Experimentation - 22%\" \u0026 \"Data Analysis - 14%\"):**\n\u003e Nắm vững **Quy trình 6 bước lựa chọn Foundation Model**; bảng so sánh **SLM vs. LLM** và **Open-Weights vs. Proprietary Models**; các chỉ số hiệu năng suy luận thực tế (**TTFT, ITL/TPOT, Throughput**); cấu trúc chuẩn của một **Model Card** \u0026 các bộ **Benchmark chuẩn (MMLU, HumanEval, GSM8K, TruthfulQA)**; làm chủ **Ma trận Nhầm lẫn (Confusion Matrix: TP, TN, FP, FN)**, khi nào ưu tiên **Precision vs. Recall vs. F1-Score vs. ROC-AUC**, các độ đo Hồi quy (**MAE, MSE, RMSE, $R^2$**); phân biệt chính xác các độ đo ngôn ngữ vàng (**BLEU** cho Dịch máy, **ROUGE** cho Tóm tắt, **BERTScore**, **Cosine Similarity** cho RAG, **RAG Triad**); và các phương pháp kiểm thử **k-Fold Cross-Validation**, **A/B Testing**, **Canary Deployment**.\n\n---\n\n## 1. Khung quy trình 6 bước lựa chọn Foundation Model\n\nKhi đứng trước hàng trăm nghìn mô hình trên Hugging Face hay các API thương mại (OpenAI, Anthropic, NVIDIA NIM), một kỹ sư AI chuyên nghiệp không chọn theo cảm tính mà tuân thủ **Quy trình 6 bước chuẩn**:\n\n```mermaid\nflowchart LR\n    S1[\"1. Define Need\u003cbr/\u003eXác định rõ bài toán,\u003cbr/\u003eSLA độ trễ \u0026 Ngân sách\"]\n    S2[\"2. Shortlist Models\u003cbr/\u003eLọc ra 2-4 ứng viên sáng giá\u003cbr/\u003e(Open-weights vs Proprietary)\"]\n    S3[\"3. Compare Specs\u003cbr/\u003eĐọc Model Card:\u003cbr/\u003eTham số, VRAM, License, Context\"]\n    S4[\"4. Evaluate Metrics\u003cbr/\u003eĐo lường bằng Metric chuẩn:\u003cbr/\u003eBLEU, ROUGE, F1, Cosine Sim\"]\n    S5[\"5. Run Tests\u003cbr/\u003eKiểm thử dữ liệu thực tế:\u003cbr/\u003eCross-Validation / A/B Test\"]\n    S6[\"6. Select Best\u003cbr/\u003eChọn mô hình tối ưu:\u003cbr/\u003eHiệu năng + Chi phí + Độ ổn định\"]\n\n    S1 --\u003e S2 --\u003e S3 --\u003e S4 --\u003e S5 --\u003e S6\n```\n\n### Chi tiết từng bước:\n1. **Define Need (Xác định nhu cầu nghiệp vụ \u0026 Ràng buộc kỹ thuật):**\n   * Làm rõ bài toán cốt lõi cần giải quyết (Sinh văn bản, tóm tắt tài liệu, viết code, trích xuất thực thể, sinh ảnh hay dịch thuật).\n   * Xác định rõ ràng buộc vận hành (**Non-functional requirements**): Yêu cầu độ trễ tối đa bao nhiêu mili-giây (**SLA Latency**), lượng truy cập đồng thời (Concurrency), yêu cầu bảo mật dữ liệu (có được gửi ra Cloud ngoài hay bắt buộc chạy On-premise), và ngân sách phần cứng/API.\n2. **Shortlist Model (Lập danh sách rút gọn):**\n   * Chọn ra từ **2 đến 4 mô hình ứng viên** sáng giá dựa trên bảng xếp hạng cộng đồng, tài liệu hỗ trợ và hình thức phân phối (**Open-Source / Open-Weights** tự host như *LLaMA-3, Mistral, NVIDIA Nemotron* hay **Proprietary / Closed-Source** gọi qua API như *GPT-4o, Claude 3.5*).\n3. **Compare Specs (So sánh thông số kỹ thuật qua Model Card):**\n   * Đọc kỹ **Model Card** để đối chiếu số lượng tham số, độ dài cửa sổ ngữ cảnh (**Context Window**), yêu cầu dung lượng bộ nhớ GPU (**VRAM**), ngôn ngữ hỗ trợ và đặc biệt là **Giấy phép bản quyền thương mại (License: Apache 2.0, MIT hay Non-commercial CC-BY-NC)**.\n4. **Evaluate Model (Đánh giá bằng độ đo kỹ thuật):**\n   * Chấm điểm tự động bằng các bộ chỉ số chuyên dụng tương ứng với từng bài toán (**BLEU** cho dịch thuật, **ROUGE** cho tóm tắt, **Cosine Similarity** cho tìm kiếm ngữ nghĩa, **F1-Score / ROC-AUC** cho phân loại, **Perplexity** cho mô hình ngôn ngữ).\n5. **Run Tests (Thực nghiệm kiểm thử trên dữ liệu thật):**\n   * Chạy thử nghiệm trên chính tập dữ liệu thực tế của doanh nghiệp (Golden Dataset) bằng **k-Fold Cross-Validation** (khi ít dữ liệu) hoặc **A/B Testing / Canary Rollout** (trên môi trường Production).\n6. **Select Best (Chọn mô hình tối ưu nhất - The Golden Trade-off):**\n   * Ra quyết định dựa trên phương trình cân bằng đa mục tiêu (chứ không chỉ chọn mô hình điểm cao nhất mà quá đắt/quá chậm):\n     $$\\text{Giá trị Tối ưu} = \\text{Chất lượng (Accuracy)} + \\text{Tốc độ (Latency/Throughput)} + \\text{Chi phí (TCO)} + \\text{Độ tin cậy \\\u0026 Bảo mật}$$\n\n---\n\n## 2. So sánh chuyên sâu: SLM vs. LLM, Open-Weights vs. Proprietary \u0026 Các Chỉ số Tốc độ Suy luận\n\n### 2.1. Small Language Model (SLM) vs. Large Language Model (LLM)\n\u003e [!TIP]\n\u003e **Góc nhìn Developer:** Không phải bài toán nào cũng vác \"đại bác\" LLM 70B/405B ra bắn! Nếu bạn chỉ cần phân loại ý định (Intent classification), trích xuất JSON đơn giản, kiểm duyệt nội dung hoặc chạy offline trên điện thoại/thiết bị IoT/xe tự hành, một chiếc **SLM** nhỏ gọn sẽ rẻ hơn hàng chục lần và phản hồi trong vài mili-giây.\n\n```mermaid\nflowchart TD\n    subgraph SLM_Box[\"Small Language Model (SLM: \u003c100M - ~8B params)\"]\n        direction LR\n        SLM_Icon[\"📱 Chạy trên Edge / Laptop / 1 GPU nhỏ\u003cbr/\u003e⚡ Độ trễ cực thấp (Low Latency: vài ms)\u003cbr/\u003e🚀 Thông lượng cực cao (High Throughput)\u003cbr/\u003e🎯 Chuyên biệt hóa cho 1 tác vụ hẹp (Task-specific)\u003cbr/\u003e🔒 Bảo mật dữ liệu cục bộ trên thiết bị (On-device Privacy)\"]\n    end\n\n    subgraph LLM_Box[\"Large Language Model (LLM: 10B - Hàng trăm tỷ params)\"]\n        direction LR\n        LLM_Icon[\"🖥️ Đòi hỏi cụm Multi-GPU cao cấp (A100/H100/B200)\u003cbr/\u003e🐢 Độ trễ cao hơn, tốn hàng trăm GB VRAM\u003cbr/\u003e🧠 Đa năng, suy luận logic đa bước phức tạp (Complex Reasoning)\u003cbr/\u003e💰 Chi phí hạ tầng \u0026 điện năng vận hành đắt đỏ\"]\n    end\n```\n\n| Tiêu chí | Small Language Model (SLM) | Large Language Model (LLM) |\n| :--- | :--- | :--- |\n| **Quy mô tham số (Parameters)** | Nhỏ: Dưới 100 triệu đến ~8 tỷ tham số (VD: *BERT ~110M, DistilBERT ~66M, Phi-3 Mini 3.8B, Mistral 7B, LLaMA-3 8B, Nemotron-Mini 4B*). | Khổng lồ: Từ 13 tỷ đến hàng trăm/nghìn tỷ tham số (VD: *LLaMA-3 70B/405B, Nemotron-4 340B, GPT-4, Claude 3.5*). |\n| **Độ trễ (Latency)** | **Rất thấp**, phản hồi tức thì (real-time, lý tưởng cho Voice Assistant, Game NPC, Autocomplete). | **Cao hơn đáng kể** do khối lượng phép nhân ma trận đồ sộ qua hàng chục tầng. |\n| **Thông lượng (Throughput)** | **Rất cao** (xử lý hàng nghìn tokens/giây trên cùng một phần cứng). | **Thấp hơn** (thường phải chia nhỏ mô hình qua nhiều GPU bằng Tensor Parallelism). |\n| **Yêu cầu phần cứng** | Chạy mượt trên CPU, NPU, thiết bị biên (**Edge, Mobile, IoT, Jetson**) hoặc 1 GPU phổ thông. | Đòi hỏi cụm máy chủ nhiều GPU Data Center (**A100, H100, B200**) với dung lượng VRAM cực lớn. |\n| **Tính đa năng (Versatility)** | Thường chuyên biệt hóa cho **một tác vụ hẹp cụ thể (Task-specific)** sau khi fine-tune hoặc chưng cất (Distillation). | Giải quyết **đa tác vụ (General-purpose)**, suy luận logic phức tạp, Zero-shot và Agentic workflows xuất sắc. |\n| **Chi phí vận hành (Cost)** | Rất rẻ cho từng tác vụ đơn lẻ (nhưng cần kiến trúc Model Router nếu quản lý nhiều SLM khác nhau). | Chi phí duy trì cụm server suy luận rất đắt đỏ, nhưng 1 mô hình trung tâm phục vụ được nhiều phòng ban. |\n\n### 2.2. Mô hình Nguồn mở / Trọng số mở (Open-Weights) vs. Mô hình Độc quyền (Proprietary API)\n| Tiêu chí | Open-Weights Models (LLaMA-3, Mistral, DeepSeek, Nemotron) | Proprietary / Closed API Models (GPT-4o, Claude 3.5, Gemini Pro) |\n| :--- | :--- | :--- |\n| **Quyền kiểm soát \u0026 Bảo mật dữ liệu** | **Kiểm soát cao:** Có thể tải trọng số về triển khai trong hạ tầng nội bộ (On-prem / VPC) kèm chính sách bảo mật mạng và kiểm soát truy cập của tổ chức. | Dữ liệu được gửi qua mạng tới dịch vụ của nhà cung cấp bên thứ ba (cần đánh giá hợp đồng bảo mật, chính sách lưu trữ dữ liệu và tuân thủ của hãng). |\n| **Khả năng tùy biến sâu** | Cho phép can thiệp toàn diện: **Full Fine-Tuning, LoRA/QLoRA, Pruning, Quantization (`FP8`/`INT4`)**, sửa kiến trúc. | Bị giới hạn ở Prompt Engineering, RAG hoặc chỉ Fine-tune hộp đen qua giao diện web của nhà cung cấp. |\n| **Chi phí theo quy mô** | Tốn chi phí dựng server GPU ban đầu, nhưng **rẻ hơn rất nhiều khi lưu lượng request lớn và ổn định 24/7**. | Không tốn phí hạ tầng ban đầu (trả tiền theo mỗi 1 triệu tokens Input/Output), nhưng **rất đắt đỏ khi quy mô người dùng tăng vọt**. |\n\n### 2.3. Ba Chỉ số Đo lường Hiệu năng Suy luận LLM trên Production (Inference Latency Metrics)\nKhi triển khai LLM (với TensorRT-LLM / Triton / NIM), đề thi thường hỏi về 3 chỉ số đo tốc độ:\n1. **TTFT (Time To First Token – Thời gian sinh ra token đầu tiên):**\n   * Khoảng thời gian từ lúc User bấm gửi Prompt cho đến khi chữ đầu tiên xuất hiện trên màn hình (Pha **Prefill** — xử lý song song toàn bộ Prompt đầu vào để tạo KV Cache).\n   * *Bản chất phần cứng:* Phụ thuộc vào **năng lực tính toán ma trận của GPU (Compute-bound)** và độ dài của Input Prompt.\n2. **ITL (Inter-Token Latency) / TPOT (Time Per Output Token – Thời gian giữa hai token liên tiếp):**\n   * Tốc độ nhả từng chữ tiếp theo sau khi chữ đầu tiên đã hiện ra (Pha **Decode** tự hồi quy). Để người dùng đọc mượt hơn tốc độ mắt người, TPOT cần đạt khoảng $10 - 30\\text{ ms/token}$.\n   * *Bản chất phần cứng:* Phụ thuộc vào **băng thông bộ nhớ VRAM (Memory-bandwidth bound)** vì mỗi lần sinh 1 token mới lại phải đọc toàn bộ trọng số mô hình và KV Cache từ HBM lên nhân tính toán!\n3. **Throughput (Thông lượng tổng thể – Tokens/second hoặc Requests/second):**\n   * Tổng số lượng token mà máy chủ phục vụ được cho **tất cả người dùng đồng thời** trong 1 giây (Tối ưu hóa bằng *In-flight Batching / Dynamic Batching*).\n\n---\n\n## 3. Khái niệm Model Card \u0026 Các Bộ Benchmark Đánh giá LLM Chuẩn Quốc tế\n\n### 3.1. Model Card (Hồ sơ Lý lịch Mô hình)\n* **Model Card là gì?** Là tài liệu tiêu chuẩn kỹ thuật (do Google đề xuất và trở thành chuẩn thực hành phổ biến trên **Hugging Face** cũng như **NVIDIA NGC Catalog**) đi kèm mỗi mô hình AI nhằm cung cấp thông tin minh bạch, toàn diện và có thể kiểm chứng về năng lực cũng như giới hạn của mô hình đó.\n* **6 mục cốt lõi thường có trong một Model Card tiêu chuẩn (Cần nhớ kỹ cho kỳ thi):**\n  1. **Model Overview (Tổng quan mô hình):** Tên mô hình, phiên bản, tổ chức phát triển, ngày phát hành, loại kiến trúc nền tảng (ví dụ: *Transformer Decoder-only*) và **Giấy phép bản quyền (License: Apache 2.0, MIT, Llama Community License hay Non-commercial)**.\n  2. **Intended Use \u0026 Out-of-Scope Use (Mục đích sử dụng \u0026 Trường hợp cấm):** Các bài toán được thiết kế để sử dụng (ví dụ: trợ lý tóm tắt văn bản tiếng Anh) và các trường hợp **nghiêm cấm/ngoài phạm vi (Out-of-scope / Misuse)** (ví dụ: không được dùng để kê đơn thuốc y khoa tự động hay tư vấn pháp lý sinh tử).\n  3. **Training Data (Dữ liệu huấn luyện):** Nguồn gốc dữ liệu huấn luyện, phương pháp lọc/làm sạch, kích thước kho ngữ liệu (bao nhiêu nghìn tỷ token), phân bố ngôn ngữ và **Mốc thời gian ngắt tri thức (Knowledge Cutoff)**.\n  4. **Model Architecture \u0026 Compute Requirements (Kiến trúc \u0026 Yêu cầu phần cứng):** Số lượng tham số, số tầng (layers), số đầu chú ý (attention heads), độ dài cửa sổ ngữ cảnh (**Context Window**), định dạng số học (`BF16`/`FP8`) và lượng VRAM tối thiểu để chạy.\n  5. **Evaluation \u0026 Performance Metrics (Kết quả đánh giá chuẩn):** Bảng điểm định lượng thực tế trên các bộ benchmark công khai (MMLU, HumanEval, GSM8K, BLEU, ROUGE, F1-score...).\n  6. **Limitations, Ethical Considerations \u0026 Bias (Hạn chế, Đạo đức \u0026 Thiên vị):** Các điểm yếu đã biết, tỷ lệ sinh ảo giác (hallucination), các rủi ro thiên vị văn hóa/giới tính/chủng tộc và khuyến nghị đặt rào chắn an toàn (Guardrails).\n\n### 3.2. Các Bộ Benchmark Tiêu chuẩn để So sánh các LLM (Hay xuất hiện trong Model Card)\n| Tên Bộ Benchmark | Đo lường năng lực gì của LLM? | Ví dụ nội dung bài thi của Benchmark |\n| :--- | :--- | :--- |\n| **1. MMLU (Massive Multitask Language Understanding)** | **Kiến thức tổng quát \u0026 Học thuật đa lĩnh vực:** Bộ 57 môn thi trắc nghiệm từ cấp 3 đến đại học/chuyên gia (Toán, Lý, Hóa, Y sinh, Luật, Lịch sử, Kinh tế). | Các câu hỏi trắc nghiệm 4 lựa chọn A/B/C/D trải rộng mọi ngành khoa học. |\n| **2. HumanEval \u0026 MBPP** | **Năng lực Lập trình \u0026 Sinh mã nguồn (Coding):** Khả năng viết hàm Python từ chuỗi mô tả Docstring và vượt qua các Unit Tests tự động (chỉ số `pass@1`). | Cho đề bài thuật toán và kiểm tra xem code AI sinh ra chạy có đúng 100% test cases không. |\n| **3. GSM8K \u0026 MATH** | **Suy luận Toán học đa bước (Mathematical Reasoning):** Giải các bài toán đố cấp 2 (GSM8K - 8.500 bài) và toán thi Olympic (MATH). | Bài toán đố đòi hỏi 4–8 bước lập luận cộng trừ nhân chia liên tiếp (Chain-of-Thought). |\n| **4. TruthfulQA \u0026 HaluEval** | **Độ trung thực \u0026 Chống ảo giác (Truthfulness \u0026 Hallucination):** Kiểm tra xem mô hình có bị lừa bởi những tin đồn/ngộ nhận phổ biến của con người hay không. | Hỏi các câu dễ gây ngộ nhận để xem mô hình nói sự thật khoa học hay bịa chuyện theo đám đông. |\n| **5. MT-Bench \u0026 Chatbot Arena (LMSYS)** | **Chất lượng Hội thoại đa lượt \u0026 Đánh giá ngang hàng:** Dùng **LLM-as-a-Judge (GPT-4 chấm điểm)** hoặc người thật bình chọn mù (Blind A/B testing tính điểm **Elo**). | So sánh trực tiếp 2 mô hình ẩn danh qua các cuộc hội thoại phức tạp nhiều lượt. |\n\n---\n\n## 4. Các Độ đo Đánh giá Chuyên sâu (Evaluation Metrics)\n\n### 4.1. Bộ Độ đo cho Bài toán Phân loại: Confusion Matrix, Precision, Recall, F1, PR-AUC \u0026 ROC-AUC\nKhi đánh giá mô hình phân loại (ví dụ: Phát hiện email Spam, Phát hiện giao dịch gian lận, Chẩn đoán bệnh, Kiểm duyệt nội dung độc hại), ta lập **Ma trận Nhầm lẫn (Confusion Matrix)** gồm 4 ô:\n\n```mermaid\nflowchart TD\n    subgraph CM[\"Ma trận Nhầm lẫn (Confusion Matrix)\"]\n        direction LR\n        subgraph Pred_Pos[\"Mô hình Dự đoán: DƯƠNG TÍNH (Positive / Có bệnh / Spam)\"]\n            TP[\"✅ TP (True Positive - Dương tính thật)\u003cbr/\u003eThực tế: Dương tính | Mô hình đoán: Dương tính\u003cbr/\u003e(Bắt trúng Spam / Bắt trúng kẻ gian!)\"]\n            FP[\"❌ FP (False Positive - Dương tính giả / Lỗi Loại I)\u003cbr/\u003eThực tế: Âm tính | Mô hình đoán nhầm: Dương tính\u003cbr/\u003e(Báo động giả: Xóa nhầm email hợp đồng của sếp vào thùng rác!)\"]\n        end\n        subgraph Pred_Neg[\"Mô hình Dự đoán: ÂM TÍNH (Negative / Bình thường)\"]\n            FN[\"🚨 FN (False Negative - Âm tính giả / Lỗi Loại II)\u003cbr/\u003eThực tế: Dương tính | Mô hình đoán nhầm: Âm tính\u003cbr/\u003e(Bỏ lọt tội phạm / Bỏ sót bệnh nhân ung thư!)\"]\n            TN[\"✅ TN (True Negative - Âm tính thật)\u003cbr/\u003eThực tế: Âm tính | Mô hình đoán: Âm tính\u003cbr/\u003e(Email thường cho vào hộp thư đến bình thường)\"]\n        end\n    end\n```\n\n| Độ đo (Metric) | Công thức Toán học | Ý nghĩa trực quan \u0026 Khi nào nên ưu tiên? |\n| :--- | :--- | :--- |\n| **1. Accuracy (Độ chính xác tổng thể)** | $$\\frac{TP + TN}{TP + TN + FP + FN}$$ | Tỷ lệ đoán đúng trên tổng số mẫu. \u003cbr/\u003e⚠️ **CẢNH BÁO:** Phù hợp khi các lớp dữ liệu cân bằng và chi phí lỗi tương đương. **Thường dễ đánh lừa trên dữ liệu mất cân bằng (Imbalanced Data)** (VD: 99% bình thường, 1% gian lận $\\to$ một mô hình đơn giản đoán tất cả là bình thường vẫn đạt Accuracy 99%!). |\n| **2. Precision (Độ chuẩn xác / Độ tin cậy dương tính)** | $$\\frac{TP}{TP + FP}$$ | *\"Trong tất cả những trường hợp mô hình dự đoán là Dương tính, có bao nhiêu % là Dương tính thật?\"* \u003cbr/\u003e👉 **Ưu tiên khi chi phí của False Positive (FP - Bắt nhầm / Báo động giả) cao:** Ví dụ **Lọc Email Spam**, **Khóa tài khoản người dùng tự động**, **Gợi ý video an toàn cho trẻ em** (tránh tự động xóa nhầm email hợp đồng quan trọng của khách hàng). |\n| **3. Recall (Độ bao phủ / Độ nhạy - Sensitivity / TPR)** | $$\\frac{TP}{TP + FN}$$ | *\"Trong tất cả các ca Dương tính thực tế, mô hình phát hiện được bao nhiêu %?\"* \u003cbr/\u003e👉 **Ưu tiên khi chi phí của False Negative (FN - Bỏ sót positive) gây hậu quả nghiêm trọng:** Ví dụ **Sàng lọc bệnh hiểm nghèo**, **Phát hiện giao dịch gian lận/rửa tiền**, **Phát hiện xâm nhập mạng** (thường ưu tiên tối đa hóa Recall trong giới hạn khối lượng cảnh báo giả FP có thể xử lý được). |\n| **4. F1-Score (Điểm cân bằng Precision–Recall)** | $$2 \\times \\frac{\\text{Precision} \\times \\text{Recall}}{\\text{Precision} + \\text{Recall}}$$ | Trung bình điều hòa (Harmonic Mean) giữa Precision và Recall (chỉ cao khi cả Precision và Recall đều cao). \u003cbr/\u003e👉 **Hữu ích khi cần cân bằng giữa Precision và Recall tại một ngưỡng phân loại (threshold)** trên dữ liệu mất cân bằng. Tuy nhiên, không phải mọi bài toán mất cân bằng đều chọn F1 một cách máy móc — cần chọn metric theo **chi phí nghiệp vụ của FP và FN** (hoặc dùng $F_\\beta$-score khi muốn đặt trọng số thiên về Recall hay Precision). |\n| **5. PR-AUC \u0026 ROC-AUC (Đánh giá qua nhiều ngưỡng cắt)** | • **ROC-AUC:** Diện tích dưới đường cong **TPR (Recall)** theo **FPR ($\\frac{FP}{FP+TN}$)**\u003cbr/\u003e• **PR-AUC:** Diện tích dưới đường cong **Precision – Recall** | • **PR-AUC (Precision-Recall AUC):** Đặc biệt hữu ích khi đánh giá lớp **positive rất hiếm** qua nhiều ngưỡng xác suất (thresholds).\u003cbr/\u003e• **ROC-AUC:** Đo khả năng xếp hạng phân tách hai lớp (ngẫu nhiên = $0.5$, lý tưởng = $1.0$), nhưng khi số lượng Negative ($TN$) quá áp đảo so với Positive, FPR = $\\frac{FP}{FP+TN}$ có thể giữ ở mức rất nhỏ khiến ROC-AUC trông quá lạc quan. |\n\n---\n\n### 4.2. Bộ Độ đo cho Bài toán Hồi quy (Regression Metrics: Dự đoán số liên tục)\nKhi mô hình dự đoán giá nhà, nhiệt độ, doanh số, đề thi có thể hỏi về 4 chỉ số sau:\n1. **MAE (Mean Absolute Error):** Trung bình trị tuyệt đối sai số $\\frac{1}{n}\\sum |y_i - \\hat{y}_i|$. Dễ hiểu, cùng đơn vị với biến mục tiêu, **ít bị ảnh hưởng bởi các điểm dị biệt (Outliers)**.\n2. **MSE (Mean Squared Error) \u0026 RMSE (Root MSE):** Trung bình bình phương sai số $\\frac{1}{n}\\sum (y_i - \\hat{y}_i)^2$ (và căn bậc hai của nó). Vì bình phương sai số nên **phạt cực nặng các lỗi dự đoán sai lệch lớn (Outliers)**.\n3. **$R^2$ (R-Squared / Coefficient of Determination):** Cho biết mô hình giải thích được bao nhiêu % sự biến thiên của dữ liệu (gần $1.0$ là mô hình khớp hoàn hảo).\n\n---\n\n### 4.3. Các Độ đo cho Bài toán Ngôn ngữ \u0026 GenAI: BLEU, ROUGE, BERTScore, Cosine Similarity \u0026 RAG Triad\n\n```mermaid\nflowchart TD\n    Metrics[\"Các Độ đo Đánh giá Ngôn ngữ \u0026 GenAI Cốt lõi\"]\n    \n    subgraph M1[\"1. BLEU (Bilingual Evaluation Understudy)\"]\n        B1[\"🎯 Bài toán: DỊCH MÁY (Machine Translation)\"]\n        B2[\"🔍 Bản chất: Thiên về Độ chuẩn xác (PRECISION-oriented)\u003cbr/\u003eĐếm tỷ lệ cụm từ (1-gram đến 4-gram) trong bản dịch AI\u003cbr/\u003exuất hiện trùng khớp trong bản dịch mẫu của người (kèm Brevity Penalty)\"]\n        B3[\"📏 Thang điểm: 0.0 đến 1.0 (hoặc 0 - 100; Càng cao càng tốt)\"]\n        B1 --\u003e B2 --\u003e B3\n    end\n\n    subgraph M2[\"2. ROUGE (Recall-Oriented Understudy for Gisting Evaluation)\"]\n        R1[\"🎯 Bài toán: TÓM TẮT VĂN BẢN (Text Summarization)\"]\n        R2[\"🔍 Bản chất: Thiên về Độ bao phủ (RECALL-oriented)\u003cbr/\u003eKiểm tra bản tóm tắt của AI có nhặt đủ các từ/ý chính\u003cbr/\u003exuất hiện trong bản tóm tắt chuẩn của người hay không\"]\n        R3[\"📏 Biến thể: ROUGE-1 (từ đơn), ROUGE-2 (cặp từ), ROUGE-L (chuỗi con chung dài nhất LCS)\"]\n        R1 --\u003e R2 --\u003e R3\n    end\n\n    subgraph M3[\"3. Cosine Similarity \u0026 BERTScore (Độ tương đồng Ngữ nghĩa Vector)\"]\n        C1[\"🎯 Bài toán: So khớp Vector Embedding (Semantic Retrieval) \u0026 Tương đồng ngữ nghĩa\"]\n        C2[\"🔍 Bản chất: Đo cô-sin góc giữa 2 Vector Embedding trong không gian đa chiều\u003cbr/\u003eLưu ý: Cosine similarity đo độ gần gũi giữa các vector, KHÔNG trực tiếp đảm bảo câu trả lời RAG cuối cùng đúng sự thật!\"]\n        C3[\"📏 Thang điểm: -1.0 đến 1.0 (1.0 = Cùng hướng vector)\"]\n        C1 --\u003e C2 --\u003e C3\n    end\n\n    Metrics --\u003e M1 \u0026 M2 \u0026 M3\n```\n\n1. **BLEU (Bilingual Evaluation Understudy) $\\to$ DỊCH MÁY (Machine Translation):**\n   * *Gợi ý nhớ:* **B**ilingual (Song ngữ) = **Dịch thuật**!\n   * *Bản chất:* **Precision-oriented** (kèm hệ số phạt *Brevity Penalty* nếu máy dịch câu quá ngắn). Đếm xem câu máy dịch có bao nhiêu n-gram xuất hiện trùng khớp trong bản dịch tham chiếu.\n2. **ROUGE (Recall-Oriented Understudy for Gisting Evaluation) $\\to$ TÓM TẮT (Summarization):**\n   * *Gợi ý nhớ:* **R**ecall-Oriented ... for **Gisting** (Gist = Ý chính / Tóm tắt)!\n   * *Bản chất:* **Recall-oriented**. Kiểm tra bài tóm tắt của AI có bao phủ được các từ/cụm từ trong bản tóm tắt tham chiếu hay không:\n     * **ROUGE-1:** Độ trùng khớp từng từ đơn (Unigrams).\n     * **ROUGE-2:** Độ trùng khớp từng cặp 2 từ liên tiếp (Bigrams).\n     * **ROUGE-L:** Dựa trên **Chuỗi con chung dài nhất (Longest Common Subsequence - LCS)** để đánh giá cấu trúc mạch câu mà không đòi hỏi các từ phải đứng sát cạnh nhau.\n3. **Hạn chế của BLEU \u0026 ROUGE và Giải pháp `BERTScore` / `Cosine Similarity`:**\n   * Vì BLEU và ROUGE chỉ **đếm sự trùng khớp mặt chữ (Exact lexical / n-gram overlap)**, nên nếu đáp án mẫu là *\"Chiếc xe hơi chạy rất nhanh\"* mà AI viết là *\"Chiếc ô tô di chuyển với tốc độ cao\"*, điểm BLEU/ROUGE sẽ rất thấp dù hai câu tương đương về nghĩa.\n   * **Giải pháp – `BERTScore` \u0026 `Cosine Similarity`:** Đưa câu của AI và câu mẫu qua mô hình Embedding rồi tính **Cosine Similarity** giữa các vector nhúng để đo **độ tương đồng về mặt ngữ nghĩa (Semantic Similarity)**:\n     $$\\text{Cosine Similarity}(\\mathbf{A}, \\mathbf{B}) = \\cos(\\theta) = \\frac{\\mathbf{A} \\cdot \\mathbf{B}}{\\|\\mathbf{A}\\| \\|\\mathbf{B}\\|}$$\n4. **Đánh giá toàn diện hệ thống RAG (Retrieval + Grounding + Answer + System Metrics):**\n   \u003e [!IMPORTANT]\n   \u003e **Lưu ý quan trọng:** `Cosine Similarity` chỉ đo độ tương đồng giữa các vector embedding (thường dùng trong bước tìm kiếm vector của RAG); nó **không trực tiếp đánh giá độ chính xác hay tính trung thực của câu trả lời cuối cùng**.\n   \n   Với một hệ thống RAG hoàn chỉnh, cần **phân tách evaluation** thành 4 nhóm rõ ràng:\n   * **Retrieval Metrics (Chất lượng truy xuất tài liệu):** **`Recall@k`** (tỷ lệ tài liệu đúng nằm trong top-$k$ kết quả lấy ra), **`Precision@k`**, **`MRR` (Mean Reciprocal Rank)** và **`nDCG` (Normalized Discounted Cumulative Gain - có xét thứ tự xếp hạng)**.\n   * **Grounding / Faithfulness (Tính trung thực với ngữ cảnh - Chống Hallucination):** Câu trả lời của LLM có được hỗ trợ trực tiếp bởi các đoạn văn (context chunks) vừa truy xuất được không, hay mô hình tự suy diễn/bịa thêm thông tin ngoài ngữ cảnh?\n   * **Answer Quality (Correctness \u0026 Relevance):** Câu trả lời cuối cùng có giải quyết đúng trọng tâm câu hỏi của người dùng (**Answer Relevance**) và khớp với đáp án chuẩn (**Answer Correctness** khi có ground truth) hay không?\n   * **System \u0026 Operational Metrics:** Độ trễ (**Latency: TTFT, TPOT, End-to-end latency**), thông lượng (**Throughput**) và chi phí (**Cost per query**).\n\n---\n\n## 5. Phương pháp Kiểm thử Thực tế: Cross-Validation, A/B Testing \u0026 Canary Deployment\n\n### 5.1. Chia tập dữ liệu (Train / Validation / Test Split) \u0026 k-Fold Cross-Validation\n* **Ba tập dữ liệu tách biệt trong huấn luyện:**\n  1. **Training Set (~70–80%):** Dùng để mô hình học và cập nhật trọng số (Backpropagation).\n  2. **Validation Set / Dev Set (~10–15%):** Dùng để chấm điểm sau mỗi Epoch nhằm **tinh chỉnh siêu tham số (Hyperparameter Tuning)**, chọn kiến trúc và kích hoạt **Early Stopping** (dừng sớm chống Overfitting).\n  3. **Test Set / Holdout Set (~10–15%):** Giữ độc lập, **chỉ sử dụng ở bước đánh giá cuối cùng** để báo cáo hiệu năng khách quan. *(Nếu để dữ liệu Test lọt vào tập Train, chuẩn hóa/fit bộ tiền xử lý trên toàn bộ dữ liệu trước khi chia, hoặc dùng tập Test để chỉnh tham số sẽ gây lỗi **Data Leakage / Rò rỉ dữ liệu**!).*\n* **k-Fold Cross-Validation (Kiểm định chéo k-Fold):**\n  * *Khi nào sử dụng?* Khi doanh nghiệp có **tập dữ liệu giới hạn / nhỏ (Limited dataset)** và muốn đánh giá khả năng tổng quát hóa của mô hình một cách đáng tin cậy hơn so với chỉ một lần chia Train/Validation ngẫu nhiên. *(Nếu dữ liệu mất cân bằng nhãn, nên dùng **Stratified k-Fold** để giữ tỷ lệ các nhãn nhất quán ở mọi Fold).*\n\n```mermaid\nflowchart TD\n    subgraph CV[\"Minh họa 5-Fold Cross-Validation (Mỗi Fold lần lượt đóng vai trò làm Validation đúng 1 lần)\"]\n        L1[\"Lần lặp 1: [Validation: Fold 1] | [Train: Fold 2 + Fold 3 + Fold 4 + Fold 5] -\u003e Điểm E1\"]\n        L2[\"Lần lặp 2: [Validation: Fold 2] | [Train: Fold 1 + Fold 3 + Fold 4 + Fold 5] -\u003e Điểm E2\"]\n        L3[\"Lần lặp 3: [Validation: Fold 3] | [Train: Fold 1 + Fold 2 + Fold 4 + Fold 5] -\u003e Điểm E3\"]\n        L4[\"Lần lặp 4: [Validation: Fold 4] | [Train: Fold 1 + Fold 2 + Fold 3 + Fold 5] -\u003e Điểm E4\"]\n        L5[\"Lần lặp 5: [Validation: Fold 5] | [Train: Fold 1 + Fold 2 + Fold 3 + Fold 4] -\u003e Điểm E5\"]\n        Avg[\"👉 Kết quả đánh giá cuối cùng = Trung bình cộng (E1 + E2 + E3 + E4 + E5) / 5 (± Độ lệch chuẩn)\"]\n        \n        L1 --\u003e L2 --\u003e L3 --\u003e L4 --\u003e L5 --\u003e Avg\n    end\n```\n\n### 5.2. Kiểm thử trên môi trường Production: A/B Testing, Canary Rollout \u0026 Shadow Deployment\n1. **A/B Testing:**\n   * Giải quyết bài toán đánh đổi **Explore (Khám phá mô hình mới)** vs. **Exploit (Khai thác mô hình hiện tại)**: Chia ngẫu nhiên lưu lượng người dùng thật (ví dụ 50% vào **Model A - Control** và 50% vào **Model B - Treatment**) chạy song song trong cùng điều kiện thời gian thực để đo lường chỉ số mục tiêu (CTR, tỷ lệ chuyển đổi, mức độ hài lòng) và kiểm định ý nghĩa thống kê.\n2. **Canary Deployment (Triển khai Chim hoàng yến):**\n   * Ban đầu chỉ điều hướng một lượng nhỏ người dùng thật (ví dụ **1% – 5% traffic**) sang mô hình mới để theo dõi lỗi hệ thống, độ trễ và phản hồi; nếu ổn định mới tăng dần lên 25% $\\to$ 50% $\\to$ 100%.\n3. **Shadow Deployment (Triển khai Bóng râm / Dark Launch):**\n   * Mọi request của người dùng vẫn do mô hình hiện tại trả lời, nhưng hệ thống âm thầm nhân bản (mirror) request đó gửi song song cho mô hình mới chạy ngầm để ghi log so sánh kết quả mà **không ảnh hưởng trực tiếp tới kết quả trả về cho người dùng cuối**.\n\n---\n\n## 6. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm cần lưu ý ở Module 5:**\n\u003e 1. **Ghép cặp Metric Ngôn ngữ \u0026 RAG:**\n\u003e    * Dịch thuật (Machine Translation) $\\leftrightarrow$ **BLEU** (Precision-oriented trên n-gram).\n\u003e    * Tóm tắt (Text Summarization) $\\leftrightarrow$ **ROUGE** (Recall-oriented trên n-gram/LCS).\n\u003e    * Độ tương đồng giữa hai vector nhúng (Vector Similarity) $\\leftrightarrow$ **Cosine Similarity**.\n\u003e    * Đánh giá hệ thống **RAG đầu-cuối (End-to-end RAG)**: Phải kết hợp **Retrieval metrics** (`Recall@k`, `MRR`, `nDCG`), **Faithfulness/Grounding** và **Answer Correctness/Relevance** (không chỉ nhìn vào Cosine Similarity).\n\u003e 2. **Lưu ý Imbalanced Data (Dữ liệu mất cân bằng):** Khi tập dữ liệu có 98% nhãn A và chỉ 2% nhãn B, độ đo **Accuracy** dễ gây hiểu lầm. Hãy chọn metric theo **chi phí của False Positives (FP) và False Negatives (FN)**:\n\u003e    * Khi bỏ sót ca dương tính (**False Negative**) gây hậu quả nghiêm trọng (sàng lọc bệnh, phát hiện gian lận/xâm nhập) $\\to$ Ưu tiên **Recall** (trong ngưỡng FP chấp nhận được).\n\u003e    * Khi báo động giả (**False Positive**) gây tốn kém lớn (lọc Spam xóa nhầm email quan trọng, khóa nhầm tài khoản) $\\to$ Ưu tiên **Precision**.\n\u003e    * Khi cần cân bằng giữa Precision và Recall $\\to$ Dùng **F1-Score** (hoặc **PR-AUC** khi đánh giá lớp dương tính hiếm qua nhiều ngưỡng).\n\u003e 3. **Lưu ý SLM vs. LLM:** Chạy trên thiết bị biên (Edge/Mobile/IoT), yêu cầu độ trễ thấp (Low latency), thông lượng cao cho một tác vụ chuyên biệt $\\to$ Thường ưu tiên **SLM (Small Language Model)**.\n\n### Câu hỏi luyện tập minh họa (Mini Quiz):\n1. **Câu 1:** Một ngân hàng huấn luyện mô hình phát hiện rửa tiền trên tập dữ liệu gồm 99.9% giao dịch hợp pháp và 0.1% giao dịch rửa tiền. Mô hình đạt Accuracy 99.9% nhưng không bắt được bất kỳ giao dịch rửa tiền nào trên thực tế. Những độ đo nào phù hợp hơn Accuracy để đánh giá mô hình này?\n   * *Đáp án:* **Recall** (để đo tỷ lệ phát hiện trúng các giao dịch rửa tiền thực tế, giảm False Negatives), kết hợp với **Precision / F1-Score** hoặc **PR-AUC** để kiểm soát tỷ lệ cảnh báo giả ở mức đội vận hành có thể xử lý được.\n2. **Câu 2:** Một kỹ sư AI đang xây dựng hệ thống tự động tóm tắt các biên bản cuộc họp dài 10 trang thành 5 gạch đầu dòng ngắn gọn. Độ đo (Metric) truyền thống nào phù hợp để đánh giá mức độ bao phủ các từ/cụm từ quan trọng so với bản tóm tắt tham chiếu?\n   * *Đáp án:* **ROUGE (Recall-Oriented Understudy for Gisting Evaluation)**.\n3. **Câu 3:** Một hãng sản xuất ô tô muốn tích hợp mô hình ngôn ngữ vào chip xử lý trên xe hơi để nhận diện giọng nói điều khiển điều hòa và bản đồ ngay cả khi xe đi vào vùng mất sóng Internet, với yêu cầu phản hồi dưới 50 mili-giây. Họ nên lựa chọn **SLM** hay **LLM**?\n   * *Đáp án:* **SLM (Small Language Model)** vì có kích thước nhỏ gọn, chạy trực tiếp được trên phần cứng biên (Edge hardware) không cần kết nối Cloud và đáp ứng yêu cầu độ trễ thấp (Low latency).\n4. **Câu 4:** Khi đọc hồ sơ của một mô hình mã nguồn mở trên Hugging Face hoặc NVIDIA NGC để kiểm tra xem mô hình đó có cho phép sử dụng cho mục đích thương mại hay không, được huấn luyện trên dữ liệu gì và có những rủi ro thiên vị nào đã biết, kỹ sư cần tra cứu tài liệu nào?\n   * *Đáp án:* **Model Card**.\n5. **Câu 5:** Một công ty y tế chỉ thu thập được một tập dữ liệu nhỏ gồm 1.000 bệnh án đã gắn nhãn (với tỷ lệ bệnh hiếm là 8%). Để đánh giá khả năng tổng quát hóa của mô hình phân loại một cách tin cậy mà không phụ thuộc vào một lần chia Train/Validation duy nhất, kỹ thuật kiểm thử nào nên được áp dụng?\n   * *Đáp án:* **Stratified k-Fold Cross-Validation** (giúp tận dụng toàn bộ các fold để kiểm định và giữ nguyên tỷ lệ 8% lớp bệnh hiếm trong mỗi fold).\n6. **Câu 6:** Trong hệ thống lọc email rác (Spam Filter), người dùng phàn nàn rằng nhiều email công việc quan trọng của đối tác bị hệ thống tự động đưa vào thư mục Spam (lỗi **False Positive** cao). Kỹ sư cần điều chỉnh ngưỡng phân loại của mô hình để ưu tiên cải thiện chỉ số nào?\n   * *Đáp án:* Ưu tiên cải thiện **Precision (Độ chuẩn xác)** — nhằm giảm thiểu số lượng False Positives ($FP$).\n"},{"id":"mod06","file":"Module_06_Model_Customization.md","badge":"MODULE 06","shortTitle":"Model Customization (Prompt, RAG, PEFT)","domain":"SW Dev \u0026 Exp (46%)","weight":"SW \u0026 Exp","icon":"🛠️","content":"# Module 6: Model Customization (Phương pháp Tùy biến Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn tập NCA-GENL ở Module 6 (Thuộc Domain \"Software Development - 24%\" \u0026 \"Experimentation - 22%\"):**\n\u003e Hiểu rõ **3 lý do doanh nghiệp cần tùy biến Foundation Model**; nắm vững thứ tự **4 cấp độ tùy biến tăng dần về chi phí và độ phức tạp** (`Prompt Engineering` $\\to$ `RAG` $\\to$ `Transfer Learning / Fine-Tuning` $\\to$ `Training from Scratch`) cùng **Ma trận Quyết định chọn giải pháp**; phân biệt các kỹ thuật **Prompting (Zero-shot, One-shot, Few-shot, CoT, Self-Consistency, ReAct, System Prompt)**; nắm chắc luồng hoạt động, **đánh giá và gỡ lỗi (troubleshooting) hệ thống RAG** (Chunking + Overlap, Bi-Encoder Embedding, Vector DB HNSW/IVF, Hybrid Search BM25 + Vector, Cross-Encoder Reranking, `Recall@k`/`MRR`/`nDCG`, Faithfulness, ACLs); hiểu cơ chế toán học của **PEFT (LoRA, QLoRA, Adapter, Prompt/Prefix Tuning)**, hiện tượng **Catastrophic Forgetting**, **Knowledge Distillation**, và các mẫu **tích hợp LLM bằng Python cho Software Developer**.\n\n---\n\n## 1. Tại sao doanh nghiệp cần tùy biến mô hình?\n\nCác mô hình nền tảng (Foundation Models như GPT-4 hay LLaMA-3 gốc) sở hữu kiến thức tổng quát cho đến thời điểm cắt dữ liệu (**Knowledge Cutoff**). Doanh nghiệp thường cần tùy biến (Customize) mô hình vì **3 lý do chính**:\n1. **Thích ứng với ngôn ngữ và thuật ngữ chuyên ngành (Domain-specific Jargon \u0026 Vocabulary):** Ví dụ trong Y khoa (tên biệt dược, mã bệnh ICD-10, bệnh án lâm sàng), Luật pháp, Viễn thông hay Tài chính ngân hàng.\n2. **Nâng cao hiệu năng cho tác vụ và định dạng đặc thù (Task-specific Performance \u0026 Formatting):** Đảm bảo mô hình trả về đúng cấu trúc JSON Schema nghiêm ngặt của hệ thống, sinh câu truy vấn SQL chính xác theo schema cơ sở dữ liệu công ty, hoặc tuân thủ đúng văn phong chăm sóc khách hàng của thương hiệu.\n3. **Cải thiện mức độ nhận thức ngữ cảnh nội bộ \u0026 Dữ liệu thời gian thực (Internal Context \u0026 Fresh Data Awareness):** Tích hợp các chính sách nhân sự, bảng giá tồn kho thay đổi từng phút, tài liệu bảo hành sản phẩm mới ra mắt, hoặc tài liệu mật nội bộ mà mô hình công khai chưa từng được học.\n\n---\n\n## 2. Bốn Cấp độ Tùy biến Mô hình (Spectrum of Model Customization) \u0026 Ma trận Quyết định\n\nTrong kỳ thi NCA-GENL, bạn cần nhớ nguyên tắc vàng của kiến trúc sư AI: **Luôn ưu tiên đi từ giải pháp đơn giản, nhanh và rẻ tiền nhất (bên trái) sang giải pháp phức tạp, đắt đỏ nhất (bên phải)!**\n\n```mermaid\nflowchart LR\n    L1[\"Cấp độ 1:\u003cbr/\u003ePROMPT ENGINEERING\u003cbr/\u003e💰 Chi phí: Rất thấp (~0$)\u003cbr/\u003e⏱️ Thời gian: Vài phút/giờ\u003cbr/\u003e🔧 Thay đổi Weights: KHÔNG\u003cbr/\u003e🎯 Tối ưu câu lệnh đầu vào\"]\n    \n    L2[\"Cấp độ 2:\u003cbr/\u003eRAG (Retrieval-Augmented)\u003cbr/\u003e💰 Chi phí: Trung bình thấp\u003cbr/\u003e⏱️ Thời gian: Vài ngày\u003cbr/\u003e🔧 Thay đổi Weights: KHÔNG\u003cbr/\u003e🎯 Kết nối dữ liệu nội bộ động\"]\n    \n    L3[\"Cấp độ 3:\u003cbr/\u003eTRANSFER LEARNING / FINE-TUNING\u003cbr/\u003e💰 Chi phí: Cao\u003cbr/\u003e⏱️ Thời gian: Vài ngày - tuần\u003cbr/\u003e🔧 Thay đổi Weights: CÓ\u003cbr/\u003e🎯 Học văn phong, kỹ năng \u0026 định dạng\"]\n    \n    L4[\"Cấp độ 4:\u003cbr/\u003eTRAINING FROM SCRATCH\u003cbr/\u003e💰 Chi phí: Cực kỳ đắt đỏ (Triệu $)\u003cbr/\u003e⏱️ Thời gian: Hàng tháng trời\u003cbr/\u003e🔧 Thay đổi Weights: Huấn luyện mới 100%\u003cbr/\u003e🎯 Ngôn ngữ/Miền dữ liệu mới hoàn toàn\"]\n\n    L1 ==\u003e|\"Tăng dần Chi phí GPU, Thời gian, Lượng dữ liệu \u0026 Độ phức tạp\"| L2 ==\u003e L3 ==\u003e L4\n```\n\n### Bảng Ma trận Quyết định: Khi nào dùng Prompting vs. RAG vs. Fine-Tuning? (CỰC KỲ QUAN TRỌNG!)\nĐề thi rất hay đưa ra một kịch bản doanh nghiệp và hỏi bạn nên chọn phương pháp nào. Hãy đối chiếu bảng sau:\n\n| Tiêu chí so sánh | 1. Prompt Engineering | 2. RAG (Retrieval-Augmented Generation) | 3. Fine-Tuning (PEFT / LoRA / SFT) | 4. Training from Scratch |\n| :--- | :--- | :--- | :--- | :--- |\n| **Có cập nhật Trọng số (Weights) của LLM không?** | **KHÔNG** | **KHÔNG** | **CÓ** (Cập nhật Adapter LoRA hoặc toàn bộ Weights) | **CÓ** (Khởi tạo và học mới 100% từ con số 0) |\n| **Giải quyết bài toán gì tốt nhất?** | Định hướng nhanh hành vi, định dạng đầu ra hoặc suy luận logic ngay trong cửa sổ ngữ cảnh. | Bổ sung **tri thức sự kiện mới (External Facts), dữ liệu nội bộ thay đổi liên tục**, giảm ảo giác và cần **trích dẫn nguồn (Citations)**. | Dạy mô hình **hành vi mới, văn phong/giọng điệu đặc thù, cấu trúc đầu ra phức tạp cố định**, hoặc ngôn ngữ chuyên ngành sâu. | Xây dựng mô hình nền tảng cho một ngôn ngữ hoàn toàn mới hoặc dữ liệu khoa học đặc biệt (DNA/Protein/Khí hậu) chưa có Base Model. |\n| **Tần suất dữ liệu thay đổi** | Tức thì theo từng câu lệnh. | **Thay đổi liên tục theo từng giây/phút** (chỉ cần cập nhật Vector DB, không cần train lại model!). | Dữ liệu tĩnh, ít thay đổi (mỗi lần muốn nạp quy luật mới phải chạy lại job Fine-tune). | Dữ liệu nền tảng tĩnh (cố định tại thời điểm Knowledge Cutoff). |\n| **Nguy cơ Ảo giác (Hallucination)** | Trung bình – Cao nếu hỏi kiến thức ngoài luồng. | **Thấp nhất** (vì câu trả lời bị neo chặt vào đoạn văn bản truy xuất được). | Trung bình (Fine-tuning dạy *cách trả lời* tốt hơn là dạy *nhớ chính xác sự kiện mới*). | Phụ thuộc chất lượng dữ liệu gốc. |\n| **Dữ liệu cần thiết** | 0 đến vài ví dụ mẫu (Few-shot). | Kho tài liệu thô (PDF, Wiki, Word, SQL) không cần gắn nhãn. | Hàng nghìn đến hàng trăm nghìn cặp `(Instruction, Ideal Response)` đã gắn nhãn sạch. | Hàng nghìn tỷ (Trillions) tokens dữ liệu thô + Cụm hàng nghìn GPU. |\n\n\u003e [!TIP]\n\u003e **Góc nhìn Thực chiến:** Trong các hệ thống AI doanh nghiệp hiện đại, **RAG và Fine-Tuning KHÔNG loại trừ nhau mà thường được KẾT HỢP (RAG + Fine-Tuning)**! Ví dụ: Dùng **LoRA Fine-Tuning** để dạy mô hình hiểu thuật ngữ y khoa và xuất báo cáo chuẩn bệnh viện, đồng thời kết nối **RAG** để tra cứu hồ sơ bệnh án mới nhất của từng bệnh nhân theo thời gian thực.\n\n---\n\n## 3. Cấp độ 1: Prompt Engineering (Kỹ nghệ Câu lệnh)\n\n* **Bản chất:** Là phương pháp thiết kế, cấu trúc và tối ưu hóa câu lệnh đầu vào (Input Prompt) bằng ngôn ngữ tự nhiên để dẫn dắt LLM sinh ra kết quả mong muốn thông qua cơ chế **In-Context Learning (Học trong ngữ cảnh)** mà **hoàn toàn KHÔNG làm thay đổi bất kỳ trọng số (weights) nào của mô hình**.\n\n### 3.1. Bảng phân biệt 7 kỹ thuật Prompting cốt lõi (Rất hay hỏi trong đề thi):\n| Kỹ thuật Prompting | Định nghĩa \u0026 Cách nhận diện | Ví dụ minh họa thực tế | Khi nào nên dùng? |\n| :--- | :--- | :--- | :--- |\n| **1. Zero-shot Prompting** | Đặt câu hỏi hoặc giao nhiệm vụ **trực tiếp mà không kèm theo bất kỳ ví dụ mẫu nào**. | *\"Phân loại cảm xúc câu sau thành Tích cực hoặc Tiêu cực: \u0027Bộ phim này hay ngoài mong đợi.\u0027 $\\to$ Đáp án:\"* | Các tác vụ phổ thông, đơn giản mà LLM đã hiểu rõ bản chất từ lúc Pre-train/SFT. |\n| **2. One-shot Prompting** | Cung cấp **đúng 1 ví dụ mẫu hoàn chỉnh (1 cặp Input-Output)** trước khi đưa ra câu hỏi chính. | *\"Ví dụ: \u0027Giao hàng chậm\u0027 -\u003e Tiêu cực. Hãy phân loại: \u0027Đóng gói rất kỹ\u0027 -\u003e ?\"* | Khi muốn mô hình bắt chước chính xác một định dạng đầu ra đơn giản mà không tốn nhiều token. |\n| **3. Few-shot Prompting** | Cung cấp từ **2 đến $N$ ví dụ mẫu đa dạng** ngay trong prompt để dạy mô hình quy luật ánh xạ tại chỗ (**In-context learning**). | Đưa 3–5 ví dụ chuyển đổi câu nói tự nhiên thành mã JSON chuẩn của công ty trước khi yêu cầu xử lý câu mới. | Khi tác vụ có định dạng đặc thù hoặc cần phân biệt các trường hợp biên phức tạp mà chưa muốn fine-tune. |\n| **4. Chain-of-Thought (CoT)** | Yêu cầu mô hình **trình bày rõ từng bước lập luận trung gian** trước khi chốt đáp án cuối cùng (*\"Let\u0027s think step by step\"*). | *\"Lan có 5 quả táo, mua thêm 2 túi mỗi túi 3 quả... Hãy suy nghĩ từng bước một trước khi đưa ra kết quả.\"* | Cực kỳ hiệu quả cho bài toán **Toán học, Logic, Lập trình và Suy luận đa bước** (kết hợpได้ với cả Zero-shot CoT và Few-shot CoT). |\n| **5. Self-Consistency** | Mở rộng của CoT: Cho mô hình sinh ra **nhiều luồng suy luận CoT độc lập khác nhau** (với Temperature \u003e 0), sau đó lấy **biểu quyết đa số (Majority Vote)** cho đáp án cuối cùng. | Sinh 5 cách giải cho cùng 1 bài toán phức tạp; nếu 4/5 cách đều ra đáp số `42`, chọn `42`. | Khi bài toán suy luận cực khó, một luồng CoT đơn lẻ vẫn có nguy cơ tính nhầm ở bước giữa. |\n| **6. ReAct (Reason + Act)** | Mô hình lặp đi lặp lại chu trình: **Suy nghĩ (`Thought`) $\\to$ Gọi công cụ bên ngoài (`Action`: Search API, SQL, Calculator) $\\to$ Quan sát kết quả (`Observation`)** cho đến khi giải xong bài toán. | *\"Thought: Cần tìm giá cổ phiếu NVDA hôm nay -\u003e Action: gọi YahooFinance API -\u003e Observation: \\$140 -\u003e Answer...\"* | Nền tảng cốt lõi để xây dựng **AI Agents \u0026 Tool Calling / Function Calling**. |\n| **7. System Prompt (Role / Persona)** | Câu lệnh nền định nghĩa **vai trò (Persona), quy tắc ứng xử, giới hạn bảo mật và định dạng đầu ra** của toàn bộ cuộc hội thoại. | *\"Bạn là trợ lý tài chính của ngân hàng X. Chỉ trả lời bằng tiếng Việt lịch sự về lãi suất, từ chối mọi câu hỏi chính trị...\"* | Định hình hành vi tổng thể của ứng dụng; có **độ ưu tiên cao hơn User Prompt** để giữ nhất quán và chống bẻ khóa. |\n\n---\n\n## 4. Cấp độ 2: Retrieval-Augmented Generation (RAG - Sinh văn bản Tăng cường Truy xuất)\n\n* **Bản chất của RAG:** Giống như cho sinh viên đi thi dưới hình thức **\"Thi mở sách (Open-Book Exam)\"**. Thay vì bắt mô hình học thuộc lòng mọi tài liệu nội bộ vào trọng số (Parametric Memory), hệ thống sẽ **tự động tra cứu đúng đoạn tài liệu liên quan nhất từ kho lưu trữ ngoài (Non-parametric Memory / Vector Database) rồi đính kèm trực tiếp vào Prompt** để LLM đọc và tổng hợp câu trả lời!\n\n### 4.1. Sơ đồ Kiến trúc \u0026 Quy trình 2 Pha của Hệ thống RAG Doanh nghiệp (Chuẩn NVIDIA NeMo Retriever)\n\n```mermaid\nflowchart TD\n    subgraph Offline[\"PHA 1: OFFLINE DATA INGESTION \u0026 INDEXING (Chuẩn bị \u0026 Lập chỉ mục tri thức)\"]\n        direction LR\n        Docs[\"Tài liệu Doanh nghiệp\u003cbr/\u003e(PDF, Word, Wiki, HTML, SQL)\"] --\u003e|1. Parsing \u0026 Cleaning| Clean[\"Văn bản \u0026 Bảng biểu\u003cbr/\u003eđã làm sạch\"]\n        Clean --\u003e|\"2. Chunking\u003cbr/\u003e(Cắt đoạn + Chunk Overlap)\"| Chunks[\"Các đoạn văn nhỏ\u003cbr/\u003e(Semantic Chunks)\"]\n        Chunks --\u003e|\"3. Embedding Model\u003cbr/\u003e(Bi-Encoder: NeMo Retriever)\"| Vecs[\"Dense Vectors\u003cbr/\u003e(VD: 1024 chiều)\"]\n        Vecs --\u003e|\"4. Indexing (HNSW / IVF)\"| VDB[(\"Vector Database\u003cbr/\u003e(Milvus / cuVS, FAISS, Pinecone)\")]\n    end\n\n    subgraph Online[\"PHA 2: ONLINE RETRIEVAL, RERANKING \u0026 GENERATION (Khi User đặt câu hỏi)\"]\n        direction LR\n        User[\"Câu hỏi của User\u003cbr/\u003e(User Query)\"] --\u003e|\"1. Nhúng bằng CÙNG\u003cbr/\u003eEmbedding Model\"| QVec[\"Query Vector\"]\n        QVec \u003c--\u003e|\"2a. Hybrid Search (Vector Cosine + BM25)\u003cbr/\u003eLấy nhanh Top-25 Chunks ứng viên\"| VDB\n        VDB --\u003e|\"2b. Reranker (Cross-Encoder)\u003cbr/\u003eChấm điểm ngữ cảnh sâu chọn Top-3 chuẩn nhất\"| Aug[\"3. Prompt Augmentation\u003cbr/\u003eGộp: System Prompt + Top-3 Chunks + User Query\"]\n        Aug --\u003e|\"4. Generation\"| LLM[\"Mô hình LLM\u003cbr/\u003e(Temperature thấp ~ 0.1)\"]\n        LLM --\u003e Ans[\"Câu trả lời chính xác\u003cbr/\u003e+ Trích dẫn nguồn (Citations)\"]\n    end\n```\n\n### 4.2. Giải phẫu các thành phần kỹ thuật quan trọng trong RAG:\n1. **Chiến lược Chunking \u0026 Chunk Overlap (Cắt nhỏ tài liệu):**\n   * *Tại sao cần Chunking?*\n     1. Tránh vượt quá giới hạn **Cửa sổ ngữ cảnh (Context Window)** và giảm hiện tượng **\"Lost in the Middle\"** (LLM thường khai thác thông tin ở phần đầu và phần cuối prompt tốt hơn phần chìm ở giữa một văn bản rất dài).\n     2. Tăng **độ tập trung ngữ nghĩa của Vector Embedding (Retrieval Precision)**: Nếu nhúng cả cuốn sách 200 trang thành 1 vector duy nhất, ý nghĩa của từng chi tiết sẽ bị trung bình hóa và pha loãng; cắt thành từng đoạn nhỏ (ví dụ `256 - 512 tokens`) giúp vector đại diện rõ nét cho từng ý cụ thể.\n     3. Giảm độ trễ (**TTFT**) và tiết kiệm chi phí token mỗi lần gọi LLM.\n   * *Tại sao thường dùng **Chunk Overlap** (Gối đầu khoảng 10–20%, ví dụ chunk 500 tokens gối đầu 50 tokens)?* Để **bảo toàn ngữ cảnh liên tục tại vị trí vết cắt**, tránh việc một câu văn hoặc ý tưởng quan trọng bị cắt đôi nằm nửa ở cuối Chunk 1, nửa ở đầu Chunk 2 làm mất ngữ cảnh.\n2. **Cơ sở dữ liệu Vector (Vector Databases) \u0026 Thuật toán tìm kiếm ANN:**\n   * Lưu trữ hàng triệu/tỷ vector nhúng cùng với dữ liệu gốc và **Metadata** (tên file, số trang, ngày tạo, quyền truy cập phòng ban RBAC).\n   * Thay vì quét cạn từng vector một (Brute-force Flat Search chậm trên tập lớn), các Vector DB (như **Milvus được tăng tốc bằng NVIDIA cuVS/RAFT, FAISS, Pinecone, Weaviate, Qdrant**) sử dụng các thuật toán **ANN (Approximate Nearest Neighbors)** như **HNSW (Hierarchical Navigable Small World - đồ thị phân tầng)** hoặc **IVF (Inverted File Index - phân cụm tâm)** để tìm ra Top-K vector gần nhất theo **Cosine Similarity / Inner Product / L2** trong vài mili-giây.\n3. **Hybrid Search (Tìm kiếm Lai) \u0026 Reranking (Sắp xếp lại bằng Cross-Encoder):**\n   * **Hybrid Search = Dense Retrieval (Vector Embedding hiểu ngữ nghĩa) + Sparse Retrieval (BM25 / TF-IDF khớp chính xác mã sản phẩm, số hiệu hợp đồng, tên riêng)**: Kết hợp thế mạnh của cả hai để hạn chế bỏ sót tài liệu.\n   * **Bi-Encoder (Embedding Model) vs. Cross-Encoder (Reranker Model):**\n     * *Bước 1 (Bi-Encoder):* Nhúng độc lập câu hỏi và tài liệu để quét nhanh qua hàng triệu bản ghi trong Vector DB, lọc ra **Top-25 đến Top-50 ứng viên**.\n     * *Bước 2 (Cross-Encoder Reranker - ví dụ trong **NVIDIA NeMo Retriever**):* Đưa đồng thời từng cặp `(Câu hỏi + Chunk ứng viên)` vào mạng Transformer Cross-Encoder để tính Self-Attention chéo giữa các từ của câu hỏi và tài liệu, chấm điểm mức độ liên quan sâu rồi lọc lấy **Top-3 đến Top-5 đoạn phù hợp nhất** đưa vào LLM.\n\n### 4.3. Đánh giá, Gỡ lỗi (Troubleshooting) và Vận hành An toàn Hệ thống RAG\nĐể đánh giá và vận hành RAG trong thực tế sản xuất, kỹ sư cần tách bạch rõ bộ chỉ số của **khâu Truy xuất (Retrieval)** và **khâu Sinh câu trả lời (Generation)**:\n\n| Nhóm đánh giá / Vận hành | Các chỉ số \u0026 Cơ chế cốt lõi | Triệu chứng lỗi thường gặp \u0026 Cách khắc phục (Troubleshooting) |\n| :--- | :--- | :--- |\n| **1. Chất lượng Truy xuất (Retrieval Evaluation)** | • **`Recall@k`:** Tỷ lệ tài liệu liên quan thực sự xuất hiện trong Top-$k$ chunks lấy ra.\u003cbr/\u003e• **`Precision@k`:** Tỷ lệ chunks trong Top-$k$ thực sự hữu ích.\u003cbr/\u003e• **`MRR` (Mean Reciprocal Rank):** Đánh giá vị trí xuất hiện đầu tiên của tài liệu đúng ($\\frac{1}{\\text{rank}}$).\u003cbr/\u003e• **`nDCG@k`:** Đánh giá chất lượng thứ tự xếp hạng có trọng số vị trí. | • **Lỗi:** `Recall@k` thấp (không tìm thấy đoạn văn có đáp án).\u003cbr/\u003e• **Nguyên nhân \u0026 Cách sửa:**\u003cbr/\u003e  1. *Chunking sai:* Cắt mất tiêu đề/bảng biểu $\\to$ Dùng Semantic/Hierarchical chunking, thêm tiêu đề cha vào metadata mỗi chunk.\u003cbr/\u003e  2. *Embedding mismatch:* Dùng khác model khi index và khi query, hoặc thiếu từ khóa chuyên ngành $\\to$ Kết hợp **Hybrid Search (BM25 + Dense Vector)**.\u003cbr/\u003e  3. *Metadata filter quá chặt:* Lọc nhầm ngày/danh mục làm rỗng kết quả $\\to$ Kiểm tra lại logic pre-filtering. |\n| **2. Chất lượng Câu trả lời \u0026 Chống Ảo giác (Answer \u0026 Grounding)** | • **Faithfulness / Groundedness:** Câu trả lời có được hỗ trợ hoàn toàn bởi các chunks truy xuất không?\u003cbr/\u003e• **Answer Relevance:** Câu trả lời có đi đúng trọng tâm câu hỏi không?\u003cbr/\u003e• **Answer Correctness \u0026 Citation Accuracy:** Độ chính xác so với ground truth và trích dẫn đúng nguồn. | • **Lỗi:** Retrieval lấy đúng tài liệu (`Recall@k` cao) nhưng LLM vẫn trả lời sai hoặc bịa đặt.\u003cbr/\u003e• **Nguyên nhân \u0026 Cách sửa:**\u003cbr/\u003e  1. *Reranker cắt nhầm:* Top-25 có đáp án nhưng Reranker đẩy xuống dưới Top-3 $\\to$ Tăng $k$ hoặc tinh chỉnh Reranker.\u003cbr/\u003e  2. *Nhiễu ngữ cảnh / Lost in the Middle:* Đưa quá nhiều chunks rác vào prompt $\\to$ Giữ Top-3..5 chunks chất lượng cao nhất.\u003cbr/\u003e  3. *Stale sources:* Tài liệu cũ xung đột tài liệu mới $\\to$ Lọc theo timestamp/version mới nhất. |\n| **3. Bảo mật \u0026 Vận hành (Operational \u0026 Security)** | • **Access Control (RBAC / Document ACLs).**\u003cbr/\u003e• **Chống Indirect Prompt Injection.**\u003cbr/\u003e• **Ngân sách Latency (TTFT/TPOT) \u0026 Cost.** | • **Phân quyền truy cập:** Phải lọc quyền người dùng (**ACL metadata filter**) **ngay tại bước Retrieval** trước khi đưa chunks vào LLM (không để nhân viên thường truy xuất được bảng lương CEO).\u003cbr/\u003e• **Indirect Prompt Injection:** Dùng **Retrieval Rails (NeMo Guardrails)** và phân tách rõ thẻ dữ liệu `\u003ccontext\u003e` với chỉ thị hệ thống. |\n\n---\n\n## 5. Cấp độ 3: Transfer Learning, Fine-Tuning (LoRA/QLoRA) \u0026 Knowledge Distillation\n\n* **Bản chất của Transfer Learning (Học chuyển giao):** Tái sử dụng một mô hình đã được huấn luyện sẵn trên tập dữ liệu lớn (**Pre-trained Model**) làm điểm xuất phát, sau đó tinh chỉnh tiếp để thích ứng với tác vụ hoặc miền dữ liệu chuyên sâu của doanh nghiệp.\n* **Phép ẩn dụ Lái xe (Driving Analogy):** Một người **đã biết lái xe ô tô con thành thạo** khi chuyển sang **học lái xe tải hạng nặng** sẽ học nhanh hơn nhiều so với người chưa từng cầm vô lăng bao giờ (vì họ đã nắm sẵn luật giao thông, cách nhìn gương, cảm giác chân ga/phanh)!\n* **Lợi ích cốt lõi:** Tiết kiệm đáng kể thời gian và chi phí tính toán GPU, cần ít dữ liệu gắn nhãn hơn so với huấn luyện từ đầu (Training from scratch).\n\n```mermaid\nflowchart TD\n    TL[\"Các phương pháp Transfer Learning \u0026 Tối ưu Mô hình\"]\n    \n    subgraph FT[\"1. Fine-Tuning (Tinh chỉnh Trọng số)\"]\n        FullFT[\"Full Fine-Tuning:\u003cbr/\u003eMở khóa \u0026 cập nhật toàn bộ trọng số của mô hình gốc\u003cbr/\u003e(Tốn nhiều VRAM \u0026 dễ gặp nguy cơ Catastrophic Forgetting)\"]\n        PEFT[\"PEFT (LoRA, QLoRA, P-Tuning, Adapters):\u003cbr/\u003eChỉ điều chỉnh một phần nhỏ tham số hoặc thêm tham số phụ trợ,\u003cbr/\u003egiữ đóng băng phần lớn trọng số base model\u003cbr/\u003e(Giảm mạnh VRAM cần thiết \u0026 hạn chế quên tri thức gốc)\"]\n    end\n\n    subgraph KD[\"2. Knowledge Distillation (Chưng cất Tri thức)\"]\n        Teacher[\"👨‍🏫 Teacher Model (Mô hình Thầy giáo):\u003cbr/\u003eMô hình LLM lớn (VD: 70B / 340B), năng lực cao nhưng nặng nề\"]\n        Student[\"🧑‍🎓 Student Model (Mô hình Học sinh):\u003cbr/\u003eMô hình SLM nhỏ gọn (VD: 3B / 8B), học bắt chước phân phối xác suất (Soft Labels)\u003cbr/\u003ehoặc học trên dữ liệu tổng hợp từ Thầy\u003cbr/\u003e👉 Nhỏ gọn hơn, chạy nhanh trên Edge/Mobile!\"]\n        Teacher ==\u003e|\"Truyền dạy tri thức (Distillation)\"| Student\n    end\n\n    TL --\u003e FT \u0026 KD\n```\n\n### 5.1. Làm rõ chuyên sâu: Full Fine-Tuning vs. Họ các kỹ thuật PEFT (Parameter-Efficient Fine-Tuning)\n1. **Hai rào cản lớn của Full Fine-Tuning:**\n   * **Chi phí bộ nhớ VRAM lớn:** Để cập nhật toàn bộ 70 tỷ tham số của LLaMA-3 70B ở chuẩn 16-bit, ngoài `~140 GB` lưu trọng số (Weights), GPU còn phải lưu `~140 GB` cho đạo hàm (Gradients) và hàng trăm GB cho trạng thái bộ tối ưu hóa (Optimizer States của AdamW) + Activations $\\to$ Đòi hỏi cụm nhiều GPU dung lượng lớn!\n   * **Hiện tượng Catastrophic Forgetting (Quên thảm khốc):** Khi cập nhật trực tiếp toàn bộ trọng số gốc trên một tập dữ liệu nhỏ/hẹp của công ty, mô hình có nguy cơ làm suy giảm các kỹ năng ngôn ngữ và lập luận tổng quát đã học ở giai đoạn Pre-training.\n2. **Giải pháp PEFT – Tinh chỉnh hiệu quả tham số (Tham khảo: [Hugging Face PEFT Documentation](https://huggingface.co/docs/peft/index)):**\n   * **Bản chất của PEFT:** PEFT là họ kỹ thuật **chỉ điều chỉnh một phần nhỏ tham số hoặc thêm các tham số phụ trợ (adapters / soft prompts)** để giảm chi phí bộ nhớ và tính toán khi fine-tuning. Với cấu hình **LoRA điển hình**, trọng số base model được đóng băng và chỉ các low-rank adapters được huấn luyện. **Lưu ý:** Tỷ lệ tham số huấn luyện (`trainable parameters %`) **phụ thuộc vào kiến trúc model, bậc hạng `r` (rank), danh sách các tầng đích (`target_modules`)**, và không mặc định dưới 1% cho mọi cấu hình PEFT (một số thiết lập PEFT/LoRA có thể mở khóa thêm `bias`, tầng `embed_tokens` hoặc `lm_head` qua tham số `modules_to_save`).\n   * **LoRA (Low-Rank Adaptation):**\n     * *Cơ chế toán học:* Thay vì cập nhật trực tiếp toàn bộ ma trận trọng số gốc $W_0$ (kích thước $d \\times k$), **LoRA đóng băng $W_0$ (`requires_grad = False`)** và gắn song song hai ma trận phân rã hạng thấp (**Low-rank decomposition matrices**) là $A$ (kích thước $r \\times k$) và $B$ (kích thước $d \\times r$) với bậc hạng $r \\ll \\min(d, k)$ (ví dụ $r = 8, 16, 32$):\n       $$h = W_0 x + \\Delta W x = W_0 x + \\frac{\\alpha}{r} (B \\cdot A) x$$\n       *(Khi khởi tạo, ma trận $A$ thường lấy mẫu ngẫu nhiên Gaussian còn ma trận $B$ khởi tạo bằng $0$ để tại bước đầu tiên $\\Delta W = 0$, giữ nguyên hành vi mô hình gốc).*\n     * *Hiệu quả bộ nhớ:* Ví dụ với một ma trận $4096 \\times 4096$ ($16.77\\text{ triệu}$ tham số) và $r = 8$, số tham số của cặp $(A, B)$ tại tầng đó chỉ là $(4096 \\times 8) + (8 \\times 4096) = 65.536$ tham số. Nhờ không phải lưu Optimizer States cho $W_0$, lượng VRAM huấn luyện giảm mạnh và hạn chế *Catastrophic Forgetting*.\n     * *Gộp trọng số khi suy luận (Mergeable Weights):* Sau khi train xong, có thể cộng gộp $W_{\\text{merged}} = W_0 + \\frac{\\alpha}{r} B A$ để suy luận không phát sinh thêm độ trễ, hoặc giữ rời để phục vụ **Multi-LoRA Serving** trên Triton/NIM (1 Base Model trong VRAM phục vụ nhiều bộ Adapter LoRA khác nhau).\n   * **QLoRA (Quantized LoRA):**\n     * Giúp fine-tune LLM trên phần cứng giới hạn VRAM: **Lượng tử hóa mô hình gốc đã đóng băng $W_0$ xuống định dạng 4-bit (`NF4` - NormalFloat4)** kết hợp *Double Quantization* và *Paged Optimizers*, trong khi vẫn gắn và huấn luyện các thanh Adapter LoRA ở độ chính xác `BF16`/`FP16`.\n   * **Các kỹ thuật PEFT khác (hỗ trợ trong Hugging Face PEFT \u0026 NVIDIA NeMo Customizer):**\n     * **Prompt Tuning / P-Tuning:** Đóng băng base model, chỉ học thêm một chuỗi các vector liên tục (**Learnable Soft Prompt / Virtual Tokens**) gắn vào đầu chuỗi đầu vào.\n     * **Prefix Tuning:** Gắn thêm các vector tiền tố học được vào các tầng Key và Value của khối Attention.\n     * **Adapter Tuning:** Chèn thêm các lớp mạng bottleneck nhỏ nối tiếp vào bên trong từng khối Transformer.\n\n```mermaid\nflowchart LR\n    subgraph LoRA_Diagram[\"Cơ chế Toán học của LoRA (Low-Rank Adaptation)\"]\n        direction BT\n        Input_X[\"Đầu vào x\u003cbr/\u003e(d = 4096)\"]\n        \n        Frozen_W[\"❄️ Trọng số gốc W₀ (4096 × 4096)\u003cbr/\u003eĐóng băng (Frozen)\u003cbr/\u003e(Ở QLoRA: Nén W₀ xuống chuẩn 4-bit NF4)\"]\n        \n        Mat_A[\"🔥 Ma trận A (4096 × r)\u003cbr/\u003eGiảm chiều xuống rank r\"]\n        Mat_B[\"🔥 Ma trận B (r × 4096)\u003cbr/\u003eKhôi phục chiều lên 4096\"]\n        \n        Sum((\"Cộng (+)\u003cbr/\u003eh = W₀x + (α/r)B·A·x\"))\n        Output_H[\"Đầu ra h\u003cbr/\u003e(d = 4096)\"]\n\n        Input_X --\u003e Frozen_W --\u003e Sum\n        Input_X --\u003e Mat_A --\u003e|\"Nút cổ chai hạng thấp (rank r)\u003cbr/\u003eChỉ cập nhật A và B (tỷ lệ params tùy r \u0026 target_modules)\"| Mat_B --\u003e Sum\n        Sum --\u003e Output_H\n    end\n```\n\n### 5.2. Knowledge Distillation (Chưng cất tri thức) \u0026 Đánh giá sau Fine-Tuning\n* **Knowledge Distillation:** Quá trình chuyển giao tri thức từ một mô hình lớn, phức tạp (**Teacher Model**, ví dụ LLaMA-3 70B/405B) sang một mô hình nhỏ gọn hơn (**Student Model**, ví dụ SLM 3B/8B).\n  * Thay vì chỉ học trên nhãn cứng (Hard labels 0 hoặc 1), Student Model học cách bắt chước **phân phối xác suất đầu ra (Soft Labels / Logits)** hoặc học trên tập dữ liệu tổng hợp (**Synthetic Data**) do Teacher Model sinh ra $\\to$ Giúp thu được mô hình nhỏ gọn hơn, giảm chi phí và độ trễ khi chạy trên thiết bị biên (Edge/Mobile) hoặc sản xuất.\n* **Đánh giá mô hình sau khi Fine-Tuning:** Cần theo dõi **Validation Set Loss / Task Metrics** (trên tập kiểm định chưa từng thấy trong lúc train) để đánh giá khả năng tổng quát hóa và phát hiện sớm **Overfitting**, đồng thời kiểm tra trên bộ benchmark nền để đảm bảo mô hình không bị *Catastrophic Forgetting*.\n\n---\n\n## 6. Thực hành Tích hợp LLM cho Software Developer (Python Integration Patterns)\n\nMiền kiến thức **Software Development (24%)** và **Experimentation (22%)** trong NCA-GENL nhấn mạnh việc tích hợp LLM vào ứng dụng thực tế bằng Python. Dưới đây là 4 mẫu kỹ thuật cốt lõi dành cho Developer:\n\n### 6.1. Gọi LLM Endpoint, Đo Độ trễ (TTFT \u0026 Total Latency) và Theo dõi Token Usage\nKhi tích hợp một dịch vụ suy luận (như NVIDIA NIM hoặc OpenAI-compatible API), kỹ sư cần thiết lập `timeout`, đo thời gian phản hồi token đầu tiên (**TTFT**) khi dùng `stream=True`, tổng thời gian xử lý và ghi log lượng token tiêu thụ:\n\n```python\nimport time\nimport logging\nfrom openai import OpenAI, APITimeoutError, APIConnectionError\n\nlogging.basicConfig(level=logging.INFO)\nlogger = logging.getLogger(\"llm_client\")\n\nclient = OpenAI(\n    base_url=\"http://localhost:8000/v1\",  # Endpoint NVIDIA NIM hoặc OpenAI-compatible server\n    api_key=\"nvapi-placeholder-key\",\n    timeout=15.0,                         # Luôn đặt timeout rõ ràng cho môi trường Production\n    max_retries=2\n)\n\ndef call_llm_with_telemetry(prompt: str, model: str = \"meta/llama-3.1-8b-instruct\") -\u003e str:\n    start_time = time.perf_counter()\n    ttft = None\n    chunks = []\n\n    try:\n        stream = client.chat.completions.create(\n            model=model,\n            messages=[{\"role\": \"user\", \"content\": prompt}],\n            temperature=0.1,\n            max_tokens=256,\n            stream=True,\n            stream_options={\"include_usage\": True}\n        )\n        usage_info = None\n        for event in stream:\n            if ttft is None and event.choices and event.choices[0].delta.content:\n                ttft = (time.perf_counter() - start_time) * 1000.0  # ms\n            if event.choices and event.choices[0].delta.content:\n                chunks.append(event.choices[0].delta.content)\n            if getattr(event, \"usage\", None):\n                usage_info = event.usage\n\n        total_ms = (time.perf_counter() - start_time) * 1000.0\n        logger.info(\n            \"status=success model=%s ttft_ms=%.1f total_ms=%.1f prompt_tokens=%s completion_tokens=%s\",\n            model,\n            ttft or -1.0,\n            total_ms,\n            getattr(usage_info, \"prompt_tokens\", \"N/A\"),\n            getattr(usage_info, \"completion_tokens\", \"N/A\"),\n        )\n        return \"\".join(chunks)\n\n    except (APITimeoutError, APIConnectionError) as exc:\n        total_ms = (time.perf_counter() - start_time) * 1000.0\n        logger.error(\"status=error error_type=%s total_ms=%.1f detail=%s\", type(exc).__name__, total_ms, exc)\n        raise\n```\n\n### 6.2. Xác thực Đầu ra JSON Có cấu trúc (Structured Output Validation với Pydantic)\nKhông bao giờ tin tưởng tuyệt đối rằng LLM (kể cả khi `temperature=0`) sẽ luôn trả về JSON hợp lệ. Luôn kiểm tra cú pháp và ràng buộc kiểu dữ liệu bằng `Pydantic` hoặc `jsonschema`:\n\n```python\nimport json\nfrom pydantic import BaseModel, Field, ValidationError\nfrom typing import Literal\n\nclass SupportTicketAnalysis(BaseModel):\n    category: Literal[\"billing\", \"technical\", \"account\", \"other\"]\n    urgency: Literal[\"low\", \"medium\", \"high\"]\n    summary: str = Field(min_length=5, max_length=300)\n    requires_human_escalation: bool\n\ndef parse_and_validate_ticket(raw_llm_output: str) -\u003e SupportTicketAnalysis | None:\n    try:\n        data = json.loads(raw_llm_output)\n        return SupportTicketAnalysis.model_validate(data)\n    except (json.JSONDecodeError, ValidationError) as err:\n        # Xử lý an toàn: ghi log lỗi, kích hoạt retry kèm thông báo lỗi schema, hoặc chuyển sang fallback\n        logging.warning(\"Invalid structured output from LLM: %s\", err)\n        return None\n```\n\n### 6.3. So sánh Thực nghiệm: Prompt-Only Baseline vs. RAG Pipeline\nKhi đánh giá xem việc bổ sung RAG có thực sự cải thiện chất lượng câu trả lời so với chỉ dùng Prompt (Prompt-only baseline) hay không, cần giữ **cùng một phiên bản model, cùng tham số giải mã (`temperature`, `max_tokens`) và cùng tập câu hỏi kiểm thử (Golden Test Set)**:\n\n```python\ndef build_prompt_only(question: str) -\u003e str:\n    return f\"Hãy trả lời chính xác câu hỏi sau:\\nCâu hỏi: {question}\\nTrả lời:\"\n\ndef build_rag_prompt(question: str, retrieved_chunks: list[str]) -\u003e str:\n    context_block = \"\\n---\\n\".join(retrieved_chunks)\n    return (\n        \"Chỉ sử dụng thông tin trong phần \u003ccontext\u003e dưới đây để trả lời câu hỏi. \"\n        \"Nếu \u003ccontext\u003e không có thông tin, hãy trả lời \u0027Không đủ thông tin trong tài liệu\u0027.\\n\"\n        f\"\u003ccontext\u003e\\n{context_block}\\n\u003c/context\u003e\\n\"\n        f\"Câu hỏi: {question}\\nTrả lời:\"\n    )\n```\n\n---\n\n## 7. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm cần lưu ý ở Module 6:**\n\u003e 1. **So sánh RAG vs. Fine-Tuning:**\n\u003e    * Bài toán yêu cầu *\"kết nối kho tài liệu nội bộ thay đổi thường xuyên, giảm ảo giác (hallucination), kèm trích dẫn nguồn (citations) mà không cập nhật trọng số mô hình\"* $\\to$ Chọn **RAG**.\n\u003e    * Bài toán yêu cầu *\"dạy mô hình phong cách ngôn ngữ chuyên ngành sâu, thay đổi giọng văn hoặc tuân thủ định dạng đầu ra phức tạp cố định trên tập dữ liệu gán nhãn\"* $\\to$ Chọn **Fine-Tuning (LoRA/PEFT)**.\n\u003e 2. **So sánh LoRA vs. QLoRA:**\n\u003e    * Đóng băng trọng số gốc và chèn các ma trận phân rã hạng thấp (Low-rank decomposition matrices) để giảm số lượng tham số huấn luyện $\\to$ **LoRA**.\n\u003e    * Kết hợp LoRA với việc lượng tử hóa mô hình nền đã đóng băng xuống **4-bit (`NF4`)** để fine-tune trên phần cứng hạn chế VRAM $\\to$ **QLoRA**.\n\u003e 3. **Mô hình Teacher-Student:** Dùng mô hình lớn truyền tri thức cho mô hình nhỏ gọn hơn để triển khai tiết kiệm tài nguyên $\\to$ **Knowledge Distillation**.\n\u003e 4. **Hiện tượng Catastrophic Forgetting:** Khi Full Fine-Tuning làm mô hình suy giảm các kỹ năng ngôn ngữ tổng quát ban đầu $\\to$ Khắc phục bằng cách dùng **PEFT (LoRA)** hoặc trộn thêm dữ liệu tổng quát vào tập fine-tune.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Một kỹ sư muốn tinh chỉnh (fine-tune) một mô hình LLaMA-3 70B cho tác vụ y khoa nhưng chỉ có 1 máy trạm GPU với dung lượng VRAM hạn chế. Kỹ thuật nào cho phép nén mô hình gốc xuống 4-bit và chỉ huấn luyện các ma trận hạng thấp gắn kèm để tiết kiệm tối đa bộ nhớ?\n   * *Đáp án:* **QLoRA (Quantized Low-Rank Adaptation)**.\n2. **Câu 2:** Tại sao khi thực hiện Chunking tài liệu trong hệ thống RAG, các kỹ sư thường thiết lập một khoảng chồng lấn nhỏ (**Chunk Overlap**, ví dụ 10–15% số token) giữa hai đoạn văn liên tiếp?\n   * *Đáp án:* Để **bảo toàn ngữ cảnh liên tục tại vị trí ranh giới cắt**, tránh làm đứt gãy ý nghĩa của những câu văn hoặc ý tưởng nằm vắt ngang giữa hai chunk.\n3. **Câu 3:** Một tập đoàn luật muốn xây dựng chatbot tra cứu hàng chục nghìn văn bản quy phạm pháp luật mới ban hành hàng tuần. Yêu cầu bắt buộc là mọi câu trả lời của AI phải trích dẫn chính xác số hiệu điều khoản luật và tuyệt đối không được tự suy diễn sai lệch. Phương pháp tùy biến nào phù hợp nhất?\n   * *Đáp án:* **RAG (Retrieval-Augmented Generation)** kết hợp cơ sở dữ liệu Vector và bộ Reranker (vì dữ liệu cập nhật hàng tuần và đòi hỏi trích dẫn nguồn chính xác, chống ảo giác).\n4. **Câu 4:** Khi giải các bài toán đố toán học phức tạp hoặc lập luận logic nhiều bước mà không được phép fine-tune mô hình, kỹ thuật Prompt Engineering nào yêu cầu mô hình viết ra từng bước suy luận trung gian trước khi đưa ra câu trả lời cuối cùng?\n   * *Đáp án:* **Chain-of-Thought (CoT) Prompting**.\n5. **Câu 5:** Hiện tượng một mô hình ngôn ngữ lớn sau khi được Full Fine-Tuning trên tập dữ liệu câu lệnh SQL lại mất đi khả năng làm thơ và trò chuyện tự nhiên vốn có của Base Model được gọi là gì?\n   * *Đáp án:* **Catastrophic Forgetting (Quên thảm khốc)**.\n6. **Câu 6:** Trong kiến trúc RAG nâng cao (như NVIDIA NeMo Retriever), tại sao người ta thường đặt thêm một mô hình **Reranker (Cross-Encoder)** ngay sau bước tìm kiếm Vector (Bi-Encoder)?\n   * *Đáp án:* Vì Vector Search (Bi-Encoder) tối ưu cho tốc độ quét nhanh qua hàng triệu bản ghi để lấy Top-25 ứng viên nhưng nén riêng rẽ câu hỏi và tài liệu; trong khi **Reranker (Cross-Encoder)** chấm điểm tương tác ngữ cảnh sâu trực tiếp giữa câu hỏi và từng đoạn văn ứng viên để lọc ra Top-3 đoạn chính xác nhất đưa vào LLM.\n"},{"id":"mod07","file":"Module_07_Model_Training_and_Lifecycle.md","badge":"MODULE 07","shortTitle":"Training \u0026 Deployment Lifecycle","domain":"Exp \u0026 Data (36%)","weight":"Lifecycle","icon":"🔄","content":"# Module 7: Model Training \u0026 Deployment Lifecycle (Vòng đời Huấn luyện \u0026 Triển khai Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn tập NCA-GENL ở Module 7 (Thuộc Domain \"Software Development - 24%\", \"Experimentation - 22%\" \u0026 \"Data Analysis - 14%\"):**\n\u003e Nắm vững **5 giai đoạn trong vòng đời dự án ML/GenAI**; phân biệt **3 nguồn dữ liệu**; hiểu vai trò của **EDA (Exploratory Data Analysis)**, xử lý dữ liệu khuyết/ngoại lai/mất cân bằng (**SMOTE, Normalization vs. Standardization** và phòng chống **Data Leakage**), cùng các công cụ tiền xử lý văn bản (**Regex, N-grams, TF-IDF, Stemming vs. Lemmatization, Deduplication**); nắm rõ các **Hyperparameters (Learning Rate + Warmup/Decay, Batch Size + Gradient Accumulation, Epochs, Early Stopping)**; phân biệt đánh giá **Định lượng (Quantitative - bao gồm Perplexity) vs. Định tính (Qualitative)**; nắm chắc bộ 3 kỹ thuật nén \u0026 tối ưu triển khai: **ONNX**, **Reduced Precision \u0026 Quantization (`FP16`/`BF16`, `FP8`, `INT8`/`INT4`, PTQ vs. QAT)**, **Pruning (Structured 2:4 Sparsity vs. Unstructured)**, **Batch vs. Real-time Deployment**, **Docker \u0026 Kubernetes**, và giám sát **Data Drift vs. Concept Drift** sau triển khai.\n\n---\n\n## 1. Năm giai đoạn trong Vòng đời Dự án ML / GenAI (End-to-End Lifecycle)\n\nMọi dự án AI chuẩn công nghiệp (MLOps / LLMOps) đều đi qua đường ống (Pipeline) 5 giai đoạn tuần tự và lặp lại liên tục:\n\n```mermaid\nflowchart LR\n    P1[\"1. Data Collection\u003cbr/\u003e(Thu thập Dữ liệu)\u003cbr/\u003ePublic, Enterprise, API\"]\n    P2[\"2. Data Processing\u003cbr/\u003e(Khám phá \u0026 Làm sạch)\u003cbr/\u003eEDA, Regex, N-grams, Dedupe\"]\n    P3[\"3. Model Training\u003cbr/\u003e(Huấn luyện Mô hình)\u003cbr/\u003eHyperparams, BF16, Checkpoints\"]\n    P4[\"4. Model Evaluation\u003cbr/\u003e(Đánh giá Mô hình)\u003cbr/\u003eQuantitative (PPL) \u0026 Qualitative\"]\n    P5[\"5. Model Deployment\u003cbr/\u003e(Triển khai, Tối ưu \u0026 Giám sát)\u003cbr/\u003eONNX, Quantization, K8s, Drift\"]\n\n    P1 ==\u003e P2 ==\u003e P3 ==\u003e P4 ==\u003e P5\n    P4 -.-\u003e|\"Chưa đạt KPI -\u003e Quay lại làm giàu dữ liệu \u0026 tinh chỉnh\"| P2\n    P5 -.-\u003e|\"Phát hiện Data Drift / Concept Drift -\u003e Continuous Retraining\"| P1\n```\n\n---\n\n## 2. Giai đoạn 1: Data Collection (Thu thập Dữ liệu)\n\nChất lượng của mô hình phụ thuộc trực tiếp vào nguyên lý bất di bất dịch: **\"Garbage In, Garbage Out\"** (Dữ liệu rác đầu vào $\\to$ Mô hình rác đầu ra). Có **3 nguồn dữ liệu chính**:\n\n| Nguồn dữ liệu | Ví dụ điển hình | Đặc điểm \u0026 Lưu ý cho kỳ thi |\n| :--- | :--- | :--- |\n| **1. Public Datasets (Dữ liệu công khai)** | Hugging Face Datasets, Kaggle, **NVIDIA NGC Catalog**, Common Crawl, The Pile, Wikipedia, ImageNet, COCO. | Miễn phí, đa dạng, sẵn có; rất tốt để học tập, pre-train nền tảng, nghiên cứu ban đầu và chấm điểm chuẩn (**Benchmarking**). Cần kiểm tra kỹ bản quyền (License) và lọc nội dung độc hại. |\n| **2. Enterprise / Proprietary Data (Dữ liệu nội bộ doanh nghiệp)** | Hồ sơ khách hàng CRM, lịch sử giao dịch ngân hàng, biên bản cuộc họp, ticket hỗ trợ kỹ thuật, log cảm biến IoT. | Tạo ra **lợi thế cạnh tranh độc quyền (Competitive Moat)** cho doanh nghiệp khi dùng cho RAG hoặc Fine-tuning, nhưng đòi hỏi bảo mật, ẩn danh hóa (**PII Masking/Redaction**) và phân quyền nghiêm ngặt. |\n| **3. External / API-Based \u0026 Synthetic Data (Dữ liệu bên ngoài qua API \u0026 Dữ liệu tổng hợp)** | Dữ liệu thời gian thực từ Bloomberg API, mạng xã hội, thời tiết; hoặc **Synthetic Data** do mô hình lớn (như Nemotron-4 340B) sinh ra. | API cung cấp thông tin tươi mới (Real-time data); còn Synthetic Data giúp giải quyết tình trạng khan hiếm dữ liệu gắn nhãn ở các lĩnh vực hẹp. |\n\n* **Giải pháp Lưu trữ tương ứng theo quy mô:** Dùng **Object Storage (AWS S3 / GCS / MinIO)** cho kho dữ liệu thô khổng lồ (Data Lake); định dạng cột nén **Apache Parquet** hoặc **WebDataset** để đọc tuần tự tốc độ cao; và **NVIDIA GPUDirect Storage (GDS)** để nạp dữ liệu huấn luyện thẳng từ ổ cứng NVMe/Parallel FS vào VRAM của GPU.\n\n---\n\n## 3. Giai đoạn 2: Data Processing \u0026 Exploratory Data Analysis (Xử lý \u0026 Khám phá Dữ liệu)\n\n### 3.1. Exploratory Data Analysis (EDA - Phân tích Khám phá Dữ liệu)\n* **Phép ẩn dụ Y khoa (Medical Analogy):** Làm EDA trước khi huấn luyện mô hình giống hệt như **bác sĩ phải khám lâm sàng, xét nghiệm máu và chụp X-quang trước khi kê đơn hoặc phẫu thuật**. Bỏ qua EDA mà lao vào train mô hình ngay giống như mổ mà không chụp phim — tốn hàng nghìn giờ GPU vô ích!\n* **4 nhiệm vụ cốt lõi trong EDA \u0026 Tiền xử lý dữ liệu dạng bảng (Tabular Preprocessing):**\n  1. **Xử lý dữ liệu khuyết thiếu (Missing Values / `NaN` / `Null`) \u0026 Trùng lặp (Duplicates):**\n     * Nếu tỷ lệ thiếu rất nhỏ: Xóa dòng bị thiếu (`dropna`).\n     * Nếu dữ liệu quý giá: Điền giá trị thay thế (**Imputation**) bằng giá trị **Trung bình (Mean)**, **Trung vị (Median - tốt hơn khi có Outliers)**, **Giá trị phổ biến nhất (Mode)** cho biến phân loại, hoặc dùng thuật toán k-NN Imputer.\n  2. **Phát hiện và xử lý Điểm ngoại lai dị biệt (Outliers):**\n     * Dùng biểu đồ hộp (**Box Plot / IQR - Interquartile Range**) hoặc điểm chuẩn **Z-score ($|Z| \u003e 3$)** để phát hiện các điểm dữ liệu sai lệch bất thường (ví dụ nhập nhầm tuổi khách hàng = `999`).\n  3. **Xử lý Mất cân bằng Nhãn (Class Imbalance - Ví dụ: 99% bình thường, 1% gian lận):**\n     * **Oversampling (Tăng mẫu lớp thiểu số):** Nhân bản hoặc dùng thuật toán **SMOTE (Synthetic Minority Over-sampling Technique)** để nội suy sinh thêm mẫu cho lớp thiểu số. *(Lưu ý chống Data Leakage: SMOTE chỉ được áp dụng **bên trong tập huấn luyện / training fold** sau khi đã chia tách Train/Validation/Test, tuyệt đối không chạy SMOTE trên toàn bộ dataset trước khi split!).*\n     * **Undersampling (Giảm mẫu lớp đa số):** Giảm bớt mẫu của lớp chiếm đa số.\n     * **Cost-Sensitive Learning (Class Weights):** Tăng trọng số phạt trong hàm Loss nếu mô hình đoán sai mẫu thuộc lớp thiểu số.\n  4. **Chuẩn hóa Thang đo Đặc trưng (Feature Scaling: Normalization vs. Standardization):**\n     * Khi cột *\"Tuổi\"* có giá trị từ `18 – 80` còn cột *\"Thu nhập\"* có giá trị từ `10,000,000 – 500,000,000`, thuật toán Gradient Descent và các thuật toán dựa trên khoảng cách (k-NN, SVM, K-Means, PCA) sẽ bị cột Thu nhập chi phối. Ta dùng 1 trong 2 cách (và lưu ý chỉ **`fit` tham số $x_{\\min}, x_{\\max}, \\mu, \\sigma$ trên tập Train**, sau đó dùng tham số đó để `transform` tập Validation/Test — tham khảo [scikit-learn Common Pitfalls](https://scikit-learn.org/stable/common_pitfalls.html)):\n       * **Min-Max Normalization:** Đưa giá trị trên tập train về đoạn **$[0, 1]$** theo công thức $x\u0027 = \\frac{x - x_{\\min}}{x_{\\max} - x_{\\min}}$.\n       * **Standardization (Z-Score Scaling):** Đưa phân phối về **Trung bình $\\mu = 0$ và Độ lệch chuẩn $\\sigma = 1$** theo công thức $z = \\frac{x - \\mu}{\\sigma}$ (Ít bị ảnh hưởng bởi Outliers hơn Min-Max).\n\n---\n\n### 3.2. Các Kỹ thuật Xử lý Dữ liệu Văn bản cho NLP \u0026 LLM (Text Preprocessing Pipeline)\nTrong miền *Data Analysis (14%)* của đề thi NCA-GENL, bạn sẽ gặp các câu hỏi về công cụ xử lý văn bản thô:\n\n```mermaid\nflowchart TD\n    Raw[\"Văn bản thô thu thập từ Internet / Doanh nghiệp (Raw Text Corpus)\"]\n    \n    T1[\"1. Regular Expressions (Regex - Biểu thức chính quy)\u003cbr/\u003e🎯 Tìm kiếm, lọc bỏ \u0026 ẩn danh hóa (PII Redaction) các mẫu ký tự cố định:\u003cbr/\u003eEmail, Số điện thoại, Số thẻ tín dụng, URL, Thẻ HTML/XML, Ký tự rác\u003cbr/\u003e⚡ Siêu nhanh bằng CPU/GPU (cuDF), không cần tốn tài nguyên chạy ML!\"]\n    \n    T2[\"2. Chuẩn hóa Từ vựng (Stopwords, Stemming vs. Lemmatization)\u003cbr/\u003e• Stopwords Removal: Loại bỏ từ dừng tần suất cao ít nghĩa (\u0027the\u0027, \u0027is\u0027, \u0027at\u0027)\u003cbr/\u003e• Stemming: Cắt cụt đuôi từ thô sơ theo luật (\u0027studies\u0027 -\u003e \u0027studi\u0027, \u0027running\u0027 -\u003e \u0027run\u0027)\u003cbr/\u003e• Lemmatization: Đưa từ về đúng từ gốc từ điển theo ngữ pháp (\u0027better\u0027 -\u003e \u0027good\u0027, \u0027studies\u0027 -\u003e \u0027study\u0027)\"]\n    \n    T3[\"3. N-gram Summaries (Phân tích cụm N từ liền kề)\u003cbr/\u003e• Unigram (1 từ): [\u0027not\u0027, \u0027good\u0027] -\u003e Mất sắc thái phủ định!\u003cbr/\u003e• Bigram (2 từ): [\u0027not good\u0027] | Trigram (3 từ): [\u0027not worth watching\u0027]\u003cbr/\u003e👉 Giữ được ngữ cảnh cục bộ và phát hiện các cụm từ cố định (Collocations)!\"]\n    \n    T4[\"4. Word Frequency Analysis (TF-IDF) \u0026 Deduplication (Khử trùng lặp)\u003cbr/\u003e• Thống kê tần suất từ khóa chủ đề đặc trưng\u003cbr/\u003e• Exact \u0026 Fuzzy Deduplication (MinHash LSH trong NeMo Curator):\u003cbr/\u003eXóa các trang văn bản trùng lặp để LLM không học vẹt (Memorization)!\"]\n\n    Raw --\u003e T1 --\u003e T2 --\u003e T3 --\u003e T4\n```\n\n* **Lưu ý đặc biệt khi tiền xử lý cho LLM hiện đại vs. NLP cổ điển:**\n  * Trong **NLP cổ điển (Bag-of-Words / TF-IDF + Naive Bayes/SVM)**: Ta luôn xóa Stopwords (`\"the\"`, `\"not\"`, `\"is\"`) và đưa về chữ thường (Lowercasing) để giảm chiều vector.\n  * Trong **LLM hiện đại (Transformer)**: Ta **KHÔNG xóa Stopwords** và **KHÔNG cắt Stemming** vì cơ chế Self-Attention cần đầy đủ từng từ dừng và chữ hoa/thường để hiểu trọn vẹn cấu trúc ngữ pháp và sinh câu văn tự nhiên! Thay vào đó, bước quan trọng nhất cho LLM là **Lọc rác bằng Regex, Ẩn danh hóa PII, và Khử trùng lặp (Deduplication)** bằng công cụ như **NVIDIA NeMo Curator**.\n\n---\n\n## 4. Giai đoạn 3: Model Training (Huấn luyện Mô hình)\n\nQuá trình huấn luyện bao gồm **5 bước kỹ thuật cốt lõi**:\n1. **Lựa chọn kiến trúc (Model Architecture Selection):**\n   * Xử lý ngôn ngữ tự nhiên / Sinh văn bản / Code $\\to$ **Transformer (Decoder / Encoder / Seq2Seq)**.\n   * Thị giác máy tính / Phân loại \u0026 nhận diện ảnh $\\to$ **CNN (Convolutional Neural Networks: ResNet, YOLO)** hoặc **Vision Transformer (ViT)**.\n   * Sinh ảnh / Video nghệ thuật từ văn bản $\\to$ **Diffusion Models (Latent Diffusion / DiT)**.\n   * Dữ liệu dạng bảng có cấu trúc (Tabular Data) $\\to$ **Gradient Boosted Trees (XGBoost / LightGBM / CatBoost)** hoặc **Random Forest**.\n2. **Chiến lược huấn luyện (Training Strategy):** Chọn giữa *Full Training from Scratch*, *Continual Pre-training*, *Full Fine-Tuning* hay *PEFT (LoRA / QLoRA)*.\n3. **Cấu hình Siêu tham số (Hyperparameter Configuration - Cực kỳ hay hỏi trong đề thi!):**\n   * *Phân biệt Parameters vs. Hyperparameters:*\n     * **Model Parameters (Tham số mô hình):** Trọng số ($W$) và độ lệch ($b$) bên trong mạng nơ-ron — do mô hình **tự động học và cập nhật** trong lúc train.\n     * **Hyperparameters (Siêu tham số):** Các nút vặn cấu hình bên ngoài do **Kỹ sư AI thiết lập trước khi bấm nút train** (Learning Rate, Batch Size, số Epochs, số tầng, bậc $r$ của LoRA, Dropout rate).\n\n| Siêu tham số (Hyperparameter) | Ý nghĩa kỹ thuật | Chuyện gì xảy ra nếu đặt SAI? | Kỹ thuật tối ưu nâng cao |\n| :--- | :--- | :--- | :--- |\n| **1. Learning Rate ($\\eta$ - Tốc độ học)** | Độ lớn của bước nhảy khi cập nhật trọng số ngược chiều đạo hàm: $W \\leftarrow W - \\eta \\nabla L$. *(Siêu tham số quan trọng nhất!)* | • **Quá cao (Too High):** Nhảy vọt qua đáy cực tiểu (**Overshooting / Divergence**), hàm Loss dao động hỗn loạn hoặc nổ thành `NaN`.\u003cbr/\u003e• **Quá thấp (Too Low):** Hội tụ cực kỳ chậm chạp (tốn tiền GPU) và dễ bị kẹt ở cực tiểu cục bộ (**Local Minimum**). | Dùng **Learning Rate Scheduler**: Tăng dần tuyến tính ở vài trăm bước đầu (**Warmup**) để ổn định đạo hàm, sau đó giảm dần theo hình cô-sin (**Cosine Annealing Decay**). |\n| **2. Batch Size (Kích thước lô)** | Số lượng mẫu dữ liệu được đưa vào GPU tính toán song song trong **1 bước cập nhật trọng số (1 Iteration/Step)**. | • **Quá lớn:** Tận dụng GPU tốt, đạo hàm chuẩn nhưng **tốn rất nhiều VRAM (dễ lỗi `CUDA OOM`)** và đôi khi hội tụ vào cực tiểu nhọn kém tổng quát.\u003cbr/\u003e• **Quá nhỏ (VD: Batch = 1):** Đạo hàm rất nhiễu (Noisy gradients) và không tận dụng hết nhân GPU. | **Gradient Accumulation (Tích lũy đạo hàm):** Nếu VRAM chỉ chứa nổi `micro_batch = 2`, ta chạy xuôi-ngược 16 lần liên tiếp cộng dồn Gradient lại rồi mới gọi `optimizer.step()` 1 lần $\\to$ Giả lập được `Effective Batch Size = 32` mà không tốn thêm VRAM! |\n| **3. Epochs (Số chu kỳ huấn luyện)** | Số lần mà **toàn bộ 100% tập dữ liệu huấn luyện** được đẩy qua mô hình trọn vẹn. *(Ví dụ: Tập dữ liệu có $10.000$ mẫu, `Batch Size = 100` $\\to$ $1\\text{ Epoch} = 100\\text{ Iterations/Steps}$).* | • **Quá ít Epochs:** Mô hình chưa kịp học hết quy luật $\\to$ **Underfitting**.\u003cbr/\u003e• **Quá nhiều Epochs:** Mô hình học thuộc lòng cả nhiễu của tập Train $\\to$ **Overfitting**. | **Early Stopping (Dừng sớm):** Theo dõi `Validation Loss` sau mỗi Epoch; nếu thấy Validation Loss không giảm nữa (hoặc bắt đầu tăng lên) trong $k$ epochs liên tiếp (`patience`), tự động dừng train ngay và lấy Checkpoint tốt nhất! |\n\n4. **Thực thi huấn luyện (Training Execution):** Chạy trên **PyTorch / NVIDIA NeMo Megatron**, bật **Mixed Precision (`BF16` / `FP16` / `FP8`)**, áp dụng **Gradient Clipping** (cắt ngưỡng độ dài vector đạo hàm để chống nổ đạo hàm *Exploding Gradients*), và lưu **Checkpoints** định kỳ ra Parallel File System để nếu cụm 1.000 GPU có 1 máy bị lỗi phần cứng thì chỉ cần khôi phục từ Checkpoint gần nhất thay vì mất trắng nhiều tuần chạy.\n5. **Giám sát Đường cong Huấn luyện (Monitoring Loss Curves) – Chẩn đoán Underfitting vs. Overfitting:**\n\n```mermaid\nflowchart LR\n    subgraph UF[\"1. Underfitting (Chưa khớp / Học quá kém - High Bias)\"]\n        U1[\"📉 Training Loss: RẤT CAO\u003cbr/\u003e📉 Validation Loss: RẤT CAO\u003cbr/\u003e🔧 Nguyên nhân: Mô hình quá nhỏ, thiếu đặc trưng hoặc train quá ít Epochs\u003cbr/\u003e💡 Cách sửa:
