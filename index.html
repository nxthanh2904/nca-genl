<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA NCA-GENL Master Study Hub | Cẩm Nang Toàn Diện & Sơ Đồ Tư Duy</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Highlight.js for Code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
    <!-- Mermaid.js (Fallback Vector Mode) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- TOP NAVIGATION -->
    <header class="topbar">
        <div class="brand">
            <button class="icon-btn" id="toggleSidebarBtn" title="Ẩn/Hiện danh mục Module" aria-label="Danh mục tài liệu" aria-controls="sidebarLeft" aria-expanded="true">☰</button>
            <div class="brand-logo">NV</div>
            <div class="brand-copy">
                <span class="brand-title-text">NCA-GENL Master Hub</span>
                <span class="brand-badge">Custom Visual Diagrams</span>
            </div>
        </div>

        <nav class="nav-tabs" id="mainNavTabs" aria-label="Chế độ học tập">
            <button class="nav-tab active" data-view="reader">📖 <span class="tab-label">Đọc Tài Liệu (13 File)</span><span class="tab-short">Tài Liệu</span></button>
            <button class="nav-tab" data-view="mindmaps">🧠 <span class="tab-label">Bản Đồ Tư Duy (13 Mindmaps)</span><span class="tab-short">Mindmap</span></button>
            <button class="nav-tab" data-view="diagrams">🏗️ <span class="tab-label">Sơ Đồ Quyết Định & VRAM Calc</span><span class="tab-short">Sơ đồ</span></button>
            <button class="nav-tab" data-view="flashcards">⚡ <span class="tab-label">Flashcards Phản Xạ (20 Thẻ)</span><span class="tab-short">Flashcards</span></button>
            <button class="nav-tab" data-view="quiz">🎯 <span class="tab-label">Thi Thử 60 Phút (EN / VI & Practice 01)</span><span class="tab-short">Thi Thử</span></button>
        </nav>

        <div class="top-actions">
            <button class="search-trigger" id="openSearchBtn" title="Tìm kiếm toàn bộ (Ctrl+K)" aria-label="Tìm kiếm toàn bộ tài liệu">
                <span>🔍<span class="search-text"> Tìm kiếm toàn bộ...</span></span>
                <span class="kbd">Ctrl K</span>
            </button>
            <details class="reading-settings" id="readingSettings">
                <summary class="icon-btn" title="Tùy chỉnh khung đọc" aria-label="Tùy chỉnh khung đọc">Aa</summary>
                <div class="reading-settings-panel">
                    <span>Cỡ chữ: <output id="fontSizeValue" aria-live="polite">16</output> px</span>
                    <button class="icon-btn" id="fontDecBtn" title="Giảm cỡ chữ" aria-label="Giảm cỡ chữ">A−</button>
                    <button class="icon-btn" id="fontIncBtn" title="Tăng cỡ chữ" aria-label="Tăng cỡ chữ">A+</button>
                    <button class="icon-btn" id="widthToggleBtn" title="Mở rộng khung đọc" aria-label="Mở rộng khung đọc" aria-pressed="false">↔</button>
                </div>
            </details>
            <button class="icon-btn" id="themeToggleBtn" title="Đổi giao diện Sáng/Tối" aria-label="Đổi giao diện Sáng/Tối">🌙</button>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="app-body">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- LEFT SIDEBAR: MODULE LIST -->
        <aside class="sidebar-left" id="sidebarLeft" aria-label="Danh mục tài liệu" tabindex="-1">
            <div class="sidebar-heading">
                <span>Tài liệu ôn tập</span>
                <button class="icon-btn drawer-close" id="closeSidebarBtn" title="Đóng danh mục" aria-label="Đóng danh mục">✕</button>
            </div>
            <div class="progress-box">
                <div class="progress-header">
                    <span>Tiến độ ôn tập NCA-GENL</span>
                    <span id="progressText">0 / 13 hoàn thành</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>
            <div class="module-list" id="moduleListContainer"></div>
        </aside>

        <!-- MAIN SCROLLABLE AREA -->
        <main class="main-scroll" id="mainScroll">
            <div class="content-container" id="contentContainer"></div>
        </main>

        <!-- RIGHT SIDEBAR: TABLE OF CONTENTS -->
        <aside class="sidebar-right" id="sidebarRight" aria-label="Mục lục bài học" tabindex="-1">
            <div class="toc-header">
                <span>📑 Mục lục bài học</span>
                <button class="icon-btn" id="closeTocMobileBtn" title="Ẩn mục lục" aria-label="Ẩn mục lục">✕</button>
            </div>
            <ul class="toc-list" id="tocList"></ul>
        </aside>

        <!-- MOBILE FLOATING ACTION BUTTONS (TOC & SCROLL TOP) -->
        <div class="mobile-fab-group" id="mobileFabGroup">
            <button class="mobile-fab" id="scrollTopFab" title="Lên đầu trang" onclick="document.getElementById('mainScroll').scrollTo({top:0, behavior:'smooth'})">↑ Đầu trang</button>
            <button class="mobile-fab primary" id="openTocFab" title="Mục lục bài học" aria-controls="sidebarRight" aria-expanded="false">📑 Mục lục</button>
        </div>
    </div>

    <!-- GLOBAL SEARCH MODAL -->
    <div class="modal-backdrop" id="searchModal">
        <div class="search-modal">
            <div class="search-input-wrap">
                <span>🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="Nhập từ khóa (VD: GPUDirect RDMA, BF16, LoRA, BLEU, ROUGE, Triton, Guardrails, PCA...)" autocomplete="off">
                <button class="icon-btn" id="closeSearchBtn">✕</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <script src="assets/js/docs-data.js"></script>
    <script src="assets/js/quiz-data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
