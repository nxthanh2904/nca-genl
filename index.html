mory-bandwidth bound)** vì mỗi lần sinh 1 token mới lại phải đọc toàn bộ trọng số mô hình và KV Cache từ HBM lên nhân tính toán!\n3. **Throughput (Thông lượng tổng thể – Tokens/second hoặc Requests/second):**\n   * Tổng số lượng token mà máy chủ phục vụ được cho **tất cả người dùng đồng thời** trong 1 giây (Tối ưu hóa bằng *In-flight Batching / Dynamic Batching*).\n\n---\n\n## 3. Khái niệm Model Card \u0026 Các Bộ Benchmark Đánh giá LLM Chuẩn Quốc tế\n\n### 3.1. Model Card (Hồ sơ Lý lịch Mô hình)\n* **Model Card là gì?** Là tài liệu tiêu chuẩn kỹ thuật (do Google đề xuất và trở thành chuẩn bắt buộc trên **Hugging Face** cũng như **NVIDIA NGC Catalog**) đi kèm mỗi mô hình AI nhằm cung cấp thông tin minh bạch, toàn diện và có thể kiểm chứng về năng lực cũng như giới hạn của mô hình đó.\n* **6 mục bắt buộc phải có trong một Model Card tiêu chuẩn (Cần nhớ kỹ cho kỳ thi):**\n  1. **Model Overview (Tổng quan mô hình):** Tên mô hình, phiên bản, tổ chức phát triển, ngày phát hành, loại kiến trúc nền tảng (ví dụ: *Transformer Decoder-only*) và **Giấy phép bản quyền (License: Apache 2.0, MIT, Llama Community License hay Non-commercial)**.\n  2. **Intended Use \u0026 Out-of-Scope Use (Mục đích sử dụng \u0026 Trường hợp cấm):** Các bài toán được thiết kế để sử dụng (ví dụ: trợ lý tóm tắt văn bản tiếng Anh) và các trường hợp **nghiêm cấm/ngoài phạm vi (Out-of-scope / Misuse)** (ví dụ: không được dùng để kê đơn thuốc y khoa tự động hay tư vấn pháp lý sinh tử).\n  3. **Training Data (Dữ liệu huấn luyện):** Nguồn gốc dữ liệu huấn luyện, phương pháp lọc/làm sạch, kích thước kho ngữ liệu (bao nhiêu nghìn tỷ token), phân bố ngôn ngữ và **Mốc thời gian ngắt tri thức (Knowledge Cutoff)**.\n  4. **Model Architecture \u0026 Compute Requirements (Kiến trúc \u0026 Yêu cầu phần cứng):** Số lượng tham số, số tầng (layers), số đầu chú ý (attention heads), độ dài cửa sổ ngữ cảnh (**Context Window**), định dạng số học (`BF16`/`FP8`) và lượng VRAM tối thiểu để chạy.\n  5. **Evaluation \u0026 Performance Metrics (Kết quả đánh giá chuẩn):** Bảng điểm định lượng thực tế trên các bộ benchmark công khai (MMLU, HumanEval, GSM8K, BLEU, ROUGE, F1-score...).\n  6. **Limitations, Ethical Considerations \u0026 Bias (Hạn chế, Đạo đức \u0026 Thiên vị):** Các điểm yếu đã biết, tỷ lệ sinh ảo giác (hallucination), các rủi ro thiên vị văn hóa/giới tính/chủng tộc và khuyến nghị đặt rào chắn an toàn (Guardrails).\n\n### 3.2. Các Bộ Benchmark Tiêu chuẩn để So sánh các LLM (Hay xuất hiện trong Model Card)\n| Tên Bộ Benchmark | Đo lường năng lực gì của LLM? | Ví dụ nội dung bài thi của Benchmark |\n| :--- | :--- | :--- |\n| **1. MMLU (Massive Multitask Language Understanding)** | **Kiến thức tổng quát \u0026 Học thuật đa lĩnh vực:** Bộ 57 môn thi trắc nghiệm từ cấp 3 đến đại học/chuyên gia (Toán, Lý, Hóa, Y sinh, Luật, Lịch sử, Kinh tế). | Các câu hỏi trắc nghiệm 4 lựa chọn A/B/C/D trải rộng mọi ngành khoa học. |\n| **2. HumanEval \u0026 MBPP** | **Năng lực Lập trình \u0026 Sinh mã nguồn (Coding):** Khả năng viết hàm Python từ chuỗi mô tả Docstring và vượt qua các Unit Tests tự động (chỉ số `pass@1`). | Cho đề bài thuật toán và kiểm tra xem code AI sinh ra chạy có đúng 100% test cases không. |\n| **3. GSM8K \u0026 MATH** | **Suy luận Toán học đa bước (Mathematical Reasoning):** Giải các bài toán đố cấp 2 (GSM8K - 8.500 bài) và toán thi Olympic (MATH). | Bài toán đố đòi hỏi 4–8 bước lập luận cộng trừ nhân chia liên tiếp (Chain-of-Thought). |\n| **4. TruthfulQA \u0026 HaluEval** | **Độ trung thực \u0026 Chống ảo giác (Truthfulness \u0026 Hallucination):** Kiểm tra xem mô hình có bị lừa bởi những tin đồn/ngộ nhận phổ biến của con người hay không. | Hỏi các câu dễ gây ngộ nhận để xem mô hình nói sự thật khoa học hay bịa chuyện theo đám đông. |\n| **5. MT-Bench \u0026 Chatbot Arena (LMSYS)** | **Chất lượng Hội thoại đa lượt \u0026 Đánh giá ngang hàng:** Dùng **LLM-as-a-Judge (GPT-4 chấm điểm)** hoặc người thật bình chọn mù (Blind A/B testing tính điểm **Elo**). | So sánh trực tiếp 2 mô hình ẩn danh qua các cuộc hội thoại phức tạp nhiều lượt. |\n\n---\n\n## 4. Các Độ đo Đánh giá Chuyên sâu (Evaluation Metrics - BẮT BUỘC THUỘC LÒNG!)\n\n### 4.1. Bộ Độ đo cho Bài toán Phân loại: Confusion Matrix, Precision, Recall, F1 \u0026 ROC-AUC\nKhi đánh giá mô hình phân loại (ví dụ: Phát hiện email Spam, Phát hiện giao dịch gian lận, Chẩn đoán bệnh, Kiểm duyệt nội dung độc hại), ta lập **Ma trận Nhầm lẫn (Confusion Matrix)** gồm 4 ô:\n\n```mermaid\nflowchart TD\n    subgraph CM[\"Ma trận Nhầm lẫn (Confusion Matrix)\"]\n        direction LR\n        subgraph Pred_Pos[\"Mô hình Dự đoán: DƯƠNG TÍNH (Positive / Có bệnh / Spam)\"]\n            TP[\"✅ TP (True Positive - Dương tính thật)\u003cbr/\u003eThực tế: Dương tính | Mô hình đoán: Dương tính\u003cbr/\u003e(Bắt trúng Spam / Bắt trúng kẻ gian!)\"]\n            FP[\"❌ FP (False Positive - Dương tính giả / Lỗi Loại I)\u003cbr/\u003eThực tế: Âm tính | Mô hình đoán nhầm: Dương tính\u003cbr/\u003e(Báo động giả: Xóa nhầm email hợp đồng của sếp vào thùng rác!)\"]\n        end\n        subgraph Pred_Neg[\"Mô hình Dự đoán: ÂM TÍNH (Negative / Bình thường)\"]\n            FN[\"🚨 FN (False Negative - Âm tính giả / Lỗi Loại II)\u003cbr/\u003eThực tế: Dương tính | Mô hình đoán nhầm: Âm tính\u003cbr/\u003e(Bỏ lọt tội phạm / Bỏ sót bệnh nhân ung thư!)\"]\n            TN[\"✅ TN (True Negative - Âm tính thật)\u003cbr/\u003eThực tế: Âm tính | Mô hình đoán: Âm tính\u003cbr/\u003e(Email thường cho vào hộp thư đến bình thường)\"]\n        end\n    end\n```\n\n| Độ đo (Metric) | Công thức Toán học | Ý nghĩa trực quan \u0026 Khi nào phải ưu tiên? (Cực kỳ hay hỏi thi!) |\n| :--- | :--- | :--- |\n| **1. Accuracy (Độ chính xác tổng thể)** | $$\\frac{TP + TN}{TP + TN + FP + FN}$$ | Tỷ lệ đoán đúng trên tổng số mẫu. \u003cbr/\u003e⚠️ **CẢNH BÁO BẪY:** Chỉ dùng khi dữ liệu cân bằng (50/50). **Hoàn toàn vô dụng và gây hiểu lầm nghiêm trọng khi dữ liệu mất cân bằng (Imbalanced Data)** (VD: 99% bình thường, 1% gian lận $\\to$ một mô hình \"ngu\" đoán tất cả là bình thường cũng đạt Accuracy 99%!). |\n| **2. Precision (Độ chuẩn xác / Độ tin cậy dương tính)** | $$\\frac{TP}{TP + FP}$$ | *\"Trong tất cả những trường hợp mô hình HÔ LÊN là Dương tính, có bao nhiêu % là Dương tính thật?\"* \u003cbr/\u003e👉 **Ưu tiên tối đa khi chi phí của False Positive (FP - Bắt nhầm / Báo động giả) quá đắt:** Ví dụ **Lọc Email Spam**, **Khóa tài khoản người dùng tự động**, **Gợi ý video an toàn cho trẻ em** (thà để sót vài tin rác vào Inbox còn hơn tự động xóa mất email hợp đồng triệu đô của khách hàng!). |\n| **3. Recall (Độ bao phủ / Độ nhạy - Sensitivity / TPR)** | $$\\frac{TP}{TP + FN}$$ | *\"Trong tất cả các ca Dương tính thực tế ngoài đời, mô hình TÓM ĐƯỢC bao nhiêu %?\"* \u003cbr/\u003e👉 **Ưu tiên tối đa khi chi phí của False Negative (FN - Bỏ lọt) nguy hiểm chết người:** Ví dụ **Sàng lọc bệnh ung thư**, **Phát hiện giao dịch gian lận/rửa tiền**, **Phát hiện mã độc/xâm nhập mạng**, **Phát hiện lỗi phanh xe tự hành** (thà báo động nhầm để bác sĩ/nhân viên kiểm tra lại còn hơn bỏ sót bệnh nhân/kẻ trộm!). |\n| **4. F1-Score (Điểm cân bằng)** | $$2 \\times \\frac{\\text{Precision} \\times \\text{Recall}}{\\text{Precision} + \\text{Recall}}$$ | Trung bình điều hòa (Harmonic Mean) giữa Precision và Recall (chỉ cao khi cả Precision và Recall đều cao). \u003cbr/\u003e👉 **Thước đo VÀNG bắt buộc chọn trong đề thi khi Tập dữ liệu mất cân bằng (Imbalanced Dataset)** và cần cân bằng cả hai loại lỗi FP và FN! |\n| **5. ROC-AUC (Area Under the ROC Curve)** | Diện tích dưới đường cong biểu diễn **TPR (Recall)** theo **FPR ($\\frac{FP}{FP+TN}$)** tại mọi ngưỡng cắt xác suất (Threshold) | Đo lường khả năng phân tách hai lớp của mô hình độc lập với ngưỡng cắt (từ $0.0$ đến $1.0$; đoán ngẫu nhiên tung đồng xu = $0.5$, hoàn hảo = $1.0$). |\n\n---\n\n### 4.2. Bộ Độ đo cho Bài toán Hồi quy (Regression Metrics: Dự đoán số liên tục)\nKhi mô hình dự đoán giá nhà, nhiệt độ, doanh số, đề thi có thể hỏi về 4 chỉ số sau:\n1. **MAE (Mean Absolute Error):** Trung bình trị tuyệt đối sai số $\\frac{1}{n}\\sum |y_i - \\hat{y}_i|$. Dễ hiểu, cùng đơn vị với biến mục tiêu, **ít bị ảnh hưởng bởi các điểm dị biệt (Outliers)**.\n2. **MSE (Mean Squared Error) \u0026 RMSE (Root MSE):** Trung bình bình phương sai số $\\frac{1}{n}\\sum (y_i - \\hat{y}_i)^2$ (và căn bậc hai của nó). Vì bình phương sai số nên **phạt cực nặng các lỗi dự đoán sai lệch lớn (Outliers)**.\n3. **$R^2$ (R-Squared / Coefficient of Determination):** Cho biết mô hình giải thích được bao nhiêu % sự biến thiên của dữ liệu (gần $1.0$ là mô hình khớp hoàn hảo).\n\n---\n\n### 4.3. Các Độ đo cho Bài toán Ngôn ngữ \u0026 GenAI: BLEU, ROUGE, BERTScore, Cosine Similarity \u0026 RAG Triad\n\n```mermaid\nflowchart TD\n    Metrics[\"Các Độ đo Đánh giá Ngôn ngữ \u0026 GenAI Cốt lõi\"]\n    \n    subgraph M1[\"1. BLEU (Bilingual Evaluation Understudy)\"]\n        B1[\"🎯 Bài toán: DỊCH MÁY (Machine Translation)\"]\n        B2[\"🔍 Bản chất: Thiên về Độ chuẩn xác (PRECISION-oriented)\u003cbr/\u003eĐếm tỷ lệ cụm từ (1-gram đến 4-gram) trong bản dịch AI\u003cbr/\u003exuất hiện trùng khớp trong bản dịch mẫu của người (kèm Brevity Penalty)\"]\n        B3[\"📏 Thang điểm: 0.0 đến 1.0 (hoặc 0 - 100; Càng cao càng tốt)\"]\n        B1 --\u003e B2 --\u003e B3\n    end\n\n    subgraph M2[\"2. ROUGE (Recall-Oriented Understudy for Gisting Evaluation)\"]\n        R1[\"🎯 Bài toán: TÓM TẮT VĂN BẢN (Text Summarization)\"]\n        R2[\"🔍 Bản chất: Thiên về Độ bao phủ (RECALL-oriented)\u003cbr/\u003eKiểm tra bản tóm tắt của AI có nhặt đủ các từ/ý chính\u003cbr/\u003exuất hiện trong bản tóm tắt chuẩn của người hay không\"]\n        R3[\"📏 Biến thể: ROUGE-1 (từ đơn), ROUGE-2 (cặp từ), ROUGE-L (chuỗi con chung dài nhất LCS)\"]\n        R1 --\u003e R2 --\u003e R3\n    end\n\n    subgraph M3[\"3. Cosine Similarity \u0026 BERTScore (Ngữ nghĩa Vector)\"]\n        C1[\"🎯 Bài toán: TÌM KIẾM NGỮ NGHĨA (Semantic Search), RAG \u0026 Đánh giá Từ đồng nghĩa\"]\n        C2[\"🔍 Bản chất: Đo cô-sin góc giữa 2 Vector Embedding trong không gian đa chiều\u003cbr/\u003eĐánh giá mức độ gần gũi về Ý NGHĨA chứ không đếm chữ bề mặt!\"]\n        C3[\"📏 Thang điểm: -1.0 đến 1.0 (Văn bản thường từ 0 đến 1; 1.0 = Trùng khớp nghĩa hoàn toàn)\"]\n        C1 --\u003e C2 --\u003e C3\n    end\n\n    Metrics --\u003e M1 \u0026 M2 \u0026 M3\n```\n\n1. **BLEU (Bilingual Evaluation Understudy) $\\to$ DỊCH MÁY (Machine Translation):**\n   * *Mẹo nhớ:* **B**ilingual (Song ngữ) = **Dịch thuật**!\n   * *Bản chất:* **Precision-oriented** (kèm hệ số phạt *Brevity Penalty* nếu máy dịch câu quá ngắn). Đếm xem câu máy dịch có bao nhiêu n-gram xuất hiện chuẩn xác trong bản dịch tham chiếu của con người.\n2. **ROUGE (Recall-Oriented Understudy for Gisting Evaluation) $\\to$ TÓM TẮT (Summarization):**\n   * *Mẹo nhớ:* **R**ecall-Oriented ... for **Gisting** (Gist = Ý chính / Tóm tắt)!\n   * *Bản chất:* **Recall-oriented**. Kiểm tra bài tóm tắt của AI có bao phủ đủ các ý chính quan trọng trong bản tóm tắt chuẩn hay không:\n     * **ROUGE-1:** Độ trùng khớp từng từ đơn (Unigrams).\n     * **ROUGE-2:** Độ trùng khớp từng cặp 2 từ liên tiếp (Bigrams).\n     * **ROUGE-L:** Dựa trên **Chuỗi con chung dài nhất (Longest Common Subsequence - LCS)** để đánh giá cấu trúc mạch câu mà không đòi hỏi các từ phải đứng sát cạnh nhau.\n3. **Hạn chế chung của BLEU \u0026 ROUGE và Giải pháp `BERTScore`:**\n   * Vì BLEU và ROUGE chỉ **đếm sự trùng khớp mặt chữ (Exact lexical / n-gram overlap)**, nên nếu đáp án mẫu là *\"Chiếc xe hơi chạy rất nhanh\"* mà AI viết là *\"Chiếc ô tô di chuyển với tốc độ cao\"*, điểm BLEU/ROUGE sẽ rất thấp dù hai câu đồng nghĩa 100%!\n   * **Giải pháp – `BERTScore` \u0026 `Cosine Similarity`:** Đưa cả câu của AI và câu mẫu qua mô hình Embedding (như BERT/RoBERTa) rồi tính **Cosine Similarity** giữa các vector nhúng để chấm điểm **tương đồng về mặt ngữ nghĩa (Semantic Similarity)**:\n     $$\\text{Cosine Similarity}(\\mathbf{A}, \\mathbf{B}) = \\cos(\\theta) = \\frac{\\mathbf{A} \\cdot \\mathbf{B}}{\\|\\mathbf{A}\\| \\|\\mathbf{B}\\|}$$\n4. **Bộ 3 Chỉ số Đánh giá Hệ thống RAG (The RAG Triad - Rất thực tế trong NeMo Evaluator / Ragas):**\n   Khi đánh giá một pipeline RAG, kỹ sư đo lường 3 cạnh của tam giác chất lượng:\n   * **Context Relevance (Độ liên quan của Ngữ cảnh truy xuất):** Các đoạn văn (Chunks) mà Vector DB tìm ra có thực sự liên quan đến câu hỏi của User không?\n   * **Groundedness / Faithfulness (Tính trung thực với Ngữ cảnh - Chống Hallucination):** Câu trả lời của LLM có bám sát 100% vào dữ kiện trong Chunks vừa tìm được không, hay nó tự bịa thêm thông tin bên ngoài?\n   * **Answer Relevance (Độ trúng đích của Câu trả lời):** Câu trả lời cuối cùng có giải quyết đúng câu hỏi ban đầu của User không?\n\n---\n\n## 5. Phương pháp Kiểm thử Thực tế: Cross-Validation, A/B Testing \u0026 Canary Deployment\n\n### 5.1. Chia tập dữ liệu (Train / Validation / Test Split) \u0026 k-Fold Cross-Validation\n* **Ba tập dữ liệu tách biệt trong huấn luyện:**\n  1. **Training Set (~70–80%):** Dùng để mô hình học và cập nhật trọng số (Backpropagation).\n  2. **Validation Set / Dev Set (~10–15%):** Dùng để chấm điểm sau mỗi Epoch nhằm **tinh chỉnh siêu tham số (Hyperparameter Tuning)**, chọn kiến trúc và kích hoạt **Early Stopping** (dừng sớm chống Overfitting).\n  3. **Test Set / Holdout Set (~10–15%):** Cất kỹ trong \"két sắt\", **chỉ mang ra chạy đúng 1 lần cuối cùng** để báo cáo hiệu năng khách quan. *(Nếu vô tình để dữ liệu Test lọt vào tập Train hoặc dùng tập Test để chỉnh tham số sẽ gây lỗi nghiêm trọng gọi là **Data Leakage / Rò rỉ dữ liệu**!).*\n* **k-Fold Cross-Validation (Kiểm định chéo k-Fold):**\n  * *Khi nào sử dụng?* Khi doanh nghiệp có **tập dữ liệu giới hạn / nhỏ (Limited dataset)** và muốn đánh giá khả năng tổng quát hóa của mô hình một cách đáng tin cậy nhất trên toàn bộ mẫu dữ liệu mà không bị may rủi do một lần chia Train/Validation ngẫu nhiên. *(Nếu dữ liệu mất cân bằng nhãn, dùng **Stratified k-Fold** để giữ nguyên tỷ lệ % các nhãn ở mọi Fold).*\n\n```mermaid\nflowchart TD\n    subgraph CV[\"Minh họa 5-Fold Cross-Validation (Mỗi Fold lần lượt đóng vai trò làm Validation đúng 1 lần)\"]\n        L1[\"Lần lặp 1: [Validation: Fold 1] | [Train: Fold 2 + Fold 3 + Fold 4 + Fold 5] -\u003e Điểm E1\"]\n        L2[\"Lần lặp 2: [Validation: Fold 2] | [Train: Fold 1 + Fold 3 + Fold 4 + Fold 5] -\u003e Điểm E2\"]\n        L3[\"Lần lặp 3: [Validation: Fold 3] | [Train: Fold 1 + Fold 2 + Fold 4 + Fold 5] -\u003e Điểm E3\"]\n        L4[\"Lần lặp 4: [Validation: Fold 4] | [Train: Fold 1 + Fold 2 + Fold 3 + Fold 5] -\u003e Điểm E4\"]\n        L5[\"Lần lặp 5: [Validation: Fold 5] | [Train: Fold 1 + Fold 2 + Fold 3 + Fold 4] -\u003e Điểm E5\"]\n        Avg[\"👉 Kết quả đánh giá cuối cùng = Trung bình cộng (E1 + E2 + E3 + E4 + E5) / 5 (± Độ lệch chuẩn)\"]\n        \n        L1 --\u003e L2 --\u003e L3 --\u003e L4 --\u003e L5 --\u003e Avg\n    end\n```\n\n### 5.2. Kiểm thử trên môi trường Production: A/B Testing, Canary Rollout \u0026 Shadow Deployment\n1. **A/B Testing:**\n   * Giải quyết bài toán đánh đổi **Explore (Khám phá mô hình mới)** vs. **Exploit (Khai thác mô hình cũ an toàn)**: Chia ngẫu nhiên lưu lượng người dùng thật (ví dụ 50% vào **Model A - Control** và 50% vào **Model B - Treatment**) chạy song song trong cùng điều kiện thời gian thực để đo lường chỉ số kinh doanh (Tỷ lệ nhấp chuột CTR, tỷ lệ mua hàng, điểm hài lòng Thumbs-up/Thumbs-down) có ý nghĩa thống kê ($p\\text{-value} \u003c 0.05$).\n2. **Canary Deployment (Triển khai Chim hoàng yến):**\n   * Ban đầu chỉ điều hướng một lượng cực nhỏ người dùng thật (ví dụ **1% – 5% traffic**) sang mô hình mới để theo dõi lỗi hệ thống, độ trễ và phản hồi; nếu ổn định mới tăng dần lên 25% $\\to$ 50% $\\to$ 100%.\n3. **Shadow Deployment (Triển khai Bóng râm / Dark Launch):**\n   * Mọi request của người dùng vẫn do mô hình cũ trả lời, nhưng hệ thống âm thầm nhân bản (mirror) request đó gửi song song cho mô hình mới chạy ngầm để ghi log so sánh kết quả mà **không gây bất kỳ rủi ro nào cho người dùng cuối**.\n\n---\n\n## 6. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 5:**\n\u003e 1. **Bẫy ghép cặp Metric Ngôn ngữ:**\n\u003e    * Dịch thuật (Machine Translation) $\\leftrightarrow$ **BLEU** (Precision-oriented).\n\u003e    * Tóm tắt (Text Summarization) $\\leftrightarrow$ **ROUGE** (Recall-oriented).\n\u003e    * Tìm kiếm vector / RAG (Semantic Search) $\\leftrightarrow$ **Cosine Similarity**.\n\u003e 2. **Bẫy Imbalanced Data (Dữ liệu mất cân bằng):** Khi tập dữ liệu có 98% nhãn A và chỉ 2% nhãn B, độ đo **Accuracy** trở nên vô nghĩa. Phải chọn **F1-Score** (hoặc **Precision / Recall / ROC-AUC**).\n\u003e 3. **Bẫy Precision vs. Recall:**\n\u003e    * Không được phép bỏ sót ca bệnh hiểm nghèo / giao dịch gian lận (sợ **False Negative**) $\\to$ Ưu tiên **Recall**.\n\u003e    * Không được phép bắt nhầm email thường thành Spam / khóa nhầm tài khoản khách VIP (sợ **False Positive**) $\\to$ Ưu tiên **Precision**.\n\u003e 4. **Bẫy SLM vs. LLM:** Chạy trên thiết bị biên (Edge/Mobile/IoT), yêu cầu độ trễ cực thấp (Low latency), thông lượng cao cho một tác vụ chuyên biệt $\\to$ Chọn **SLM (Small Language Model)**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Một ngân hàng huấn luyện mô hình phát hiện rửa tiền trên tập dữ liệu gồm 99.9% giao dịch hợp pháp và 0.1% giao dịch rửa tiền. Mô hình đạt Accuracy 99.9% nhưng không bắt được bất kỳ giao dịch rửa tiền nào trên thực tế. Độ đo nào nên được sử dụng thay cho Accuracy để đánh giá đúng hiệu quả của mô hình này?\n   * *Đáp án:* **Recall** (để đo tỷ lệ bắt trúng các giao dịch rửa tiền thực tế) kết hợp với **F1-Score** (trung bình điều hòa cân bằng giữa Precision và Recall trên tập dữ liệu mất cân bằng).\n2. **Câu 2:** Một kỹ sư AI đang xây dựng hệ thống tự động tóm tắt các biên bản cuộc họp dài 10 trang thành 5 gạch đầu dòng ngắn gọn. Độ đo (Metric) nào phù hợp nhất để đánh giá xem bản tóm tắt có giữ lại đầy đủ các ý chính của cuộc họp hay không?\n   * *Đáp án:* **ROUGE (Recall-Oriented Understudy for Gisting Evaluation)**.\n3. **Câu 3:** Một hãng sản xuất ô tô muốn tích hợp mô hình ngôn ngữ vào chip xử lý trên xe hơi để nhận diện giọng nói điều khiển điều hòa và bản đồ ngay cả khi xe đi vào vùng mất sóng Internet, với yêu cầu phản hồi dưới 50 mili-giây. Họ nên lựa chọn **SLM** hay **LLM**?\n   * *Đáp án:* **SLM (Small Language Model)** vì có kích thước nhỏ gọn, chạy trực tiếp được trên phần cứng biên (Edge hardware) không cần kết nối Cloud và đảm bảo độ trễ cực thấp (Low latency).\n4. **Câu 4:** Khi đọc hồ sơ của một mô hình mã nguồn mở trên Hugging Face hoặc NVIDIA NGC để kiểm tra xem mô hình đó có cho phép sử dụng cho mục đích thương mại hay không, được huấn luyện trên dữ liệu gì và có những rủi ro thiên vị nào đã biết, kỹ sư cần tra cứu tài liệu nào?\n   * *Đáp án:* **Model Card**.\n5. **Câu 5:** Một công ty y tế chỉ thu thập được một tập dữ liệu nhỏ gồm 1.000 bệnh án đã gắn nhãn. Để đánh giá độ chính xác của mô hình phân loại một cách tin cậy nhất mà không lãng phí dữ liệu cho một tập Validation cố định, kỹ thuật kiểm thử nào nên được áp dụng?\n   * *Đáp án:* **k-Fold Cross-Validation** (hoặc *Stratified k-Fold Cross-Validation*).\n6. **Câu 6:** Trong hệ thống lọc email rác (Spam Filter), người dùng phàn nàn rằng nhiều email công việc quan trọng của đối tác bị hệ thống tự động ném vào thư mục Spam (tức lỗi **False Positive** cao). Kỹ sư cần điều chỉnh ngưỡng phân loại của mô hình để tối ưu hóa chỉ số nào?\n   * *Đáp án:* Tối ưu hóa **Precision (Độ chuẩn xác)** — nhằm giảm thiểu tối đa số lượng False Positives ($FP$).\n"},{"id":"mod06","file":"Module_06_Model_Customization.md","badge":"MODULE 06","shortTitle":"Model Customization (Prompt/RAG/PEFT)","domain":"Software Dev \u0026 Exp","weight":"SW / Exp","icon":"🛠️","content":"# Module 6: Model Customization (Phương pháp Tùy biến Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 6 (Trọng tâm thực tiễn doanh nghiệp - Chiếm tỷ trọng lớn!):**\n\u003e Hiểu rõ **3 lý do doanh nghiệp bắt buộc phải tùy biến Foundation Model**; thuộc lòng thứ tự **4 cấp độ tùy biến tăng dần về chi phí và độ phức tạp** (`Prompt Engineering` $\\to$ `RAG` $\\to$ `Transfer Learning / Fine-Tuning` $\\to$ `Training from Scratch`) cùng **Ma trận Quyết định chọn giải pháp**; phân biệt các kỹ thuật **Prompting (Zero-shot, One-shot, Few-shot, CoT, Self-Consistency, ReAct, System Prompt)**; nắm chắc luồng hoạt động chuyên sâu của **RAG (Chunking + Overlap, Bi-Encoder Embedding, Vector DB HNSW/IVF, Hybrid Search BM25 + Vector, Cross-Encoder Reranking)**; hiểu sâu cơ chế toán học của **PEFT (LoRA, QLoRA, Adapter, Prompt/Prefix Tuning)**, hiện tượng **Catastrophic Forgetting**, và **Knowledge Distillation (Teacher-Student \u0026 Synthetic Data)**.\n\n---\n\n## 1. Tại sao doanh nghiệp bắt buộc phải tùy biến mô hình?\n\nCác mô hình nền tảng (Foundation Models như GPT-4 hay LLaMA-3 gốc) chỉ sở hữu kiến thức đại chúng trên Internet cho đến thời điểm cắt dữ liệu (**Knowledge Cutoff**). Doanh nghiệp bắt buộc phải tùy biến (Customize) mô hình vì **3 lý do sống còn**:\n1. **Thích ứng với ngôn ngữ và thuật ngữ chuyên ngành (Domain-specific Jargon \u0026 Vocabulary):** Ví dụ trong Y khoa (tên biệt dược, mã bệnh ICD-10, bệnh án lâm sàng), Luật pháp, Viễn thông hay Tài chính ngân hàng.\n2. **Nâng cao hiệu năng cho tác vụ và định dạng đặc thù (Task-specific Performance \u0026 Formatting):** Đảm bảo mô hình trả về đúng cấu trúc JSON Schema nghiêm ngặt của hệ thống, sinh câu truy vấn SQL chính xác theo schema cơ sở dữ liệu công ty, hoặc tuân thủ đúng văn phong chăm sóc khách hàng của thương hiệu.\n3. **Cải thiện mức độ nhận thức ngữ cảnh nội bộ \u0026 Dữ liệu thời gian thực (Internal Context \u0026 Fresh Data Awareness):** Tích hợp các chính sách nhân sự, bảng giá tồn kho thay đổi từng phút, tài liệu bảo hành sản phẩm mới ra mắt, hoặc tài liệu mật nội bộ mà mô hình công khai chưa từng được học.\n\n---\n\n## 2. Bốn Cấp độ Tùy biến Mô hình (Spectrum of Model Customization) \u0026 Ma trận Quyết định\n\nTrong kỳ thi NCA-GENL, bạn cần nhớ nguyên tắc vàng của kiến trúc sư AI: **Luôn ưu tiên đi từ giải pháp đơn giản, nhanh và rẻ tiền nhất (bên trái) sang giải pháp phức tạp, đắt đỏ nhất (bên phải)!**\n\n```mermaid\nflowchart LR\n    L1[\"Cấp độ 1:\u003cbr/\u003ePROMPT ENGINEERING\u003cbr/\u003e💰 Chi phí: Rất thấp (~0$)\u003cbr/\u003e⏱️ Thời gian: Vài phút/giờ\u003cbr/\u003e🔧 Thay đổi Weights: KHÔNG\u003cbr/\u003e🎯 Tối ưu câu lệnh đầu vào\"]\n    \n    L2[\"Cấp độ 2:\u003cbr/\u003eRAG (Retrieval-Augmented)\u003cbr/\u003e💰 Chi phí: Trung bình thấp\u003cbr/\u003e⏱️ Thời gian: Vài ngày\u003cbr/\u003e🔧 Thay đổi Weights: KHÔNG\u003cbr/\u003e🎯 Kết nối dữ liệu nội bộ động\"]\n    \n    L3[\"Cấp độ 3:\u003cbr/\u003eTRANSFER LEARNING / FINE-TUNING\u003cbr/\u003e💰 Chi phí: Cao\u003cbr/\u003e⏱️ Thời gian: Vài ngày - tuần\u003cbr/\u003e🔧 Thay đổi Weights: CÓ\u003cbr/\u003e🎯 Học văn phong, kỹ năng \u0026 định dạng\"]\n    \n    L4[\"Cấp độ 4:\u003cbr/\u003eTRAINING FROM SCRATCH\u003cbr/\u003e💰 Chi phí: Cực kỳ đắt đỏ (Triệu $)\u003cbr/\u003e⏱️ Thời gian: Hàng tháng trời\u003cbr/\u003e🔧 Thay đổi Weights: Huấn luyện mới 100%\u003cbr/\u003e🎯 Ngôn ngữ/Miền dữ liệu mới hoàn toàn\"]\n\n    L1 ==\u003e|\"Tăng dần Chi phí GPU, Thời gian, Lượng dữ liệu \u0026 Độ phức tạp\"| L2 ==\u003e L3 ==\u003e L4\n```\n\n### Bảng Ma trận Quyết định: Khi nào dùng Prompting vs. RAG vs. Fine-Tuning? (CỰC KỲ QUAN TRỌNG!)\nĐề thi rất hay đưa ra một kịch bản doanh nghiệp và hỏi bạn nên chọn phương pháp nào. Hãy đối chiếu bảng sau:\n\n| Tiêu chí so sánh | 1. Prompt Engineering | 2. RAG (Retrieval-Augmented Generation) | 3. Fine-Tuning (PEFT / LoRA / SFT) | 4. Training from Scratch |\n| :--- | :--- | :--- | :--- | :--- |\n| **Có cập nhật Trọng số (Weights) của LLM không?** | **KHÔNG** | **KHÔNG** | **CÓ** (Cập nhật Adapter LoRA hoặc toàn bộ Weights) | **CÓ** (Khởi tạo và học mới 100% từ con số 0) |\n| **Giải quyết bài toán gì tốt nhất?** | Định hướng nhanh hành vi, định dạng đầu ra hoặc suy luận logic ngay trong cửa sổ ngữ cảnh. | Bổ sung **tri thức sự kiện mới (External Facts), dữ liệu nội bộ thay đổi liên tục**, giảm ảo giác và cần **trích dẫn nguồn (Citations)**. | Dạy mô hình **hành vi mới, văn phong/giọng điệu đặc thù, cấu trúc đầu ra phức tạp cố định**, hoặc ngôn ngữ chuyên ngành sâu. | Xây dựng mô hình nền tảng cho một ngôn ngữ hoàn toàn mới hoặc dữ liệu khoa học đặc biệt (DNA/Protein/Khí hậu) chưa có Base Model. |\n| **Tần suất dữ liệu thay đổi** | Tức thì theo từng câu lệnh. | **Thay đổi liên tục theo từng giây/phút** (chỉ cần cập nhật Vector DB, không cần train lại model!). | Dữ liệu tĩnh, ít thay đổi (mỗi lần muốn nạp quy luật mới phải chạy lại job Fine-tune). | Dữ liệu nền tảng tĩnh (cố định tại thời điểm Knowledge Cutoff). |\n| **Nguy cơ Ảo giác (Hallucination)** | Trung bình – Cao nếu hỏi kiến thức ngoài luồng. | **Thấp nhất** (vì câu trả lời bị neo chặt vào đoạn văn bản truy xuất được). | Trung bình (Fine-tuning dạy *cách trả lời* tốt hơn là dạy *nhớ chính xác sự kiện mới*). | Phụ thuộc chất lượng dữ liệu gốc. |\n| **Dữ liệu cần thiết** | 0 đến vài ví dụ mẫu (Few-shot). | Kho tài liệu thô (PDF, Wiki, Word, SQL) không cần gắn nhãn. | Hàng nghìn đến hàng trăm nghìn cặp `(Instruction, Ideal Response)` đã gắn nhãn sạch. | Hàng nghìn tỷ (Trillions) tokens dữ liệu thô + Cụm hàng nghìn GPU. |\n\n\u003e [!TIP]\n\u003e **Góc nhìn Thực chiến:** Trong các hệ thống AI doanh nghiệp hiện đại, **RAG và Fine-Tuning KHÔNG loại trừ nhau mà thường được KẾT HỢP (RAG + Fine-Tuning)**! Ví dụ: Dùng **LoRA Fine-Tuning** để dạy mô hình hiểu thuật ngữ y khoa và xuất báo cáo chuẩn bệnh viện, đồng thời kết nối **RAG** để tra cứu hồ sơ bệnh án mới nhất của từng bệnh nhân theo thời gian thực.\n\n---\n\n## 3. Cấp độ 1: Prompt Engineering (Kỹ nghệ Câu lệnh)\n\n* **Bản chất:** Là phương pháp thiết kế, cấu trúc và tối ưu hóa câu lệnh đầu vào (Input Prompt) bằng ngôn ngữ tự nhiên để dẫn dắt LLM sinh ra kết quả mong muốn thông qua cơ chế **In-Context Learning (Học trong ngữ cảnh)** mà **hoàn toàn KHÔNG làm thay đổi bất kỳ trọng số (weights) nào của mô hình**.\n\n### 3.1. Bảng phân biệt 7 kỹ thuật Prompting cốt lõi (Rất hay hỏi trong đề thi):\n| Kỹ thuật Prompting | Định nghĩa \u0026 Cách nhận diện | Ví dụ minh họa thực tế | Khi nào nên dùng? |\n| :--- | :--- | :--- | :--- |\n| **1. Zero-shot Prompting** | Đặt câu hỏi hoặc giao nhiệm vụ **trực tiếp mà không kèm theo bất kỳ ví dụ mẫu nào**. | *\"Phân loại cảm xúc câu sau thành Tích cực hoặc Tiêu cực: \u0027Bộ phim này hay ngoài mong đợi.\u0027 $\\to$ Đáp án:\"* | Các tác vụ phổ thông, đơn giản mà LLM đã hiểu rõ bản chất từ lúc Pre-train/SFT. |\n| **2. One-shot Prompting** | Cung cấp **đúng 1 ví dụ mẫu hoàn chỉnh (1 cặp Input-Output)** trước khi đưa ra câu hỏi chính. | *\"Ví dụ: \u0027Giao hàng chậm\u0027 -\u003e Tiêu cực. Hãy phân loại: \u0027Đóng gói rất kỹ\u0027 -\u003e ?\"* | Khi muốn mô hình bắt chước chính xác một định dạng đầu ra đơn giản mà không tốn nhiều token. |\n| **3. Few-shot Prompting** | Cung cấp từ **2 đến $N$ ví dụ mẫu đa dạng** ngay trong prompt để dạy mô hình quy luật ánh xạ tại chỗ (**In-context learning**). | Đưa 3–5 ví dụ chuyển đổi câu nói tự nhiên thành mã JSON chuẩn của công ty trước khi yêu cầu xử lý câu mới. | Khi tác vụ có định dạng đặc thù hoặc cần phân biệt các trường hợp biên phức tạp mà chưa muốn fine-tune. |\n| **4. Chain-of-Thought (CoT)** | Yêu cầu mô hình **trình bày rõ từng bước lập luận trung gian** trước khi chốt đáp án cuối cùng (*\"Let\u0027s think step by step\"*). | *\"Lan có 5 quả táo, mua thêm 2 túi mỗi túi 3 quả... Hãy suy nghĩ từng bước một trước khi đưa ra kết quả.\"* | Cực kỳ hiệu quả cho bài toán **Toán học, Logic, Lập trình và Suy luận đa bước** (kết hợpได้ với cả Zero-shot CoT và Few-shot CoT). |\n| **5. Self-Consistency** | Mở rộng của CoT: Cho mô hình sinh ra **nhiều luồng suy luận CoT độc lập khác nhau** (với Temperature \u003e 0), sau đó lấy **biểu quyết đa số (Majority Vote)** cho đáp án cuối cùng. | Sinh 5 cách giải cho cùng 1 bài toán phức tạp; nếu 4/5 cách đều ra đáp số `42`, chọn `42`. | Khi bài toán suy luận cực khó, một luồng CoT đơn lẻ vẫn có nguy cơ tính nhầm ở bước giữa. |\n| **6. ReAct (Reason + Act)** | Mô hình lặp đi lặp lại chu trình: **Suy nghĩ (`Thought`) $\\to$ Gọi công cụ bên ngoài (`Action`: Search API, SQL, Calculator) $\\to$ Quan sát kết quả (`Observation`)** cho đến khi giải xong bài toán. | *\"Thought: Cần tìm giá cổ phiếu NVDA hôm nay -\u003e Action: gọi YahooFinance API -\u003e Observation: \\$140 -\u003e Answer...\"* | Nền tảng cốt lõi để xây dựng **AI Agents \u0026 Tool Calling / Function Calling**. |\n| **7. System Prompt (Role / Persona)** | Câu lệnh nền định nghĩa **vai trò (Persona), quy tắc ứng xử, giới hạn bảo mật và định dạng đầu ra** của toàn bộ cuộc hội thoại. | *\"Bạn là trợ lý tài chính của ngân hàng X. Chỉ trả lời bằng tiếng Việt lịch sự về lãi suất, từ chối mọi câu hỏi chính trị...\"* | Định hình hành vi tổng thể của ứng dụng; có **độ ưu tiên cao hơn User Prompt** để giữ nhất quán và chống bẻ khóa. |\n\n---\n\n## 4. Cấp độ 2: Retrieval-Augmented Generation (RAG - Sinh văn bản Tăng cường Truy xuất)\n\n* **Bản chất của RAG:** Giống như cho sinh viên đi thi dưới hình thức **\"Thi mở sách (Open-Book Exam)\"**. Thay vì bắt mô hình học thuộc lòng mọi tài liệu nội bộ vào trọng số (Parametric Memory), hệ thống sẽ **tự động tra cứu đúng đoạn tài liệu liên quan nhất từ kho lưu trữ ngoài (Non-parametric Memory / Vector Database) rồi đính kèm trực tiếp vào Prompt** để LLM đọc và tổng hợp câu trả lời!\n\n### 4.1. Sơ đồ Kiến trúc \u0026 Quy trình 2 Pha của Hệ thống RAG Doanh nghiệp (Chuẩn NVIDIA NeMo Retriever)\n\n```mermaid\nflowchart TD\n    subgraph Offline[\"PHA 1: OFFLINE DATA INGESTION \u0026 INDEXING (Chuẩn bị \u0026 Lập chỉ mục tri thức)\"]\n        direction LR\n        Docs[\"Tài liệu Doanh nghiệp\u003cbr/\u003e(PDF, Word, Wiki, HTML, SQL)\"] --\u003e|1. Parsing \u0026 Cleaning| Clean[\"Văn bản \u0026 Bảng biểu\u003cbr/\u003eđã làm sạch\"]\n        Clean --\u003e|\"2. Chunking\u003cbr/\u003e(Cắt đoạn + Chunk Overlap)\"| Chunks[\"Các đoạn văn nhỏ\u003cbr/\u003e(Semantic Chunks)\"]\n        Chunks --\u003e|\"3. Embedding Model\u003cbr/\u003e(Bi-Encoder: NeMo Retriever)\"| Vecs[\"Dense Vectors\u003cbr/\u003e(VD: 1024 chiều)\"]\n        Vecs --\u003e|\"4. Indexing (HNSW / IVF)\"| VDB[(\"Vector Database\u003cbr/\u003e(Milvus / cuVS, FAISS, Pinecone)\")]\n    end\n\n    subgraph Online[\"PHA 2: ONLINE RETRIEVAL, RERANKING \u0026 GENERATION (Khi User đặt câu hỏi)\"]\n        direction LR\n        User[\"Câu hỏi của User\u003cbr/\u003e(User Query)\"] --\u003e|\"1. Nhúng bằng CÙNG\u003cbr/\u003eEmbedding Model\"| QVec[\"Query Vector\"]\n        QVec \u003c--\u003e|\"2a. Hybrid Search (Vector Cosine + BM25)\u003cbr/\u003eLấy nhanh Top-25 Chunks ứng viên\"| VDB\n        VDB --\u003e|\"2b. Reranker (Cross-Encoder)\u003cbr/\u003eChấm điểm ngữ cảnh sâu chọn Top-3 chuẩn nhất\"| Aug[\"3. Prompt Augmentation\u003cbr/\u003eGộp: System Prompt + Top-3 Chunks + User Query\"]\n        Aug --\u003e|\"4. Generation\"| LLM[\"Mô hình LLM\u003cbr/\u003e(Temperature thấp ~ 0.1)\"]\n        LLM --\u003e Ans[\"Câu trả lời chính xác\u003cbr/\u003e+ Trích dẫn nguồn (Citations)\"]\n    end\n```\n\n### 4.2. Giải phẫu các thành phần kỹ thuật quan trọng trong RAG (Hay hỏi thi!):\n1. **Chiến lược Chunking \u0026 Chunk Overlap (Cắt nhỏ tài liệu):**\n   * *Tại sao bắt buộc phải Chunking?*\n     1. Tránh vượt quá giới hạn **Cửa sổ ngữ cảnh (Context Window)** và tránh hiện tượng **\"Lost in the Middle\"** (LLM thường nhớ rất tốt phần đầu và phần cuối prompt nhưng hay quên thông tin nằm chìm nghỉm ở giữa một văn bản quá dài).\n     2. Tăng **độ chính xác của Vector Embedding (Retrieval Precision)**: Nếu nhúng cả cuốn sách 200 trang thành 1 vector duy nhất, ý nghĩa của từng chi tiết sẽ bị trung bình hóa và pha loãng hoàn toàn; cắt thành từng đoạn nhỏ `256 - 512 tokens` giúp vector đại diện sắc nét cho đúng 1 ý cụ thể.\n     3. Giảm độ trễ (**TTFT**) và tiết kiệm chi phí token mỗi lần gọi LLM.\n   * *Tại sao phải có **Chunk Overlap** (Gối đầu khoảng 10–20%, ví dụ chunk 500 tokens gối đầu 50 tokens)?* Để **bảo toàn ngữ cảnh liên tục tại vị trí vết cắt**, tránh việc một câu văn quan trọng bị cắt đôi nằm nửa ở cuối Chunk 1, nửa ở đầu Chunk 2 làm mất hoàn toàn ý nghĩa!\n2. **Cơ sở dữ liệu Vector (Vector Databases) \u0026 Thuật toán tìm kiếm ANN:**\n   * Lưu trữ hàng triệu/tỷ vector nhúng cùng với dữ liệu gốc và **Metadata** (tên file, số trang, ngày tạo, quyền truy cập phòng ban RBAC).\n   * Thay vì quét cạn từng vector một (Brute-force Flat Search rất chậm), các Vector DB (như **Milvus được tăng tốc bằng NVIDIA cuVS/RAFT, FAISS, Pinecone, Weaviate, Qdrant**) sử dụng các thuật toán **ANN (Approximate Nearest Neighbors)** như **HNSW (Hierarchical Navigable Small World - đồ thị phân tầng)** hoặc **IVF (Inverted File Index - phân cụm tâm)** để tìm ra Top-K vector gần nhất theo **Cosine Similarity** chỉ trong vài mili-giây!\n3. **Hybrid Search (Tìm kiếm Lai) \u0026 Reranking (Sắp xếp lại bằng Cross-Encoder):**\n   * **Hybrid Search = Dense Retrieval (Vector Embedding hiểu ngữ nghĩa) + Sparse Retrieval (BM25 / TF-IDF khớp chính xác mã sản phẩm, số hiệu hợp đồng, tên riêng)**: Kết hợp thế mạnh của cả hai để không bỏ sót tài liệu.\n   * **Bi-Encoder (Embedding Model) vs. Cross-Encoder (Reranker Model):**\n     * *Bước 1 (Bi-Encoder):* Nhúng độc lập câu hỏi và tài liệu để quét cực nhanh qua 10 triệu bản ghi trong Vector DB, lọc ra **Top-25 ứng viên**.\n     * *Bước 2 (Cross-Encoder Reranker - ví dụ trong **NVIDIA NeMo Retriever**):* Đưa đồng thời từng cặp `(Câu hỏi + Chunk ứng viên)` vào mạng Transformer Cross-Encoder để tính Self-Attention chéo giữa mọi từ của câu hỏi và tài liệu, chấm điểm chính xác tuyệt đối rồi lọc lấy **Top-3 đến Top-5 đoạn xuất sắc nhất** đưa vào LLM!\n\n---\n\n## 5. Cấp độ 3: Transfer Learning, Fine-Tuning (LoRA/QLoRA) \u0026 Knowledge Distillation\n\n* **Bản chất của Transfer Learning (Học chuyển giao):** Tái sử dụng một mô hình đã được huấn luyện sẵn trên tập dữ liệu lớn (**Pre-trained Model**) làm điểm xuất phát, sau đó tinh chỉnh tiếp để thích ứng với tác vụ hoặc miền dữ liệu chuyên sâu của doanh nghiệp.\n* **Phép ẩn dụ Lái xe (Driving Analogy):** Một người **đã biết lái xe ô tô con thành thạo** khi chuyển sang **học lái xe tải hạng nặng** sẽ học nhanh hơn gấp 10 lần so với người chưa từng cầm vô lăng bao giờ (vì họ đã nắm sẵn luật giao thông, cách nhìn gương, cảm giác chân ga/phanh)!\n* **Lợi ích cốt lõi:** Tiết kiệm tới **90% thời gian và chi phí tính toán GPU**, cần ít dữ liệu gắn nhãn hơn rất nhiều so với huấn luyện từ đầu (Training from scratch).\n\n```mermaid\nflowchart TD\n    TL[\"Các phương pháp Transfer Learning \u0026 Tối ưu Mô hình\"]\n    \n    subgraph FT[\"1. Fine-Tuning (Tinh chỉnh Trọng số)\"]\n        FullFT[\"Full Fine-Tuning:\u003cbr/\u003eMở khóa \u0026 cập nhật 100% trọng số của mô hình gốc\u003cbr/\u003e(Cực tốn VRAM \u0026 dễ bị Catastrophic Forgetting)\"]\n        PEFT[\"PEFT (LoRA, QLoRA, P-Tuning, Adapters):\u003cbr/\u003eĐÓNG BĂNG (Freeze) 100% trọng số mô hình gốc,\u003cbr/\u003echỉ huấn luyện một lượng cực nhỏ tham số bổ sung (\u003c1%)\u003cbr/\u003e(Tiết kiệm 90-99% VRAM, giữ nguyên tri thức gốc!)\"]\n    end\n\n    subgraph KD[\"2. Knowledge Distillation (Chưng cất Tri thức)\"]\n        Teacher[\"👨‍🏫 Teacher Model (Mô hình Thầy giáo):\u003cbr/\u003eMô hình LLM khổng lồ (VD: 70B / 340B), cực kỳ thông minh nhưng nặng nề\"]\n        Student[\"🧑‍🎓 Student Model (Mô hình Học sinh):\u003cbr/\u003eMô hình SLM nhỏ gọn (VD: 3B / 8B), học bắt chước phân phối xác suất (Soft Labels)\u003cbr/\u003ehoặc học trên dữ liệu tổng hợp từ Thầy\u003cbr/\u003e👉 Nhỏ hơn 10 lần, chạy siêu nhanh trên Edge/Mobile!\"]\n        Teacher ==\u003e|\"Truyền dạy tri thức (Distillation)\"| Student\n    end\n\n    TL --\u003e FT \u0026 KD\n```\n\n### 5.1. Làm rõ chuyên sâu: Full Fine-Tuning vs. Họ các kỹ thuật PEFT (Parameter-Efficient Fine-Tuning)\n1. **Hai rào cản lớn của Full Fine-Tuning:**\n   * **Bùng nổ bộ nhớ VRAM:** Để cập nhật toàn bộ 70 tỷ tham số của LLaMA-3 70B ở chuẩn 16-bit, ngoài `140 GB` lưu trọng số (Weights), GPU còn phải lưu `140 GB` cho đạo hàm (Gradients) và `280–560 GB` cho trạng thái bộ tối ưu hóa (Optimizer States của AdamW) + Activations $\\to$ Đòi hỏi cụm từ **8 đến 16 GPU H100 80GB**!\n   * **Hiện tượng Catastrophic Forgetting (Quên thảm khốc):** Khi ép mô hình ghi đè trực tiếp lên toàn bộ trọng số gốc trên một tập dữ liệu nhỏ/hẹp của công ty, mô hình rất dễ xóa sạch các kiến thức ngôn ngữ, lập luận logic và đa năng mà nó đã vất vả học được ở giai đoạn Pre-training!\n2. **Giải pháp PEFT – Đóng băng mô hình gốc, chỉ huấn luyện $\u003c 1\\%$ tham số:**\n   * **LoRA (Low-Rank Adaptation - Quan trọng số 1 trong đề thi!):**\n     * *Cơ chế toán học:* Thay vì sửa trực tiếp ma trận trọng số gốc $W_0$ (kích thước $d \\times d$, ví dụ $4096 \\times 4096 = 16.77\\text{ triệu}$ tham số), **LoRA đóng băng hoàn toàn $W_0$ (`requires_grad = False`)** và gắn song song hai ma trận phân rã hạng thấp (**Low-rank decomposition matrices**) là $A$ (kích thước $d \\times r$) và $B$ (kích thước $r \\times d$) với bậc hạng $r \\ll d$ (ví dụ $r = 8$ hoặc $16$):\n       $$h = W_0 x + \\Delta W x = W_0 x + \\frac{\\alpha}{r} (B \\cdot A) x$$\n       *(Khi khởi tạo, ma trận $A$ khởi tạo ngẫu nhiên Gaussian còn ma trận $B$ khởi tạo toàn số $0$ để tại bước đầu tiên $\\Delta W = 0$, không làm xáo trộn mô hình gốc).*\n     * *Hiệu quả đáng kinh ngạc:* Với $r = 8$, tổng số tham số cần học của $A$ và $B$ chỉ là $(4096 \\times 8) + (8 \\times 4096) = 65.536$ tham số $\\to$ **Giảm hơn 99.6% số lượng tham số cần huấn luyện**, không cần lưu Optimizer State cho $W_0$, chống *Catastrophic Forgetting* tuyệt vời!\n     * *Zero Inference Latency Overhead (Không tăng độ trễ lúc suy luận):* Sau khi train xong, bạn có thể cộng gộp trực tiếp $W_{\\text{merged}} = W_0 + B \\times A$ thành một ma trận duy nhất (hoặc giữ rời để phục vụ **Multi-LoRA Serving** trên Triton/NIM: 1 Base Model nằm trong VRAM phục vụ hàng chục bộ Adapter LoRA mỏng nhẹ cho hàng chục phòng ban khác nhau!).\n   * **QLoRA (Quantized LoRA):**\n     * Bước tiến đột phá giúp fine-tune LLM trên phần cứng hạn chế: **Nén (Quantize) mô hình gốc đã đóng băng $W_0$ xuống định dạng 4-bit (`NF4` - NormalFloat4)** kết hợp *Double Quantization* (nén cả hằng số lượng tử hóa) và *Paged Optimizers* (tự động mượn tạm System RAM khi VRAM chạm đỉnh), trong khi vẫn gắn và huấn luyện các thanh Adapter LoRA ở độ chính xác `BF16`/`FP16`.\n     * Nhờ QLoRA, một kỹ sư có thể fine-tune mô hình **LLaMA-3 70B chỉ trên 1 chiếc GPU 48GB–80GB duy nhất**!\n   * **Các kỹ thuật PEFT khác trong NVIDIA NeMo Customizer:**\n     * **Prompt Tuning / P-Tuning:** Đóng băng 100% mô hình, chỉ gắn thêm một chuỗi các vector liên tục học được (**Learnable Soft Prompt / Virtual Tokens**) vào phía trước chuỗi đầu vào.\n     * **Prefix Tuning:** Gắn thêm các vector tiền tố học được vào các tầng Key và Value của mọi khối Attention.\n     * **Adapter Tuning:** Chèn thêm các lớp mạng bottleneck nhỏ nối tiếp vào bên trong từng khối Transformer.\n\n```mermaid\nflowchart LR\n    subgraph LoRA_Diagram[\"Cơ chế Toán học của LoRA (Low-Rank Adaptation)\"]\n        direction BT\n        Input_X[\"Đầu vào x\u003cbr/\u003e(d = 4096)\"]\n        \n        Frozen_W[\"❄️ Trọng số gốc W₀ (4096 × 4096)\u003cbr/\u003eĐÓNG BĂNG HOÀN TOÀN (Frozen)\u003cbr/\u003e(Ở QLoRA: Nén W₀ xuống chuẩn 4-bit NF4)\"]\n        \n        Mat_A[\"🔥 Ma trận A (4096 × r)\u003cbr/\u003eGiảm chiều xuống r = 8\"]\n        Mat_B[\"🔥 Ma trận B (r × 4096)\u003cbr/\u003eKhôi phục chiều lên 4096\"]\n        \n        Sum((\"Cộng (+)\u003cbr/\u003eh = W₀x + B·A·x\"))\n        Output_H[\"Đầu ra h\u003cbr/\u003e(d = 4096)\"]\n\n        Input_X --\u003e Frozen_W --\u003e Sum\n        Input_X --\u003e Mat_A --\u003e|\"Nút cổ chai hạng thấp (r = 8)\u003cbr/\u003eChỉ train A và B (\u003c1% params)!\"| Mat_B --\u003e Sum\n        Sum --\u003e Output_H\n    end\n```\n\n### 5.2. Knowledge Distillation (Chưng cất tri thức) \u0026 Đánh giá sau Fine-Tuning\n* **Knowledge Distillation:** Quá trình chuyển giao tri thức từ một mô hình lớn, phức tạp (**Teacher Model**, ví dụ LLaMA-3 70B/405B) sang một mô hình nhỏ gọn hơn nhiều (**Student Model**, ví dụ SLM 3B/8B).\n  * Thay vì chỉ học trên nhãn cứng (Hard labels 0 hoặc 1), Student Model học cách bắt chước toàn bộ **phân phối xác suất đầu ra (Soft Labels / Logits)** hoặc học trên tập dữ liệu tổng hợp (**Synthetic Data**) có kèm lập luận do Teacher Model sinh ra $\\to$ Giúp thu được mô hình nhỏ hơn 10 lần, giảm chi phí và chạy siêu tốc trên thiết bị biên (Edge/Mobile).\n* **Độ đo quan trọng nhất khi đánh giá mô hình Fine-Tuned:** Chính là **Validation Set Accuracy / Loss (Độ chính xác và hàm mất mát trên tập kiểm định chưa từng thấy trong lúc train)** để kiểm tra khả năng tổng quát hóa và phát hiện sớm hiện tượng **Overfitting**.\n\n---\n\n## 6. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 6:**\n\u003e 1. **Bẫy RAG vs. Fine-Tuning:**\n\u003e    * Bài toán yêu cầu *\"kết nối kho tài liệu nội bộ thay đổi thường xuyên theo thời gian thực, giảm ảo giác (hallucination), kèm trích dẫn nguồn (citations) mà không cập nhật trọng số mô hình\"* $\\to$ Chọn **RAG**!\n\u003e    * Bài toán yêu cầu *\"dạy mô hình phong cách ngôn ngữ chuyên ngành sâu, thay đổi giọng văn hoặc tuân thủ định dạng đầu ra phức tạp cố định trên tập dữ liệu gán nhãn\"* $\\to$ Chọn **Fine-Tuning (LoRA/PEFT)**.\n\u003e 2. **Bẫy LoRA vs. QLoRA:**\n\u003e    * Đóng băng trọng số gốc và chèn các ma trận phân rã hạng thấp (Low-rank decomposition matrices) để giảm số lượng tham số huấn luyện $\\to$ **LoRA**.\n\u003e    * Kết hợp LoRA với việc lượng tử hóa mô hình nền đã đóng băng xuống **4-bit (`NF4`)** để fine-tune trên phần cứng rất hạn chế VRAM $\\to$ **QLoRA**.\n\u003e 3. **Bẫy Teacher-Student:** Dùng mô hình lớn truyền tri thức cho mô hình nhỏ gọn hơn để triển khai tiết kiệm tài nguyên $\\to$ **Knowledge Distillation**.\n\u003e 4. **Bẫy Catastrophic Forgetting:** Khi Full Fine-Tuning làm mô hình quên mất các kỹ năng ngôn ngữ tổng quát ban đầu $\\to$ Khắc phục bằng cách dùng **PEFT (LoRA)** hoặc trộn thêm dữ liệu tổng quát vào tập fine-tune.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Một kỹ sư muốn tinh chỉnh (fine-tune) một mô hình LLaMA-3 70B cho tác vụ y khoa nhưng chỉ có 1 máy trạm GPU với dung lượng VRAM hạn chế. Kỹ thuật nào cho phép nén mô hình gốc xuống 4-bit và chỉ huấn luyện các ma trận hạng thấp gắn kèm để tiết kiệm tối đa bộ nhớ?\n   * *Đáp án:* **QLoRA (Quantized Low-Rank Adaptation)**.\n2. **Câu 2:** Tại sao khi thực hiện Chunking tài liệu trong hệ thống RAG, các kỹ sư thường thiết lập một khoảng chồng lấn nhỏ (**Chunk Overlap**, ví dụ 10–15% số token) giữa hai đoạn văn liên tiếp?\n   * *Đáp án:* Để **bảo toàn ngữ cảnh liên tục tại vị trí ranh giới cắt**, tránh làm đứt gãy ý nghĩa của những câu văn hoặc ý tưởng nằm vắt ngang giữa hai chunk.\n3. **Câu 3:** Một tập đoàn luật muốn xây dựng chatbot tra cứu hàng chục nghìn văn bản quy phạm pháp luật mới ban hành hàng tuần. Yêu cầu bắt buộc là mọi câu trả lời của AI phải trích dẫn chính xác số hiệu điều khoản luật và tuyệt đối không được tự suy diễn sai lệch. Phương pháp tùy biến nào phù hợp nhất?\n   * *Đáp án:* **RAG (Retrieval-Augmented Generation)** kết hợp cơ sở dữ liệu Vector và bộ Reranker (vì dữ liệu cập nhật hàng tuần và đòi hỏi trích dẫn nguồn chính xác, chống ảo giác).\n4. **Câu 4:** Khi giải các bài toán đố toán học phức tạp hoặc lập luận logic nhiều bước mà không được phép fine-tune mô hình, kỹ thuật Prompt Engineering nào yêu cầu mô hình viết ra từng bước suy luận trung gian trước khi đưa ra câu trả lời cuối cùng?\n   * *Đáp án:* **Chain-of-Thought (CoT) Prompting**.\n5. **Câu 5:** Hiện tượng một mô hình ngôn ngữ lớn sau khi được Full Fine-Tuning trên tập dữ liệu câu lệnh SQL lại mất đi khả năng làm thơ và trò chuyện tự nhiên vốn có của Base Model được gọi là gì?\n   * *Đáp án:* **Catastrophic Forgetting (Quên thảm khốc)**.\n6. **Câu 6:** Trong kiến trúc RAG nâng cao (như NVIDIA NeMo Retriever), tại sao người ta thường đặt thêm một mô hình **Reranker (Cross-Encoder)** ngay sau bước tìm kiếm Vector (Bi-Encoder)?\n   * *Đáp án:* Vì Vector Search (Bi-Encoder) tối ưu cho tốc độ quét nhanh qua hàng triệu bản ghi để lấy Top-25 ứng viên nhưng nén riêng rẽ câu hỏi và tài liệu; trong khi **Reranker (Cross-Encoder)** chấm điểm tương tác ngữ cảnh sâu trực tiếp giữa câu hỏi và từng đoạn văn ứng viên để lọc ra Top-3 đoạn chính xác nhất đưa vào LLM.\n"},{"id":"mod07","file":"Module_07_Model_Training_and_Lifecycle.md","badge":"MODULE 07","shortTitle":"Training \u0026 Deployment Lifecycle","domain":"SW Dev / Exp / Data","weight":"Lifecycle","icon":"🔄","content":"# Module 7: Model Training \u0026 Deployment Lifecycle (Vòng đời Huấn luyện \u0026 Triển khai Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 7 (Thuộc Domain \"Software Development - 24%\", \"Experimentation - 22%\" \u0026 \"Data Analysis - 14%\"):**\n\u003e Thuộc lòng **5 giai đoạn trong vòng đời dự án ML/GenAI**; phân biệt **3 nguồn dữ liệu**; hiểu vai trò sống còn của **EDA (Exploratory Data Analysis)**, xử lý dữ liệu khuyết/ngoại lai/mất cân bằng (**SMOTE, Normalization vs. Standardization**), và các công cụ tiền xử lý văn bản (**Regex, N-grams, TF-IDF, Stemming vs. Lemmatization, Deduplication**); nắm rõ các **Hyperparameters (Learning Rate + Warmup/Decay, Batch Size + Gradient Accumulation, Epochs, Early Stopping)**; phân biệt đánh giá **Định lượng (Quantitative - bao gồm Perplexity) vs. Định tính (Qualitative)**; nắm chắc bộ 3 kỹ thuật nén \u0026 tối ưu triển khai: **ONNX**, **Quantization (`FP32` $\\to$ `FP16` $\\to$ `INT8`/`INT4`, PTQ vs. QAT)**, **Pruning (Structured 2:4 Sparsity vs. Unstructured)**, **Batch vs. Real-time Deployment**, **Docker \u0026 Kubernetes**, và giám sát **Data Drift vs. Concept Drift** sau triển khai.\n\n---\n\n## 1. Năm giai đoạn trong Vòng đời Dự án ML / GenAI (End-to-End Lifecycle)\n\nMọi dự án AI chuẩn công nghiệp (MLOps / LLMOps) đều đi qua đường ống (Pipeline) 5 giai đoạn tuần tự và lặp lại liên tục:\n\n```mermaid\nflowchart LR\n    P1[\"1. Data Collection\u003cbr/\u003e(Thu thập Dữ liệu)\u003cbr/\u003ePublic, Enterprise, API\"]\n    P2[\"2. Data Processing\u003cbr/\u003e(Khám phá \u0026 Làm sạch)\u003cbr/\u003eEDA, Regex, N-grams, Dedupe\"]\n    P3[\"3. Model Training\u003cbr/\u003e(Huấn luyện Mô hình)\u003cbr/\u003eHyperparams, BF16, Checkpoints\"]\n    P4[\"4. Model Evaluation\u003cbr/\u003e(Đánh giá Mô hình)\u003cbr/\u003eQuantitative (PPL) \u0026 Qualitative\"]\n    P5[\"5. Model Deployment\u003cbr/\u003e(Triển khai, Tối ưu \u0026 Giám sát)\u003cbr/\u003eONNX, Quantization, K8s, Drift\"]\n\n    P1 ==\u003e P2 ==\u003e P3 ==\u003e P4 ==\u003e P5\n    P4 -.-\u003e|\"Chưa đạt KPI -\u003e Quay lại làm giàu dữ liệu \u0026 tinh chỉnh\"| P2\n    P5 -.-\u003e|\"Phát hiện Data Drift / Concept Drift -\u003e Continuous Retraining\"| P1\n```\n\n---\n\n## 2. Giai đoạn 1: Data Collection (Thu thập Dữ liệu)\n\nChất lượng của mô hình phụ thuộc trực tiếp vào nguyên lý bất di bất dịch: **\"Garbage In, Garbage Out\"** (Dữ liệu rác đầu vào $\\to$ Mô hình rác đầu ra). Có **3 nguồn dữ liệu chính**:\n\n| Nguồn dữ liệu | Ví dụ điển hình | Đặc điểm \u0026 Lưu ý cho kỳ thi |\n| :--- | :--- | :--- |\n| **1. Public Datasets (Dữ liệu công khai)** | Hugging Face Datasets, Kaggle, **NVIDIA NGC Catalog**, Common Crawl, The Pile, Wikipedia, ImageNet, COCO. | Miễn phí, đa dạng, sẵn có; rất tốt để học tập, pre-train nền tảng, nghiên cứu ban đầu và chấm điểm chuẩn (**Benchmarking**). Cần kiểm tra kỹ bản quyền (License) và lọc nội dung độc hại. |\n| **2. Enterprise / Proprietary Data (Dữ liệu nội bộ doanh nghiệp)** | Hồ sơ khách hàng CRM, lịch sử giao dịch ngân hàng, biên bản cuộc họp, ticket hỗ trợ kỹ thuật, log cảm biến IoT. | Tạo ra **lợi thế cạnh tranh độc quyền (Competitive Moat)** cho doanh nghiệp khi dùng cho RAG hoặc Fine-tuning, nhưng đòi hỏi bảo mật, ẩn danh hóa (**PII Masking/Redaction**) và phân quyền nghiêm ngặt. |\n| **3. External / API-Based \u0026 Synthetic Data (Dữ liệu bên ngoài qua API \u0026 Dữ liệu tổng hợp)** | Dữ liệu thời gian thực từ Bloomberg API, mạng xã hội, thời tiết; hoặc **Synthetic Data** do mô hình lớn (như Nemotron-4 340B) sinh ra. | API cung cấp thông tin tươi mới (Real-time data); còn Synthetic Data giúp giải quyết tình trạng khan hiếm dữ liệu gắn nhãn ở các lĩnh vực hẹp. |\n\n* **Giải pháp Lưu trữ tương ứng theo quy mô:** Dùng **Object Storage (AWS S3 / GCS / MinIO)** cho kho dữ liệu thô khổng lồ (Data Lake); định dạng cột nén **Apache Parquet** hoặc **WebDataset** để đọc tuần tự tốc độ cao; và **NVIDIA GPUDirect Storage (GDS)** để nạp dữ liệu huấn luyện thẳng từ ổ cứng NVMe/Parallel FS vào VRAM của GPU.\n\n---\n\n## 3. Giai đoạn 2: Data Processing \u0026 Exploratory Data Analysis (Xử lý \u0026 Khám phá Dữ liệu)\n\n### 3.1. Exploratory Data Analysis (EDA - Phân tích Khám phá Dữ liệu)\n* **Phép ẩn dụ Y khoa (Medical Analogy):** Làm EDA trước khi huấn luyện mô hình giống hệt như **bác sĩ phải khám lâm sàng, xét nghiệm máu và chụp X-quang trước khi kê đơn hoặc phẫu thuật**. Bỏ qua EDA mà lao vào train mô hình ngay giống như mổ mà không chụp phim — tốn hàng nghìn giờ GPU vô ích!\n* **4 nhiệm vụ cốt lõi trong EDA \u0026 Tiền xử lý dữ liệu dạng bảng (Tabular Preprocessing):**\n  1. **Xử lý dữ liệu khuyết thiếu (Missing Values / `NaN` / `Null`) \u0026 Trùng lặp (Duplicates):**\n     * Nếu tỷ lệ thiếu rất nhỏ: Xóa dòng bị thiếu (`dropna`).\n     * Nếu dữ liệu quý giá: Điền giá trị thay thế (**Imputation**) bằng giá trị **Trung bình (Mean)**, **Trung vị (Median - tốt hơn khi có Outliers)**, **Giá trị phổ biến nhất (Mode)** cho biến phân loại, hoặc dùng thuật toán k-NN Imputer.\n  2. **Phát hiện và xử lý Điểm ngoại lai dị biệt (Outliers):**\n     * Dùng biểu đồ hộp (**Box Plot / IQR - Interquartile Range**) hoặc điểm chuẩn **Z-score ($|Z| \u003e 3$)** để phát hiện các điểm dữ liệu sai lệch bất thường (ví dụ nhập nhầm tuổi khách hàng = `999`).\n  3. **Xử lý Mất cân bằng Nhãn (Class Imbalance - Ví dụ: 99% bình thường, 1% gian lận):**\n     * **Oversampling (Tăng mẫu lớp thiểu số):** Nhân bản hoặc dùng thuật toán **SMOTE (Synthetic Minority Over-sampling Technique)** để nội suy sinh thêm mẫu mới cho lớp 1%.\n     * **Undersampling (Giảm mẫu lớp đa số):** Cắt bớt ngẫu nhiên mẫu của lớp 99%.\n     * **Cost-Sensitive Learning (Class Weights):** Tăng trọng số phạt trong hàm Loss gấp 100 lần nếu mô hình đoán sai mẫu thuộc lớp thiểu số.\n  4. **Chuẩn hóa Thang đo Đặc trưng (Feature Scaling: Normalization vs. Standardization):**\n     * Khi cột *\"Tuổi\"* có giá trị từ `18 – 80` còn cột *\"Thu nhập\"* có giá trị từ `10,000,000 – 500,000,000`, thuật toán Gradient Descent và khoảng cách vector sẽ bị cột Thu nhập lấn át hoàn toàn. Ta dùng 1 trong 2 cách:\n       * **Min-Max Normalization:** Ép mọi giá trị vào đoạn cố định **$[0, 1]$** theo công thức $x\u0027 = \\frac{x - x_{\\min}}{x_{\\max} - x_{\\min}}$.\n       * **Standardization (Z-Score Scaling):** Đưa phân phối về **Trung bình $\\mu = 0$ và Độ lệch chuẩn $\\sigma = 1$** theo công thức $z = \\frac{x - \\mu}{\\sigma}$ (Ít bị bóp méo bởi Outliers hơn Min-Max).\n\n---\n\n### 3.2. Các Kỹ thuật Xử lý Dữ liệu Văn bản cho NLP \u0026 LLM (Text Preprocessing Pipeline)\nTrong miền *Data Analysis (14%)* của đề thi NCA-GENL, bạn sẽ gặp các câu hỏi về công cụ xử lý văn bản thô:\n\n```mermaid\nflowchart TD\n    Raw[\"Văn bản thô thu thập từ Internet / Doanh nghiệp (Raw Text Corpus)\"]\n    \n    T1[\"1. Regular Expressions (Regex - Biểu thức chính quy)\u003cbr/\u003e🎯 Tìm kiếm, lọc bỏ \u0026 ẩn danh hóa (PII Redaction) các mẫu ký tự cố định:\u003cbr/\u003eEmail, Số điện thoại, Số thẻ tín dụng, URL, Thẻ HTML/XML, Ký tự rác\u003cbr/\u003e⚡ Siêu nhanh bằng CPU/GPU (cuDF), không cần tốn tài nguyên chạy ML!\"]\n    \n    T2[\"2. Chuẩn hóa Từ vựng (Stopwords, Stemming vs. Lemmatization)\u003cbr/\u003e• Stopwords Removal: Loại bỏ từ dừng tần suất cao ít nghĩa (\u0027the\u0027, \u0027is\u0027, \u0027at\u0027)\u003cbr/\u003e• Stemming: Cắt cụt đuôi từ thô sơ theo luật (\u0027studies\u0027 -\u003e \u0027studi\u0027, \u0027running\u0027 -\u003e \u0027run\u0027)\u003cbr/\u003e• Lemmatization: Đưa từ về đúng từ gốc từ điển theo ngữ pháp (\u0027better\u0027 -\u003e \u0027good\u0027, \u0027studies\u0027 -\u003e \u0027study\u0027)\"]\n    \n    T3[\"3. N-gram Summaries (Phân tích cụm N từ liền kề)\u003cbr/\u003e• Unigram (1 từ): [\u0027not\u0027, \u0027good\u0027] -\u003e Mất sắc thái phủ định!\u003cbr/\u003e• Bigram (2 từ): [\u0027not good\u0027] | Trigram (3 từ): [\u0027not worth watching\u0027]\u003cbr/\u003e👉 Giữ được ngữ cảnh cục bộ và phát hiện các cụm từ cố định (Collocations)!\"]\n    \n    T4[\"4. Word Frequency Analysis (TF-IDF) \u0026 Deduplication (Khử trùng lặp)\u003cbr/\u003e• Thống kê tần suất từ khóa chủ đề đặc trưng\u003cbr/\u003e• Exact \u0026 Fuzzy Deduplication (MinHash LSH trong NeMo Curator):\u003cbr/\u003eXóa các trang văn bản trùng lặp để LLM không học vẹt (Memorization)!\"]\n\n    Raw --\u003e T1 --\u003e T2 --\u003e T3 --\u003e T4\n```\n\n* **Lưu ý đặc biệt khi tiền xử lý cho LLM hiện đại vs. NLP cổ điển:**\n  * Trong **NLP cổ điển (Bag-of-Words / TF-IDF + Naive Bayes/SVM)**: Ta luôn xóa Stopwords (`\"the\"`, `\"not\"`, `\"is\"`) và đưa về chữ thường (Lowercasing) để giảm chiều vector.\n  * Trong **LLM hiện đại (Transformer)**: Ta **KHÔNG xóa Stopwords** và **KHÔNG cắt Stemming** vì cơ chế Self-Attention cần đầy đủ từng từ dừng và chữ hoa/thường để hiểu trọn vẹn cấu trúc ngữ pháp và sinh câu văn tự nhiên! Thay vào đó, bước quan trọng nhất cho LLM là **Lọc rác bằng Regex, Ẩn danh hóa PII, và Khử trùng lặp (Deduplication)** bằng công cụ như **NVIDIA NeMo Curator**.\n\n---\n\n## 4. Giai đoạn 3: Model Training (Huấn luyện Mô hình)\n\nQuá trình huấn luyện bao gồm **5 bước kỹ thuật cốt lõi**:\n1. **Lựa chọn kiến trúc (Model Architecture Selection):**\n   * Xử lý ngôn ngữ tự nhiên / Sinh văn bản / Code $\\to$ **Transformer (Decoder / Encoder / Seq2Seq)**.\n   * Thị giác máy tính / Phân loại \u0026 nhận diện ảnh $\\to$ **CNN (Convolutional Neural Networks: ResNet, YOLO)** hoặc **Vision Transformer (ViT)**.\n   * Sinh ảnh / Video nghệ thuật từ văn bản $\\to$ **Diffusion Models (Latent Diffusion / DiT)**.\n   * Dữ liệu dạng bảng có cấu trúc (Tabular Data) $\\to$ **Gradient Boosted Trees (XGBoost / LightGBM / CatBoost)** hoặc **Random Forest**.\n2. **Chiến lược huấn luyện (Training Strategy):** Chọn giữa *Full Training from Scratch*, *Continual Pre-training*, *Full Fine-Tuning* hay *PEFT (LoRA / QLoRA)*.\n3. **Cấu hình Siêu tham số (Hyperparameter Configuration - Cực kỳ hay hỏi trong đề thi!):**\n   * *Phân biệt Parameters vs. Hyperparameters:*\n     * **Model Parameters (Tham số mô hình):** Trọng số ($W$) và độ lệch ($b$) bên trong mạng nơ-ron — do mô hình **tự động học và cập nhật** trong lúc train.\n     * **Hyperparameters (Siêu tham số):** Các nút vặn cấu hình bên ngoài do **Kỹ sư AI thiết lập trước khi bấm nút train** (Learning Rate, Batch Size, số Epochs, số tầng, bậc $r$ của LoRA, Dropout rate).\n\n| Siêu tham số (Hyperparameter) | Ý nghĩa kỹ thuật | Chuyện gì xảy ra nếu đặt SAI? | Kỹ thuật tối ưu nâng cao |\n| :--- | :--- | :--- | :--- |\n| **1. Learning Rate ($\\eta$ - Tốc độ học)** | Độ lớn của bước nhảy khi cập nhật trọng số ngược chiều đạo hàm: $W \\leftarrow W - \\eta \\nabla L$. *(Siêu tham số quan trọng nhất!)* | • **Quá cao (Too High):** Nhảy vọt qua đáy cực tiểu (**Overshooting / Divergence**), hàm Loss dao động hỗn loạn hoặc nổ thành `NaN`.\u003cbr/\u003e• **Quá thấp (Too Low):** Hội tụ cực kỳ chậm chạp (tốn tiền GPU) và dễ bị kẹt ở cực tiểu cục bộ (**Local Minimum**). | Dùng **Learning Rate Scheduler**: Tăng dần tuyến tính ở vài trăm bước đầu (**Warmup**) để ổn định đạo hàm, sau đó giảm dần theo hình cô-sin (**Cosine Annealing Decay**). |\n| **2. Batch Size (Kích thước lô)** | Số lượng mẫu dữ liệu được đưa vào GPU tính toán song song trong **1 bước cập nhật trọng số (1 Iteration/Step)**. | • **Quá lớn:** Tận dụng GPU tốt, đạo hàm chuẩn nhưng **tốn rất nhiều VRAM (dễ lỗi `CUDA OOM`)** và đôi khi hội tụ vào cực tiểu nhọn kém tổng quát.\u003cbr/\u003e• **Quá nhỏ (VD: Batch = 1):** Đạo hàm rất nhiễu (Noisy gradients) và không tận dụng hết nhân GPU. | **Gradient Accumulation (Tích lũy đạo hàm):** Nếu VRAM chỉ chứa nổi `micro_batch = 2`, ta chạy xuôi-ngược 16 lần liên tiếp cộng dồn Gradient lại rồi mới gọi `optimizer.step()` 1 lần $\\to$ Giả lập được `Effective Batch Size = 32` mà không tốn thêm VRAM! |\n| **3. Epochs (Số chu kỳ huấn luyện)** | Số lần mà **toàn bộ 100% tập dữ liệu huấn luyện** được đẩy qua mô hình trọn vẹn. *(Ví dụ: Tập dữ liệu có $10.000$ mẫu, `Batch Size = 100` $\\to$ $1\\text{ Epoch} = 100\\text{ Iterations/Steps}$).* | • **Quá ít Epochs:** Mô hình chưa kịp học hết quy luật $\\to$ **Underfitting**.\u003cbr/\u003e• **Quá nhiều Epochs:** Mô hình học thuộc lòng cả nhiễu của tập Train $\\to$ **Overfitting**. | **Early Stopping (Dừng sớm):** Theo dõi `Validation Loss` sau mỗi Epoch; nếu thấy Validation Loss không giảm nữa (hoặc bắt đầu tăng lên) trong $k$ epochs liên tiếp (`patience`), tự động dừng train ngay và lấy Checkpoint tốt nhất! |\n\n4. **Thực thi huấn luyện (Training Execution):** Chạy trên **PyTorch / NVIDIA NeMo Megatron**, bật **Mixed Precision (`BF16` / `FP16` / `FP8`)**, áp dụng **Gradient Clipping** (cắt ngưỡng độ dài vector đạo hàm để chống nổ đạo hàm *Exploding Gradients*), và lưu **Checkpoints** định kỳ ra Parallel File System để nếu cụm 1.000 GPU có 1 máy bị lỗi phần cứng thì chỉ cần khôi phục từ Checkpoint gần nhất thay vì mất trắng nhiều tuần chạy.\n5. **Giám sát Đường cong Huấn luyện (Monitoring Loss Curves) – Chẩn đoán Underfitting vs. Overfitting:**\n\n```mermaid\nflowchart LR\n    subgraph UF[\"1. Underfitting (Chưa khớp / Học quá kém - High Bias)\"]\n        U1[\"📉 Training Loss: RẤT CAO\u003cbr/\u003e📉 Validation Loss: RẤT CAO\u003cbr/\u003e🔧 Nguyên nhân: Mô hình quá nhỏ, thiếu đặc trưng hoặc train quá ít Epochs\u003cbr/\u003e💡 Cách sửa: Tăng kích thước mô hình, train thêm Epochs, giảm Regularization\"]\n    end\n\n    subgraph Good[\"2. Good Fit / Sweet Spot (Hội tụ Tối ưu)\"]\n        G1[\"✅ Training Loss: THẤP\u003cbr/\u003e✅ Validation Loss: CHẠM ĐÁY THẤP NHẤT \u0026 ổn định\u003cbr/\u003e💡 Kích hoạt EARLY STOPPING \u0026 lưu Checkpoint tại đúng điểm này!\"]\n    end\n\n    subgraph OF[\"3. Overfitting (Quá khớp / Học vẹt - High Variance)\"]\n        O1[\"📉 Training Loss: CỰC THẤP (Tiến sát về 0)\u003cbr/\u003e📈 Validation Loss: QUAY ĐẦU TĂNG VỌT LÊN!\u003cbr/\u003e🔧 Nguyên nhân: Mô hình quá lớn học thuộc lòng nhiễu của tập Train\u003cbr/\u003e💡 Cách sửa: Thêm dữ liệu, Data Augmentation, bật Dropout, Weight Decay (L2), Early Stopping\"]\n    end\n\n    UF --\u003e Good --\u003e OF\n```\n\n---\n\n## 5. Giai đoạn 4: Model Evaluation (Đánh giá Mô hình: Định lượng vs. Định tính)\n\n| Phương pháp đánh giá | Bản chất \u0026 Công cụ | Ví dụ chỉ số cụ thể |\n| :--- | :--- | :--- |\n| **1. Đánh giá Định lượng (Quantitative Evaluation)** | Đo lường tự động, khách quan và có thể lặp lại bằng các **công thức toán học và con số thống kê** trên tập dữ liệu kiểm thử (Test Set / Benchmarks). | • Phân loại: **Accuracy, Precision, Recall, F1-Score, ROC-AUC**.\u003cbr/\u003e• Dịch thuật: **BLEU** \\| Tóm tắt: **ROUGE** \\| RAG: **Cosine Similarity**.\u003cbr/\u003e• Độ tự tin nội tại của LLM: **Perplexity (PPL)**.\u003cbr/\u003e• Hệ thống: **Latency (TTFT, TPOT), Throughput (tokens/s)**. |\n| **2. Đánh giá Định tính (Qualitative Evaluation)** | **Chuyên gia con người (Human-in-the-loop / Domain Experts)** hoặc khảo sát người dùng trực tiếp đọc, trải nghiệm và thẩm định chất lượng đầu ra theo ngữ cảnh. | Kiểm tra giọng văn có tự nhiên, lịch sự không; tính mạch lạc logic; phát hiện các ca **Ảo giác (Hallucination)** tinh vi; kiểm tra độ an toàn đạo đức, sắc thái văn hóa và cảm nhận thực tế (**Vibe check / Red Teaming**). |\n\n### Làm rõ chỉ số Perplexity (PPL) cho LLM (Câu hỏi tủ trong đề thi!):\n* **Perplexity là gì?** Là lũy thừa tự nhiên của hàm mất mát Cross-Entropy trên tập kiểm thử:\n  $$\\text{Perplexity (PPL)} = \\exp\\left(-\\frac{1}{N}\\sum_{i=1}^N \\log P(w_i \\mid w_{\u003ci})\\right) = e^{\\text{Cross-Entropy Loss}}$$\n* **Ý nghĩa trực quan:** Đo lường **mức độ \"bối rối / ngạc nhiên / phân vân\"** (Branching factor) của mô hình ngôn ngữ khi dự đoán token tiếp theo.\n* **Trực giác cho Developer:** Nếu Mô hình A có $\\text{Perplexity} = 8.5$ và Mô hình B có $\\text{Perplexity} = 42.0$, điều đó có nghĩa là ở mỗi bước chọn từ tiếp theo, Mô hình A chỉ phân vân giữa ~8 từ hợp lý, trong khi Mô hình B đang hoang mang giữa 42 từ!\n* **Quy tắc vàng cần nhớ:** **Perplexity CÀNG THẤP (Lower is Better) $\\to$ Cross-Entropy Loss càng thấp $\\to$ Mô hình dự đoán ngôn ngữ CÀNG CHÍNH XÁC VÀ TỰ TIN!**\n\n---\n\n## 6. Giai đoạn 5: Model Deployment, Optimization (ONNX, Quantization, Pruning) \u0026 Drift Monitoring\n\nSau khi huấn luyện xong, mô hình thường rất nặng nề. Để đưa lên Production phục vụ hàng triệu người dùng với chi phí thấp nhất, kỹ sư áp dụng các kỹ thuật chuẩn hóa và nén mô hình:\n\n### 6.1. Chuẩn hóa mô hình đa nền tảng với ONNX (Open Neural Network Exchange)\n* **ONNX** là **định dạng chuẩn mở trung gian (Open Standard Format)** biểu diễn đồ thị tính toán mạng nơ-ron (Computation Graph + Weights) hoàn toàn **độc lập với framework**.\n* **Giá trị cốt lõi (Interoperability \u0026 Portability):** Đội ngũ Data Science có thể thoải mái nghiên cứu và huấn luyện mô hình bằng **PyTorch, TensorFlow hoặc Scikit-learn**, sau đó xuất (Export) ra một file `.onnx` duy nhất để đội ngũ Engineering triển khai trên **ONNX Runtime (C++, C#, Java, JavaScript)** hoặc nạp thẳng vào **NVIDIA TensorRT / Triton Inference Server** mà không cần cài đặt bộ thư viện Python huấn luyện nặng nề.\n\n```mermaid\nflowchart LR\n    F1[\"PyTorch Model (.pt)\"]\n    F2[\"TensorFlow / Keras (.pb)\"]\n    F3[\"Scikit-learn / XGBoost\"]\n    \n    ONNX[\"Chuẩn trung gian mở\u003cbr/\u003e📦 ONNX (.onnx)\u003cbr/\u003e(Độc lập Framework - High Portability)\"]\n    \n    R1[\"ONNX Runtime (C++ / C# / Python / Mobile)\"]\n    R2[\"NVIDIA TensorRT (Biên dịch tối ưu cực đại trên GPU NVIDIA)\"]\n    R3[\"NVIDIA Triton Inference Server\"]\n\n    F1 \u0026 F2 \u0026 F3 ==\u003e|\"Export\"| ONNX ==\u003e|\"Deploy / Compile\"| R1 \u0026 R2 \u0026 R3\n```\n\n---\n\n### 6.2. Bộ Ba Kỹ thuật Nén và Tăng tốc Mô hình: Quantization, Pruning \u0026 Distillation\n\n#### A. Kỹ thuật Quantization (Lượng tử hóa - Giảm độ chính xác bit số học)\n* **Quantization** nén mô hình bằng cách **giảm số lượng bit biểu diễn (bit-width)** của mỗi trọng số (Weights) và giá trị kích hoạt (Activations) từ số thực 32-bit (**`FP32`**) xuống **16-bit (`FP16` / `BF16`)**, **8-bit (`INT8` / `FP8`)** hoặc **4-bit (`INT4` - AWQ / GPTQ)**.\n\n```mermaid\nflowchart LR\n    FP32[\"32-bit Float (FP32 - 4 bytes)\u003cbr/\u003e📦 Kích thước: 100 MB\u003cbr/\u003e⚡ Tốc độ: 1.0x (Gốc)\u003cbr/\u003e🎯 Độ chính xác: 95.0%\"]\n    \n    FP16[\"16-bit Float (FP16 / BF16 - 2 bytes)\u003cbr/\u003e📦 Kích thước: 50 MB (Giảm 50% / 2x)\u003cbr/\u003e⚡ Tốc độ: ~1.8x - 2x\u003cbr/\u003e🎯 Độ chính xác: 94.9%\"]\n    \n    INT8[\"8-bit Integer (INT8 / FP8 - 1 byte)\u003cbr/\u003e📦 Kích thước: 25 MB (Giảm 75% - Nhỏ hơn 4 lần!)\u003cbr/\u003e⚡ Tốc độ: ~3.0x - 4.0x trên Tensor Cores!\u003cbr/\u003e🎯 Độ chính xác: 94.2% (Chỉ giảm \u003c1%)\"]\n\n    FP32 ==\u003e|\"Quantization\"| FP16 ==\u003e|\"Quantization\"| INT8\n```\n\n* **Phân biệt 2 phương pháp thực hiện Quantization (Hay hỏi thi):**\n  1. **PTQ (Post-Training Quantization - Lượng tử hóa sau huấn luyện):** Mô hình đã huấn luyện xong xuôi ở FP32/BF16 được đem nén thẳng xuống `INT8`/`FP8`/`INT4` (chỉ cần chạy qua một tập dữ liệu nhỏ khoảng vài trăm mẫu gọi là **Calibration Dataset** để đo dải giá trị cực đại/cực tiểu mà **không cần huấn luyện lại**). *Ưu điểm:* Cực nhanh, tiết kiệm tài nguyên (Hỗ trợ mạnh mẽ trong **NVIDIA TensorRT / TensorRT-LLM Model Optimizer**).\n  2. **QAT (Quantization-Aware Training - Huấn luyện nhận thức lượng tử hóa):** Chèn các nút giả lập sai số làm tròn (Fake quantization nodes) ngay trong quá trình Fine-tuning để mô hình tự điều chỉnh trọng số thích nghi với chuẩn 8-bit/4-bit. *Ưu điểm:* Bảo toàn độ chính xác cao hơn PTQ ở các mức bit cực thấp, nhưng tốn chi phí GPU để train thêm.\n\n#### B. Kỹ thuật Model Pruning (Cắt tỉa mạng nơ-ron)\n* Giống như cắt tỉa những cành cây khô không ra quả: **Pruning** loại bỏ các trọng số gần bằng $0$, các nơ-ron, các kênh (channels), các đầu chú ý (Attention Heads) hoặc thậm chí toàn bộ các tầng dư thừa ít đóng góp vào kết quả dự đoán:\n  * **Unstructured Pruning (Cắt tỉa phi cấu trúc):** Cho các trọng số nhỏ lẻ rải rác trong ma trận bằng $0$. Tuy giảm được dung lượng khi nén file nhưng GPU khó tăng tốc vì ma trận bị thủng lỗ chỗ không đều.\n  * **Structured Pruning \u0026 NVIDIA 2:4 Structured Sparsity (Cắt tỉa có cấu trúc):** Cắt bỏ nguyên cả hàng/cột/kênh hoặc áp dụng chuẩn **2:4 Sparsity của NVIDIA** (trong mỗi nhóm 4 trọng số liên tiếp, giữ lại 2 số lớn nhất và cho 2 số nhỏ nhất bằng $0$) $\\to$ Phần cứng **Sparse Tensor Cores** trên GPU Ampere/Hopper/Blackwell tự động bỏ qua các số $0$ và **tăng gấp đôi (2x) tốc độ nhân ma trận**!\n  * *(Trong hệ sinh thái NVIDIA hiện đại như mô hình **Llama-3.1-Nemotron-Nano/Ultra**, các kỹ sư kết hợp **Structured Pruning + Knowledge Distillation** thông qua phương pháp **Minitron** để tạo ra các mô hình vừa nhỏ gọn vừa cực kỳ thông minh!).*\n\n---\n\n### 6.3. Phương thức Triển khai (Batch vs. Real-time) \u0026 Giám sát Sự trôi dạt (Drift Monitoring)\n* **Hai mô hình triển khai chính:**\n  1. **Batch Deployment / Offline Inference (Xử lý theo lô định kỳ):** Gom hàng triệu bản ghi chạy offline theo lịch cố định (ví dụ 2h sáng hàng ngày chạy dự báo doanh số tồn kho, gửi email gợi ý sản phẩm hàng tuần). *Mục tiêu tối ưu:* **Throughput (Thông lượng) và hiệu quả chi phí cao nhất**, không đòi hỏi độ trễ thấp tức thì.\n  2. **Real-time / Online Deployment (Suy luận thời gian thực):** Phục vụ trực tiếp từng yêu cầu của người dùng qua **REST API / gRPC / WebSockets** với độ trễ mili-giây (ví dụ: Chatbot CSKH, tự động hoàn thành code IDE, phát hiện gian lận khi quẹt thẻ). Thường đóng gói trong **Docker Containers**, chạy trên **NVIDIA Triton / NIM** và điều phối co giãn tự động (Horizontal Pod Autoscaler) bằng **Kubernetes (K8s)**.\n* **Giám sát sau triển khai (Post-Deployment Monitoring) – Phân biệt Data Drift vs. Concept Drift:**\n  Mô hình AI không giống như phần mềm truyền thống viết xong là chạy mãi mãi; theo thời gian, thế giới thực thay đổi làm chất lượng mô hình suy thoái (**Model Decay / Degradation**):\n\n| Loại Trôi dạt (Drift) | Bản chất Toán học | Ví dụ Thực tế Dễ nhớ | Cách khắc phục |\n| :--- | :--- | :--- | :--- |\n| **1. Data Drift (Covariate Shift / Feature Drift)** | Phân phối của **dữ liệu đầu vào $P(X)$ thay đổi** so với tập dữ liệu lúc huấn luyện, nhưng quy luật bản chất $P(Y \\mid X)$ vẫn giữ nguyên. | • Người dùng mạng xã hội bắt đầu dùng nhiều **từ lóng, viết tắt mới** mà lúc train mô hình chưa từng gặp.\u003cbr/\u003e• Camera nhà máy bị mờ bụi hoặc thay đổi góc chiếu sáng khác với ảnh lúc train. | Thu thập dữ liệu đầu vào mới gần đây, gắn nhãn bổ sung và **huấn luyện lại (Retrain / Fine-tune)** hoặc cập nhật kho RAG. |\n| **2. Concept Drift (Sự trôi dạt khái niệm)** | Dữ liệu đầu vào $X$ trông vẫn như cũ, nhưng **bản chất mối quan hệ giữa đầu vào và đầu ra $P(Y \\mid X)$ đã thay đổi hoàn toàn**! | • Cùng một mức thu nhập và lịch sử mua sắm đó, nhưng khi xảy ra **đại dịch COVID-19 hoặc khủng hoảng lạm phát**, hành vi tiêu dùng và tỷ lệ vỡ nợ của khách hàng đảo chiều hoàn toàn.\u003cbr/\u003e• Kẻ lừa đảo đổi sang phương thức rửa tiền mới. | Phải **xây dựng lại tập nhãn mới phản ánh quy luật mới của thời cuộc**, điều chỉnh đặc trưng và huấn luyện lại mô hình (**Continuous Learning**). |\n\n---\n\n## 7. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 7:**\n\u003e 1. **Bẫy Perplexity:** Điểm Perplexity của Mô hình A là `12.5` và của Mô hình B là `45.0`. Mô hình nào tốt hơn? $\\to$ **Mô hình A tốt hơn** (Perplexity càng thấp = mô hình càng ít bối rối và dự đoán từ tiếp theo càng chính xác!).\n\u003e 2. **Bẫy Overfitting vs. Underfitting:** Training Loss rất thấp nhưng Validation Loss tăng cao $\\to$ **Overfitting** (Sửa bằng: *Dropout, Early Stopping, Data Augmentation, L2 Weight Decay*). Cả hai Loss đều cao $\\to$ **Underfitting** (Sửa bằng: *Mô hình lớn hơn, train thêm Epochs*).\n\u003e 3. **Bẫy Quantization:** Giảm từ `FP32` (32-bit) xuống `INT8` (8-bit) giúp giảm kích thước bộ nhớ mô hình đi bao nhiêu lần? $\\to$ **Giảm 4 lần ($32 / 8 = 4$)** (từ 100MB xuống 25MB) và tăng tốc khoảng $3\\times$.\n\u003e 4. **Bẫy Data Drift vs. Concept Drift:** Đầu vào thay đổi (từ lóng mới, nhóm tuổi khách hàng mới) $\\to$ **Data Drift**. Ý nghĩa/hành vi thực tế thay đổi theo thời cuộc dù đầu vào giống hệt cũ $\\to$ **Concept Drift**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Sau khi triển khai mô hình phân loại bình luận mạng xã hội lên Production được 6 tháng, kỹ sư nhận thấy độ chính xác suy giảm do người dùng bắt đầu sử dụng nhiều từ viết tắt và trào lưu ngôn ngữ mới chưa từng có trong tập dữ liệu huấn luyện ban đầu. Hiện tượng này được gọi là gì?\n   * *Đáp án:* **Data Drift (Sự trôi dạt dữ liệu đầu vào / Covariate Shift)**.\n2. **Câu 2:** Để lọc bỏ nhanh các chuỗi có định dạng cố định như địa chỉ Email, số thẻ tín dụng, số điện thoại và đường dẫn URL khỏi tập dữ liệu văn bản thô trước khi đưa vào huấn luyện LLM, công cụ nào hiệu quả và tiết kiệm tài nguyên nhất?\n   * *Đáp án:* **Regular Expressions (Regex - Biểu thức chính quy)**.\n3. **Câu 3:** Khi phân tích văn bản bằng phương pháp thống kê truyền thống, tại sao việc sử dụng **Bigrams (2-grams)** hoặc **Trigrams (3-grams)** lại giúp mô hình phân tích cảm xúc chính xác hơn so với chỉ dùng **Unigrams (từng từ đơn lẻ)**?\n   * *Đáp án:* Vì N-grams ($N \\ge 2$) giữ lại được **ngữ cảnh kết hợp từ liền kề (đặc biệt là các cụm từ phủ định như `\"not good\"`, `\"not worth watching\"`)**, trong khi Unigram tách rời chữ `\"not\"` và `\"good\"` làm mất đi ý nghĩa chê bai.\n4. **Câu 4:** Trong quá trình huấn luyện mô hình Deep Learning, kỹ sư thiết lập `Learning Rate` ở mức quá cao (ví dụ `1.0`). Hiện tượng gì sẽ xảy ra với hàm mất mát (Loss Function)?\n   * *Đáp án:* Trọng số mô hình sẽ nhảy vọt qua điểm cực tiểu (**Overshooting**), khiến hàm Loss **dao động mạnh hỗn loạn, không thể hội tụ hoặc phát nổ (Divergence / `NaN`)**.\n5. **Câu 5:** Một nhóm kỹ sư huấn luyện mô hình bằng PyTorch nhưng đội ngũ vận hành lại yêu cầu triển khai mô hình đó trên môi trường C++ đa nền tảng mà không phụ thuộc vào Python. Họ nên xuất mô hình sang định dạng chuẩn mở nào?\n   * *Đáp án:* **ONNX (Open Neural Network Exchange)**.\n6. **Câu 6:** Khi so sánh hai mô hình ngôn ngữ lớn trên cùng một tập dữ liệu kiểm thử văn bản, `Model X` đạt chỉ số **Perplexity = 9.2**, trong khi `Model Y` đạt **Perplexity = 28.7**. Mô hình nào có khả năng dự đoán từ tiếp theo tốt hơn và tại sao?\n   * *Đáp án:* **`Model X` tốt hơn** vì Perplexity đo lường mức độ bối rối/không chắc chắn của mô hình ($e^{\\text{Loss}}$) — **Perplexity càng thấp chứng tỏ mô hình càng tự tin và dự đoán chính xác chuỗi ngôn ngữ hơn**.\n"},{"id":"mod08","file":"Module_08_NVIDIA_Ecosystem.md","badge":"MODULE 08","shortTitle":"NVIDIA AI Ecosystem (Full-Stack)","domain":"Software Dev (24%) \u0026 Data","weight":"NVIDIA Stack","icon":"🟢","content":"# Module 8: NVIDIA AI Ecosystem (Hệ sinh thái Toàn diện của NVIDIA)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 8 (Thuộc Domain \"Software Development - 24%\" \u0026 \"Data Analysis - 14%\" — Chiếm ~30% tổng số câu hỏi của cả đề thi!):**\n\u003e Bạn BẮT BUỘC phải nắm vững vai trò, kiến trúc và sự khác biệt của từng công cụ trong hệ sinh thái NVIDIA:\n\u003e * **Phần cứng \u0026 Quản trị Cụm:** Hệ thống **DGX (Volta $\\to$ Ampere $\\to$ Hopper $\\to$ Blackwell)**, công nghệ chia nhỏ GPU **MIG (Multi-Instance GPU)**, **Grace CPU** (kiến trúc Arm + NVLink-C2C), và phần mềm quản trị cụm **NVIDIA Base Command**.\n\u003e * **Lập trình \u0026 Giám sát GPU:** **CUDA** (Thread $\\to$ Warp $\\to$ Block $\\to$ Grid, cuBLAS/cuDNN/NCCL) \u0026 lệnh **`nvidia-smi`**.\n\u003e * **Tăng tốc Khoa học Dữ liệu (NVIDIA RAPIDS):** Thuộc lòng bảng ánh xạ `Pandas` $\\to$ **`cuDF`**, `NumPy` $\\to$ **`cuPy`**, `Scikit-learn` $\\to$ **`cuML`**, `NetworkX` $\\to$ **`cuGraph`**, `PyArrow` $\\to$ **`cuIO`**, và tìm kiếm vector **`cuVS / RAFT`**.\n\u003e * **Tối ưu Suy luận:** **NVIDIA TensorRT** (Layer Fusion, Quantization, Kernel Auto-Tuning) và **TensorRT-LLM** (In-flight Batching, PagedAttention, FP8 KV Cache).\n\u003e * **Framework GenAI/LLM:** **NVIDIA NeMo** (Curator, Megatron, Customizer, Evaluator, Retriever, Guardrails) cùng dòng mô hình **NVIDIA Nemotron**, **BioNeMo**, **Picasso/Edify**.\n\u003e * **Triển khai \u0026 Phục vụ Mô hình:** **NVIDIA Triton Inference Server** (Dynamic Batching, Concurrent Model Execution, Model Ensembles) và **NVIDIA NIM (Inference Microservices)**.\n\u003e * **Phân phối \u0026 Cloud-Native:** **NGC Catalog**, **NVIDIA AI Enterprise (NVAIE)**, **NVIDIA Container Toolkit**, **NVIDIA GPU Operator**.\n\n---\n\n## 1. Kiến trúc AI Full-Stack 6 Lớp của NVIDIA\n\nNVIDIA không chỉ là công ty bán chip phần cứng mà là một công ty **AI Full-Stack** cung cấp ngăn xếp công nghệ đồng bộ từ vi mạch silicon bên dưới cho tới các container microservices ở tầng ứng dụng trên cùng:\n\n```mermaid\nflowchart TD\n    subgraph Stack[\"Kiến trúc 6 Lớp NVIDIA AI Full-Stack\"]\n        L6[\"Layer 6 - Software Distribution, Microservices \u0026 Cluster Management\u003cbr/\u003e📦 NVIDIA NGC Catalog, NVIDIA NIM, AI Enterprise (NVAIE), Base Command, Container Toolkit, GPU Operator\"]\n        L5[\"Layer 5 - Production Model Serving\u003cbr/\u003e🚀 NVIDIA Triton Inference Server (HTTP/gRPC, Dynamic Batching, Concurrent Execution, Ensembles)\"]\n        L4[\"Layer 4 - Generative AI \u0026 Domain Frameworks\u003cbr/\u003e🧠 NVIDIA NeMo (Curator, Megatron, Customizer, Retriever, Guardrails), BioNeMo, Picasso\"]\n        L3[\"Layer 3 - Domain Optimization \u0026 Acceleration Libraries\u003cbr/\u003e⚡ NVIDIA RAPIDS (cuDF, cuML, cuGraph, cuVS) \u0026 NVIDIA TensorRT / TensorRT-LLM\"]\n        L2[\"Layer 2 - Parallel Programming Platform \u0026 Core Libraries\u003cbr/\u003e💻 Kiến trúc CUDA, cuDNN, cuBLAS, NCCL \u0026 Công cụ giám sát nvidia-smi\"]\n        L1[\"Layer 1 - Hardware Foundation (Nền tảng Phần cứng)\u003cbr/\u003e🖥️ GPU (Hopper H100/H200, Blackwell B200), MIG, Grace CPU (Arm), NVLink, InfiniBand, DGX\"]\n\n        L6 --\u003e L5 --\u003e L4 --\u003e L3 --\u003e L2 --\u003e L1\n    end\n```\n\n---\n\n## 2. Layer 1: Phần cứng chuyên dụng – NVIDIA DGX, MIG, Grace CPU \u0026 Base Command\n\n### 2.1. Dòng siêu máy tính AI: NVIDIA DGX Systems \u0026 Sự tiến hóa Kiến trúc GPU\n**NVIDIA DGX** là dòng máy chủ/siêu máy tính chuyên dụng được NVIDIA thiết kế tối ưu hóa toàn diện (tích hợp sẵn 8 GPU kết nối qua NVLink/NVSwitch, card mạng InfiniBand tốc độ cao, ổ cứng NVMe RAID và phần mềm chuẩn hóa) cho các tác vụ huấn luyện và suy luận AI/DL nặng nhất:\n\n```mermaid\nflowchart LR\n    D1[\"2016: DGX-1\u003cbr/\u003eGPU Pascal P100\u003cbr/\u003eKhai sinh dòng DGX\"]\n    D2[\"2017-2018: DGX-2\u003cbr/\u003eGPU Volta V100\u003cbr/\u003eRa mắt Tensor Cores \u0026 NVSwitch\"]\n    D3[\"2020: DGX A100\u003cbr/\u003eGPU Ampere A100\u003cbr/\u003eTF32, BF16, MIG \u0026 2:4 Sparsity\"]\n    D4[\"2022-2023: DGX H100 / H200\u003cbr/\u003eGPU Hopper\u003cbr/\u003eTransformer Engine (FP8)\u003cbr/\u003e\u0026 Confidential Computing\"]\n    D5[\"2024+: DGX B200 / GB200 NVL72\u003cbr/\u003eGPU Blackwell\u003cbr/\u003eFP4/FP6, NVLink thế hệ 5 (1.8 TB/s)\u003cbr/\u003eLàm mát chất lỏng toàn Rack\"]\n\n    D1 --\u003e D2 --\u003e D3 --\u003e D4 --\u003e D5\n```\n\n| Thế hệ Kiến trúc GPU | Dòng GPU Tiêu biểu | Đột phá Công nghệ Quan trọng Cần Nhớ Cho Kỳ Thi |\n| :--- | :--- | :--- |\n| **1. Volta (2017)** | Tesla V100 | Thế hệ GPU đầu tiên giới thiệu nhân **Tensor Cores** chuyên dụng cho phép nhân ma trận Deep Learning (`FP16`) và chip chuyển mạch **NVSwitch**. |\n| **2. Ampere (2020)** | A100 (40GB / 80GB) | Giới thiệu định dạng **`TF32`**, **`BF16`**, **2:4 Structured Sparsity** và công nghệ chia nhỏ phần cứng GPU **MIG (Multi-Instance GPU)**. |\n| **3. Ada Lovelace (2022)** | L4, L40S, RTX 4090 | Tối ưu hóa cho suy luận đa phương thức (Inference), đồ họa Omniverse, dựng hình 3D và xử lý Video/AI tiêu thụ ít điện năng. |\n| **4. Hopper (2022–2023)** | H100 (80GB), H200 (141GB HBM3e) | Giới thiệu **Transformer Engine** (tự động chuyển đổi động giữa **`FP8`** và `FP16`/`BF16`), **NVIDIA Confidential Computing (TEE)**, và NVLink thế hệ 4 (900 GB/s). |\n| **5. Blackwell (2024+)** | B200, GB200 NVL72 | Thế hệ Transformer Engine thứ 2 hỗ trợ lượng tử hóa **`FP4` / `FP6`**, NVLink thế hệ 5 (**1.8 TB/s**), kết nối 72 GPU Blackwell như một GPU khổng lồ duy nhất trong 1 Rack làm mát bằng chất lỏng (**GB200 NVL72**). |\n\n### 2.2. Công nghệ Chia nhỏ GPU: MIG (Multi-Instance GPU)\n* **Vấn đề thực tế:** Một chiếc GPU A100/H100 80GB là quá dư thừa nếu chỉ dùng để chạy một mô hình nhỏ (như BERT hoặc SLM 1B) hoặc cho 7 sinh viên/kỹ sư cùng thực hành Jupyter Notebook. Nếu cho 7 người chạy chung trên 1 GPU bình thường, tiến trình của người này bị treo hoặc ngốn hết băng thông bộ nhớ sẽ làm chậm người kia (**Noisy Neighbor problem**).\n* **Giải pháp – NVIDIA MIG (Multi-Instance GPU):** Cho phép phân vùng vật lý **1 chiếc GPU lớn (A100/H100/B200) thành tối đa 7 GPU con độc lập hoàn toàn ở cấp độ phần cứng (7 MIG Instances)**. Mỗi MIG Instance có phần bộ nhớ HBM riêng, bộ nhớ đệm L2 Cache riêng và các cụm nhân SM riêng biệt — đảm bảo cách ly lỗi, bảo mật và chất lượng dịch vụ (QoS) 100%!\n\n### 2.3. Bộ vi xử lý NVIDIA Grace CPU \u0026 Siêu chip Grace Hopper / Grace Blackwell\n* **Grace CPU:** Bộ vi xử lý máy chủ **72 nhân (cores) kiến trúc Arm Neoverse** hiệu suất cao và siêu tiết kiệm điện năng do chính NVIDIA thiết kế cho trung tâm dữ liệu AI.\n* **Giao tiếp NVLink-C2C (Chip-to-Chip):** Kết nối trực tiếp Grace CPU với GPU Hopper (**Siêu chip GH200**) hoặc 2 GPU Blackwell (**Siêu chip GB200**) với băng thông **900 GB/s (nhanh gấp 7 lần PCIe Gen 5)** và tạo thành một không gian **Bộ nhớ Hợp nhất Mạch lạc (Hardware-Coherent Unified Memory)** lên tới hàng trăm Gigabyte, cho phép GPU truy cập trực tiếp vào RAM LPDDR5X của CPU để chạy các mô hình khổng lồ mà không bị nghẽn PCIe.\n\n### 2.4. Quản trị Cụm Huấn luyện Quy mô lớn: NVIDIA Base Command\n* **NVIDIA Base Command (và Base Command Manager - BCM):** Là nền tảng phần mềm quản trị, điều phối và giám sát toàn diện hạ tầng cụm siêu máy tính AI (**DGX SuperPOD** / Hybrid Cloud).\n* **Vai trò trong đề thi:** Cung cấp giao diện thống nhất cho quản trị viên cấp phát tài nguyên cụm (Provisioning), lập lịch chạy các job huấn luyện lớn (tích hợp **Slurm** và **Kubernetes**), quản lý hạn ngạch (Quota) người dùng, theo dõi sức khỏe phần cứng/nhiệt độ/mạng InfiniBand toàn cụm và tự động cô lập node lỗi để khôi phục huấn luyện.\n\n---\n\n## 3. Layer 2: Lập trình \u0026 Giám sát GPU – CUDA \u0026 `nvidia-smi`\n\n### 3.1. Kiến trúc CUDA (Compute Unified Device Architecture) \u0026 Các Thư viện Toán học Lõi\n* **Định nghĩa:** Nền tảng tính toán song song và mô hình lập trình (API) độc quyền của NVIDIA (ra mắt năm 2006) cho phép các ngôn ngữ như **C, C++, Fortran, Python** điều khiển trực tiếp hàng nghìn nhân GPU.\n* **Phép ẩn dụ Sơn
