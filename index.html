 chật hẹp (PCIe Gen5 chỉ đạt ~128 GB/s hai chiều), **NVLink** và chip chuyển mạch **NVSwitch** nối trực tiếp mọi GPU với nhau theo cấu trúc All-to-All với băng thông lên tới **900 GB/s (trên Hopper H100)** và **1.8 TB/s (trên Blackwell B200)** — nhanh gấp 7 đến 14 lần PCIe, biến các GPU trong miền NVLink thành một \"siêu GPU\" với bể bộ nhớ VRAM dùng chung!\n2. **Giữa các máy chủ khác nhau trong cụm Cluster (Inter-node / Scale-out): InfiniBand, Spectrum-X \u0026 GPUDirect RDMA**\n   * **Ẩn dụ Đường bộ (Ethernet chuẩn) vs. Đường ray tàu cao tốc Shinkansen (InfiniBand):**\n     * **Ethernet truyền thống (TCP/IP):** Thiết kế kiểu \"Best-effort\", kiểm soát gói tin qua ngăn xếp TCP/IP của hệ điều hành gây **overhead CPU cao**, **độ trễ lớn**, dễ xảy ra nghẽn cổ chai (packet drop) khi hàng trăm máy chủ bắn dữ liệu cùng một mili-giây (hiện tượng *Incast congestion*).\n     * **NVIDIA Quantum InfiniBand:** Chuẩn mạng chuyên dụng cho HPC và AI Factory với băng thông **400Gbps (NDR) – 800Gbps (XDR)/cổng**, cơ chế kiểm soát luồng phần cứng đảm bảo **không rớt gói tin (Lossless network)**, định tuyến thích ứng (Adaptive Routing) và tính toán gộp dữ liệu ngay trên thiết bị chuyển mạch (**SHARP** - Scalable Hierarchical Aggregation and Reduction Protocol).\n     * **NVIDIA Spectrum-X:** Nền tảng Ethernet được NVIDIA thiết kế lại chuyên biệt cho AI (kết hợp Switch Spectrum-4 và SmartNIC/SuperNIC **BlueField-3 DPU**), mang lại hiệu năng RoCE (RDMA over Converged Ethernet) tiệm cận InfiniBand cho các trung tâm dữ liệu chuẩn Ethernet.\n   * **Công nghệ RDMA \u0026 GPUDirect RDMA:** Cho phép **GPU ở máy chủ A đọc/ghi trực tiếp vào VRAM của GPU ở máy chủ B** qua card mạng InfiniBand/RoCE mà **không cần sao chép qua vùng đệm System RAM của CPU trên đường truyền dữ liệu**, giảm độ trễ xuống mức **micro-giây ($\\mu s$)** và giảm đáng kể tải cho CPU.\n\n```mermaid\nflowchart TD\n    subgraph Trad[\"Mạng Truyền thống (Không có GPUDirect RDMA - 4 lần Copy qua CPU/RAM)\"]\n        direction LR\n        G1[\"GPU 1 VRAM\u003cbr/\u003e(Node A)\"] --\u003e|Copy 1| R1[\"System RAM\u003cbr/\u003e\u0026 CPU Kernel (Node A)\"]\n        R1 --\u003e|Copy 2| NIC1[\"Card mạng NIC\u003cbr/\u003e(Node A)\"]\n        NIC1 ==\u003e|Mạng TCP/IP| NIC2[\"Card mạng NIC\u003cbr/\u003e(Node B)\"]\n        NIC2 --\u003e|Copy 3| R2[\"System RAM\u003cbr/\u003e\u0026 CPU Kernel (Node B)\"]\n        R2 --\u003e|Copy 4| G2[\"GPU 2 VRAM\u003cbr/\u003e(Node B)\"]\n    end\n\n    subgraph RDMA_Flow[\"Công nghệ InfiniBand + GPUDirect RDMA (Zero-Copy qua CPU)\"]\n        direction LR\n        GA[\"GPU 1 VRAM\u003cbr/\u003e(Node A)\"] \u003c==\u003e|\"Đọc/Ghi trực tiếp qua NIC \u0026 InfiniBand\u003cbr/\u003e(Bỏ qua hoàn toàn CPU \u0026 System RAM)\"| GB[\"GPU 2 VRAM\u003cbr/\u003e(Node B)\"]\n    end\n```\n\n---\n\n## 5. Hạ tầng Lưu trữ cho AI (Storage Infrastructure)\n\n### 5.1. Bốn lớp lưu trữ chính trong Data Center AI\nTừ nhanh nhất (nhưng đắt và dung lượng nhỏ) đến rẻ nhất (nhưng chậm hơn và dung lượng vô hạn):\n\n```mermaid\nflowchart LR\n    T1[\"1. NVMe SSD\u003cbr/\u003e(Local Storage)\u003cbr/\u003e⚡ Độ trễ micro-giây\u003cbr/\u003e🎯 Active Training / Inference\"]\n    T2[\"2. Parallel File Systems\u003cbr/\u003e(Lustre, GPFS, WEKA)\u003cbr/\u003e⚡ Hàng trăm Node đọc song song\u003cbr/\u003e🎯 Shared Cluster Datasets\"]\n    T3[\"3. Network File Systems\u003cbr/\u003e(NFS)\u003cbr/\u003e📁 Chia sẻ tệp qua mạng chuẩn\u003cbr/\u003e🎯 Code, Configs, Small Checkpoints\"]\n    T4[\"4. Object Storage\u003cbr/\u003e(AWS S3, GCS, Ceph)\u003cbr/\u003e📦 Mở rộng vô hạn, giá rẻ\u003cbr/\u003e🎯 Raw Data, Archives, Backups\"]\n\n    T1 --- T2 --- T3 --- T4\n```\n\n| Lớp lưu trữ | Đặc tính kỹ thuật | Mục đích sử dụng chuẩn trong AI |\n| :--- | :--- | :--- |\n| **1. NVMe SSD (Local Storage)** | Gắn trực tiếp qua bus PCIe của từng máy chủ cục bộ; độ trễ micro-giây, IOPS cực đại nhưng dung lượng giới hạn theo từng máy. | Chứa **Hot Data** (dữ liệu đang nạp trực tiếp vào vòng lặp training), bộ nhớ đệm cục bộ (Local Scratch Cache) và chạy **Inference** tốc độ cao. |\n| **2. Parallel File Systems (Lustre, IBM Storage Scale/GPFS, WEKA, BeeGFS)** | Hệ thống tệp phân tán song song; băm nhỏ (stripe) file ra hàng chục máy chủ lưu trữ, cho phép **hàng trăm node GPU đọc/ghi đồng thời** trên cùng một namespace mà không nghẽn. | Lưu trữ **tập dữ liệu huấn luyện khổng lồ dùng chung** cho toàn bộ cụm GPU Cluster và ghi **Checkpoints** của mô hình tỷ tham số trong vài giây. |\n| **3. Network File Systems (NFS)** | Chia sẻ tệp qua mạng truyền thống theo mô hình Client-Server đơn lẻ; dễ cài đặt nhưng băng thông hạn chế, dễ nghẽn nếu hàng trăm node cùng đọc dữ liệu nặng. | Lưu trữ **mã nguồn (source code/scripts), thư viện môi trường, file cấu hình (configs)**, tập dữ liệu nhỏ. |\n| **4. Object Storage (AWS S3, GCS, Azure Blob, Ceph, MinIO)** | Lưu trữ đối tượng phẳng theo cơ chế Bucket (giao tiếp qua HTTP/REST API); dung lượng mở rộng vô hạn (Exabytes), độ bền cao, chi phí cực rẻ nhưng độ trễ cao (mili-giây). | Lưu trữ **Cold/Warm Data**: Kho dữ liệu thô chưa xử lý (Raw Data Lake), bản sao lưu (Backups), lịch sử Checkpoint dài hạn, logs. |\n\n### 5.2. Kiến trúc lưu trữ phân tầng (Tiered Storage), Định dạng File \u0026 GPUDirect Storage (GDS)\n* **Hot Data (Dữ liệu nóng):** Dữ liệu đang trực tiếp tham gia vào vòng lặp huấn luyện $\\to$ Thường đặt trên **NVMe SSD** hoặc **Parallel File System**.\n* **Mẹo tối ưu I/O cho Developer AI:** Đọc hàng triệu file ảnh/text nhỏ lẻ (`small random I/O`) trên ổ cứng sẽ làm tụt hiệu năng nghiêm trọng vì overhead mở/đóng file (metadata operations). Thực tế sản xuất thường đóng gói hàng triệu mẫu nhỏ thành các tệp tuần tự kích thước lớn (**Large Sequential Shards**) như **Apache Parquet, WebDataset (`.tar`), TFRecord, hoặc `.safetensors`** (hỗ trợ memory-map `mmap` nạp thẳng vào bộ nhớ nhanh chóng).\n* **Công nghệ NVIDIA GPUDirect Storage (GDS):**\n  * *Không có GDS:* Để đọc 1 file từ ổ cứng NVMe hoặc Parallel FS vào GPU, CPU phải đọc file đó vào vùng đệm System RAM (**CPU Bounce Buffer**) rồi mới copy qua PCIe sang VRAM của GPU $\\to$ Tốn băng thông RAM, tốn CPU và tăng độ trễ.\n  * *Có GDS:* Mở một đường truyền **DMA (Direct Memory Access) thẳng từ ổ cứng NVMe / hệ thống lưu trữ mạng vào thẳng VRAM của GPU**, bỏ qua CPU Bounce Buffer, giảm tải cho CPU và cải thiện đáng kể thông lượng đọc/ghi dữ liệu (tùy thuộc vào phần cứng lưu trữ, cấu hình PCIe và kích thước I/O).\n* **Warm / Cold Data (Dữ liệu ấm / lạnh):** Dữ liệu lịch sử, checkpoint của các epoch cũ, raw data chưa làm sạch $\\to$ Đẩy về **Object Storage** để tối ưu hóa chi phí.\n\n---\n\n## 6. Phân tích Chiến lược Triển khai: Cloud (OpEx) vs. On-Premises (CapEx) vs. Hybrid\n\n| Tiêu chí so sánh | Cloud Infrastructure (AWS, Azure, GCP, OCI, CoreWeave) | On-Premise Infrastructure (DGX SuperPOD tại chỗ) | Hybrid / Multi-Cloud (Mô hình Lai) |\n| :--- | :--- | :--- | :--- |\n| **Mô hình chi phí (Cost Model)** | **OpEx (Operating Expense - Chi phí vận hành):** Trả tiền theo mức sử dụng (Pay-as-you-go theo giờ/phút), không tốn vốn mua máy ban đầu. | **CapEx (Capital Expense - Chi phí đầu tư vốn):** Đầu tư ban đầu lớn (mua server, bản quyền, xây phòng lạnh, trạm biến áp). | Kết hợp cả **CapEx** (cho tải nền ổn định) và **OpEx** (thuê thêm Cloud khi tải tăng đột biến - **Cloud Bursting**). |\n| **Khả năng mở rộng (Scalability)** | **Rất linh hoạt (Elastic):** Thuê thêm nhiều GPU nhanh chóng khi cần train, tắt đi ngay khi xong việc. | **Giới hạn theo phần cứng hiện có:** Phụ thuộc vào số lượng máy vật lý đã mua; muốn nâng cấp cần thời gian đặt hàng và lắp đặt. | Linh hoạt: Chạy inference hàng ngày tại chỗ, khi cần pre-train mô hình lớn hoặc vượt tải thì đẩy job lên Cloud. |\n| **Bảo mật \u0026 Chủ quyền dữ liệu (Data Sovereignty)** | Phụ thuộc vào mô hình trách nhiệm chung (Shared Responsibility Model) và cấu hình bảo mật trên Cloud (có thể kết hợp *Confidential Computing* để bảo vệ dữ liệu *in use*). | **Quyền kiểm soát trực tiếp cao:** Doanh nghiệp tự quản lý hạ tầng vật lý và mạng nội bộ (có thể thiết kế cách ly mạng / *air-gapped* nếu cần). Tuy nhiên, **đặt máy tại chỗ (on-premises) không tự động đồng nghĩa với air-gapped hay bảo mật tuyệt đối** nếu thiếu kiểm soát truy cập, phân vùng mạng, vá lỗi và giám sát an ninh. | Giữ dữ liệu nhạy cảm (PII, bệnh án, tài chính) ở On-Premise; xử lý dữ liệu công khai hoặc tải tính toán không nhạy cảm trên Cloud. |\n| **Bảo trì \u0026 Vận hành (Maintenance)** | Nhà cung cấp Cloud quản lý phần cứng vật lý, mạng cơ sở và duy trì SLA hạ tầng. | Doanh nghiệp cần đội ngũ kỹ sư Data Center để vận hành, cấp nguồn, làm mát và bảo trì phần cứng. | Đòi hỏi công cụ quản trị đồng nhất (như Kubernetes, NVIDIA Base Command, NIM) để điều phối cả hai môi trường. |\n| **Khi nào nên chọn?** | **Startup, R\u0026D ban đầu**, dự án ngắn hạn, tải công việc biến động mạnh (Spiky workloads) hoặc cần thử nghiệm nhanh. | **Doanh nghiệp lớn, Ngân hàng, Y tế, Cơ quan nhà nước** có yêu cầu tuân thủ nghiêm ngặt về nơi lưu trữ dữ liệu và tải công việc AI chạy liên tục 24/7 ổn định. | Doanh nghiệp vừa và lớn muốn cân bằng giữa kiểm soát dữ liệu cốt lõi và sự linh hoạt mở rộng. |\n\n---\n\n## 7. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm dễ nhầm lẫn cần lưu ý ở Module 1:**\n\u003e 1. **Phân biệt CPU vs. GPU \u0026 CUDA vs. Tensor Cores:**\n\u003e    * *Low Latency \u0026 Sequential Processing (Xử lý tuần tự, logic rẽ nhánh)* $\\to$ **CPU**.\n\u003e    * *High Throughput \u0026 Parallel Processing (Xử lý song song khối lượng lớn)* $\\to$ **GPU**.\n\u003e    * Nhân phần cứng chuyên dụng bên trong GPU NVIDIA để tăng tốc phép nhân ma trận Deep Learning/Transformer với độ chính xác hỗn hợp (`FP16`/`BF16`/`FP8`) $\\to$ **Tensor Cores**.\n\u003e 2. **Phân biệt GPUDirect RDMA vs. GPUDirect Storage (GDS) vs. NVLink:**\n\u003e    * Kết nối băng thông cao giữa các GPU **bên trong cùng 1 máy chủ (Intra-node)** $\\to$ **NVLink / NVSwitch**.\n\u003e    * Truyền dữ liệu trực tiếp giữa các GPU **ở các máy chủ khác nhau qua mạng (Inter-node)** giảm thiểu trung gian qua CPU $\\to$ **InfiniBand + GPUDirect RDMA**.\n\u003e    * Truyền dữ liệu trực tiếp từ **ổ cứng lưu trữ (NVMe / Parallel Storage) vào thẳng VRAM GPU** bỏ qua CPU Bounce Buffer $\\to$ **GPUDirect Storage (GDS)**.\n\u003e 3. **Phân biệt 3D Parallelism:**\n\u003e    * Copy nguyên mô hình lên mỗi GPU, chia nhỏ mini-batch dữ liệu $\\to$ **Data Parallelism**.\n\u003e    * Cắt ma trận trọng số của **cùng 1 tầng (intra-layer)** ra nhiều GPU qua NVLink $\\to$ **Tensor Parallelism**.\n\u003e    * Chia **các tầng nối tiếp nhau (inter-layer)** cho các GPU/Node khác nhau như dây chuyền $\\to$ **Pipeline Parallelism**.\n\u003e 4. **Phân biệt Storage Tiers:** Lưu *code, script, config* $\\to$ **NFS**. Lưu *dữ liệu đang huấn luyện cho cụm hàng trăm node đọc song song* $\\to$ **Parallel File System (Lustre/GPFS/WEKA)**. Lưu *dữ liệu thô khổng lồ dài hạn giá rẻ* $\\to$ **Object Storage (S3)**.\n\n### Câu hỏi luyện tập minh họa (Mini Quiz):\n1. **Câu 1:** Một công ty khởi nghiệp AI muốn huấn luyện thử nghiệm một mô hình ngôn ngữ trong 2 tuần nhưng không có vốn đầu tư mua sắm máy chủ ban đầu. Lựa chọn hạ tầng nào là phù hợp nhất?\n   * *Đáp án:* **Cloud Infrastructure (mô hình chi phí OpEx - Pay-as-you-go)** vì cho phép thuê GPU tức thì mà không cần vốn đầu tư ban đầu (CapEx) và giải phóng tài nguyên ngay sau khi hoàn tất thử nghiệm.\n2. **Câu 2:** Khi huấn luyện một mô hình LLM khổng lồ mà kích thước của một tầng đơn lẻ (single layer) vượt quá dung lượng VRAM của 1 GPU, kỹ sư phải chia nhỏ ma trận trọng số của chính tầng đó ra nhiều GPU trong cùng một node. Kỹ thuật này gọi là gì và thường ưu tiên kết nối phần cứng nào?\n   * *Đáp án:* **Tensor Parallelism (Song song hóa Tensor)**, thường đòi hỏi kết nối băng thông rất cao nội bộ node là **NVLink / NVSwitch**.\n3. **Câu 3:** Trong quá trình huấn luyện LLM trên cụm 64 máy chủ GPU, các GPU thường xuyên rơi vào trạng thái chờ rỗi (GPU Starvation) do CPU bị quá tải khi phải đọc dữ liệu từ hệ thống tệp song song vào System RAM rồi mới chép sang VRAM. Công nghệ nào của NVIDIA giải quyết trực tiếp nút thắt này?\n   * *Đáp án:* **NVIDIA GPUDirect Storage (GDS)** — tạo đường truyền DMA trực tiếp từ ổ cứng lưu trữ (NVMe/Parallel FS) vào thẳng VRAM của GPU mà bỏ qua CPU Bounce Buffer trên System RAM.\n4. **Câu 4:** Tại sao định dạng số học **`BF16` (Bfloat16)** thường được ưa chuộng hơn **`FP16`** khi huấn luyện trước (Pre-training) các mô hình ngôn ngữ lớn?\n   * *Đáp án:* Vì **`BF16` giữ nguyên 8-bit phần số mũ (Exponent) giống như `FP32`**, mang lại dải động (Dynamic Range) rộng hơn `FP16`, giúp giảm nguy cơ tràn số (Overflow/Underflow) của đạo hàm và thường giảm nhu cầu phải dùng Loss Scaling trong mixed-precision training (dù `BF16` có độ chính xác phần trị thấp hơn `FP16` và không loại bỏ hoàn toàn mọi khả năng overflow).\n5. **Câu 5:** Một ngân hàng có quy định pháp lý nghiêm ngặt yêu cầu dữ liệu giao dịch tài chính và hồ sơ khách hàng phải được lưu trữ và xử lý ngay trong trung tâm dữ liệu nội bộ của ngân hàng, đồng thời hệ thống AI phát hiện gian lận của họ phải chạy liên tục 24/7 quanh năm. Họ nên chọn mô hình hạ tầng nào?\n   * *Đáp án:* **On-Premise Infrastructure (Hạ tầng tại chỗ - CapEx)** kết hợp với các biện pháp kiểm soát truy cập, phân vùng mạng và bảo mật vật lý nghiêm ngặt để đáp ứng yêu cầu quản trị dữ liệu tại chỗ (Data Sovereignty) và tối ưu chi phí dài hạn cho tải công việc chạy liên tục 24/7.\n6. **Câu 6:** Trong trung tâm dữ liệu AI, lưu lượng mạng chủ yếu phát sinh từ việc hàng trăm máy chủ GPU liên tục đồng bộ hóa các vector đạo hàm (Gradients) với nhau thông qua thư viện NCCL. Loại lưu lượng mạng này được gọi là gì?\n   * *Đáp án:* **East-West Traffic (Lưu lượng Đông-Tây)** giữa các máy chủ bên trong trung tâm dữ liệu (đối lập với North-South Traffic từ người dùng bên ngoài gọi vào).\n"},{"id":"mod02","file":"Module_02_AIML_Fundamentals.md","badge":"MODULE 02","shortTitle":"AI/ML Fundamentals (Nền tảng ML)","domain":"Core ML \u0026 AI (30%)","weight":"Core AI","icon":"🧠","content":"# Module 2: AI/ML Fundamentals (Nền tảng Trí tuệ Nhân tạo \u0026 Học máy)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn tập NCA-GENL ở Module 2 (Thuộc Domain \"Core ML \u0026 AI Knowledge - 30%\"):**\n\u003e Phân biệt rõ mối quan hệ giữa **AI $\\supset$ Machine Learning (ML) $\\supset$ Deep Learning (DL)** và vị trí của **Generative AI**; nắm vững **3 phương pháp học máy cốt lõi (Supervised, Unsupervised, Reinforcement Learning)** cùng các thuật toán kinh điển (**PCA** để giảm chiều, **K-Means / DBSCAN** để phân cụm, **Linear/Logistic Regression, SVM, Decision Trees**, **Bagging vs. Boosting**); hiểu sự đánh đổi **Bias-Variance Tradeoff \u0026 Regularization (`L1` vs. `L2`)**; hiểu cách các tầng ẩn (**Hidden Layers**) tự động trích xuất đặc trưng từ thấp đến cao; nắm vững sự khác biệt giữa **Classical Programming vs. ML**, bộ ba khái niệm **Algorithm – Model – Inference**, và quy trình **7 bước huấn luyện mô hình** qua phép ẩn dụ Barista.\n\n---\n\n## 1. Bản chất của Trí tuệ Nhân tạo (Intelligence \u0026 AI)\n\n* **Trí tuệ tự nhiên (Intelligence):** Là khả năng tiếp thu thông tin, hiểu biết sâu sắc và đúc kết kinh nghiệm từ những gì đã trải qua để đưa ra hành động thích hợp trong môi trường sống. Hầu hết sinh vật sống đều sở hữu trí tuệ ở các cấp độ khác nhau (con người, cá heo, tinh tinh, voi...).\n* **Trí tuệ Nhân tạo (Artificial Intelligence - AI):** Là một nhánh rộng của Khoa học Máy tính nghiên cứu và xây dựng các hệ thống máy móc có khả năng thực hiện các nhiệm vụ vốn đòi hỏi trí tuệ của con người (nhận thức thị giác, hiểu ngôn ngữ, giải quyết vấn đề, ra quyết định).\n* **Ba năng lực cốt lõi của hệ thống AI (3 Core Capabilities):**\n  1. **Discover (Khám phá):** Tự tìm ra các quy luật ẩn (hidden patterns), mối tương quan, thông tin và tri thức mới từ kho dữ liệu thô khổng lồ.\n  2. **Infer (Suy luận/Phán đoán):** Đưa ra dự đoán hoặc phán đoán có cơ sở xác suất dựa trên dữ liệu mới hoặc dữ liệu chưa hoàn chỉnh.\n  3. **Reason (Lập luận):** Suy luận logic nhân quả, kết nối nhiều sự kiện và đưa ra quyết định đánh giá tối ưu để đạt mục tiêu.\n* **Phân loại AI theo phạm vi năng lực:**\n  * **ANI (Artificial Narrow Intelligence - AI Hẹp / Yếu):** AI chuyên biệt chỉ giải quyết xuất sắc một hoặc một nhóm nhiệm vụ cụ thể (ví dụ: nhận diện khuôn mặt FaceID, phân loại Spam, chơi cờ vua, dịch thuật). Toàn bộ các hệ thống AI hiện nay (kể cả LLM) về mặt kỹ thuật vẫn đang tiến hóa từ ANI lên đa nhiệm.\n  * **AGI (Artificial General Intelligence - AI Tổng quát / Mạnh):** Hệ thống AI giả định có khả năng tư duy, tự học và thích ứng với bất kỳ nhiệm vụ trí tuệ nào ngang bằng với con người.\n\n---\n\n## 2. Phân biệt chuẩn xác: AI vs. Machine Learning vs. Deep Learning\n\n### 2.1. Sơ đồ phân cấp mối quan hệ giữa AI, ML, DL và Generative AI\nAI bao gồm ML, và Deep Learning là một nhánh của ML. **Generative AI mô tả loại nhiệm vụ/hệ thống tạo dữ liệu mới**, trong đó các hệ thống hiện đại chủ yếu dựa trên Deep Learning (LLMs, diffusion models). Lưu ý không nên coi toàn bộ mô hình sinh đều là Deep Learning theo nghĩa toán học tuyệt đối: một số mô hình xác suất truyền thống (như Naive Bayes, Gaussian Mixture Models - GMM, Hidden Markov Models - HMM) cũng có tính sinh.\n\n```mermaid\nflowchart TD\n    subgraph AI[\"1. Artificial Intelligence (Trí tuệ Nhân tạo - Từ những năm 1950)\"]\n        direction TB\n        DescAI[\"Hệ thống máy tính mô phỏng trí tuệ \u0026 hành vi con người\u003cbr/\u003e(Bao gồm cả hệ chuyên gia Rule-based / Symbolic AI như Deep Blue lẫn Học máy)\"]\n        \n        subgraph ML[\"2. Machine Learning (Học máy - Bùng nổ từ những năm 1980-1990)\"]\n            direction TB\n            DescML[\"Nhánh con của AI: Máy tính HỌC QUY LUẬT THỐNG KÊ TỪ DỮ LIỆU\u003cbr/\u003emà không cần lập trình viên viết luật tường minh cho từng trường hợp\"]\n            TradGen[\"Mô hình sinh xác suất cổ điển (GMM, HMM, Naive Bayes)\u003cbr/\u003ecũng thuộc ML nhưng không dùng mạng nơ-ron sâu\"]\n            \n            subgraph DL[\"3. Deep Learning (Học sâu - Bùng nổ từ 2012 với AlexNet)\"]\n                direction TB\n                DescDL[\"Nhánh con của ML: Sử dụng Mạng Nơ-ron Nhân tạo nhiều lớp ẩn\u003cbr/\u003e(Multi-layered Artificial Neural Networks) học biểu diễn từ dữ liệu phi cấu trúc\"]\n                \n                subgraph GenAI[\"4. Modern Generative AI (AI Tạo sinh hiện đại - Trọng tâm NCA-GENL)\"]\n                    DescGen[\"Các hệ thống tạo dữ liệu mới dựa trên Deep Learning:\u003cbr/\u003eVăn bản (LLMs), Hình ảnh/Video (Diffusion), Âm thanh, Source Code\"]\n                end\n            end\n        end\n    end\n```\n\n### 2.2. Phép ẩn dụ Cờ vua (The Chess Analogy - Rất dễ nhớ!)\nHãy xem cách nhân loại dạy máy tính chơi cờ vua qua 3 thế hệ để thấy rõ sự tiến hóa từ Rule-based AI $\\to$ ML $\\to$ DL:\n\n| Cấp độ | Cách tiếp cận trong bài toán Cờ vua | Ví dụ thực tế | Bản chất kỹ thuật |\n| :--- | :--- | :--- | :--- |\n| **AI (Rule-based / Symbolic AI)** | Lập trình viên và các kiện tướng ngồi viết sẵn hàng nghìn quy tắc cứng (`if/else`) và bảng điểm vị trí từng quân cờ vào code. | **IBM Deep Blue (1997)** (Đánh bại Garry Kasparov) | Dựa hoàn toàn vào luật định sẵn (**Hardcoded rules / Heuristics**) và vét cạn cây tìm kiếm (Minimax + Alpha-Beta Pruning). Không tự học thêm được từ kinh nghiệm. |\n| **ML (Machine Learning)** | Không viết luật chiến thuật chi tiết nữa; nạp vào máy **hàng triệu biên bản ván cờ lịch sử** của các đại kiện tướng để máy tự thống kê xác suất thắng của từng thế cờ. | Các engine cờ học từ cơ sở dữ liệu ván đấu | Học quy luật thống kê từ dữ liệu lịch sử (**Historical Data**); tuy nhiên kỹ sư vẫn phải định nghĩa các đặc trưng (**Hand-crafted Features**) của bàn cờ. |\n| **DL (Deep Learning)** | Chỉ dạy máy luật đi quân cơ bản, sau đó cho mạng nơ-ron nhiều lớp **tự đấu với chính mình hàng triệu ván (Self-play)** từ con số 0, tự sáng tạo ra những nước cờ thần sầu mà con người chưa từng nghĩ tới. | **Google DeepMind AlphaZero (2017)** | Mạng nơ-ron sâu (**Deep Neural Network**) kết hợp học tăng cường, tự trích xuất đặc trưng chiến thuật ở cấp độ trừu tượng cao nhất mà không cần dữ liệu con người. |\n\n---\n\n### 2.3. Cấu trúc Deep Learning hoạt động như thế nào? (Automatic Feature Extraction)\nĐiểm làm nên chữ **\"Deep\" (Sâu)** trong Deep Learning chính là việc xếp chồng nhiều **Tầng ẩn (Hidden Layers)** giữa tầng đầu vào (Input Layer) và tầng đầu ra (Output Layer). Mỗi tầng ẩn sẽ tự động trích xuất các đặc trưng (**Hierarchical Feature Extraction**) từ mức độ chi tiết thô sơ lên mức độ trừu tượng hoàn chỉnh.\n\nVí dụ bài toán: Nhận diện chữ cái viết tay `\"B\"` hoặc khuôn mặt từ bức ảnh điểm ảnh (Pixels):\n\n```mermaid\nflowchart LR\n    Input[\"Input Layer\u003cbr/\u003e(Tầng đầu vào)\u003cbr/\u003eMa trận điểm ảnh thô (Pixels)\u003cbr/\u003ecủa bức ảnh chữ \u0027B\u0027\"]\n    \n    H1[\"Hidden Layer 1\u003cbr/\u003e(Low-level features)\u003cbr/\u003eNhận diện cạnh cơ bản:\u003cbr/\u003eđường thẳng, kẻ ngang, góc nghiêng, độ tương phản\"]\n    \n    H2[\"Hidden Layer 2\u003cbr/\u003e(Mid-level features)\u003cbr/\u003eKết hợp các cạnh thành hình học:\u003cbr/\u003eđường cong, nét móc, nửa vòng tròn, góc vuông\"]\n    \n    H3[\"Hidden Layer 3\u003cbr/\u003e(High-level features)\u003cbr/\u003eGhép nối các bộ phận thành:\u003cbr/\u003ecấu trúc chữ cái hoàn chỉnh / ngũ quan khuôn mặt\"]\n    \n    Output[\"Output Layer\u003cbr/\u003e(Tầng đầu ra - Softmax)\u003cbr/\u003ePhân phối xác suất:\u003cbr/\u003e\u0027B\u0027 = 98%, \u0027P\u0027 = 1.5%, \u0027R\u0027 = 0.5%\"]\n\n    Input --\u003e H1 --\u003e H2 --\u003e H3 --\u003e Output\n```\n\n\u003e [!TIP]\n\u003e **Sự khác biệt quan trọng giữa Traditional ML và Deep Learning:**\n\u003e * **Traditional ML (Học máy cổ điển - Scikit-learn):** Thường phụ thuộc nhiều vào bước **Manual Feature Engineering** (Kỹ sư cần thiết kế và trích xuất các đặc trưng đầu vào phù hợp trước khi đưa vào SVM/Random Forest/XGBoost). Rất hiệu quả trên **dữ liệu dạng bảng có cấu trúc (Structured / Tabular Data)**.\n\u003e * **Deep Learning (Học sâu - PyTorch/TensorFlow):** Thực hiện **Automatic Feature Extraction (End-to-End Representation Learning)** — có thể đưa ảnh thô, âm thanh hoặc văn bản vào mạng nơ-ron để các tầng **Hidden Layers** tự động học biểu diễn đặc trưng đa cấp độ. Rất mạnh trên **dữ liệu phi cấu trúc (Unstructured Data: Text, Image, Audio, Video)**.\n\n---\n\n## 3. Ba Nhánh Học Máy Cốt Lõi (Supervised, Unsupervised \u0026 Reinforcement Learning)\n\nTrong đề thi NCA-GENL (phần *Core Machine Learning - 30%*), bạn thường xuyên gặp câu hỏi phân loại bài toán thực tế và thuật toán vào đúng nhánh học máy:\n\n```mermaid\nflowchart TD\n    ML[\"Các Phương pháp Học máy (Machine Learning Paradigms)\"]\n    \n    subgraph Sup[\"1. Supervised Learning (Học có giám sát)\"]\n        S_Data[\"Dữ liệu CÓ GẮN NHÃN (Labeled Data: Tập cặp X -\u003e Y)\"]\n        S_Reg[\"• Regression (Hồi quy):\u003cbr/\u003eDự đoán SỐ THỰC LIÊN TỤC (Giá nhà, Nhiệt độ, Doanh thu, Giá cổ phiếu)\u003cbr/\u003eThuật toán: Linear Regression, Polynomial Regression, SVR, Ridge/Lasso\"]\n        S_Cls[\"• Classification (Phân loại):\u003cbr/\u003eDự đoán NHÃN RỜI RẠC / DANH MỤC (Spam/Not Spam, Gian lận, Bệnh/Không bệnh)\u003cbr/\u003eThuật toán: Logistic Regression, Decision Trees, Random Forest, XGBoost, SVM, Naive Bayes\"]\n        S_Data --\u003e S_Reg \u0026 S_Cls\n    end\n\n    subgraph Unsup[\"2. Unsupervised Learning (Học không giám sát)\"]\n        U_Data[\"Dữ liệu KHÔNG GẮN NHÃN (Unlabeled Data: Chỉ có đầu vào X)\u003cbr/\u003eMô hình tự khám phá cấu trúc, sự tương đồng \u0026 quy luật ẩn\"]\n        U_Clust[\"• Clustering (Phân cụm):\u003cbr/\u003eGom các điểm dữ liệu tương đồng vào các nhóm tự nhiên\u003cbr/\u003eThuật toán: K-Means, DBSCAN, Hierarchical Clustering, GMM\"]\n        U_Dim[\"• Dimensionality Reduction (Giảm chiều dữ liệu):\u003cbr/\u003eNén từ hàng nghìn cột đặc trưng xuống vài cột cốt lõi\u003cbr/\u003eThuật toán: PCA (Principal Component Analysis), t-SNE, UMAP, Autoencoders\"]\n        U_Anom[\"• Anomaly Detection \u0026 Association Rules:\u003cbr/\u003ePhát hiện điểm dị biệt (Isolation Forest) \u0026 Giỏ hàng (Apriori)\"]\n        U_Data --\u003e U_Clust \u0026 U_Dim \u0026 U_Anom\n    end\n\n    subgraph RL[\"3. Reinforcement Learning (Học tăng cường)\"]\n        R_Data[\"Tác tử (Agent) tương tác trực tiếp với Môi trường (Environment)\u003cbr/\u003eThực hiện Hành động (Action) ở Trạng thái (State) -\u003e Nhận Phần thưởng/Phạt (Reward/Penalty)\u003cbr/\u003eThuật toán: Q-Learning, DQN, PPO (Dùng trong RLHF cho LLM, Robot, Xe tự hành, AlphaZero)\"]\n    end\n\n    ML --\u003e Sup \u0026 Unsup \u0026 RL\n```\n\n### 3.1. Chi tiết các Thuật toán Học Có Giám Sát (Supervised Learning) cần nhớ:\n1. **Linear Regression (Hồi quy tuyến tính) $\\to$ Bài toán Regression:**\n   * Tìm một đường thẳng (hoặc siêu phẳng) $\\hat{y} = w_1 x_1 + w_2 x_2 + \\dots + b$ khớp nhất với các điểm dữ liệu để dự đoán một **con số liên tục** (ví dụ: dự đoán giá nhà từ diện tích và số phòng ngủ), tối ưu bằng cách cực tiểu hóa hàm mất mát **MSE (Mean Squared Error)**.\n2. **Logistic Regression (Hồi quy Logistic) $\\to$ Bài toán Classification (Cẩn thận bẫy tên gọi!):**\n   * **LƯU Ý TÊN GỌI:** Dù trong tên có chữ *\"Regression\"*, nhưng **Logistic Regression là thuật toán PHÂN LOẠI (Classification)** chứ không phải hồi quy dự đoán số thực liên tục! Nó đưa tổng tuyến tính qua hàm **Sigmoid** $\\sigma(z) = \\frac{1}{1+e^{-z}}$ để biến đổi đầu ra thành giá trị trong khoảng $(0, 1)$ biểu diễn xác suất thuộc về một lớp (ví dụ: xác suất khách hàng rời bỏ dịch vụ Churn = 85%).\n3. **Support Vector Machines (SVM - Máy Vector Hỗ trợ):**\n   * Tìm siêu phẳng phân cách (Decision Boundary) sao cho **khoảng cách lề (Margin)** giữa hai lớp dữ liệu là rộng nhất. Sử dụng **Kernel Trick (RBF, Polynomial)** để chiếu dữ liệu không phân tách tuyến tính lên không gian chiều cao hơn nhằm phân loại dễ dàng.\n4. **Decision Trees (Cây quyết định) \u0026 Học Kết hợp (Ensemble Learning: Bagging vs. Boosting):**\n   * Một cây quyết định đơn lẻ dễ hiểu nhưng rất dễ bị học vẹt (**Overfitting**). Để khắc phục, người ta kết hợp hàng trăm cây quyết định lại (**Ensemble Learning**) theo 2 chiến lược đối lập nhau:\n\n| Tiêu chí | Bagging (Bootstrap Aggregating) | Boosting (Tăng cường tuần tự) |\n| :--- | :--- | :--- |\n| **Thuật toán đại diện** | **`Random Forest` (Rừng ngẫu nhiên)** | **`XGBoost`, `LightGBM`, `CatBoost`, `AdaBoost`, `Gradient Boosting`** |\n| **Cách huấn luyện các cây** | Huấn luyện hàng trăm cây quyết định **SONG SONG và ĐỘC LẬP** trên các tập con dữ liệu lấy mẫu ngẫu nhiên có hoàn lại (Bootstrap samples). | Huấn luyện các cây quyết định **NỐI TIẾP TUẦN TỰ**, trong đó cây đứng sau tập trung đánh trọng số cao hơn để **sửa những lỗi sai mà cây đứng trước vừa đoán trật**! |\n| **Cách tổng hợp kết quả** | Bỏ phiếu đa số (**Majority Voting** cho phân loại) hoặc lấy trung bình cộng (cho hồi quy). | Cộng có trọng số (Weighted Sum) dự đoán của tất cả các cây theo tốc độ học (Learning rate). |\n| **Mục tiêu toán học** | **Giảm Phương sai (Reduce Variance) $\\to$ Chống Overfitting cực tốt!** | **Giảm Độ chệch (Reduce Bias) $\\to$ Đạt độ chính xác đỉnh cao trên dữ liệu dạng bảng!** |\n\n---\n\n### 3.2. Chi tiết các Thuật toán Học Không Giám Sát (Unsupervised Learning) đáng lưu ý:\n1. **PCA (Principal Component Analysis - Phân tích Thành phần Chính):**\n   * Thuộc nhánh **Unsupervised Learning (Giảm chiều dữ liệu - Dimensionality Reduction)**.\n   * *Bản chất toán học:* Khi bảng dữ liệu có quá nhiều cột đặc trưng (ví dụ $1.000$ features) gây ra **Lời nguyền chiều dữ liệu (Curse of Dimensionality)** làm chậm quá trình train và tốn bộ nhớ, **PCA** tính toán các Vector riêng (Eigenvectors) của ma trận hiệp phương sai để xoay và chiếu dữ liệu sang một hệ trục tọa độ mới gồm ít trục trực giao hơn (ví dụ 20 cột **Principal Components**: $PC_1, PC_2, \\dots, PC_{20}$).\n   * *Ưu điểm chính:* Giữ lại được **phần lớn phương sai (Maximum Explained Variance)** của dữ liệu gốc trên các trục chính, đồng thời giảm nhiễu và giảm hiện tượng đa cộng tuyến tuyến tính giữa các biến.\n2. **t-SNE \u0026 UMAP:**\n   * Các thuật toán giảm chiều **phi tuyến tính (Non-linear Dimensionality Reduction)** chuyên dùng để **trực quan hóa (Visualization)** các Vector Embedding 4096 chiều của LLM xuống biểu đồ 2D hoặc 3D để con người nhìn thấy các cụm từ vựng trên màn hình.\n3. **K-Means Clustering vs. DBSCAN (Phân cụm dữ liệu):**\n   * **K-Means:** Bạn phải chỉ định trước số lượng cụm $K$ (chọn $K$ tối ưu bằng phương pháp **Elbow Method** hoặc **Silhouette Score**). Thuật toán khởi tạo $K$ tâm cụm (**Centroids**), gán mỗi điểm dữ liệu vào tâm gần nhất theo khoảng cách Euclid, rồi cập nhật lại tọa độ tâm cho đến khi hội tụ. *Ứng dụng:* Phân khúc khách hàng (Customer Segmentation), nén màu ảnh.\n   * **DBSCAN (Density-Based Spatial Clustering):** Phân cụm dựa trên **mật độ điểm dữ liệu** mà **không cần biết trước số cụm $K$**, có khả năng tìm ra các cụm có hình thù uốn lượn bất kỳ và tự động phát hiện các điểm nhiễu ngoại lai (**Outliers / Noise**).\n\n---\n\n### 3.3. Sự đánh đổi Bias-Variance (Bias-Variance Tradeoff) \u0026 Regularization (`L1` vs. `L2`)\nĐể mô hình học máy hoạt động tốt trên dữ liệu thực tế (Generalization), kỹ sư phải cân bằng giữa hai nguồn sai số:\n* **Bias (Độ chệch):** Sai số do giả định của mô hình quá đơn giản (ví dụ dùng đường thẳng bậc 1 để khớp dữ liệu hình sin phức tạp). **High Bias $\\to$ Underfitting (Học chưa tới / Đều sai trên cả tập Train và Test)**.\n* **Variance (Phương sai):** Độ nhạy cảm thái quá của mô hình với những biến động nhỏ/nhiễu trong tập dữ liệu huấn luyện. **High Variance $\\to$ Overfitting (Học vẹt / Đúng 99.9% trên tập Train nhưng đoán sai bét trên tập Test)**.\n* **Kỹ thuật Điều chuẩn (Regularization - Cộng thêm thành phần phạt vào Loss Function để chống Overfitting):**\n  * **L1 Regularization (Lasso):** Cộng thêm tổng trị tuyệt đối trọng số $\\lambda \\sum |w_i|$ vào hàm Loss. Có tính chất đặc biệt là **ép các trọng số của những đặc trưng kém quan trọng về đúng bằng $0$** $\\to$ Giúp tạo mô hình thưa (**Sparse Model**) và tự động **chọn lọc đặc trưng (Feature Selection)**.\n  * **L2 Regularization (Ridge / Weight Decay trong Deep Learning):** Cộng thêm tổng bình phương trọng số $\\lambda \\sum w_i^2$ vào hàm Loss. Ép tất cả các trọng số phải nhỏ và phân bố đều, ngăn không cho một vài trọng số phình quá to chi phối mô hình (đây chính là chữ **W** trong thuật toán tối ưu **AdamW** dùng cho mọi LLM!).\n\n---\n\n## 4. Case Study: Lập trình truyền thống vs. Machine Learning\n\n### Bài toán kinh doanh:\nXây dựng hệ thống gợi ý sản phẩm (Recommendation System) hoặc phát hiện gian lận thẻ tín dụng cho sàn thương mại điện tử dựa trên lịch sử mua hàng và hồ sơ khách hàng.\n\n```mermaid\nflowchart TD\n    subgraph Classical[\"1. Lập trình Truyền thống (Classical Programming - Rule-based)\"]\n        direction LR\n        In1[\"Dữ liệu đầu vào (Input Data)\u003cbr/\u003e+ Quy tắc cứng (Rules if/else do Dev viết)\"] --\u003e Engine1[\"Chương trình\u003cbr/\u003e(Hardcoded Logic)\"] --\u003e Out1[\"Kết quả đầu ra\u003cbr/\u003e(Answers / Output)\"]\n    end\n\n    subgraph ML_Flow[\"2. Học máy (Machine Learning - Data-driven)\"]\n        direction LR\n        In2[\"Dữ liệu đầu vào (Input Data)\u003cbr/\u003e+ Kết quả lịch sử (Historical Answers / Labels)\"] --\u003e Engine2[\"Thuật toán Huấn luyện\u003cbr/\u003e(ML Training)\"] --\u003e Out2[\"Mô hình chứa Quy tắc ẩn\u003cbr/\u003e(Trained Model / Learned Rules)\"]\n    end\n```\n\n* **Tiếp cận Lập trình truyền thống (Classical Programming):** Lập trình viên phải tự ngồi viết tay hàng nghìn quy tắc điều kiện (`if/else`). Khi quy mô dữ liệu lớn và hành vi kẻ gian/người dùng thay đổi theo từng ngày, các luật này nhanh chóng xung đột nhau, không thể bao quát hết trường hợp biên và cực kỳ tốn kém để bảo trì.\n* **Tiếp cận Machine Learning:** Đưa lịch sử mua sắm, lượt click và giỏ hàng (`Input Data + Historical Answers`) vào thuật toán ML để máy **tự động rút trích ra Mô hình chứa các quy tắc ẩn (`Trained Model`)**, tự thích ứng với hành vi theo mùa và phản hồi suy luận trong vài mili-giây.\n\n---\n\n## 5. Ba khái niệm cốt lõi: Algorithm, Model và Inference\n\nRất nhiều Developer mới làm quen với AI thường gọi lẫn lộn giữa \"Thuật toán\" và \"Mô hình\". Trong kỳ thi NCA-GENL, 3 khái niệm này được phân định cực kỳ rõ ràng:\n\n```mermaid\nflowchart LR\n    Data[\"Tập dữ liệu huấn luyện\u003cbr/\u003e(Training Data)\"]\n    Algo[\"1. Algorithm (Thuật toán)\u003cbr/\u003eCông thức toán học tổng quát\u003cbr/\u003ef(x) = w₁x₁ + w₂x₂ + b\u003cbr/\u003e(Chưa có trọng số cụ thể)\"]\n    Model[\"2. Model (Mô hình)\u003cbr/\u003eSản phẩm (Artifact) sau khi học xong\u003cbr/\u003eLưu trữ bộ Trọng số (Weights)\u003cbr/\u003e\u0026 Độ lệch (Biases) đã tối ưu\"]\n    Unseen[\"Dữ liệu mới thực tế\u003cbr/\u003e(Unseen / Live Data)\"]\n    Pred[\"3. Inference (Suy luận)\u003cbr/\u003eQuá trình chạy Model trên dữ liệu mới\u003cbr/\u003eđể sinh ra Dự đoán (Prediction)\"]\n\n    Data \u0026 Algo ==\u003e|\"Quá trình Training\"| Model\n    Model \u0026 Unseen ==\u003e|\"Chạy trên Production\"| Pred\n```\n\n| Khái niệm | Bản chất kỹ thuật | Góc nhìn Developer (Tương đương trong Code) |\n| :--- | :--- | :--- |\n| **1. Algorithm (Thuật toán)** | Là quy trình toán học hoặc công thức logic tổng quát (ví dụ: *Linear Regression, Decision Trees, K-Means, Backpropagation*) dùng để tìm mối tương quan giữa các biến số: $$f(x) = w_1 x_1 + w_2 x_2 + \\dots + b$$ | Giống như **Source Code định nghĩa một Class trống** (chưa khởi tạo trạng thái, mới chỉ có cấu trúc hàm và công thức học). |\n| **2. Model (Mô hình)** | Là **kết quả (artifact)** thu được sau khi chạy Algorithm trên một tập dữ liệu huấn luyện cụ thể. Mô hình chính là cấu trúc mạng kèm tệp lưu trữ các **trọng số (weights $w$)** và **độ lệch (biases $b$)** đã được tối ưu hóa. | Giống như **Compiled Binary + Serialized State Object** (ví dụ file `.pt`, `.onnx`, `.safetensors`, `.pkl`) chứa sẵn tri thức đã học. |\n| **3. Inference (Suy luận)** | Là quá trình đưa **dữ liệu mới chưa từng thấy (unseen/live data)** vào Model đã huấn luyện xong để lấy kết quả dự đoán (chỉ chạy Forward Pass, không tính Backpropagation). *Training chỉ diễn ra định kỳ, nhưng Inference diễn ra hàng triệu lần mỗi ngày trên Production.* | Giống như việc nạp file model vào RAM/VRAM rồi gọi hàm **`model.predict(new_input)`** bên trong một REST API endpoint phục vụ user. |\n\n### Minh họa bằng Code Python (`scikit-learn`) cho Developer:\n```python\nfrom sklearn.ensemble import RandomForestClassifier\nimport joblib\n\n# 1. ALGORITHM: Khởi tạo thuật toán tổng quát (chưa học dữ liệu, chưa có trọng số)\nalgorithm = RandomForestClassifier(n_estimators=100, random_state=42)\n\n# 2. TRAINING -\u003e MODEL: Huấn luyện thuật toán trên dữ liệu (X_train, y_train) để tạo ra Model đã học\ntrained_model = algorithm.fit(X_train, y_train)\njoblib.dump(trained_model, \"fraud_detection_model.pkl\") # Lưu Artifact của Model ra ổ cứng\n\n# 3. INFERENCE: Nạp Model lên Production và dự đoán trên dữ liệu giao dịch mới (new_transaction)\nproduction_model = joblib.load(\"fraud_detection_model.pkl\")\nprediction = production_model.predict(new_transaction) # Quá trình Inference!\n```\n\n---\n\n## 6. Vòng đời Huấn luyện ML qua Phép ẩn dụ Đào tạo Barista (Barista Analogy)\n\nĐể nhớ trọn vẹn vòng lặp huấn luyện một mạng nơ-ron (Forward Pass $\\to$ Loss $\\to$ Backpropagation $\\to$ GPU Acceleration $\\to$ Epochs $\\to$ Inference), tài liệu chuẩn của NVIDIA sử dụng phép ẩn dụ **Đào tạo một nhân viên pha chế cà phê (Barista)**:\n\n```mermaid\nflowchart TD\n    S1[\"1. Initialize (Khởi tạo)\u003cbr/\u003e☕ Học việc mới vào quán, chưa biết pha, làm thử ngẫu nhiên\u003cbr/\u003e🤖 Khởi tạo trọng số ngẫu nhiên (Random Weights Initialization)\"]\n    S2[\"2. Guide (Hướng dẫn / Forward Pass)\u003cbr/\u003e☕ Đưa công thức mẫu \u0026 nguyên liệu đầu vào\u003cbr/\u003e🤖 Đưa dữ liệu đầu vào đi xuôi qua mạng (Forward Propagation)\"]\n    S3[\"3. Predict \u0026 Evaluate (Dự đoán \u0026 Đánh giá sai số)\u003cbr/\u003e☕ Pha thử 1 ly; Quản lý nếm thử \u0026 chấm điểm lệch vị bao nhiêu\u003cbr/\u003e🤖 Mô hình ra dự đoán; Loss Function đo khoảng cách sai số so với nhãn chuẩn\"]\n    S4[\"4. Adjust (Điều chỉnh / Backpropagation \u0026 Optimizer)\u003cbr/\u003e☕ Học việc rút kinh nghiệm: bớt đường, thêm sữa theo góp ý\u003cbr/\u003e🤖 Lan truyền ngược (Backpropagation) cập nhật lại Weights để giảm Loss\"]\n    S5[\"5. Accelerate (Tăng tốc phần cứng)\u003cbr/\u003e☕ Trang bị máy pha cà phê công nghiệp tự động công suất lớn\u003cbr/\u003e🤖 Dùng GPU / Tensor Cores tăng tốc tính toán ma trận song song\"]\n    S6[\"6. Master (Thành thạo qua nhiều Epochs)\u003cbr/\u003e☕ Luyện tập lặp đi lặp lại hàng nghìn ly qua nhiều ngày đến khi chuẩn vị\u003cbr/\u003e🤖 Lặp qua nhiều chu kỳ huấn luyện (Epochs) đạt độ chính xác hội tụ\"]\n    S7[\"7. Deploy (Triển khai thực tế / Inference)\u003cbr/\u003e☕ Chính thức đứng quầy pha chế phục vụ khách hàng thật mỗi ngày\u003cbr/\u003e🤖 Đóng gói mô hình đưa lên Production chạy Suy luận (Inference)\"]\n\n    S1 --\u003e S2 --\u003e S3 --\u003e S4\n    S4 -.-\u003e|\"Lặp lại liên tục (Nhờ bước 5 \u0026 6)\"| S2\n    S4 --\u003e S5 --\u003e S6 --\u003e S7\n```\n\n---\n\n## 7. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 2:**\n\u003e 1. **Bẫy PCA vs. K-Means:**\n\u003e    * Muốn **giảm số lượng cột đặc trưng (Dimensionality Reduction)** mà vẫn giữ lại phương sai/thông tin quan trọng nhất để tăng tốc độ train $\\to$ Chọn **PCA (Principal Component Analysis)**.\n\u003e    * Muốn **chia dữ liệu không gắn nhãn thành các nhóm tương đồng (Clustering)** $\\to$ Chọn **K-Means** hoặc **DBSCAN**.\n\u003e 2. **Bẫy Logistic Regression:** Dù tên có chữ \"Regression\", nhưng **Logistic Regression** dùng hàm Sigmoid để giải bài toán **Classification (Phân loại nhị phân)**, KHÔNG phải bài toán Hồi quy số liên tục!\n\u003e 3. **Bẫy Bagging vs. Boosting:** Huấn luyện nhiều cây quyết định **song song độc lập** để giảm phương sai (Variance) $\\to$ **Bagging (`Random Forest`)**. Huấn luyện các cây **nối tiếp tuần tự**, cây sau sửa lỗi cho cây trước để giảm độ chệch (Bias) $\\to$ **Boosting (`XGBoost` / `Gradient Boosting`)**.\n\u003e 4. **Bẫy Algorithm vs. Model vs. Inference:** Thành phần lưu trữ các trọng số (weights) và độ lệch (biases) đã được tối ưu sau khi huấn luyện $\\to$ **Model**. Quá trình áp dụng Model đó lên dữ liệu thực tế mới để lấy dự đoán $\\to$ **Inference**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Một nhà khoa học dữ liệu làm việc với tập dữ liệu gồm 500 biến đặc trưng (features) không gắn nhãn và muốn nén xuống còn 30 biến quan trọng nhất để trực quan hóa và giảm chi phí huấn luyện mà ít mất mát thông tin nhất. Thuật toán nào nên được sử dụng?\n   * *Đáp án:* **PCA (Principal Component Analysis)**.\n2. **Câu 2:** Trong mạng nơ-ron sâu (Deep Neural Network) nhận diện khuôn mặt, tầng ẩn đầu tiên (First Hidden Layer) thường đảm nhận vai trò gì, và điều này khác gì với Machine Learning cổ điển?\n   * *Đáp án:* Tầng ẩn đầu tiên tự động trích xuất các **đặc trưng cấp thấp (Low-level features)** như các cạnh, đường viền sáng tối, góc nghiêng cơ bản của bức ảnh. Điểm khác biệt là Deep Learning tự động hóa hoàn toàn việc trích xuất đặc trưng (**Automatic Feature Extraction**), trong khi ML cổ điển đòi hỏi con người phải tự thiết kế đặc trưng bằng tay (**Manual Feature Engineering**).\n3. **Câu 3:** Một kỹ sư muốn xây dựng mô hình dự đoán chính xác giá bán của một căn hộ (ví dụ: $\\$245,000$) dựa trên diện tích, số phòng ngủ và khoảng cách tới trung tâm. Đây là loại bài toán gì và thuộc nhánh học máy nào?\n   * *Đáp án:* Bài toán **Hồi quy (Regression)** thuộc nhánh **Học có giám sát (Supervised Learning)** vì đầu ra là một giá trị số liên tục và dữ liệu huấn luyện có sẵn nhãn giá bán lịch sử.\n4. **Câu 4:** Sự khác biệt cốt lõi trong cách huấn luyện các cây quyết định giữa thuật toán **Random Forest (Bagging)** và **XGBoost (Boosting)** là gì?\n   * *Đáp án:* **Random Forest (Bagging)** huấn luyện nhiều cây quyết định **song song và độc lập** trên các tập con dữ liệu ngẫu nhiên rồi lấy biểu quyết đa số (giúp giảm Variance/Overfitting); trong khi **XGBoost (Boosting)** huấn luyện các cây **tuần tự nối tiếp nhau**, trong đó mỗi cây mới tập trung sửa các lỗi dự đoán sai của các cây trước đó (giúp giảm Bias).\n5. **Câu 5:** Trong quá trình huấn luyện mô hình ngôn ngữ lớn ở giai đoạn căn chỉnh (Alignment - RLHF), mô hình sinh ra câu trả lời, nhận điểm số đánh giá (Reward) từ mô hình phần thưởng và tự điều chỉnh chính sách (Policy) để tối đa hóa tổng điểm thưởng. Cơ chế này thuộc nhánh học máy nào?\n   * *Đáp án:* **Reinforcement Learning (Học tăng cường)**.\n6. **Câu 6:** Nếu một mô hình học máy có sai số rất thấp trên tập dữ liệu huấn luyện (Training Set) nhưng lại có sai số rất cao khi chạy thử trên tập dữ liệu kiểm tra (Test Set), mô hình đó đang gặp hiện tượng gì và có đặc trưng Bias/Variance như thế nào?\n   * *Đáp án:* Hiện tượng **Overfitting (Quá khớp / Học vẹt)**, đặc trưng bởi **Low Bias (Độ chệch thấp)** nhưng **High Variance (Phương sai cao)**.\n"},{"id":"mod03","file":"Module_03_Generative_AI_and_LLM.md","badge":"MODULE 03","shortTitle":"Generative AI \u0026 Foundation Models","domain":"Core ML \u0026 AI (30%)","weight":"Core AI","icon":"✨","content":"# Module 3: Generative AI \u0026 Large Language Models (AI Tạo sinh \u0026 Mô hình Ngôn ngữ Lớn)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 3:**\n\u003e Nắm vững sự khác biệt toán học và bản chất giữa **Discriminative AI ($P(Y \\mid X)$) vs. Generative AI ($P(X)$ / $P(X, Y)$)**; so sánh **4 họ mô hình tạo sinh (GANs, VAEs, Diffusion, Autoregressive Transformers)**; **3 động lực bùng nổ (Tipping Point)**; khái niệm **Foundation Models (FM)** (huấn luyện bằng **Self-Supervised Learning** trên dữ liệu không nhãn), **Định luật Mở rộng (Chinchilla Scaling Laws)**, **Năng lực Trỗi dậy (Emergent Abilities)** và tính đa phương thức (**Multimodal**); quy trình **3 giai đoạn huấn luyện LLM hiện đại (Pre-training $\\to$ SFT $\\to$ RLHF / DPO / RLAIF)**; và con đường tiến hóa NLP từ **One-Hot / TF-IDF $\\to$ Word2Vec (CBOW \u0026 Skip-gram) / GloVe $\\to$ RNN/LSTM $\\to$ Transformer**.\n\n---\n\n## 1. Bản chất của Generative AI (AI Tạo sinh)\n\n### 1.1. Phân biệt Mô hình Phân biệt (Discriminative AI) vs. Mô hình Tạo sinh (Generative AI)\nTrong đề thi NCA-GENL, câu hỏi thường yêu cầu phân biệt sự khác nhau về bản chất toán học và đầu ra giữa mô hình ML/DL truyền thống (Discriminative) và Generative AI:\n\n* **Discriminative AI (Mô hình Phân biệt / Dự đoán):**\n  * *Bản chất toán học:* Học **ranh giới quyết định (Decision Boundary)** phân chia giữa các lớp dữ liệu sẵn có, tức là tính xác suất có điều kiện $P(Y \\mid X)$ (biết đặc trưng đầu vào $X$, dự đoán nhãn $Y$).\n  * *Ví dụ:* Nhìn bức ảnh đoán xem đó là `\"Chó\"` hay `\"Mèo\"` (CNN ResNet); đọc email đoán xem là `\"Spam\"` hay `\"Không Spam\"` (BERT / Logistic Regression); dự đoán giá cổ phiếu ngày mai. Mô hình này chỉ biết phân loại hoặc chấm điểm chứ **không thể tự vẽ ra một bức ảnh con mèo mới**.\n* **Generative AI (Mô hình Tạo sinh):**\n  * *Bản chất toán học:* Học **phân phối xác suất nội tại của toàn bộ tập dữ liệu** $P(X)$ (hoặc phân phối đồng thời $P(X, Y)$), từ đó có khả năng lấy mẫu (Sample) từ phân phối đã học để **sáng tạo ra dữ liệu hoàn toàn mới và nguyên bản (Synthetic / Original Content)** mang đầy đủ đặc trưng của dữ liệu thật nhưng chưa từng tồn tại trước đó.\n\n```mermaid\nflowchart TD\n    subgraph TradML[\"1. Traditional ML (Discriminative - Học máy cổ điển)\"]\n        direction LR\n        I1[\"Đầu vào Đơn giản\u003cbr/\u003e(Dữ liệu dạng bảng: Tuổi, Thu nhập)\"] --\u003e M1[\"Mô hình ML\u003cbr/\u003e(XGBoost / Logistic / SVM)\"] --\u003e O1[\"Đầu ra Đơn giản\u003cbr/\u003e(Nhãn: Duyệt vay / Từ chối)\"]\n    end\n\n    subgraph TradDL[\"2. Traditional Deep Learning (Discriminative DL)\"]\n        direction LR\n        I2[\"Đầu vào Phức tạp\u003cbr/\u003e(Bức ảnh triệu điểm ảnh / File Audio)\"] --\u003e M2[\"Mô hình DL\u003cbr/\u003e(CNN - ResNet / YOLO)\"] --\u003e O2[\"Đầu ra Đơn giản\u003cbr/\u003e(Nhãn: \u0027Con mèo\u0027 - 99%)\"]\n    end\n\n    subgraph GenAI_Flow[\"3. Generative AI (AI Tạo sinh)\"]\n        direction LR\n        I3[\"Đầu vào Phức tạp\u003cbr/\u003e(Prompt văn bản, hình ảnh, âm thanh)\"] --\u003e M3[\"Mô hình GenAI\u003cbr/\u003e(Transformer / Diffusion)\"] --\u003e O3[\"Đầu ra Phức tạp \u0026 Nguyên bản\u003cbr/\u003e(Bài luận văn, Source Code, Tranh nghệ thuật 4K, Video)\"]\n    end\n```\n\n### 1.2. So sánh 4 Họ Kiến trúc Mô hình Tạo sinh Cốt lõi (Generative Model Families)\nTrước và song song với Transformer, giới nghiên cứu đã phát triển nhiều kiến trúc Generative AI khác nhau mà đề thi thường nhắc tới:\n\n| Họ Mô hình Tạo sinh | Cơ chế Hoạt động Cốt lõi | Ưu điểm \u0026 Nhược điểm | Ứng dụng Tiêu biểu |\n| :--- | :--- | :--- | :--- |\n| **1. GANs (Generative Adversarial Networks - 2014)** | Gồm 2 mạng đấu kháng nhau như trò chơi mèo vờn chuột:\u003cbr/\u003e• **Generator (Kẻ làm tiền giả):** Cố sinh ra ảnh giả giống thật nhất.\u003cbr/\u003e• **Discriminator (Cảnh sát):** Cố phân biệt ảnh thật hay ảnh giả. | • *Ưu:* Sinh ảnh rất nhanh và sắc nét.\u003cbr/\u003e• *Nhược:* Rất khó huấn luyện ổn định, dễ bị sụp đổ chế độ (**Mode Collapse** - chỉ sinh đi sinh lại một vài mẫu giống nhau). | Tạo khuôn mặt người ảo (StyleGAN), nâng cấp độ phân giải ảnh (Super-Resolution), Deepfake thế hệ đầu. |\n| **2. VAEs (Variational Autoencoders)** | Gồm **Encoder** nén dữ liệu vào một **Không gian tiềm ẩn (Latent Space)** tuân theo phân phối chuẩn Gaussian, và **Decoder** tái tạo lại dữ liệu từ vector tiềm ẩn đó. | • *Ưu:* Huấn luyện rất ổn định, không gian Latent liên tục và dễ nội suy.\u003cbr/\u003e• *Nhược:* Ảnh sinh ra trực tiếp thường hơi mờ (blurry). | Nén ảnh vào không gian Latent (thành phần cốt lõi bên trong **Stable Diffusion**), phát hiện bất thường. |\n| **3. Diffusion Models (Mô hình Khuếch tán)** | Học cách đảo ngược quá trình thêm nhiễu: bắt đầu từ màn hình nhiễu Gaussian trắng xóa và **khử nhiễu từng bước (Iterative Denoising)** theo hướng dẫn của Prompt. | • *Ưu:* Chất lượng hình ảnh/video nghệ thuật cực cao, đa dạng, không bị Mode Collapse.\u003cbr/\u003e• *Nhược:* Tốc độ suy luận chậm hơn do phải lặp nhiều bước khử nhiễu. | **Stable Diffusion, Midjourney, DALL-E 3, OpenAI Sora, NVIDIA Edify / Picasso**. |\n| **4. Autoregressive Transformers (Tự hồi quy)** | Mô hình hóa xác suất chuỗi bằng cách dự đoán phần tử (token) tiếp theo dựa trên toàn bộ các token đã sinh ra trước đó: $$P(w_1, \\dots, w_T) = \\prod_{t=1}^T P(w_t \\mid w_{\u003ct})$$ | • *Ưu:* Huấn luyện song song cực tốt trên GPU, mở rộng quy mô lên hàng nghìn tỷ tham số, suy luận logic xuất sắc.\u003cbr/\u003e• *Nhược:* Sinh token tuần tự lúc Inference, chi phí Attention bậc hai $O(N^2)$ theo chiều dài chuỗi. | **GPT-4, LLaMA-3, Claude 3.5, Mistral, NVIDIA Nemotron**. |\n\n---\n\n### 1.3. Tốc độ chấp nhận kỷ lục \u0026 Ba động lực bùng nổ (3 Pillars of the Tipping Point)\n* **Kỷ lục lịch sử:** ChatGPT chỉ mất đúng **2 tháng** để cán mốc **100 triệu người dùng**, bỏ xa TikTok (9 tháng), Instagram (2.5 năm) và Netflix (10 năm).\n* **Ba động lực cốt lõi hội tụ tạo nên điểm bùng phát (Tipping Point):**\n  1. **Massive Amounts of Data:** Lượng dữ liệu số hóa khổng lồ tích lũy từ Internet suốt nhiều thập kỷ (văn bản Common Crawl, Wikipedia, sách báo, hình ảnh, video, mã nguồn mở GitHub).\n  2. **Cloud Computing \u0026 Hyperscale Data Centers:** Năng lực điện toán đám mây quy mô lớn giúp việc kết nối hàng chục nghìn GPU thành một siêu máy tính huấn luyện trở nên khả thi.\n  3. **AI Accelerators \u0026 Transformer Architecture:** Đột phá kép về phần cứng chip tăng tốc AI (GPU NVIDIA với Tensor Cores, NVLink) và kiến trúc thuật toán **Transformer (2017)** (loại bỏ nút thắt tuần tự của RNN trong quá trình huấn luyện, cho phép song song hóa hiệu quả trên các vị trí token).\n\n---\n\n## 2. Mô hình Nền tảng (Foundation Models - FM) \u0026 Định luật Mở rộng (Scaling Laws)\n\nKhái niệm **Foundation Model** được định nghĩa và phổ biến bởi Viện HAI thuộc Đại học Stanford (2021):\n\n* **Định nghĩa chuẩn:** Là mô hình học sâu quy mô cực lớn (hàng tỷ đến hàng nghìn tỷ tham số) được **huấn luyện trước (Pre-trained)** trên tập dữ liệu khổng lồ, đa dạng và **không gắn nhãn (Massive Unlabeled Data)** thông qua phương pháp **Học tự giám sát (Self-Supervised Learning - SSL)**.\n  * *Làm rõ cơ chế Self-Supervised Learning cho Developer:* Tại sao dữ liệu không có nhãn do con người gán mà mô hình vẫn tính được hàm Loss để học? Vì thuật toán **tự động rút trích nhãn giám sát từ chính cấu trúc của dữ liệu thô**!\n    * *Trong Ngôn ngữ (Autoregressive / Masked):* Lấy câu văn *\"Trời hôm nay rất đẹp\"* trên Internet, che chữ *\"đẹp\"* đi (`\"Trời hôm nay rất ___\"`), bắt mô hình đoán chữ tiếp theo rồi đối chiếu trực tiếp với chữ *\"đẹp\"* có sẵn trong văn bản gốc để tính Cross-Entropy Loss.\n    * *Trong Thị giác (Contrastive / Masked Autoencoders):* Che 75% các ô vuông (patches) của một bức ảnh và bắt mô hình vẽ lại phần bị che.\n    * Nhờ **Self-Supervised Learning**, nhân loại đã phá bỏ được rào cản tốn kém nhất của Supervised Learning truyền thống (thuê con người ngồi gắn nhãn từng mẫu), cho phép nạp hàng chục nghìn tỷ từ vựng trên toàn bộ Internet vào huấn luyện!\n* **Tính đa năng (Versatility / Homogenization - One Model, Many Tasks):** Khác với mô hình ML truyền thống (Narrow AI - mỗi tác vụ phải huấn luyện 1 mô hình riêng từ đầu), một Foundation Model đóng vai trò như \"nền móng chung\", có thể thích ứng (**Adapt / Prompt / Fine-tune**) cho hàng trăm tác vụ hạ nguồn (**Downstream Tasks**) khác nhau.\n\n```mermaid\nflowchart TD\n    Data[\"Kho dữ liệu khổng lồ không gắn nhãn\u003cbr/\u003e(Massive Unlabeled Data: Text, Images, Code, Audio, Video, Biology)\"]\n    \n    FM[\"FOUNDATION MODEL (Mô hình Nền tảng)\u003cbr/\u003ePre-trained bằng Self-Supervised Learning trên hàng nghìn GPU\"]\n    \n    T1[\"Tóm tắt văn bản\u003cbr/\u003e(Summarization)\"]\n    T2[\"Dịch thuật đa ngôn ngữ\u003cbr/\u003e(Translation)\"]\n    T3[\"Hỏi đáp \u0026 Chatbot\u003cbr/\u003e(Q\u0026A / Assistant)\"]\n    T4[\"Sinh \u0026 Debug mã nguồn\u003cbr/\u003e(Code Generation)\"]\n    T5[\"Phân tích dữ liệu khoa học\u003cbr/\u003e(Protein / Weather / Medical Imaging)\"]\n\n    Data ==\u003e|\"Pre-training (Tốn triệu USD)\"| FM\n    FM --\u003e|Adaptation / Fine-tuning / Prompting| T1 \u0026 T2 \u0026 T3 \u0026 T4 \u0026 T5\n```\n\n### 2.1. Định luật Mở rộng (Scaling Laws) \u0026 Năng lực Trỗi dậy (Emergent Abilities)\n1. **Định luật Mở rộng (Neural Scaling Laws - Kaplan et al. \u0026 Chinchilla Scaling Laws - Hoffmann et al.):**\n   * Phát hiện thực nghiệm quan trọng: Sai số (Cross-Entropy Loss) của mô hình ngôn ngữ giảm đều đặn theo hàm mũ (Power-law) khi ta tăng đồng thời **3 yếu tố**:\n     1. **Kích thước mô hình ($N$ - Số lượng tham số Parameters)**.\n     2. **Kích thước tập dữ liệu huấn luyện ($D$ - Số lượng Tokens)**.\n     3. **Ngân sách tính toán ($C$ - Compute FLOPs)**.\n   * **Định luật Chinchilla (Compute-Optimal Scaling):** Chỉ ra rằng thay vì chỉ chạy đua làm mô hình thật to mà học ít dữ liệu, để tối ưu hóa hiệu năng trên mỗi đồng chi phí GPU, khi tăng gấp đôi số lượng tham số mô hình ($N$), ta cũng phải tăng gấp đôi lượng dữ liệu huấn luyện ($D$), với tỷ lệ vàng xấp xỉ **$D \\approx 20 \\times N$** (ví dụ mô hình 70B tham số cần tối thiểu $\\sim 1.4\\text{ nghìn tỷ tokens}$, và ngày nay như LLaMA-3 8B/70B được train tới **15 nghìn tỷ tokens** để tối ưu hóa suy luận!).\n2. **Năng lực Trỗi dậy (Emergent Abilities):**\n   * Là những kỹ năng phức tạp **không hề xuất hiện ở các mô hình nhỏ** (ví dụ dưới 1B tham số), nhưng đột nhiên xuất hiện mạnh mẽ khi quy mô mô hình vượt qua một ngưỡng tới hạn (ví dụ $10\\text{B} - 100\\text{B}$ tham số):\n     * **In-Context Learning (Few-shot learning):** Học cách làm một nhiệm vụ mới toanh chỉ qua vài ví dụ ngay trong Prompt mà không cần cập nhật trọng số.\n     * **Multi-step Arithmetic \u0026 Chain-of-Thought Reasoning:** Giải toán đố nhiều bước, lập luận logic nhân quả, viết code phức tạp.\n\n### 2.2. Đa phương thức (Multimodal Foundation Models)\nMột Foundation Model hiện đại không chỉ giới hạn ở chữ viết mà có thể xử lý, căn chỉnh không gian biểu diễn (Shared Embedding Space) và chuyển đổi qua lại nhiều định dạng dữ liệu (**Modalities**) cùng lúc:\n* **Text** (Văn bản, Code) $\\leftrightarrow$ **Vision** (Hình ảnh, Video - *VLMs như GPT-4o, LLaVA, NVIDIA VILA*) $\\leftrightarrow$ **Audio** (Giọng nói, Âm nhạc) $\\leftrightarrow$ **3D / Robotics / Physical AI** (**NVIDIA Cosmos**) $\\leftrightarrow$ **Scientific Data** (Cấu trúc Protein/DNA với **NVIDIA BioNeMo**, dự báo khí hậu toàn cầu với **NVIDIA Earth-2 / FourCastNet**).\n\n---\n\n## 3. Mô hình Ngôn ngữ Lớn (LLM) \u0026 Quy trình Huấn luyện 3 Giai đoạn\n\n* **Định nghĩa:** **LLM (Large Language Model)** là một loại **Foundation Model chuyên sâu về ngôn ngữ**, được thiết kế để hiểu, xử lý và sinh ra văn bản tự nhiên (hoặc mã nguồn) bằng cách học phân phối xác suất của ngôn ngữ trên hàng nghìn tỷ token.\n* **Công thức tạo nên một LLM xuất sắc:**\n  $$\\text{LLM Xuất Sắc} = \\text{Dữ liệu Sạch \\\u0026 Đa Dạng} + \\text{Kiến trúc Co giãn (Transformer)} + \\text{Quy trình Huấn luyện \\\u0026 Căn chỉnh Đa tầng}$$\n\n### Làm rõ Quy trình Huấn luyện 3 Giai đoạn của LLM hiện đại (Pre-training $\\to$ SFT $\\to$ Alignment):\nĐây là phần kiến thức rất quan trọng trong đề thi NCA-GENL để hiểu sự khác biệt giữa **Base Model**, **Instruct Model** và **Aligned Chat Model**:\n\n```mermaid\nflowchart LR\n    S1[\"Giai đoạn 1: Pre-training\u003cbr/\u003e(Huấn luyện trước Tự giám sát)\u003cbr/\u003e📚 Đọc hàng nghìn tỷ token không nhãn\u003cbr/\u003e🎯 Mục tiêu: Next-token Prediction (CLM)\u003cbr/\u003e💰 Chi phí: 95-99% tổng ngân sách GPU\u003cbr/\u003e👉 Tạo ra: BASE MODEL\u003cbr/\u003e(Có tri thức rộng nhưng chỉ biết viết nối tiếp câu,\u003cbr/\u003echưa biết trả lời câu hỏi hay vâng lời)\"]\n    \n    S2[\"Giai đoạn 2: SFT\u003cbr/\u003e(Supervised Fine-Tuning / Instruction Tuning)\u003cbr/\u003e👩‍🏫 Học trên 10K - 1M cặp dữ liệu chất lượng cao:\u003cbr/\u003e(Instruction Prompt -\u003e Ideal Response)\u003cbr/\u003e💰 Chi phí: Thấp hơn nhiều (Vài ngày)\u003cbr/\u003e👉 Tạo ra: INSTRUCT MODEL\u003cbr/\u003e(Biết đóng vai trợ lý và làm theo hướng dẫn)\"]\n    \n    S3[\"Giai đoạn 3: Alignment (RLHF / DPO)\u003cbr/\u003e(Căn chỉnh theo Giá trị \u0026 Sở thích Con người)\u003cbr/\u003e⚖️ Học từ dữ liệu so sánh cặp (Chosen vs Rejected)\u003cbr/\u003etheo 3 tiêu chí: Helpful, Honest, Harmless (3H)\u003cbr/\u003e👉 Tạo ra: ALIGNED CHAT MODEL\u003cbr/\u003e(An toàn, lịch sự, từ chối yêu cầu độc hại)\"]\n\n    S1 ==\u003e S2 ==\u003e S3\n```\n\n* **Ví dụ thực tế phân biệt hành vi của Base Model vs. Instruct/Chat Model:**\n  * Nếu bạn đưa Prompt: *\"Thủ đô của nước Pháp là gì?\"*\n  * **Base Model (chỉ mới qua Giai đoạn 1):** Vì nó chỉ học hoàn thành văn bản giống trên mạng, nó có thể viết tiếp: *\"Thủ đô của nước Đức là gì? Thủ đô của nước Ý là gì? (Trích đề thi Địa lý lớp 7)...\"*!\n  * **Instruct / Aligned Model (đã qua Giai đoạn 2 \u0026 3):** Hiểu đây là một câu hỏi chỉ thị và trả lời ngay: *\"Thủ đô của nước Pháp là Paris.\"*\n\n### Phân biệt chuyên sâu ở Giai đoạn 3: RLHF (PPO) vs. DPO vs. RLAIF\nTrong đề thi NCA-GENL, bạn cần nắm rõ cách thức các kỹ sư căn chỉnh (Align) mô hình:\n\n| Phương pháp Căn chỉnh | Quy trình Kỹ thuật | Ưu điểm \u0026 Đặc điểm Nhận diện trong Đề thi |\n| :--- | :--- | :--- |\n| **1. RLHF (Reinforcement Learning from Human Feedback)** | Quy trình 2 pha phức tạp:\u003cbr/\u003e• **Pha A:** Cho LLM sinh nhiều câu trả lời cho cùng 1 prompt; con người xếp hạng ($A \u003e B \u003e C$) để huấn luyện một **Mô hình Phần thưởng riêng biệt (Reward Model - RM)**.\u003cbr/\u003e• **Pha B:** Dùng thuật toán học tăng cường **PPO (Proximal Policy Optimization)** để tối ưu LLM sao cho đạt điểm thưởng cao nhất từ RM (kèm hàm phạt **KL-Divergence** để LLM không bị biến dạng quá xa so với bản SFT). | Hiệu quả cao, tạo nên thành công của ChatGPT/GPT-4, nhưng **tốn rất nhiều VRAM** (phải nạp cùng lúc 4 mô hình vào bộ nhớ: Actor, Critic, Reference, Reward Model) và quá trình RL dễ mất ổn định. |\n| **2. DPO (Direct Preference Optimization)** | **Bỏ qua hoàn toàn việc huấn luyện Reward Model và không cần vòng lặp Reinforcement Learning (PPO)!** Dùng biến đổi toán học để tối ưu trực tiếp trọng số của LLM bằng hàm mất mát phân loại (Binary Cross-Entropy Loss) ngay trên tập dữ liệu cặp **(Câu trả lời được chọn `Chosen` vs. Câu trả lời bị loại `Rejected`)**. | **Đơn giản, cực kỳ ổn định, nhẹ VRAM và huấn luyện nhanh hơn RLHF rất nhiều!** Được dùng phổ biến để căn chỉnh LLaMA-3, Mistral, Zephyr. |\n| **3. RLAIF (RL from AI Feedback)** | Thay vì thuê con người chấm điểm từng cặp câu trả lời tốn kém, sử dụng một **LLM khổng lồ thông minh hơn (như GPT-4 hoặc Nemotron-4 340B Reward)** làm giám khảo chấm điểm phản hồi tự động. | Mở rộng quy mô căn chỉnh lên hàng triệu mẫu với chi phí thấp và tốc độ nhanh. |\n\n---\n\n## 4. Con đường tiến hóa kỹ thuật NLP: Từ One-Hot / TF-IDF $\\to$ Word Embedding $\\to$ RNN $\\to$ Transformer\n\nĐể hiểu tại sao kiến trúc Transformer lại vĩ đại, đề thi yêu cầu bạn nắm rõ từng bậc thang tiến hóa của cách máy tính biểu diễn ngôn ngữ:\n\n### 4.1. Bậc 0: Biểu diễn Rời rạc Cổ điển (One-Hot Encoding, Bag-of-Words \u0026 TF-IDF)\nTrước khi có mạng nơ-ron nhúng từ, máy tính biến chữ thành số như thế nào?\n1. **One-Hot Encoding:** Nếu từ điển có $50.000$ từ, mỗi từ là một vector dài $50.000$ phần tử toàn số `0`, chỉ có duy nhất một số `1` tại vị trí index của từ đó.\n   * *2 Nhược điểm chí mạng:* Vector quá dài và thưa (**Sparse \u0026 High-dimensional**); tích vô hướng giữa mọi cặp từ khác nhau đều bằng `0` ($\\overrightarrow{\\text{Chó}} \\cdot \\overrightarrow{\\text{Mèo}} = 0$ và $\\overrightarrow{\\text{Chó}} \\cdot \\overrightarrow{\\text{Tủ lạnh}} = 0$) $\\to$ **Hoàn toàn không biết hai từ nào có nghĩa gần nhau!**\n2. **Bag-of-Words (BoW) \u0026 TF-IDF (Term Frequency – Inverse Document Frequency):**\n   * Đếm tần suất xuất hiện của từ trong văn bản (**TF**), nhân với độ hiếm của từ đó trên toàn bộ kho tài liệu (**IDF** = phạt nặng những từ dừng xuất hiện ở mọi nơi như *\"the\", \"is\", \"của\", \"và\"*, tôn vinh những từ khóa đặc trưng hiếm gặp).\n   * *Hạn chế:* Làm mất hoàn toàn thứ tự từ trong câu và không hiểu được từ đồng nghĩa.\n\n---\n\n### 4.2. Bậc 1: Static Word Embeddings (Nhúng từ tĩnh) \u0026 Hai kiến trúc của Word2Vec (2013)\n* **Word Embedding là gì?** Là kỹ thuật ánh xạ mỗi từ vựng thành một **Vector số thực dày đặc có số chiều cố định nhỏ gọn** (**Dense Vector**, thường từ `100` đến `4096` chiều, ví dụ `[0.12, -0.85, 0.44, ...]`).\n* **Bảo toàn ngữ nghĩa (Semantic Preservation - Distributional Hypothesis):** *\"Bạn sẽ biết ý nghĩa của một từ thông qua những từ hay đi kèm với nó\"*. Các từ có ý nghĩa tương tự hoặc xuất hiện trong ngữ cảnh giống nhau sẽ tự động tụ lại gần nhau trong không gian vector (khoảng cách Cosine giữa `\"Chó\"` và `\"Mèo\"` rất gần nhau, cách xa `\"Máy bay\"`).\n* **Tính chất đại số tuyến tính trên ngữ nghĩa (Vector Arithmetic):**\n  $$\\overrightarrow{\\text{King}} - \\overrightarrow{\\text{Man}} + \\overrightarrow{\\text{Woman}} \\approx \\overrightarrow{\\text{Queen}}$$\n  $$\\overrightarrow{\\text{Paris}} - \\overrightarrow{\\text{France}} + \\overrightarrow{\\text{Germany}} \\approx \\overrightarrow{\\text{Berlin}}$$\n* **Thuật toán Word2Vec (Mikolov et al. - Google, 2013):** Sử dụng mạng nơ-ron nông 2 lớp học tự giám sát qua 2 kiến trúc đối ngược nhau (Cần phân biệt rõ trong đề thi!):\n  1. **CBOW (Continuous Bag of Words):** Lấy **các từ ngữ cảnh xung quanh (Surrounding Context Words)** làm đầu vào để dự đoán **1 từ bị khuyết ở chính giữa (Target Center Word)**. (Ví dụ: Đầu vào `[\"Con\", \"ngồi\", \"trên\", \"thảm\"]` $\\to$ Đoán từ giữa `\"mèo\"`). *Đặc điểm:* Huấn luyện nhanh hơn, biểu diễn rất tốt các từ phổ biến.\n  2. **Skip-gram:** Lấy **1 từ đích ở chính giữa (Center Word)** làm đầu vào để dự đoán **các từ ngữ cảnh xung quanh nó** trong một cửa sổ trượt. (Ví dụ: Đầu vào `\"mèo\"` $\\to$ Đoán `\"Con\"`, `\"ngồi\"`, `\"trên\"`, `\"thảm\"`). *Đặc điểm:* Huấn luyện chậm hơn một chút nhưng biểu diễn các **từ hiếm (Rare words)** chính xác hơn nhiều so với CBOW!\n* *(Bên cạnh Word2Vec còn có **GloVe** dựa trên ma trận đồng xuất hiện toàn cục và **FastText** tách từ thành các mảnh ký tự n-gram để xử lý từ viết sai chính tả).*\n\n```mermaid\nflowchart LR\n    subgraph Space[\"Không gian Vector Ngữ nghĩa (Semantic Vector Space)\"]\n        direction TB\n        K[\"Vector \u0027King\u0027\u003cbr/\u003e[0.9, 0.8, 0.1]\"]\n        M[\"Vector \u0027Man\u0027\u003cbr/\u003e[0.2, 0.8, 0.1]\"]\n        W[\"Vector \u0027Woman\u0027\u003cbr/\u003e[0.2, 0.1, 0.1]\"]\n        Q[\"Vector \u0027Queen\u0027\u003cbr/\u003e[0.9, 0.1, 0.1]\"]\n        \n        M -.-\u003e|\"Quan hệ Hoàng gia (+0.7 chiều đầu)\"| K\n        W -.-\u003e|\"Quan hệ Hoàng gia (+0.7 chiều đầu)\"| Q\n        K ==\u003e|\"King - Man + Woman\"| Q\n    end\n```\n\n---\n\n### 4.3. Bậc 2: Hạn chế của Embedding tĩnh \u0026 Sự ra đời của Mạng hồi quy (RNN / LSTM / GRU)\n1. **Hạn chế của Static Word Embedding (Word2Vec/GloVe) – Bài toán Từ đa nghĩa (Polysemy):**\n   * Trong Word2Vec, mỗi từ trong từ điển chỉ được gán đúng **1 vector cố định duy nhất (Static Embedding)** bất chấp ngữ cảnh!\n   * Ví dụ: Từ **`\"bank\"`** trong câu *\"I deposited money in the **bank**\"* (Ngân hàng) và *\"I sat by the river **bank**\"* (Bờ sông), hoặc từ **`\"apple\"`** (quả táo vs. hãng Apple) bị ép dùng chung 1 vector giống hệt nhau! Hơn nữa, nó không xử lý được cấu trúc câu dài.\n2. **Recurrent Neural Networks (RNN) \u0026 LSTM (Long Short-Term Memory):**\n   * Để xử lý chuỗi văn bản theo thứ tự thời gian, **RNN** đưa từng từ vào mạng lần lượt từ trái sang phải ($t_1 \\to t_2 \\to t_3 \\dots$) và duy trì một vector **Trạng thái ẩn (Hidden State $h_t$)** đóng vai trò làm \"bộ nhớ ngắn hạn\" truyền từ bước trước sang bước sau: $h_t = f(W \\cdot h_{t-1} + U \\cdot x_t)$.\n   * **LSTM** và **GRU** cải tiến RNN bằng cách thêm các cổng điều khiển (**Forget Gate, Input Gate, Output Gate**) và đường truyền **Cell State** để giữ thông tin lâu hơn một chút.\n   * **HAI HẠN CHẾ LỚN CỦA RNN / LSTM (Khái niệm đáng ôn theo Blueprint):**\n     * **Thứ nhất – Nút thắt xử lý tuần tự (Sequential Bottleneck $\\to$ Khó song song hóa theo chiều dài chuỗi khi huấn luyện):** Để tính được trạng thái ẩn $h_t$ của từ thứ $100$, mạng RNN phải đợi tính xong từ thứ $1, 2, \\dots, 99$. Sự phụ thuộc tuần tự theo bước thời gian này hạn chế khả năng tính toán đồng thời các vị trí token trong cùng một chuỗi trên GPU khi huấn luyện!\n     * **Thứ hai – Khó khăn với phụ thuộc tầm xa \u0026 Triệt tiêu đạo hàm theo thời gian (Long-Range Dependencies \u0026 Vanishing Gradients through Time):** Khi chuỗi văn bản dài, thông tin từ những từ ở đầu câu dễ bị suy giảm qua nhiều bước truyền trạng thái liên tiếp (BPTT), khiến mô hình khó giữ được ngữ cảnh xa.\n\n---\n\n### 4.4. Bậc 3: Cuộc cách mạng Transformer (2017) – Song song hóa theo vị trí token khi huấn luyện với Self-Attention\nKiến trúc **Transformer** thay thế cơ chế truyền trạng thái tuần tự của RNN bằng cơ chế **Self-Attention (Tự chú ý)** kết hợp **Contextualized Embeddings** (mỗi từ có một vector biểu diễn phụ thuộc ngữ cảnh của câu):\n\n\u003e **Lưu ý kỹ thuật quan trọng:** Transformer có khả năng **song song hóa tốt trên các vị trí token trong quá trình huấn luyện** (do toàn bộ chuỗi huấn luyện đã biết trước) so với RNN truyền thống. Tuy nhiên, với mô hình sinh văn bản **autoregressive** (như GPT, LLaMA), **quá trình decoding lúc suy luận thường tạo token tuần tự từng bước một**, dù các phép toán ma trận bên trong mỗi bước và trên nhiều request (batching) có thể được song song hóa trên GPU. Hiệu suất sử dụng GPU/Tensor Cores thực tế phụ thuộc vào workload, batch size, độ dài chuỗi, kernels (như FlashAttention) và giới hạn băng thông bộ nhớ (memory-bandwidth bound ở pha decode).\n\n```mermaid\nflowchart TD\n    subgraph RNN_Arch[\"1. Kiến trúc RNN / LSTM (Phụ thuộc tuần tự theo bước thời gian t₁ -\u003e t₂ -\u003e t₃)\"]\n        direction LR\n        W1[\"Từ 1\u003cbr/\u003e(t₁)\"] --\u003e|h₁| W2[\"Từ 2\u003cbr/\u003e(t₂)\"] --\u003e|h₂| W3[\"Từ 3\u003cbr/\u003e(t₃)\"] --\u003e|h₃| W4[\"Từ 4\u003cbr/\u003e(t₄ - Phải đợi t₁..t₃ tính xong)\"]\n    end\n\n    subgraph Trans_Arch[\"2. Kiến trúc Transformer (Song song hóa các token khi Training + Self-Attention)\"]\n        direction TB\n        AllWords[\"Khi Training: Xử lý đồng thời các vị trí token trong chuỗi: [Từ 1, Từ 2, Từ 3, Từ 4] (+ Positional Encoding)\"]\n        Attn[\"Cơ chế Self-Attention:\u003cbr/\u003eNhân ma trận (Q × Kᵀ) tính trực tiếp mức độ liên kết giữa các cặp token trong cửa sổ ngữ cảnh (O(1) path length)\"]\n        GPU_Out[\"Tận dụng hiệu quả Tensor Cores cho phép nhân ma trận;\u003cbr/\u003eLưu ý: Khi Autoregressive Decoding, token mới vẫn được sinh tuần tự từng bước!\"]\n        \n        AllWords ==\u003e Attn ==\u003e GPU_Out\n    end\n```\n\n---\n\n## 5. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm cần lưu ý ở Module 3:**\n\u003e 1. **So sánh RNN vs. Transformer:** Tại sao Transformer huấn luyện hiệu quả hơn RNN trên GPU? $\\to$ Vì trong quá trình huấn luyện, Transformer **loại bỏ sự phụ thuộc tuần tự theo bước thời gian giữa các vị trí token** của RNN, cho phép tính toán trên toàn bộ chuỗi huấn luyện **song song (in parallel)** và nắm bắt phụ thuộc tầm xa trực tiếp qua **Self-Attention**. (Lưu ý: lúc suy luận autoregressive, việc sinh từng token đầu ra vẫn diễn ra tuần tự).\n\u003e 2. **Bẫy CBOW vs. Skip-gram (Word2Vec):** Dùng các từ xung quanh đoán 1 từ ở giữa $\\to$ **CBOW**. Dùng 1 từ ở giữa đoán các từ ngữ cảnh xung quanh $\\to$ **Skip-gram**.\n\u003e 3. **Bẫy RLHF vs. DPO:** Phương pháp căn chỉnh (Alignment) nào giúp tinh chỉnh LLM theo sở thích con người một cách trực tiếp trên các cặp dữ liệu ưu tiên mà **không cần huấn luyện một mô hình phần thưởng (Reward Model) riêng biệt và không cần PPO**? $\\to$ Chọn **DPO (Direct Preference Optimization)**.\n\u003e 4. **Bẫy Foundation Model:** Foundation Model được huấn luyện ban đầu (Pre-trained) bằng phương pháp nào? $\\to$ **Self-supervised learning trên tập dữ liệu khổng lồ không gắn nhãn (Massive unlabeled data)**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Trong quá trình hoàn thiện một mô hình LLM, giai đoạn nào sử dụng phản hồi đánh giá của con người để điều chỉnh mô hình sao cho câu trả lời trở nên an toàn, hữu ích và không độc hại?\n   * *Đáp án:* Giai đoạn **Alignment (Căn chỉnh)** sử dụng **RLHF (Reinforcement Learning from Human Feedback)** hoặc **DPO (Direct Preference Optimization)**.\n2. **Câu 2:** Đâu là sự khác biệt cơ bản giữa mô hình Discriminative AI (như phân loại ảnh) và mô hình Generative AI?\n   * *Đáp án:* Discriminative AI học ranh giới phân loại $P(Y \\mid X)$ để trả về nhãn dự đoán cho dữ liệu có sẵn, trong khi Generative AI học phân phối xác suất của dữ liệu $P(X)$ để **sáng tạo ra nội dung mới và nguyên bản**.\n3. **Câu 3:** Trong hai kiến trúc của thuật toán nhúng từ **Word2Vec**, kiến trúc nào nhận đầu vào là một từ đích duy nhất ở vị trí trung tâm và cố gắng dự đoán các từ ngữ cảnh xung quanh nó (đặc biệt hiệu quả cho các từ hiếm)?\n   * *Đáp án:* **Skip-gram** (ngược lại với CBOW dùng các từ xung quanh để đoán từ trung tâm).\n4. **Câu 4:** Một nhóm nghiên cứu muốn huấn luyện trước (Pre-train) một Foundation Model từ hàng tỷ trang văn bản thu thập trên Internet nhưng không có kinh phí thuê người gắn nhãn cho từng câu. Phương pháp học máy nào cho phép mô hình tự che đi các từ trong câu hoặc tự lấy từ tiếp theo làm nhãn mục tiêu để học?\n   * *Đáp án:* **Self-Supervised Learning (Học tự giám sát)**.\n5. **Câu 5:** Tại sao biểu diễn từ bằng **Static Word Embeddings (như Word2Vec)** lại gặp khó khăn khi xử lý câu văn: *\"He went to the **bank** to deposit cash after walking along the river **bank**\"*?\n   * *Đáp án:* Vì Word2Vec chỉ gán một **vector tĩnh cố định duy nhất** cho từ `\"bank\"` bất kể ngữ cảnh, nên không thể phân biệt được hai nghĩa hoàn toàn khác nhau (\"ngân hàng\" và \"bờ sông\") của từ đa nghĩa (Polysemy) này — vấn đề mà **Contextualized Embeddings** trong Transformer giải quyết triệt để.\n6. **Câu 6:** Theo **Định luật Mở rộng Chinchilla (Chinchilla Scaling Laws)**, để tối ưu hóa hiệu năng của một mô hình ngôn ngữ lớn trong một ngân sách tính toán cố định, khi tăng gấp đôi số lượng tham số của mô hình ($N$), kỹ sư cần làm gì với lượng dữ liệu huấn luyện ($D$)?\n   * *Đáp án:* Cần **tăng gấp đôi lượng dữ liệu huấn luyện (số lượng tokens $D$)** theo tỷ lệ cân bằng (xấp xỉ ~20 tokens cho mỗi tham số) thay vì chỉ tăng kích thước mô hình.\n"},{"id":"mod04","file":"Module_04_Transformer_Architecture.md","badge":"MODULE 04","shortTitle":"Transformer Architecture","domain":"Core AI \u0026 Exp (52%)","weight":"Core AI","icon":"⚡","content":"# Module 4: Transformer Architecture (Kiến trúc Transformer Chuyên sâu)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 4 (Chiếm tỷ trọng câu hỏi rất cao!):**\n\u003e Thuộc lòng bài báo lịch sử **\"Attention Is All You Need\" (2017)**; nắm chắc **6 bước trong Pipeline xử lý đầu-cuối của Transformer** và giải phẫu bên trong 1 khối Transformer (**LayerNorm, Residual Connections, FFN/MLP**); hiểu sâu lý do dùng **Subword Tokenization (BPE, WordPiece, SentencePiece)**, **Positional Encoding (Sinusoidal \u0026 RoPE)**, bản chất toán học của **Self-Attention ($Q, K, V$), Masked Causal Attention, Cross-Attention** và sự tiến hóa **MHA $\\to$ MQA $\\to$ GQA + KV Cache + FlashAttention**; nắm rõ **các chiến lược và tham số điều khiển sinh văn bản (Greedy, Beam Search, Temperature, Top-K, Top-P)**; và đặc biệt là bảng phân loại **3 biến thể kiến trúc (Encoder-only vs. Decoder-only vs. Encoder-Decoder)** cùng kiến trúc **MoE (Mixture of Experts)**.\n\n---\n\n## 1. Nguồn gốc lịch sử và Tầm ảnh hưởng\n\n* **Tháng 6 năm 2017:** Nhóm 8 nhà nghiên cứu tại Google Brain và Google Research (Ashish Vaswani et al.) công bố bài báo khoa học kinh điển mang tên **\"Attention Is All You Need\"** tại hội nghị NeurIPS.\n* **Ý nghĩa của tên bài báo:** Trước năm 2017, giới AI mặc định rằng để dịch máy hay xử lý chuỗi ngôn ngữ, bắt buộc phải dùng mạng hồi quy (**RNN / LSTM / GRU**) hoặc mạng tích chập (CNN) làm khung xương chính, còn cơ chế Attention (như Bahdanau/Luong Attention) chỉ là linh kiện phụ trợ gắn thêm vào RNN. Bài báo này đưa ra tuyên bố táo bạo: *Hãy vứt bỏ hoàn toàn cấu trúc tuần tự của RNN đi, chỉ cần cơ chế Self-Attention là đủ để xây dựng một mô hình ngôn ngữ vừa nhanh hơn gấp chục lần trên GPU vừa thông minh hơn vượt trội!*\n* **Tầm ảnh hưởng:** Khai sinh ra kiến trúc **Transformer** (chính là chữ **T** trong **GPT** - *Generative Pre-trained Transformer* và **BERT** - *Bidirectional Encoder Representations from Transformers*), trở thành động cơ cốt lõi đằng sau toàn bộ cuộc cách mạng Generative AI ngày nay (từ ngôn ngữ, lập trình, sinh học phân tử đến cả thị giác máy tính **ViT** và video **DiT**).\n\n---\n\n## 2. Quy trình xử lý đầu-cuối của Transformer (End-to-End Pipeline) \u0026 Giải phẫu Khối Transformer\n\n### 2.1. Hành trình 6 bước của một Prompt đi qua Transformer\nHãy theo dõi hành trình của một câu đố ngôn ngữ từ lúc người dùng gõ vào bàn phím cho đến khi mô hình sinh ra câu trả lời:\n**Input Prompt:** `\"A puppy is to dog as kitten is to...\"`\n\n```mermaid\nflowchart TD\n    Input[\"Chuỗi văn bản thô (Raw Text Input)\u003cbr/\u003e\u0027A puppy is to dog as kitten is to\u0027\"]\n    \n    S1[\"Bước 1: Tokenization (Mã hóa phân đoạn)\u003cbr/\u003eCắt văn bản thành các mảnh Tokens (từ hoặc subword)\u003cbr/\u003e[\u0027A\u0027, \u0027 puppy\u0027, \u0027 is\u0027, \u0027 to\u0027, \u0027 dog\u0027, \u0027 as\u0027, \u0027 kitten\u0027, \u0027 is\u0027, \u0027 to\u0027]\"]\n    \n    S2[\"Bước 2: Encoding (Ánh xạ sang Token IDs)\u003cbr/\u003eTra cứu trong Vocabulary cố định để lấy mảng số nguyên\u003cbr/\u003e[101, 2166, 2003, 2000, 2670, 2004, 8392, 2003, 2000]\"]\n    \n    S3[\"Bước 3: Token Embedding + Positional Encoding\u003cbr/\u003eBiến mỗi ID thành Vector số thực dày đặc (VD: d_model = 4096 chiều)\u003cbr/\u003e+ Cộng/Xoay với Vector Vị trí để bảo toàn thứ tự trước-sau\"]\n    \n    S4[\"Bước 4: N × Transformer Blocks (Self-Attention Q,K,V + FFN + Residual + LayerNorm)\u003cbr/\u003eTính toán ma trận liên kết ngữ cảnh đa tầng:\u003cbr/\u003e\u0027kitten\u0027 liên kết ngữ nghĩa chặt chẽ với \u0027puppy\u0027 (con non) và \u0027dog\u0027 (loài vật)\"]\n    \n    S5[\"Bước 5: Decoding \u0026 Prediction (Linear LM Head -\u003e Logits -\u003e Softmax)\u003cbr/\u003eTính phân phối xác suất cho toàn bộ từ điển (áp dụng Temperature / Top-K / Top-P):\u003cbr/\u003eP(\u0027cat\u0027) = 0.78 | P(\u0027feline\u0027) = 0.12 | P(\u0027pet\u0027) = 0.04\"]\n    \n    S6[\"Bước 6: Output Generation (Sampling \u0026 Detokenization)\u003cbr/\u003eLấy mẫu chọn Token ID thắng cuộc và giải mã ngược thành chữ:\u003cbr/\u003e👉 \u0027cat\u0027 (Sau đó nối \u0027cat\u0027 vào chuỗi đầu vào nếu cần sinh tiếp token sau)\"]\n\n    Input --\u003e S1 --\u003e S2 --\u003e S3 --\u003e S4 --\u003e S5 --\u003e S6\n```\n\n### 2.2. Giải phẫu bên trong 1 Khối Transformer Tiêu chuẩn (Inside a Transformer Block)\nMột mô hình như LLaMA-3 8B xếp chồng $N = 32$ khối Transformer giống hệt nhau (LLaMA-3 70B xếp chồng $80$ khối). Bên trong **mỗi khối (1 Layer)** gồm **2 tầng con (Sub-layers)** cực kỳ quan trọng mà đề thi thường hỏi:\n\n```mermaid\nflowchart LR\n    In[\"Vector Đầu vào của Tầng l\u003cbr/\u003e(X)\"]\n    \n    LN1[\"1. LayerNorm / RMSNorm\u003cbr/\u003e(Chuẩn hóa về Mean=0, Std=1)\"]\n    MHA[\"2. Multi-Head Self-Attention\u003cbr/\u003e(Trộn thông tin NGỮ CẢNH giữa các Token với nhau)\"]\n    Add1((\"Cộng (+) \u003cbr/\u003eResidual / Skip Connection\"))\n    \n    LN2[\"3. LayerNorm / RMSNorm\"]\n    FFN[\"4. Feed-Forward Network (FFN / MLP)\u003cbr/\u003e(Mạng 2-3 lớp Linear + GELU/SwiGLU xử lý ĐỘC LẬP từng Token:\u003cbr/\u003eMở rộng chiều d -\u003e 4d -\u003e d, nơi lưu trữ phần lớn TRI THỨC SỰ KIỆN!)\"]\n    Add2((\"Cộng (+) \u003cbr/\u003eResidual / Skip Connection\"))\n    \n    Out[\"Vector Đầu ra truyền lên Tầng l+1\u003cbr/\u003e(X_next)\"]\n\n    In --\u003e LN1 --\u003e MHA --\u003e Add1\n    In -.-\u003e|\"Đường nối tắt (Skip Connection: x + Attention(x))\u003cbr/\u003eChống Vanishing Gradients!\"| Add1\n    \n    Add1 --\u003e LN2 --\u003e FFN --\u003e Add2\n    Add1 -.-\u003e|\"Đường nối tắt (Skip Connection: h + FFN(h))\"| Add2\n    Add2 --\u003e Out\n```\n\n\u003e [!TIP]\n\u003e **Góc nhìn Kiến trúc cho Developer:**\n\u003e * **Khối Self-Attention:** Đóng vai trò là **\"Bộ phận Giao tiếp (Communication)\"** — giúp các token khác nhau trong câu nhìn thấy nhau và trao đổi thông tin ngữ cảnh.\n\u003e * **Khối Feed-Forward Network (FFN / Position-wise MLP):** Đóng vai trò là **\"Bộ phận Suy nghĩ \u0026 Kho lưu trữ Tri thức (Computation \u0026 Factual Memory)\"** — sau khi mỗi token đã thu thập xong ngữ cảnh từ Attention, nó đi qua mạng FFN (chiếm tới ~2/3 tổng số tham số của mô hình!) để biến đổi phi tuyến và truy xuất tri thức đã học.\n\n---\n\n## 3. Giải phẫu 5 Thành phần Kỹ thuật Cốt lõi của Transformer\n\n### 3.1. Subword Tokenization (Mã hóa từ con)\nKhi thiết kế bộ Tokenizer (Bước 1), tại sao các kỹ sư không cắt theo từng từ nguyên vẹn (Whole-word) hoặc cắt theo từng chữ cái đơn lẻ (Character-level)?\n\n| Phương pháp Tokenization | Cách cắt chuỗi | Nhược điểm chí mạng |\n| :--- | :--- | :--- |\n| **1. Whole-word (Từ nguyên vẹn)** | Cắt theo khoảng trắng: `[\"unbelievable\", \"dogs\"]` | • Từ điển phình to hàng triệu từ (do chia động từ, số nhiều, từ ghép).\u003cbr/\u003e• Gặp từ mới, tên riêng hoặc từ gõ sai chính tả là dính lỗi **OOV (Out-of-Vocabulary)** $\\to$ biến thành token mù `\u003cUNK\u003e`. |\n| **2. Character-level (Từng chữ cái)** | Cắt từng ký tự: `[\u0027u\u0027, \u0027n\u0027, \u0027b\u0027, \u0027e\u0027, ...]` | • Từ điển siêu nhỏ (vài trăm ký tự), không bị OOV.\u003cbr/\u003e• Nhưng **bản thân chữ cái `\u0027u\u0027` không mang ngữ nghĩa**, và chuỗi token bị kéo dài gấp 5–7 lần làm nổ tung chi phí tính toán Attention! |\n| **3. Subword Tokenization (Mã hóa từ con - PHỔ BIẾN HIỆN NAY)** | Giữ nguyên từ phổ biến (`\"dog\"`), tách từ hiếm/phức tạp thành **Tiền tố + Gốc từ + Hậu tố** | **Điểm cân bằng hiệu quả (Sweet Spot):** Từ điển gọn nhẹ (thường 32K – 128K+ tokens), giữ được ngữ nghĩa gốc từ và **giảm đáng kể vấn đề OOV** so với word-level tokenization! |\n\n\u003e **Lưu ý kỹ thuật về OOV trong Subword Tokenization:** Subword tokenization thường làm giảm vấn đề OOV so với word-level tokenization. Các tokenizer có cơ chế **byte fallback** hoặc **byte-level coverage** (như Byte-level BPE trong GPT/LLaMA) có thể biểu diễn chuỗi UTF-8 bất kỳ ở mức byte; tuy nhiên khả năng bao phủ chính xác phụ thuộc vào thiết kế tokenizer (ví dụ WordPiece không có byte fallback vẫn có thể sinh `\u003cUNK\u003e` khi gặp ký tự lạ ngoài bảng chữ cái) và tập ký tự hỗ trợ. Do đó không nên khẳng định **mọi** subword tokenizer đều không bao giờ gặp OOV.\n\n* **Ví dụ kinh điển về Subword Tokenization:** Ba từ `unbelievable`, `unbreakable`, `unlikeable` không cần lưu thành 3 mục từ riêng biệt mà được lắp ghép từ 5 mảnh subword có nghĩa:\n  $$\\text{\\texttt{un}} + \\{\\text{\\texttt{believ}}, \\text{\\texttt{break}}, \\text{\\texttt{like}}\\} + \\text{\\texttt{able}}$$\n* **Quy tắc ước lượng nhanh cho Developer:** Trong tiếng Anh, trung bình **$1\\text{ token} \\approx 0.75\\text{ từ (words)} \\approx 4\\text{ ký tự}$** (tức là $100\\text{ tokens} \\approx 75\\text{ từ}$).\n* **3 Thuật toán Subword Tokenizer tiêu chuẩn cần nhớ tên trong đề thi:**\n  1. **BPE (Byte-Pair Encoding):** Bắt đầu từ các ký tự đơn lẻ, lặp đi lặp lại việc gộp cặp ký tự xuất hiện cùng nhau nhiều nhất thành token mới (Dùng trong **GPT-2/3/4 (`tiktoken`), LLaMA-3, RoBERTa**).\n  2. **WordPiece:** Tương tự BPE nhưng chọn cặp gộp dựa trên việc tối đa hóa xác suất hợp lý (Likelihood) của dữ liệu huấn luyện, đánh dấu mảnh từ con bằng ký hiệu `##` như `play`, `##ing` (Dùng trong **BERT, DistilBERT**).\n  3. **SentencePiece / Unigram:** Coi khoảng trắng cũng là một ký tự thông thường (`_`), không phụ thuộc vào việc ngôn ngữ có dùng dấu cách hay không (rất mạnh cho tiếng Nhật, Trung, Đa ngôn ngữ; dùng trong **T5, XLNet, LLaMA-1/2, Mistral**).\n\n---\n\n### 3.2. Positional Encoding (Mã hóa vị trí)\n* **Vấn đề kỹ thuật:** Vì Transformer nạp toàn bộ các từ trong câu vào GPU **cùng một lúc (song song)** thay vì đọc lần lượt từ trái sang phải như RNN, nên bản thân phép toán nhân ma trận trong Self-Attention có tính chất **bất biến với hoán vị (Permutation Invariant — tức là \"mù vị trí\")**. Nếu không có thông tin vị trí, mô hình sẽ nhìn câu văn như một \"túi chứa từ\" hỗn loạn (**Bag of Words**) và coi 2 câu hoàn toàn trái ngược nhau sau đây là giống hệt nhau:\n  * Câu 1: *\"The **cat** chased the **dog**.\"* (Mèo đuổi chó)\n  * Câu 2: *\"The **dog** chased the **cat**.\"* (Chó đuổi mèo)\n* **Giải pháp – Positional Encoding:**\n  * Trước khi đưa vào tầng Transformer đầu tiên, thông tin tọa độ vị trí thứ $1, 2, 3, \\dots, n$ của từng token được tiêm trực tiếp vào Vector Embedding.\n  * **Các phương pháp Positional Encoding chính:**\n    1. **Sinusoidal Positional Encoding (Bài báo Transformer gốc 2017):** Cộ
