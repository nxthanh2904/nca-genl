 đa cộng tuyến (các cột dư thừa tương quan nhau).\n2. **t-SNE \u0026 UMAP:**\n   * Các thuật toán giảm chiều **phi tuyến tính (Non-linear Dimensionality Reduction)** chuyên dùng để **trực quan hóa (Visualization)** các Vector Embedding 4096 chiều của LLM xuống biểu đồ 2D hoặc 3D để con người nhìn thấy các cụm từ vựng trên màn hình.\n3. **K-Means Clustering vs. DBSCAN (Phân cụm dữ liệu):**\n   * **K-Means:** Bạn phải chỉ định trước số lượng cụm $K$ (chọn $K$ tối ưu bằng phương pháp **Elbow Method** hoặc **Silhouette Score**). Thuật toán khởi tạo $K$ tâm cụm (**Centroids**), gán mỗi điểm dữ liệu vào tâm gần nhất theo khoảng cách Euclid, rồi cập nhật lại tọa độ tâm cho đến khi hội tụ. *Ứng dụng:* Phân khúc khách hàng (Customer Segmentation), nén màu ảnh.\n   * **DBSCAN (Density-Based Spatial Clustering):** Phân cụm dựa trên **mật độ điểm dữ liệu** mà **không cần biết trước số cụm $K$**, có khả năng tìm ra các cụm có hình thù uốn lượn bất kỳ và tự động phát hiện các điểm nhiễu ngoại lai (**Outliers / Noise**).\n\n---\n\n### 3.3. Sự đánh đổi Bias-Variance (Bias-Variance Tradeoff) \u0026 Regularization (`L1` vs. `L2`)\nĐể mô hình học máy hoạt động tốt trên dữ liệu thực tế (Generalization), kỹ sư phải cân bằng giữa hai nguồn sai số:\n* **Bias (Độ chệch):** Sai số do giả định của mô hình quá đơn giản (ví dụ dùng đường thẳng bậc 1 để khớp dữ liệu hình sin phức tạp). **High Bias $\\to$ Underfitting (Học chưa tới / Đều sai trên cả tập Train và Test)**.\n* **Variance (Phương sai):** Độ nhạy cảm thái quá của mô hình với những biến động nhỏ/nhiễu trong tập dữ liệu huấn luyện. **High Variance $\\to$ Overfitting (Học vẹt / Đúng 99.9% trên tập Train nhưng đoán sai bét trên tập Test)**.\n* **Kỹ thuật Điều chuẩn (Regularization - Cộng thêm thành phần phạt vào Loss Function để chống Overfitting):**\n  * **L1 Regularization (Lasso):** Cộng thêm tổng trị tuyệt đối trọng số $\\lambda \\sum |w_i|$ vào hàm Loss. Có tính chất đặc biệt là **ép các trọng số của những đặc trưng kém quan trọng về đúng bằng $0$** $\\to$ Giúp tạo mô hình thưa (**Sparse Model**) và tự động **chọn lọc đặc trưng (Feature Selection)**.\n  * **L2 Regularization (Ridge / Weight Decay trong Deep Learning):** Cộng thêm tổng bình phương trọng số $\\lambda \\sum w_i^2$ vào hàm Loss. Ép tất cả các trọng số phải nhỏ và phân bố đều, ngăn không cho một vài trọng số phình quá to chi phối mô hình (đây chính là chữ **W** trong thuật toán tối ưu **AdamW** dùng cho mọi LLM!).\n\n---\n\n## 4. Case Study: Lập trình truyền thống vs. Machine Learning\n\n### Bài toán kinh doanh:\nXây dựng hệ thống gợi ý sản phẩm (Recommendation System) hoặc phát hiện gian lận thẻ tín dụng cho sàn thương mại điện tử dựa trên lịch sử mua hàng và hồ sơ khách hàng.\n\n```mermaid\nflowchart TD\n    subgraph Classical[\"1. Lập trình Truyền thống (Classical Programming - Rule-based)\"]\n        direction LR\n        In1[\"Dữ liệu đầu vào (Input Data)\u003cbr/\u003e+ Quy tắc cứng (Rules if/else do Dev viết)\"] --\u003e Engine1[\"Chương trình\u003cbr/\u003e(Hardcoded Logic)\"] --\u003e Out1[\"Kết quả đầu ra\u003cbr/\u003e(Answers / Output)\"]\n    end\n\n    subgraph ML_Flow[\"2. Học máy (Machine Learning - Data-driven)\"]\n        direction LR\n        In2[\"Dữ liệu đầu vào (Input Data)\u003cbr/\u003e+ Kết quả lịch sử (Historical Answers / Labels)\"] --\u003e Engine2[\"Thuật toán Huấn luyện\u003cbr/\u003e(ML Training)\"] --\u003e Out2[\"Mô hình chứa Quy tắc ẩn\u003cbr/\u003e(Trained Model / Learned Rules)\"]\n    end\n```\n\n* **Tiếp cận Lập trình truyền thống (Classical Programming):** Lập trình viên phải tự ngồi viết tay hàng nghìn quy tắc điều kiện (`if/else`). Khi quy mô dữ liệu lớn và hành vi kẻ gian/người dùng thay đổi theo từng ngày, các luật này nhanh chóng xung đột nhau, không thể bao quát hết trường hợp biên và cực kỳ tốn kém để bảo trì.\n* **Tiếp cận Machine Learning:** Đưa lịch sử mua sắm, lượt click và giỏ hàng (`Input Data + Historical Answers`) vào thuật toán ML để máy **tự động rút trích ra Mô hình chứa các quy tắc ẩn (`Trained Model`)**, tự thích ứng với hành vi theo mùa và phản hồi suy luận trong vài mili-giây.\n\n---\n\n## 5. Ba khái niệm cốt lõi: Algorithm, Model và Inference\n\nRất nhiều Developer mới làm quen với AI thường gọi lẫn lộn giữa \"Thuật toán\" và \"Mô hình\". Trong kỳ thi NCA-GENL, 3 khái niệm này được phân định cực kỳ rõ ràng:\n\n```mermaid\nflowchart LR\n    Data[\"Tập dữ liệu huấn luyện\u003cbr/\u003e(Training Data)\"]\n    Algo[\"1. Algorithm (Thuật toán)\u003cbr/\u003eCông thức toán học tổng quát\u003cbr/\u003ef(x) = w₁x₁ + w₂x₂ + b\u003cbr/\u003e(Chưa có trọng số cụ thể)\"]\n    Model[\"2. Model (Mô hình)\u003cbr/\u003eSản phẩm (Artifact) sau khi học xong\u003cbr/\u003eLưu trữ bộ Trọng số (Weights)\u003cbr/\u003e\u0026 Độ lệch (Biases) đã tối ưu\"]\n    Unseen[\"Dữ liệu mới thực tế\u003cbr/\u003e(Unseen / Live Data)\"]\n    Pred[\"3. Inference (Suy luận)\u003cbr/\u003eQuá trình chạy Model trên dữ liệu mới\u003cbr/\u003eđể sinh ra Dự đoán (Prediction)\"]\n\n    Data \u0026 Algo ==\u003e|\"Quá trình Training\"| Model\n    Model \u0026 Unseen ==\u003e|\"Chạy trên Production\"| Pred\n```\n\n| Khái niệm | Bản chất kỹ thuật | Góc nhìn Developer (Tương đương trong Code) |\n| :--- | :--- | :--- |\n| **1. Algorithm (Thuật toán)** | Là quy trình toán học hoặc công thức logic tổng quát (ví dụ: *Linear Regression, Decision Trees, K-Means, Backpropagation*) dùng để tìm mối tương quan giữa các biến số: $$f(x) = w_1 x_1 + w_2 x_2 + \\dots + b$$ | Giống như **Source Code định nghĩa một Class trống** (chưa khởi tạo trạng thái, mới chỉ có cấu trúc hàm và công thức học). |\n| **2. Model (Mô hình)** | Là **kết quả (artifact)** thu được sau khi chạy Algorithm trên một tập dữ liệu huấn luyện cụ thể. Mô hình chính là cấu trúc mạng kèm tệp lưu trữ các **trọng số (weights $w$)** và **độ lệch (biases $b$)** đã được tối ưu hóa. | Giống như **Compiled Binary + Serialized State Object** (ví dụ file `.pt`, `.onnx`, `.safetensors`, `.pkl`) chứa sẵn tri thức đã học. |\n| **3. Inference (Suy luận)** | Là quá trình đưa **dữ liệu mới chưa từng thấy (unseen/live data)** vào Model đã huấn luyện xong để lấy kết quả dự đoán (chỉ chạy Forward Pass, không tính Backpropagation). *Training chỉ diễn ra định kỳ, nhưng Inference diễn ra hàng triệu lần mỗi ngày trên Production.* | Giống như việc nạp file model vào RAM/VRAM rồi gọi hàm **`model.predict(new_input)`** bên trong một REST API endpoint phục vụ user. |\n\n### Minh họa bằng Code Python (`scikit-learn`) cho Developer:\n```python\nfrom sklearn.ensemble import RandomForestClassifier\nimport joblib\n\n# 1. ALGORITHM: Khởi tạo thuật toán tổng quát (chưa học dữ liệu, chưa có trọng số)\nalgorithm = RandomForestClassifier(n_estimators=100, random_state=42)\n\n# 2. TRAINING -\u003e MODEL: Huấn luyện thuật toán trên dữ liệu (X_train, y_train) để tạo ra Model đã học\ntrained_model = algorithm.fit(X_train, y_train)\njoblib.dump(trained_model, \"fraud_detection_model.pkl\") # Lưu Artifact của Model ra ổ cứng\n\n# 3. INFERENCE: Nạp Model lên Production và dự đoán trên dữ liệu giao dịch mới (new_transaction)\nproduction_model = joblib.load(\"fraud_detection_model.pkl\")\nprediction = production_model.predict(new_transaction) # Quá trình Inference!\n```\n\n---\n\n## 6. Vòng đời Huấn luyện ML qua Phép ẩn dụ Đào tạo Barista (Barista Analogy)\n\nĐể nhớ trọn vẹn vòng lặp huấn luyện một mạng nơ-ron (Forward Pass $\\to$ Loss $\\to$ Backpropagation $\\to$ GPU Acceleration $\\to$ Epochs $\\to$ Inference), tài liệu chuẩn của NVIDIA sử dụng phép ẩn dụ **Đào tạo một nhân viên pha chế cà phê (Barista)**:\n\n```mermaid\nflowchart TD\n    S1[\"1. Initialize (Khởi tạo)\u003cbr/\u003e☕ Học việc mới vào quán, chưa biết pha, làm thử ngẫu nhiên\u003cbr/\u003e🤖 Khởi tạo trọng số ngẫu nhiên (Random Weights Initialization)\"]\n    S2[\"2. Guide (Hướng dẫn / Forward Pass)\u003cbr/\u003e☕ Đưa công thức mẫu \u0026 nguyên liệu đầu vào\u003cbr/\u003e🤖 Đưa dữ liệu đầu vào đi xuôi qua mạng (Forward Propagation)\"]\n    S3[\"3. Predict \u0026 Evaluate (Dự đoán \u0026 Đánh giá sai số)\u003cbr/\u003e☕ Pha thử 1 ly; Quản lý nếm thử \u0026 chấm điểm lệch vị bao nhiêu\u003cbr/\u003e🤖 Mô hình ra dự đoán; Loss Function đo khoảng cách sai số so với nhãn chuẩn\"]\n    S4[\"4. Adjust (Điều chỉnh / Backpropagation \u0026 Optimizer)\u003cbr/\u003e☕ Học việc rút kinh nghiệm: bớt đường, thêm sữa theo góp ý\u003cbr/\u003e🤖 Lan truyền ngược (Backpropagation) cập nhật lại Weights để giảm Loss\"]\n    S5[\"5. Accelerate (Tăng tốc phần cứng)\u003cbr/\u003e☕ Trang bị máy pha cà phê công nghiệp tự động công suất lớn\u003cbr/\u003e🤖 Dùng GPU / Tensor Cores tăng tốc tính toán ma trận song song\"]\n    S6[\"6. Master (Thành thạo qua nhiều Epochs)\u003cbr/\u003e☕ Luyện tập lặp đi lặp lại hàng nghìn ly qua nhiều ngày đến khi chuẩn vị\u003cbr/\u003e🤖 Lặp qua nhiều chu kỳ huấn luyện (Epochs) đạt độ chính xác hội tụ\"]\n    S7[\"7. Deploy (Triển khai thực tế / Inference)\u003cbr/\u003e☕ Chính thức đứng quầy pha chế phục vụ khách hàng thật mỗi ngày\u003cbr/\u003e🤖 Đóng gói mô hình đưa lên Production chạy Suy luận (Inference)\"]\n\n    S1 --\u003e S2 --\u003e S3 --\u003e S4\n    S4 -.-\u003e|\"Lặp lại liên tục (Nhờ bước 5 \u0026 6)\"| S2\n    S4 --\u003e S5 --\u003e S6 --\u003e S7\n```\n\n---\n\n## 7. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 2:**\n\u003e 1. **Bẫy PCA vs. K-Means:**\n\u003e    * Muốn **giảm số lượng cột đặc trưng (Dimensionality Reduction)** mà vẫn giữ lại phương sai/thông tin quan trọng nhất để tăng tốc độ train $\\to$ Chọn **PCA (Principal Component Analysis)**.\n\u003e    * Muốn **chia dữ liệu không gắn nhãn thành các nhóm tương đồng (Clustering)** $\\to$ Chọn **K-Means** hoặc **DBSCAN**.\n\u003e 2. **Bẫy Logistic Regression:** Dù tên có chữ \"Regression\", nhưng **Logistic Regression** dùng hàm Sigmoid để giải bài toán **Classification (Phân loại nhị phân)**, KHÔNG phải bài toán Hồi quy số liên tục!\n\u003e 3. **Bẫy Bagging vs. Boosting:** Huấn luyện nhiều cây quyết định **song song độc lập** để giảm phương sai (Variance) $\\to$ **Bagging (`Random Forest`)**. Huấn luyện các cây **nối tiếp tuần tự**, cây sau sửa lỗi cho cây trước để giảm độ chệch (Bias) $\\to$ **Boosting (`XGBoost` / `Gradient Boosting`)**.\n\u003e 4. **Bẫy Algorithm vs. Model vs. Inference:** Thành phần lưu trữ các trọng số (weights) và độ lệch (biases) đã được tối ưu sau khi huấn luyện $\\to$ **Model**. Quá trình áp dụng Model đó lên dữ liệu thực tế mới để lấy dự đoán $\\to$ **Inference**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Một nhà khoa học dữ liệu làm việc với tập dữ liệu gồm 500 biến đặc trưng (features) không gắn nhãn và muốn nén xuống còn 30 biến quan trọng nhất để trực quan hóa và giảm chi phí huấn luyện mà ít mất mát thông tin nhất. Thuật toán nào nên được sử dụng?\n   * *Đáp án:* **PCA (Principal Component Analysis)**.\n2. **Câu 2:** Trong mạng nơ-ron sâu (Deep Neural Network) nhận diện khuôn mặt, tầng ẩn đầu tiên (First Hidden Layer) thường đảm nhận vai trò gì, và điều này khác gì với Machine Learning cổ điển?\n   * *Đáp án:* Tầng ẩn đầu tiên tự động trích xuất các **đặc trưng cấp thấp (Low-level features)** như các cạnh, đường viền sáng tối, góc nghiêng cơ bản của bức ảnh. Điểm khác biệt là Deep Learning tự động hóa hoàn toàn việc trích xuất đặc trưng (**Automatic Feature Extraction**), trong khi ML cổ điển đòi hỏi con người phải tự thiết kế đặc trưng bằng tay (**Manual Feature Engineering**).\n3. **Câu 3:** Một kỹ sư muốn xây dựng mô hình dự đoán chính xác giá bán của một căn hộ (ví dụ: $\\$245,000$) dựa trên diện tích, số phòng ngủ và khoảng cách tới trung tâm. Đây là loại bài toán gì và thuộc nhánh học máy nào?\n   * *Đáp án:* Bài toán **Hồi quy (Regression)** thuộc nhánh **Học có giám sát (Supervised Learning)** vì đầu ra là một giá trị số liên tục và dữ liệu huấn luyện có sẵn nhãn giá bán lịch sử.\n4. **Câu 4:** Sự khác biệt cốt lõi trong cách huấn luyện các cây quyết định giữa thuật toán **Random Forest (Bagging)** và **XGBoost (Boosting)** là gì?\n   * *Đáp án:* **Random Forest (Bagging)** huấn luyện nhiều cây quyết định **song song và độc lập** trên các tập con dữ liệu ngẫu nhiên rồi lấy biểu quyết đa số (giúp giảm Variance/Overfitting); trong khi **XGBoost (Boosting)** huấn luyện các cây **tuần tự nối tiếp nhau**, trong đó mỗi cây mới tập trung sửa các lỗi dự đoán sai của các cây trước đó (giúp giảm Bias).\n5. **Câu 5:** Trong quá trình huấn luyện mô hình ngôn ngữ lớn ở giai đoạn căn chỉnh (Alignment - RLHF), mô hình sinh ra câu trả lời, nhận điểm số đánh giá (Reward) từ mô hình phần thưởng và tự điều chỉnh chính sách (Policy) để tối đa hóa tổng điểm thưởng. Cơ chế này thuộc nhánh học máy nào?\n   * *Đáp án:* **Reinforcement Learning (Học tăng cường)**.\n6. **Câu 6:** Nếu một mô hình học máy có sai số rất thấp trên tập dữ liệu huấn luyện (Training Set) nhưng lại có sai số rất cao khi chạy thử trên tập dữ liệu kiểm tra (Test Set), mô hình đó đang gặp hiện tượng gì và có đặc trưng Bias/Variance như thế nào?\n   * *Đáp án:* Hiện tượng **Overfitting (Quá khớp / Học vẹt)**, đặc trưng bởi **Low Bias (Độ chệch thấp)** nhưng **High Variance (Phương sai cao)**.\n"},{"id":"mod03","file":"Module_03_Generative_AI_and_LLM.md","badge":"MODULE 03","shortTitle":"Generative AI \u0026 LLMs","domain":"Core ML \u0026 AI (30%)","weight":"Core AI","icon":"✨","content":"# Module 3: Generative AI \u0026 Large Language Models (AI Tạo sinh \u0026 Mô hình Ngôn ngữ Lớn)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 3:**\n\u003e Nắm vững sự khác biệt toán học và bản chất giữa **Discriminative AI ($P(Y \\mid X)$) vs. Generative AI ($P(X)$ / $P(X, Y)$)**; so sánh **4 họ mô hình tạo sinh (GANs, VAEs, Diffusion, Autoregressive Transformers)**; **3 động lực bùng nổ (Tipping Point)**; khái niệm **Foundation Models (FM)** (huấn luyện bằng **Self-Supervised Learning** trên dữ liệu không nhãn), **Định luật Mở rộng (Chinchilla Scaling Laws)**, **Năng lực Trỗi dậy (Emergent Abilities)** và tính đa phương thức (**Multimodal**); quy trình **3 giai đoạn huấn luyện LLM hiện đại (Pre-training $\\to$ SFT $\\to$ RLHF / DPO / RLAIF)**; và con đường tiến hóa NLP từ **One-Hot / TF-IDF $\\to$ Word2Vec (CBOW \u0026 Skip-gram) / GloVe $\\to$ RNN/LSTM $\\to$ Transformer**.\n\n---\n\n## 1. Bản chất của Generative AI (AI Tạo sinh)\n\n### 1.1. Phân biệt Mô hình Phân biệt (Discriminative AI) vs. Mô hình Tạo sinh (Generative AI)\nTrong đề thi NCA-GENL, câu hỏi thường yêu cầu phân biệt sự khác nhau về bản chất toán học và đầu ra giữa mô hình ML/DL truyền thống (Discriminative) và Generative AI:\n\n* **Discriminative AI (Mô hình Phân biệt / Dự đoán):**\n  * *Bản chất toán học:* Học **ranh giới quyết định (Decision Boundary)** phân chia giữa các lớp dữ liệu sẵn có, tức là tính xác suất có điều kiện $P(Y \\mid X)$ (biết đặc trưng đầu vào $X$, dự đoán nhãn $Y$).\n  * *Ví dụ:* Nhìn bức ảnh đoán xem đó là `\"Chó\"` hay `\"Mèo\"` (CNN ResNet); đọc email đoán xem là `\"Spam\"` hay `\"Không Spam\"` (BERT / Logistic Regression); dự đoán giá cổ phiếu ngày mai. Mô hình này chỉ biết phân loại hoặc chấm điểm chứ **không thể tự vẽ ra một bức ảnh con mèo mới**.\n* **Generative AI (Mô hình Tạo sinh):**\n  * *Bản chất toán học:* Học **phân phối xác suất nội tại của toàn bộ tập dữ liệu** $P(X)$ (hoặc phân phối đồng thời $P(X, Y)$), từ đó có khả năng lấy mẫu (Sample) từ phân phối đã học để **sáng tạo ra dữ liệu hoàn toàn mới và nguyên bản (Synthetic / Original Content)** mang đầy đủ đặc trưng của dữ liệu thật nhưng chưa từng tồn tại trước đó.\n\n```mermaid\nflowchart TD\n    subgraph TradML[\"1. Traditional ML (Discriminative - Học máy cổ điển)\"]\n        direction LR\n        I1[\"Đầu vào Đơn giản\u003cbr/\u003e(Dữ liệu dạng bảng: Tuổi, Thu nhập)\"] --\u003e M1[\"Mô hình ML\u003cbr/\u003e(XGBoost / Logistic / SVM)\"] --\u003e O1[\"Đầu ra Đơn giản\u003cbr/\u003e(Nhãn: Duyệt vay / Từ chối)\"]\n    end\n\n    subgraph TradDL[\"2. Traditional Deep Learning (Discriminative DL)\"]\n        direction LR\n        I2[\"Đầu vào Phức tạp\u003cbr/\u003e(Bức ảnh triệu điểm ảnh / File Audio)\"] --\u003e M2[\"Mô hình DL\u003cbr/\u003e(CNN - ResNet / YOLO)\"] --\u003e O2[\"Đầu ra Đơn giản\u003cbr/\u003e(Nhãn: \u0027Con mèo\u0027 - 99%)\"]\n    end\n\n    subgraph GenAI_Flow[\"3. Generative AI (AI Tạo sinh)\"]\n        direction LR\n        I3[\"Đầu vào Phức tạp\u003cbr/\u003e(Prompt văn bản, hình ảnh, âm thanh)\"] --\u003e M3[\"Mô hình GenAI\u003cbr/\u003e(Transformer / Diffusion)\"] --\u003e O3[\"Đầu ra Phức tạp \u0026 Nguyên bản\u003cbr/\u003e(Bài luận văn, Source Code, Tranh nghệ thuật 4K, Video)\"]\n    end\n```\n\n### 1.2. So sánh 4 Họ Kiến trúc Mô hình Tạo sinh Cốt lõi (Generative Model Families)\nTrước và song song với Transformer, giới nghiên cứu đã phát triển nhiều kiến trúc Generative AI khác nhau mà đề thi thường nhắc tới:\n\n| Họ Mô hình Tạo sinh | Cơ chế Hoạt động Cốt lõi | Ưu điểm \u0026 Nhược điểm | Ứng dụng Tiêu biểu |\n| :--- | :--- | :--- | :--- |\n| **1. GANs (Generative Adversarial Networks - 2014)** | Gồm 2 mạng đấu kháng nhau như trò chơi mèo vờn chuột:\u003cbr/\u003e• **Generator (Kẻ làm tiền giả):** Cố sinh ra ảnh giả giống thật nhất.\u003cbr/\u003e• **Discriminator (Cảnh sát):** Cố phân biệt ảnh thật hay ảnh giả. | • *Ưu:* Sinh ảnh rất nhanh và sắc nét.\u003cbr/\u003e• *Nhược:* Rất khó huấn luyện ổn định, dễ bị sụp đổ chế độ (**Mode Collapse** - chỉ sinh đi sinh lại một vài mẫu giống nhau). | Tạo khuôn mặt người ảo (StyleGAN), nâng cấp độ phân giải ảnh (Super-Resolution), Deepfake thế hệ đầu. |\n| **2. VAEs (Variational Autoencoders)** | Gồm **Encoder** nén dữ liệu vào một **Không gian tiềm ẩn (Latent Space)** tuân theo phân phối chuẩn Gaussian, và **Decoder** tái tạo lại dữ liệu từ vector tiềm ẩn đó. | • *Ưu:* Huấn luyện rất ổn định, không gian Latent liên tục và dễ nội suy.\u003cbr/\u003e• *Nhược:* Ảnh sinh ra trực tiếp thường hơi mờ (blurry). | Nén ảnh vào không gian Latent (thành phần cốt lõi bên trong **Stable Diffusion**), phát hiện bất thường. |\n| **3. Diffusion Models (Mô hình Khuếch tán)** | Học cách đảo ngược quá trình thêm nhiễu: bắt đầu từ màn hình nhiễu Gaussian trắng xóa và **khử nhiễu từng bước (Iterative Denoising)** theo hướng dẫn của Prompt. | • *Ưu:* Chất lượng hình ảnh/video nghệ thuật cực cao, đa dạng, không bị Mode Collapse.\u003cbr/\u003e• *Nhược:* Tốc độ suy luận chậm hơn do phải lặp nhiều bước khử nhiễu. | **Stable Diffusion, Midjourney, DALL-E 3, OpenAI Sora, NVIDIA Edify / Picasso**. |\n| **4. Autoregressive Transformers (Tự hồi quy)** | Mô hình hóa xác suất chuỗi bằng cách dự đoán phần tử (token) tiếp theo dựa trên toàn bộ các token đã sinh ra trước đó: $$P(w_1, \\dots, w_T) = \\prod_{t=1}^T P(w_t \\mid w_{\u003ct})$$ | • *Ưu:* Huấn luyện song song cực tốt trên GPU, mở rộng quy mô lên hàng nghìn tỷ tham số, suy luận logic xuất sắc.\u003cbr/\u003e• *Nhược:* Sinh token tuần tự lúc Inference, chi phí Attention bậc hai $O(N^2)$ theo chiều dài chuỗi. | **GPT-4, LLaMA-3, Claude 3.5, Mistral, NVIDIA Nemotron**. |\n\n---\n\n### 1.3. Tốc độ chấp nhận kỷ lục \u0026 Ba động lực bùng nổ (3 Pillars of the Tipping Point)\n* **Kỷ lục lịch sử:** ChatGPT chỉ mất đúng **2 tháng** để cán mốc **100 triệu người dùng**, bỏ xa TikTok (9 tháng), Instagram (2.5 năm) và Netflix (10 năm).\n* **Ba động lực cốt lõi hội tụ tạo nên điểm bùng phát (Tipping Point - Hay hỏi thi):**\n  1. **Massive Amounts of Data:** Lượng dữ liệu số hóa khổng lồ tích lũy từ Internet suốt nhiều thập kỷ (văn bản Common Crawl, Wikipedia, sách báo, hình ảnh, video, mã nguồn mở GitHub).\n  2. **Cloud Computing \u0026 Hyperscale Data Centers:** Năng lực điện toán đám mây quy mô lớn giúp việc kết nối hàng chục nghìn GPU thành một siêu máy tính huấn luyện trở nên khả thi.\n  3. **AI Accelerators \u0026 Transformer Architecture:** Đột phá kép về phần cứng chip tăng tốc AI (GPU NVIDIA với Tensor Cores, NVLink) và kiến trúc thuật toán **Transformer (2017)** (loại bỏ nút thắt tuần tự của RNN, cho phép huấn luyện song song hoàn toàn).\n\n---\n\n## 2. Mô hình Nền tảng (Foundation Models - FM) \u0026 Định luật Mở rộng (Scaling Laws)\n\nKhái niệm **Foundation Model** được định nghĩa và phổ biến bởi Viện HAI thuộc Đại học Stanford (2021):\n\n* **Định nghĩa chuẩn:** Là mô hình học sâu quy mô cực lớn (hàng tỷ đến hàng nghìn tỷ tham số) được **huấn luyện trước (Pre-trained)** trên tập dữ liệu khổng lồ, đa dạng và **không gắn nhãn (Massive Unlabeled Data)** thông qua phương pháp **Học tự giám sát (Self-Supervised Learning - SSL)**.\n  * *Làm rõ cơ chế Self-Supervised Learning cho Developer:* Tại sao dữ liệu không có nhãn do con người gán mà mô hình vẫn tính được hàm Loss để học? Vì thuật toán **tự động rút trích nhãn giám sát từ chính cấu trúc của dữ liệu thô**!\n    * *Trong Ngôn ngữ (Autoregressive / Masked):* Lấy câu văn *\"Trời hôm nay rất đẹp\"* trên Internet, che chữ *\"đẹp\"* đi (`\"Trời hôm nay rất ___\"`), bắt mô hình đoán chữ tiếp theo rồi đối chiếu trực tiếp với chữ *\"đẹp\"* có sẵn trong văn bản gốc để tính Cross-Entropy Loss.\n    * *Trong Thị giác (Contrastive / Masked Autoencoders):* Che 75% các ô vuông (patches) của một bức ảnh và bắt mô hình vẽ lại phần bị che.\n    * Nhờ **Self-Supervised Learning**, nhân loại đã phá bỏ được rào cản tốn kém nhất của Supervised Learning truyền thống (thuê con người ngồi gắn nhãn từng mẫu), cho phép nạp hàng chục nghìn tỷ từ vựng trên toàn bộ Internet vào huấn luyện!\n* **Tính đa năng (Versatility / Homogenization - One Model, Many Tasks):** Khác với mô hình ML truyền thống (Narrow AI - mỗi tác vụ phải huấn luyện 1 mô hình riêng từ đầu), một Foundation Model đóng vai trò như \"nền móng chung\", có thể thích ứng (**Adapt / Prompt / Fine-tune**) cho hàng trăm tác vụ hạ nguồn (**Downstream Tasks**) khác nhau.\n\n```mermaid\nflowchart TD\n    Data[\"Kho dữ liệu khổng lồ không gắn nhãn\u003cbr/\u003e(Massive Unlabeled Data: Text, Images, Code, Audio, Video, Biology)\"]\n    \n    FM[\"FOUNDATION MODEL (Mô hình Nền tảng)\u003cbr/\u003ePre-trained bằng Self-Supervised Learning trên hàng nghìn GPU\"]\n    \n    T1[\"Tóm tắt văn bản\u003cbr/\u003e(Summarization)\"]\n    T2[\"Dịch thuật đa ngôn ngữ\u003cbr/\u003e(Translation)\"]\n    T3[\"Hỏi đáp \u0026 Chatbot\u003cbr/\u003e(Q\u0026A / Assistant)\"]\n    T4[\"Sinh \u0026 Debug mã nguồn\u003cbr/\u003e(Code Generation)\"]\n    T5[\"Phân tích dữ liệu khoa học\u003cbr/\u003e(Protein / Weather / Medical Imaging)\"]\n\n    Data ==\u003e|\"Pre-training (Tốn triệu USD)\"| FM\n    FM --\u003e|Adaptation / Fine-tuning / Prompting| T1 \u0026 T2 \u0026 T3 \u0026 T4 \u0026 T5\n```\n\n### 2.1. Định luật Mở rộng (Scaling Laws) \u0026 Năng lực Trỗi dậy (Emergent Abilities)\n1. **Định luật Mở rộng (Neural Scaling Laws - Kaplan et al. \u0026 Chinchilla Scaling Laws - Hoffmann et al.):**\n   * Phát hiện thực nghiệm quan trọng: Sai số (Cross-Entropy Loss) của mô hình ngôn ngữ giảm đều đặn theo hàm mũ (Power-law) khi ta tăng đồng thời **3 yếu tố**:\n     1. **Kích thước mô hình ($N$ - Số lượng tham số Parameters)**.\n     2. **Kích thước tập dữ liệu huấn luyện ($D$ - Số lượng Tokens)**.\n     3. **Ngân sách tính toán ($C$ - Compute FLOPs)**.\n   * **Định luật Chinchilla (Compute-Optimal Scaling):** Chỉ ra rằng thay vì chỉ chạy đua làm mô hình thật to mà học ít dữ liệu, để tối ưu hóa hiệu năng trên mỗi đồng chi phí GPU, khi tăng gấp đôi số lượng tham số mô hình ($N$), ta cũng phải tăng gấp đôi lượng dữ liệu huấn luyện ($D$), với tỷ lệ vàng xấp xỉ **$D \\approx 20 \\times N$** (ví dụ mô hình 70B tham số cần tối thiểu $\\sim 1.4\\text{ nghìn tỷ tokens}$, và ngày nay như LLaMA-3 8B/70B được train tới **15 nghìn tỷ tokens** để tối ưu hóa suy luận!).\n2. **Năng lực Trỗi dậy (Emergent Abilities):**\n   * Là những kỹ năng phức tạp **không hề xuất hiện ở các mô hình nhỏ** (ví dụ dưới 1B tham số), nhưng đột nhiên xuất hiện mạnh mẽ khi quy mô mô hình vượt qua một ngưỡng tới hạn (ví dụ $10\\text{B} - 100\\text{B}$ tham số):\n     * **In-Context Learning (Few-shot learning):** Học cách làm một nhiệm vụ mới toanh chỉ qua vài ví dụ ngay trong Prompt mà không cần cập nhật trọng số.\n     * **Multi-step Arithmetic \u0026 Chain-of-Thought Reasoning:** Giải toán đố nhiều bước, lập luận logic nhân quả, viết code phức tạp.\n\n### 2.2. Đa phương thức (Multimodal Foundation Models)\nMột Foundation Model hiện đại không chỉ giới hạn ở chữ viết mà có thể xử lý, căn chỉnh không gian biểu diễn (Shared Embedding Space) và chuyển đổi qua lại nhiều định dạng dữ liệu (**Modalities**) cùng lúc:\n* **Text** (Văn bản, Code) $\\leftrightarrow$ **Vision** (Hình ảnh, Video - *VLMs như GPT-4o, LLaVA, NVIDIA VILA*) $\\leftrightarrow$ **Audio** (Giọng nói, Âm nhạc) $\\leftrightarrow$ **3D / Robotics / Physical AI** (**NVIDIA Cosmos**) $\\leftrightarrow$ **Scientific Data** (Cấu trúc Protein/DNA với **NVIDIA BioNeMo**, dự báo khí hậu toàn cầu với **NVIDIA Earth-2 / FourCastNet**).\n\n---\n\n## 3. Mô hình Ngôn ngữ Lớn (LLM) \u0026 Quy trình Huấn luyện 3 Giai đoạn\n\n* **Định nghĩa:** **LLM (Large Language Model)** là một loại **Foundation Model chuyên sâu về ngôn ngữ**, được thiết kế để hiểu, xử lý và sinh ra văn bản tự nhiên (hoặc mã nguồn) bằng cách học phân phối xác suất của ngôn ngữ trên hàng nghìn tỷ token.\n* **Công thức tạo nên một LLM xuất sắc:**\n  $$\\text{LLM Xuất Sắc} = \\text{Dữ liệu Sạch \\\u0026 Đa Dạng} + \\text{Kiến trúc Co giãn (Transformer)} + \\text{Quy trình Huấn luyện \\\u0026 Căn chỉnh Đa tầng}$$\n\n### Làm rõ Quy trình Huấn luyện 3 Giai đoạn của LLM hiện đại (Pre-training $\\to$ SFT $\\to$ Alignment):\nĐây là phần kiến thức rất quan trọng trong đề thi NCA-GENL để hiểu sự khác biệt giữa **Base Model**, **Instruct Model** và **Aligned Chat Model**:\n\n```mermaid\nflowchart LR\n    S1[\"Giai đoạn 1: Pre-training\u003cbr/\u003e(Huấn luyện trước Tự giám sát)\u003cbr/\u003e📚 Đọc hàng nghìn tỷ token không nhãn\u003cbr/\u003e🎯 Mục tiêu: Next-token Prediction (CLM)\u003cbr/\u003e💰 Chi phí: 95-99% tổng ngân sách GPU\u003cbr/\u003e👉 Tạo ra: BASE MODEL\u003cbr/\u003e(Có tri thức rộng nhưng chỉ biết viết nối tiếp câu,\u003cbr/\u003echưa biết trả lời câu hỏi hay vâng lời)\"]\n    \n    S2[\"Giai đoạn 2: SFT\u003cbr/\u003e(Supervised Fine-Tuning / Instruction Tuning)\u003cbr/\u003e👩‍🏫 Học trên 10K - 1M cặp dữ liệu chất lượng cao:\u003cbr/\u003e(Instruction Prompt -\u003e Ideal Response)\u003cbr/\u003e💰 Chi phí: Thấp hơn nhiều (Vài ngày)\u003cbr/\u003e👉 Tạo ra: INSTRUCT MODEL\u003cbr/\u003e(Biết đóng vai trợ lý và làm theo hướng dẫn)\"]\n    \n    S3[\"Giai đoạn 3: Alignment (RLHF / DPO)\u003cbr/\u003e(Căn chỉnh theo Giá trị \u0026 Sở thích Con người)\u003cbr/\u003e⚖️ Học từ dữ liệu so sánh cặp (Chosen vs Rejected)\u003cbr/\u003etheo 3 tiêu chí: Helpful, Honest, Harmless (3H)\u003cbr/\u003e👉 Tạo ra: ALIGNED CHAT MODEL\u003cbr/\u003e(An toàn, lịch sự, từ chối yêu cầu độc hại)\"]\n\n    S1 ==\u003e S2 ==\u003e S3\n```\n\n* **Ví dụ thực tế phân biệt hành vi của Base Model vs. Instruct/Chat Model:**\n  * Nếu bạn đưa Prompt: *\"Thủ đô của nước Pháp là gì?\"*\n  * **Base Model (chỉ mới qua Giai đoạn 1):** Vì nó chỉ học hoàn thành văn bản giống trên mạng, nó có thể viết tiếp: *\"Thủ đô của nước Đức là gì? Thủ đô của nước Ý là gì? (Trích đề thi Địa lý lớp 7)...\"*!\n  * **Instruct / Aligned Model (đã qua Giai đoạn 2 \u0026 3):** Hiểu đây là một câu hỏi chỉ thị và trả lời ngay: *\"Thủ đô của nước Pháp là Paris.\"*\n\n### Phân biệt chuyên sâu ở Giai đoạn 3: RLHF (PPO) vs. DPO vs. RLAIF\nTrong đề thi NCA-GENL, bạn cần nắm rõ cách thức các kỹ sư căn chỉnh (Align) mô hình:\n\n| Phương pháp Căn chỉnh | Quy trình Kỹ thuật | Ưu điểm \u0026 Đặc điểm Nhận diện trong Đề thi |\n| :--- | :--- | :--- |\n| **1. RLHF (Reinforcement Learning from Human Feedback)** | Quy trình 2 pha phức tạp:\u003cbr/\u003e• **Pha A:** Cho LLM sinh nhiều câu trả lời cho cùng 1 prompt; con người xếp hạng ($A \u003e B \u003e C$) để huấn luyện một **Mô hình Phần thưởng riêng biệt (Reward Model - RM)**.\u003cbr/\u003e• **Pha B:** Dùng thuật toán học tăng cường **PPO (Proximal Policy Optimization)** để tối ưu LLM sao cho đạt điểm thưởng cao nhất từ RM (kèm hàm phạt **KL-Divergence** để LLM không bị biến dạng quá xa so với bản SFT). | Hiệu quả cao, tạo nên thành công của ChatGPT/GPT-4, nhưng **tốn rất nhiều VRAM** (phải nạp cùng lúc 4 mô hình vào bộ nhớ: Actor, Critic, Reference, Reward Model) và quá trình RL dễ mất ổn định. |\n| **2. DPO (Direct Preference Optimization)** | **Bỏ qua hoàn toàn việc huấn luyện Reward Model và không cần vòng lặp Reinforcement Learning (PPO)!** Dùng biến đổi toán học để tối ưu trực tiếp trọng số của LLM bằng hàm mất mát phân loại (Binary Cross-Entropy Loss) ngay trên tập dữ liệu cặp **(Câu trả lời được chọn `Chosen` vs. Câu trả lời bị loại `Rejected`)**. | **Đơn giản, cực kỳ ổn định, nhẹ VRAM và huấn luyện nhanh hơn RLHF rất nhiều!** Được dùng phổ biến để căn chỉnh LLaMA-3, Mistral, Zephyr. |\n| **3. RLAIF (RL from AI Feedback)** | Thay vì thuê con người chấm điểm từng cặp câu trả lời tốn kém, sử dụng một **LLM khổng lồ thông minh hơn (như GPT-4 hoặc Nemotron-4 340B Reward)** làm giám khảo chấm điểm phản hồi tự động. | Mở rộng quy mô căn chỉnh lên hàng triệu mẫu với chi phí thấp và tốc độ nhanh. |\n\n---\n\n## 4. Con đường tiến hóa kỹ thuật NLP: Từ One-Hot / TF-IDF $\\to$ Word Embedding $\\to$ RNN $\\to$ Transformer\n\nĐể hiểu tại sao kiến trúc Transformer lại vĩ đại, đề thi yêu cầu bạn nắm rõ từng bậc thang tiến hóa của cách máy tính biểu diễn ngôn ngữ:\n\n### 4.1. Bậc 0: Biểu diễn Rời rạc Cổ điển (One-Hot Encoding, Bag-of-Words \u0026 TF-IDF)\nTrước khi có mạng nơ-ron nhúng từ, máy tính biến chữ thành số như thế nào?\n1. **One-Hot Encoding:** Nếu từ điển có $50.000$ từ, mỗi từ là một vector dài $50.000$ phần tử toàn số `0`, chỉ có duy nhất một số `1` tại vị trí index của từ đó.\n   * *2 Nhược điểm chí mạng:* Vector quá dài và thưa (**Sparse \u0026 High-dimensional**); tích vô hướng giữa mọi cặp từ khác nhau đều bằng `0` ($\\overrightarrow{\\text{Chó}} \\cdot \\overrightarrow{\\text{Mèo}} = 0$ và $\\overrightarrow{\\text{Chó}} \\cdot \\overrightarrow{\\text{Tủ lạnh}} = 0$) $\\to$ **Hoàn toàn không biết hai từ nào có nghĩa gần nhau!**\n2. **Bag-of-Words (BoW) \u0026 TF-IDF (Term Frequency – Inverse Document Frequency):**\n   * Đếm tần suất xuất hiện của từ trong văn bản (**TF**), nhân với độ hiếm của từ đó trên toàn bộ kho tài liệu (**IDF** = phạt nặng những từ dừng xuất hiện ở mọi nơi như *\"the\", \"is\", \"của\", \"và\"*, tôn vinh những từ khóa đặc trưng hiếm gặp).\n   * *Hạn chế:* Làm mất hoàn toàn thứ tự từ trong câu và không hiểu được từ đồng nghĩa.\n\n---\n\n### 4.2. Bậc 1: Static Word Embeddings (Nhúng từ tĩnh) \u0026 Hai kiến trúc của Word2Vec (2013)\n* **Word Embedding là gì?** Là kỹ thuật ánh xạ mỗi từ vựng thành một **Vector số thực dày đặc có số chiều cố định nhỏ gọn** (**Dense Vector**, thường từ `100` đến `4096` chiều, ví dụ `[0.12, -0.85, 0.44, ...]`).\n* **Bảo toàn ngữ nghĩa (Semantic Preservation - Distributional Hypothesis):** *\"Bạn sẽ biết ý nghĩa của một từ thông qua những từ hay đi kèm với nó\"*. Các từ có ý nghĩa tương tự hoặc xuất hiện trong ngữ cảnh giống nhau sẽ tự động tụ lại gần nhau trong không gian vector (khoảng cách Cosine giữa `\"Chó\"` và `\"Mèo\"` rất gần nhau, cách xa `\"Máy bay\"`).\n* **Tính chất đại số tuyến tính trên ngữ nghĩa (Vector Arithmetic):**\n  $$\\overrightarrow{\\text{King}} - \\overrightarrow{\\text{Man}} + \\overrightarrow{\\text{Woman}} \\approx \\overrightarrow{\\text{Queen}}$$\n  $$\\overrightarrow{\\text{Paris}} - \\overrightarrow{\\text{France}} + \\overrightarrow{\\text{Germany}} \\approx \\overrightarrow{\\text{Berlin}}$$\n* **Thuật toán Word2Vec (Mikolov et al. - Google, 2013):** Sử dụng mạng nơ-ron nông 2 lớp học tự giám sát qua 2 kiến trúc đối ngược nhau (Cần phân biệt rõ trong đề thi!):\n  1. **CBOW (Continuous Bag of Words):** Lấy **các từ ngữ cảnh xung quanh (Surrounding Context Words)** làm đầu vào để dự đoán **1 từ bị khuyết ở chính giữa (Target Center Word)**. (Ví dụ: Đầu vào `[\"Con\", \"ngồi\", \"trên\", \"thảm\"]` $\\to$ Đoán từ giữa `\"mèo\"`). *Đặc điểm:* Huấn luyện nhanh hơn, biểu diễn rất tốt các từ phổ biến.\n  2. **Skip-gram:** Lấy **1 từ đích ở chính giữa (Center Word)** làm đầu vào để dự đoán **các từ ngữ cảnh xung quanh nó** trong một cửa sổ trượt. (Ví dụ: Đầu vào `\"mèo\"` $\\to$ Đoán `\"Con\"`, `\"ngồi\"`, `\"trên\"`, `\"thảm\"`). *Đặc điểm:* Huấn luyện chậm hơn một chút nhưng biểu diễn các **từ hiếm (Rare words)** chính xác hơn nhiều so với CBOW!\n* *(Bên cạnh Word2Vec còn có **GloVe** dựa trên ma trận đồng xuất hiện toàn cục và **FastText** tách từ thành các mảnh ký tự n-gram để xử lý từ viết sai chính tả).*\n\n```mermaid\nflowchart LR\n    subgraph Space[\"Không gian Vector Ngữ nghĩa (Semantic Vector Space)\"]\n        direction TB\n        K[\"Vector \u0027King\u0027\u003cbr/\u003e[0.9, 0.8, 0.1]\"]\n        M[\"Vector \u0027Man\u0027\u003cbr/\u003e[0.2, 0.8, 0.1]\"]\n        W[\"Vector \u0027Woman\u0027\u003cbr/\u003e[0.2, 0.1, 0.1]\"]\n        Q[\"Vector \u0027Queen\u0027\u003cbr/\u003e[0.9, 0.1, 0.1]\"]\n        \n        M -.-\u003e|\"Quan hệ Hoàng gia (+0.7 chiều đầu)\"| K\n        W -.-\u003e|\"Quan hệ Hoàng gia (+0.7 chiều đầu)\"| Q\n        K ==\u003e|\"King - Man + Woman\"| Q\n    end\n```\n\n---\n\n### 4.3. Bậc 2: Hạn chế của Embedding tĩnh \u0026 Sự ra đời của Mạng hồi quy (RNN / LSTM / GRU)\n1. **Hạn chế của Static Word Embedding (Word2Vec/GloVe) – Bài toán Từ đa nghĩa (Polysemy):**\n   * Trong Word2Vec, mỗi từ trong từ điển chỉ được gán đúng **1 vector cố định duy nhất (Static Embedding)** bất chấp ngữ cảnh!\n   * Ví dụ: Từ **`\"bank\"`** trong câu *\"I deposited money in the **bank**\"* (Ngân hàng) và *\"I sat by the river **bank**\"* (Bờ sông), hoặc từ **`\"apple\"`** (quả táo vs. hãng Apple) bị ép dùng chung 1 vector giống hệt nhau! Hơn nữa, nó không xử lý được cấu trúc câu dài.\n2. **Recurrent Neural Networks (RNN) \u0026 LSTM (Long Short-Term Memory):**\n   * Để xử lý chuỗi văn bản theo thứ tự thời gian, **RNN** đưa từng từ vào mạng lần lượt từ trái sang phải ($t_1 \\to t_2 \\to t_3 \\dots$) và duy trì một vector **Trạng thái ẩn (Hidden State $h_t$)** đóng vai trò làm \"bộ nhớ ngắn hạn\" truyền từ bước trước sang bước sau: $h_t = f(W \\cdot h_{t-1} + U \\cdot x_t)$.\n   * **LSTM** và **GRU** cải tiến RNN bằng cách thêm các cổng điều khiển (**Forget Gate, Input Gate, Output Gate**) và đường truyền **Cell State** để giữ thông tin lâu hơn một chút.\n   * **HAI HẠN CHẾ CHÍ MẠNG CỦA RNN / LSTM (Câu hỏi tủ luôn xuất hiện trong đề thi NCA-GENL!):**\n     * **Thứ nhất – Nút thắt xử lý tuần tự (Sequential Bottleneck $\\to$ Không thể song song hóa trên GPU):** Để tính được trạng thái ẩn $h_t$ của từ thứ $100$, mạng RNN bắt buộc phải đợi tính xong từ thứ $1, 2, \\dots, 99$. Sự phụ thuộc tuần tự theo thời gian này khiến hàng nghìn nhân GPU không thể tính toán các từ trong câu cùng một lúc, làm quá trình huấn luyện trên tập dữ liệu lớn trở nên chậm chạp bất khả thi!\n     * **Thứ hai – Quên ngữ cảnh dài \u0026 Triệt tiêu đạo hàm theo thời gian (Loss of Long-Range Dependencies \u0026 Vanishing Gradients through Time):** Khi chuỗi văn bản dài hàng trăm từ, thông tin từ những từ ở đầu câu bị nén ép và phai nhạt dần qua các phép nhân ma trận liên tiếp (triệt tiêu đạo hàm BPTT), khiến mô hình \"quên sạch\" chủ ngữ ở đầu đoạn văn khi đọc đến cuối đoạn.\n\n---\n\n### 4.4. Bậc 3: Cuộc cách mạng Transformer (2017) – Xóa bỏ sự tuần tự bằng Self-Attention\nKiến trúc **Transformer** đập bỏ hoàn toàn cơ chế đọc từng từ tuần tự của RNN và thay bằng cơ chế **Self-Attention (Tự chú ý)** kết hợp **Contextualized Embeddings** (mỗi từ có một vector động thay đổi linh hoạt theo đúng ngữ cảnh của câu đó!):\n\n```mermaid\nflowchart TD\n    subgraph RNN_Arch[\"1. Kiến trúc RNN / LSTM (Tuần tự từng bước - Nghẽn cổ chai trên GPU \u0026 Quên đầu câu)\"]\n        direction LR\n        W1[\"Từ 1\u003cbr/\u003e(t₁)\"] --\u003e|h₁| W2[\"Từ 2\u003cbr/\u003e(t₂)\"] --\u003e|h₂| W3[\"Từ 3\u003cbr/\u003e(t₃)\"] --\u003e|h₃| W4[\"Từ 4\u003cbr/\u003e(t₄ - Bắt buộc đợi t₁..t₃ xong mới tính được!)\"]\n    end\n\n    subgraph Trans_Arch[\"2. Kiến trúc Transformer (Song song 100% trên GPU + Self-Attention)\"]\n        direction TB\n        AllWords[\"Nạp ĐỒNG THỜI toàn bộ chuỗi vào GPU cùng một lúc: [Từ 1, Từ 2, Từ 3, Từ 4] (+ Positional Encoding)\"]\n        Attn[\"Cơ chế Self-Attention:\u003cbr/\u003eNhân ma trận (Q × Kᵀ) tính trực tiếp mức độ liên kết giữa MỌI cặp từ bất kể khoảng cách xa gần (O(1) path length)\"]\n        GPU_Out[\"Tận dụng 100% Tensor Cores trên GPU\u003cbr/\u003eHiểu sâu ngữ cảnh động (Contextualized Embedding) \u0026 Mở rộng lên hàng nghìn tỷ tham số!\"]\n        \n        AllWords ==\u003e Attn ==\u003e GPU_Out\n    end\n```\n\n---\n\n## 5. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 3:**\n\u003e 1. **Bẫy RNN vs. Transformer:** Tại sao Transformer huấn luyện nhanh hơn và hiệu quả hơn RNN vượt trội trên GPU? $\\to$ Vì Transformer **loại bỏ sự phụ thuộc tuần tự (sequential dependency)** của RNN, cho phép xử lý toàn bộ các token trong chuỗi **song song (in parallel)** và nắm bắt sự phụ thuộc tầm xa (long-range dependencies) trực tiếp qua cơ chế **Self-Attention**.\n\u003e 2. **Bẫy CBOW vs. Skip-gram (Word2Vec):** Dùng các từ xung quanh đoán 1 từ ở giữa $\\to$ **CBOW**. Dùng 1 từ ở giữa đoán các từ ngữ cảnh xung quanh $\\to$ **Skip-gram**.\n\u003e 3. **Bẫy RLHF vs. DPO:** Phương pháp căn chỉnh (Alignment) nào giúp tinh chỉnh LLM theo sở thích con người một cách trực tiếp trên các cặp dữ liệu ưu tiên mà **không cần huấn luyện một mô hình phần thưởng (Reward Model) riêng biệt và không cần PPO**? $\\to$ Chọn **DPO (Direct Preference Optimization)**.\n\u003e 4. **Bẫy Foundation Model:** Foundation Model được huấn luyện ban đầu (Pre-trained) bằng phương pháp nào? $\\to$ **Self-supervised learning trên tập dữ liệu khổng lồ không gắn nhãn (Massive unlabeled data)**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Trong quá trình hoàn thiện một mô hình LLM, giai đoạn nào sử dụng phản hồi đánh giá của con người để điều chỉnh mô hình sao cho câu trả lời trở nên an toàn, hữu ích và không độc hại?\n   * *Đáp án:* Giai đoạn **Alignment (Căn chỉnh)** sử dụng **RLHF (Reinforcement Learning from Human Feedback)** hoặc **DPO (Direct Preference Optimization)**.\n2. **Câu 2:** Đâu là sự khác biệt cơ bản giữa mô hình Discriminative AI (như phân loại ảnh) và mô hình Generative AI?\n   * *Đáp án:* Discriminative AI học ranh giới phân loại $P(Y \\mid X)$ để trả về nhãn dự đoán cho dữ liệu có sẵn, trong khi Generative AI học phân phối xác suất của dữ liệu $P(X)$ để **sáng tạo ra nội dung mới và nguyên bản**.\n3. **Câu 3:** Trong hai kiến trúc của thuật toán nhúng từ **Word2Vec**, kiến trúc nào nhận đầu vào là một từ đích duy nhất ở vị trí trung tâm và cố gắng dự đoán các từ ngữ cảnh xung quanh nó (đặc biệt hiệu quả cho các từ hiếm)?\n   * *Đáp án:* **Skip-gram** (ngược lại với CBOW dùng các từ xung quanh để đoán từ trung tâm).\n4. **Câu 4:** Một nhóm nghiên cứu muốn huấn luyện trước (Pre-train) một Foundation Model từ hàng tỷ trang văn bản thu thập trên Internet nhưng không có kinh phí thuê người gắn nhãn cho từng câu. Phương pháp học máy nào cho phép mô hình tự che đi các từ trong câu hoặc tự lấy từ tiếp theo làm nhãn mục tiêu để học?\n   * *Đáp án:* **Self-Supervised Learning (Học tự giám sát)**.\n5. **Câu 5:** Tại sao biểu diễn từ bằng **Static Word Embeddings (như Word2Vec)** lại gặp khó khăn khi xử lý câu văn: *\"He went to the **bank** to deposit cash after walking along the river **bank**\"*?\n   * *Đáp án:* Vì Word2Vec chỉ gán một **vector tĩnh cố định duy nhất** cho từ `\"bank\"` bất kể ngữ cảnh, nên không thể phân biệt được hai nghĩa hoàn toàn khác nhau (\"ngân hàng\" và \"bờ sông\") của từ đa nghĩa (Polysemy) này — vấn đề mà **Contextualized Embeddings** trong Transformer giải quyết triệt để.\n6. **Câu 6:** Theo **Định luật Mở rộng Chinchilla (Chinchilla Scaling Laws)**, để tối ưu hóa hiệu năng của một mô hình ngôn ngữ lớn trong một ngân sách tính toán cố định, khi tăng gấp đôi số lượng tham số của mô hình ($N$), kỹ sư cần làm gì với lượng dữ liệu huấn luyện ($D$)?\n   * *Đáp án:* Cần **tăng gấp đôi lượng dữ liệu huấn luyện (số lượng tokens $D$)** theo tỷ lệ cân bằng (xấp xỉ ~20 tokens cho mỗi tham số) thay vì chỉ tăng kích thước mô hình.\n"},{"id":"mod04","file":"Module_04_Transformer_Architecture.md","badge":"MODULE 04","shortTitle":"Transformer Architecture","domain":"Core ML \u0026 Experimentation","weight":"Core / Exp","icon":"⚡","content":"# Module 4: Transformer Architecture (Kiến trúc Transformer Chuyên sâu)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 4 (Chiếm tỷ trọng câu hỏi rất cao!):**\n\u003e Thuộc lòng bài báo lịch sử **\"Attention Is All You Need\" (2017)**; nắm chắc **6 bước trong Pipeline xử lý đầu-cuối của Transformer** và giải phẫu bên trong 1 khối Transformer (**LayerNorm, Residual Connections, FFN/MLP**); hiểu sâu lý do dùng **Subword Tokenization (BPE, WordPiece, SentencePiece)**, **Positional Encoding (Sinusoidal \u0026 RoPE)**, bản chất toán học của **Self-Attention ($Q, K, V$), Masked Causal Attention, Cross-Attention** và sự tiến hóa **MHA $\\to$ MQA $\\to$ GQA + KV Cache + FlashAttention**; nắm rõ **các chiến lược và tham số điều khiển sinh văn bản (Greedy, Beam Search, Temperature, Top-K, Top-P)**; và đặc biệt là bảng phân loại **3 biến thể kiến trúc (Encoder-only vs. Decoder-only vs. Encoder-Decoder)** cùng kiến trúc **MoE (Mixture of Experts)**.\n\n---\n\n## 1. Nguồn gốc lịch sử và Tầm ảnh hưởng\n\n* **Tháng 6 năm 2017:** Nhóm 8 nhà nghiên cứu tại Google Brain và Google Research (Ashish Vaswani et al.) công bố bài báo khoa học kinh điển mang tên **\"Attention Is All You Need\"** tại hội nghị NeurIPS.\n* **Ý nghĩa của tên bài báo:** Trước năm 2017, giới AI mặc định rằng để dịch máy hay xử lý chuỗi ngôn ngữ, bắt buộc phải dùng mạng hồi quy (**RNN / LSTM / GRU**) hoặc mạng tích chập (CNN) làm khung xương chính, còn cơ chế Attention (như Bahdanau/Luong Attention) chỉ là linh kiện phụ trợ gắn thêm vào RNN. Bài báo này đưa ra tuyên bố táo bạo: *Hãy vứt bỏ hoàn toàn cấu trúc tuần tự của RNN đi, chỉ cần cơ chế Self-Attention là đủ để xây dựng một mô hình ngôn ngữ vừa nhanh hơn gấp chục lần trên GPU vừa thông minh hơn vượt trội!*\n* **Tầm ảnh hưởng:** Khai sinh ra kiến trúc **Transformer** (chính là chữ **T** trong **GPT** - *Generative Pre-trained Transformer* và **BERT** - *Bidirectional Encoder Representations from Transformers*), trở thành động cơ cốt lõi đằng sau toàn bộ cuộc cách mạng Generative AI ngày nay (từ ngôn ngữ, lập trình, sinh học phân tử đến cả thị giác máy tính **ViT** và video **DiT**).\n\n---\n\n## 2. Quy trình xử lý đầu-cuối của Transformer (End-to-End Pipeline) \u0026 Giải phẫu Khối Transformer\n\n### 2.1. Hành trình 6 bước của một Prompt đi qua Transformer\nHãy theo dõi hành trình của một câu đố ngôn ngữ từ lúc người dùng gõ vào bàn phím cho đến khi mô hình sinh ra câu trả lời:\n**Input Prompt:** `\"A puppy is to dog as kitten is to...\"`\n\n```mermaid\nflowchart TD\n    Input[\"Chuỗi văn bản thô (Raw Text Input)\u003cbr/\u003e\u0027A puppy is to dog as kitten is to\u0027\"]\n    \n    S1[\"Bước 1: Tokenization (Mã hóa phân đoạn)\u003cbr/\u003eCắt văn bản thành các mảnh Tokens (từ hoặc subword)\u003cbr/\u003e[\u0027A\u0027, \u0027 puppy\u0027, \u0027 is\u0027, \u0027 to\u0027, \u0027 dog\u0027, \u0027 as\u0027, \u0027 kitten\u0027, \u0027 is\u0027, \u0027 to\u0027]\"]\n    \n    S2[\"Bước 2: Encoding (Ánh xạ sang Token IDs)\u003cbr/\u003eTra cứu trong Vocabulary cố định để lấy mảng số nguyên\u003cbr/\u003e[101, 2166, 2003, 2000, 2670, 2004, 8392, 2003, 2000]\"]\n    \n    S3[\"Bước 3: Token Embedding + Positional Encoding\u003cbr/\u003eBiến mỗi ID thành Vector số thực dày đặc (VD: d_model = 4096 chiều)\u003cbr/\u003e+ Cộng/Xoay với Vector Vị trí để bảo toàn thứ tự trước-sau\"]\n    \n    S4[\"Bước 4: N × Transformer Blocks (Self-Attention Q,K,V + FFN + Residual + LayerNorm)\u003cbr/\u003eTính toán ma trận liên kết ngữ cảnh đa tầng:\u003cbr/\u003e\u0027kitten\u0027 liên kết ngữ nghĩa chặt chẽ với \u0027puppy\u0027 (con non) và \u0027dog\u0027 (loài vật)\"]\n    \n    S5[\"Bước 5: Decoding \u0026 Prediction (Linear LM Head -\u003e Logits -\u003e Softmax)\u003cbr/\u003eTính phân phối xác suất cho toàn bộ từ điển (áp dụng Temperature / Top-K / Top-P):\u003cbr/\u003eP(\u0027cat\u0027) = 0.78 | P(\u0027feline\u0027) = 0.12 | P(\u0027pet\u0027) = 0.04\"]\n    \n    S6[\"Bước 6: Output Generation (Sampling \u0026 Detokenization)\u003cbr/\u003eLấy mẫu chọn Token ID thắng cuộc và giải mã ngược thành chữ:\u003cbr/\u003e👉 \u0027cat\u0027 (Sau đó nối \u0027cat\u0027 vào chuỗi đầu vào nếu cần sinh tiếp token sau)\"]\n\n    Input --\u003e S1 --\u003e S2 --\u003e S3 --\u003e S4 --\u003e S5 --\u003e S6\n```\n\n### 2.2. Giải phẫu bên trong 1 Khối Transformer Tiêu chuẩn (Inside a Transformer Block)\nMột mô hình như LLaMA-3 8B xếp chồng $N = 32$ khối Transformer giống hệt nhau (LLaMA-3 70B xếp chồng $80$ khối). Bên trong **mỗi khối (1 Layer)** gồm **2 tầng con (Sub-layers)** cực kỳ quan trọng mà đề thi thường hỏi:\n\n```mermaid\nflowchart LR\n    In[\"Vector Đầu vào của Tầng l\u003cbr/\u003e(X)\"]\n    \n    LN1[\"1. LayerNorm / RMSNorm\u003cbr/\u003e(Chuẩn hóa về Mean=0, Std=1)\"]\n    MHA[\"2. Multi-Head Self-Attention\u003cbr/\u003e(Trộn thông tin NGỮ CẢNH giữa các Token với nhau)\"]\n    Add1((\"Cộng (+) \u003cbr/\u003eResidual / Skip Connection\"))\n    \n    LN2[\"3. LayerNorm / RMSNorm\"]\n    FFN[\"4. Feed-Forward Network (FFN / MLP)\u003cbr/\u003e(Mạng 2-3 lớp Linear + GELU/SwiGLU xử lý ĐỘC LẬP từng Token:\u003cbr/\u003eMở rộng chiều d -\u003e 4d -\u003e d, nơi lưu trữ phần lớn TRI THỨC SỰ KIỆN!)\"]\n    Add2((\"Cộng (+) \u003cbr/\u003eResidual / Skip Connection\"))\n    \n    Out[\"Vector Đầu ra truyền lên Tầng l+1\u003cbr/\u003e(X_next)\"]\n\n    In --\u003e LN1 --\u003e MHA --\u003e Add1\n    In -.-\u003e|\"Đường nối tắt (Skip Connection: x + Attention(x))\u003cbr/\u003eChống Vanishing Gradients!\"| Add1\n    \n    Add1 --\u003e LN2 --\u003e FFN --\u003e Add2\n    Add1 -.-\u003e|\"Đường nối tắt (Skip Connection: h + FFN(h))\"| Add2\n    Add2 --\u003e Out\n```\n\n\u003e [!TIP]\n\u003e **Góc nhìn Kiến trúc cho Developer:**\n\u003e * **Khối Self-Attention:** Đóng vai trò là **\"Bộ phận Giao tiếp (Communication)\"** — giúp các token khác nhau trong câu nhìn thấy nhau và trao đổi thông tin ngữ cảnh.\n\u003e * **Khối Feed-Forward Network (FFN / Position-wise MLP):** Đóng vai trò là **\"Bộ phận Suy nghĩ \u0026 Kho lưu trữ Tri thức (Computation \u0026 Factual Memory)\"** — sau khi mỗi token đã thu thập xong ngữ cảnh từ Attention, nó đi qua mạng FFN (chiếm tới ~2/3 tổng số tham số của mô hình!) để biến đổi phi tuyến và truy xuất tri thức đã học.\n\n---\n\n## 3. Giải phẫu 5 Thành phần Kỹ thuật Cốt lõi của Transformer\n\n### 3.1. Subword Tokenization (Mã hóa từ con)\nKhi thiết kế bộ Tokenizer (Bước 1), tại sao các kỹ sư không cắt theo từng từ nguyên vẹn (Whole-word) hoặc cắt theo từng chữ cái đơn lẻ (Character-level)?\n\n| Phương pháp Tokenization | Cách cắt chuỗi | Nhược điểm chí mạng |\n| :--- | :--- | :--- |\n| **1. Whole-word (Từ nguyên vẹn)** | Cắt theo khoảng trắng: `[\"unbelievable\", \"dogs\"]` | • Từ điển phình to hàng triệu từ (do chia động từ, số nhiều, từ ghép).\u003cbr/\u003e• Gặp từ mới, tên riêng hoặc từ gõ sai chính tả là dính lỗi **OOV (Out-of-Vocabulary)** $\\to$ biến thành token mù `\u003cUNK\u003e`. |\n| **2. Character-level (Từng chữ cái)** | Cắt từng ký tự: `[\u0027u\u0027, \u0027n\u0027, \u0027b\u0027, \u0027e\u0027, ...]` | • Từ điển siêu nhỏ (vài trăm ký tự), không bị OOV.\u003cbr/\u003e• Nhưng **bản thân chữ cái `\u0027u\u0027` không mang ngữ nghĩa**, và chuỗi token bị kéo dài gấp 5–7 lần làm nổ tung chi phí tính toán Attention! |\n| **3. Subword Tokenization (Mã hóa từ con - CHUẨN HIỆN ĐẠI)** | Giữ nguyên từ phổ biến (`\"dog\"`), chỉ tách từ hiếm/phức tạp thành **Tiền tố + Gốc từ + Hậu tố** | **Điểm cân bằng hoàn hảo (Sweet Spot):** Từ điển gọn nhẹ (32K – 128K tokens), giữ trọn vẹn ngữ nghĩa gốc từ và **không bao giờ bị lỗi OOV**! |\n\n* **Ví dụ kinh điển về Subword Tokenization:** Ba từ `unbelievable`, `unbreakable`, `unlikeable` không cần lưu thành 3 mục từ riêng biệt mà được lắp ghép từ 5 mảnh subword có nghĩa:\n  $$\\text{\\texttt{un}} + \\{\\text{\\texttt{believ}}, \\text{\\texttt{break}}, \\text{\\texttt{like}}\\} + \\text{\\texttt{able}}$$\n* **Quy tắc ước lượng nhanh cho Developer:** Trong tiếng Anh, trung bình **$1\\text{ token} \\approx 0.75\\text{ từ (words)} \\approx 4\\text{ ký tự}$** (tức là $100\\text{ tokens} \\approx 75\\text{ từ}$).\n* **3 Thuật toán Subword Tokenizer tiêu chuẩn cần nhớ tên trong đề thi:**\n  1. **BPE (Byte-Pair Encoding):** Bắt đầu từ các ký tự đơn lẻ, lặp đi lặp lại việc gộp cặp ký tự xuất hiện cùng nhau nhiều nhất thành token mới (Dùng trong **GPT-2/3/4 (`tiktoken`), LLaMA-3, RoBERTa**).\n  2. **WordPiece:** Tương tự BPE nhưng chọn cặp gộp dựa trên việc tối đa hóa xác suất hợp lý (Likelihood) của dữ liệu huấn luyện, đánh dấu mảnh từ con bằng ký hiệu `##` như `play`, `##ing` (Dùng trong **BERT, DistilBERT**).\n  3. **SentencePiece / Unigram:** Coi khoảng trắng cũng là một ký tự thông thường (`_`), không phụ thuộc vào việc ngôn ngữ có dùng dấu cách hay không (rất mạnh cho tiếng Nhật, Trung, Đa ngôn ngữ; dùng trong **T5, XLNet, LLaMA-1/2, Mistral**).\n\n---\n\n### 3.2. Positional Encoding (Mã hóa vị trí)\n* **Vấn đề kỹ thuật:** Vì Transformer nạp toàn bộ các từ trong câu vào GPU **cùng một lúc (song song)** thay vì đọc lần lượt từ trái sang phải như RNN, nên bản thân phép toán nhân ma trận trong Self-Attention có tính chất **bất biến với hoán vị (Permutation Invariant — tức là \"mù vị trí\")**. Nếu không có thông tin vị trí, mô hình sẽ nhìn câu văn như một \"túi chứa từ\" hỗn loạn (**Bag of Words**) và coi 2 câu hoàn toàn trái ngược nhau sau đây là giống hệt nhau:\n  * Câu 1: *\"The **cat** chased the **dog**.\"* (Mèo đuổi chó)\n  * Câu 2: *\"The **dog** chased the **cat**.\"* (Chó đuổi mèo)\n* **Giải pháp – Positional Encoding:**\n  * Trước khi đưa vào tầng Transformer đầu tiên, thông tin tọa độ vị trí thứ $1, 2, 3, \\dots, n$ của từng token được tiêm trực tiếp vào Vector Embedding.\n  * **Các phương pháp Positional Encoding chính:**\n    1. **Sinusoidal Positional Encoding (Bài báo Transformer gốc 2017):** Cộng trực tiếp một vector tạo bởi các hàm lượng giác $\\sin$ và $\\cos$ có tần số sóng khác nhau vào Word Embedding: $\\text{Input} = \\text{WordEmbedding}(x) + \\text{PositionalEncoding}(pos)$.\n    2. **RoPE (Rotary Position Embedding - Chuẩn hiện đại trên LLaMA, Mistral, Nemotron):** Thay vì cộng vector vị trí, **RoPE xoay (rotate) trực tiếp vector Query ($Q$) và Key ($K$) một góc tỷ lệ với vị trí của chúng trong mặt phẳng phức**, giúp Attention tự nhiên phụ thuộc vào **khoảng cách tương đối (Relative Distance)** giữa hai từ và mở rộng cửa sổ ngữ cảnh (Context Window) lên tới 128K – 1M tokens dễ dàng!\n\n---\n\n### 3.3. Cơ chế Self-Attention (Tự chú ý) và Bộ ba Vector Query ($Q$), Key ($K$), Value ($V$)\n* **Phép ẩn dụ:** Self-Attention hoạt động giống như một **chiếc bút dạ quang thần kỳ (Magical Highlighter)** rà soát toàn bộ câu văn ngay lập tức. Khi xử lý đại từ `\"it\"` trong hai câu kinh điển sau:\n  * Câu A: *\"The **animal** didn\u0027t cross the street because **it** was too **tired**.\"* $\\to$ Điểm Attention của `\"it\"` tập trung mạnh nhất vào **`\"animal\"`** (vì con vật mới biết mệt!).\n  * Câu B: *\"The animal didn\u0027t cross the **street** because **it** was too **wide**.\"* $\\to$ Điểm Attention của `\"it\"` tự động chuyển sang tập trung mạnh nhất vào **`\"street\"`** (vì con đường mới rộng!).\n\n#### Giải mã Toán học $Q, K, V$ theo góc nhìn Developer (Rất hay hỏi trong đề thi!):\nĐể tính toán sự liên kết giữa các từ, mỗi vector đầu vào $X$ của một token sẽ được nhân với 3 ma trận trọng số học được ($W_Q, W_K, W_V$) để sinh ra **3 vector đóng 3 vai trò khác nhau** (giống hệt như khi bạn tìm kiếm video trên YouTube hoặc truy vấn Hash Map / Database):\n\n```mermaid\nflowchart LR\n    Token[\"Vector của mỗi Token\u003cbr/\u003e(Embedding + Positional)\"]\n    \n    Q[\"1. Vector QUERY (Q = X·W_Q)\u003cbr/\u003e🔍 \u0027Câu truy vấn tìm kiếm\u0027\u003cbr/\u003eToken hiện tại đang cần tìm kiếm\u003cbr/\u003ethông tin ngữ cảnh gì từ các từ khác?\"]\n    \n    K[\"2. Vector KEY (K = X·W_K)\u003cbr/\u003e🏷️ \u0027Nhãn / Tiêu đề chỉ mục\u0027\u003cbr/\u003eToken này đang nắm giữ loại thông tin\u003cbr/\u003engữ pháp/ngữ nghĩa gì để chào mời?\"]\n    \n    V[\"3. Vector VALUE (V = X·W_V)\u003cbr/\u003e📦 \u0027Nội dung thực sự\u0027\u003cbr/\u003eThông tin ngữ nghĩa thực chất sẽ được\u003cbr/\u003etrích xuất nếu Query khớp với Key!\"]\n\n    Dot[\"Bước 1: Nhân vô hướng Q · Kᵀ\u003cbr/\u003e(Đo độ tương đồng giữa Query của từ i và Key của mọi từ j)\u003cbr/\u003eChia cho √dₖ rồi qua hàm Softmax -\u003e Ra Trọng số Attention (Tổng = 1.0)\"]\n    \n    Out[\"Bước 2: Nhân Trọng số Attention với V\u003cbr/\u003e👉 Vector đầu ra là tổng có trọng số của các Value,\u003cbr/\u003eđã ngấm trọn vẹn ngữ cảnh cả câu!\"]\n\n    Token --\u003e Q \u0026 K \u0026 V\n    Q \u0026 K --\u003e Dot\n    Dot \u0026 V --\u003e Out\n```\n\n* **Công thức Scaled Dot-Product Attention kinh điển (Cần hiểu từng thành phần):**\n  $$\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$$\n  1. **$QK^T$ (MatMul 1):** Nhân tích vô hướng giữa vector Query của từng từ với vector Key của tất cả các từ trong câu để tạo ra **Ma trận Điểm Tương đồng (Attention Scores Matrix)** kích thước $N \\times N$ (với $N$ là số lượng token trong chuỗi).\n  2. **Chia cho $\\sqrt{d_k}$ (Scale):** Tại sao phải chia cho căn bậc hai số chiều của vector Key? Vì khi số chiều $d_k$ lớn (ví dụ $d_k = 64$ hay $128$), tổng tích vô hướng $QK^T$ sẽ có phương sai rất lớn, đẩy hàm $\\text{softmax}$ vào vùng bão hòa cực đoan (một số bằng $1$, các số khác bằng $0$), làm đạo hàm tiến về $0$ (**Vanishing Gradients**). Chia cho $\\sqrt{d_k}$ giúp giữ phương sai bằng $1$ để đạo hàm luôn mượt mà!\n  3. **$\\text{softmax}(\\cdot)$:** Chuyển hóa điểm số thô thành phân phối xác suất (**Attention Weights**) nằm trong khoảng $[0, 1]$ và tổng trên mỗi hàng bằng đúng $1.0$.\n  4. **Nhân với $V$ (MatMul 2):** Nhân ma trận trọng số xác suất vừa tìm được với ma trận **Value ($V$)** để gom thông tin ngữ nghĩa về cho từng token.\n\n### 3.4. Phân biệt 3 Cơ chế Attention: Bidirectional Self-Attention vs. Masked Causal Attention vs. Cross-Attention\nĐề thi rất hay hỏi sự khác nhau về cách hoạt động của Attention trong Encoder và Decoder:\n1. **Bidirectional Self-Attention (Dùng trong khối Encoder như BERT):** Mọi token ở vị trí $i$ được phép nhìn thấy **toàn bộ các token ở cả phía trước ($\u003c i$) và phía sau ($\u003e i$)** trong câu.\n2. **Masked / Causal Self-Attention (Dùng trong khối Decoder như GPT, LLaMA):** Vì nhiệm vụ của Decoder là dự đoán từ tiếp theo nên khi đang ở vị trí thứ $i$, nó **tuyệt đối không được phép \"ăn gian\" nhìn trộm các từ ở tương lai ($\u003e i$)**. Kỹ thuật thực hiện: Cộng một ma trận mặt nạ tam giác trên chứa giá trị **$-\\infty$ (Negative Infinity Mask)** vào $QK^T$ trước khi qua hàm Softmax (vì $e^{-\\infty} = 0$), ép toàn bộ trọng số chú ý về tương lai bằng $0$!\n3. **Cross-Attention (Encoder-Decoder Attention - Dùng trong mô hình Seq2Seq như T5, BART hoặc tiêm Text Prompt vào U-Net của Stable Diffusion):**\n   * Vector **Query ($Q$)** được lấy từ **khối Decoder** (hoặc ảnh đang khử nhiễu).\n   * Còn vector **Key ($K$)** và **Value ($V$)** được lấy từ đầu ra của **khối Encoder** (hoặc văn bản gốc)! Giúp Decoder vừa viết câu dịch vừa đối chiếu sang toàn bộ câu gốc ở Encoder.\n\n---\n\n### 3.5. Multi-Head Attention (MHA), KV Cache, GQA và FlashAttention\n* **Multi-Head Attention (MHA - Chú ý đa đầu):**\n  Một câu văn tự nhiên luôn chứa đựng nhiều tầng thông tin cùng lúc (ngữ pháp chủ-vị, quan hệ sở hữu, thời gian, cảm xúc). Thay vì chỉ tính Attention 1 lần trên toàn bộ số chiều, **Multi-Head Attention** chia nhỏ vector thành $h$ \"đầu chú ý\" (**Attention Heads**, ví dụ 32 heads) chạy song song và độc lập với nhau trên các không gian con khác nhau, sau đó nối (`Concat`) lại:\n\n```mermaid\nflowchart TD\n    Input[\"Tin nhắn trong Nhóm Chat lập kế hoạch Sinh nhật bất ngờ\"]\n    \n    H1[\"🕵️ Head 1 (Thám tử bí mật)\u003cbr/\u003eChú ý ngày giờ \u0026 lời dặn giữ bí mật\"]\n    H2[\"🍕 Head 2 (Chuyên gia ẩm thực)\u003cbr/\u003eChú ý \u0027pizza\u0027 \u0026 \u0027bánh kem sô-cô-la\u0027\"]\n    H3[\"🎈 Head 3 (Chuyên gia trang trí)\u003cbr/\u003eChú ý \u0027bong bóng\u0027, \u0027pháo kim tuyến\u0027, màu \u0027vàng-đen\u0027\"]\n    H4[\"🎵 Head 4 (Phụ trách âm nhạc)\u003cbr/\u003eChú ý \u0027nhạc thập niên 90\u0027, \u0027Spice Girls\u0027\"]\n    H5[\"😏 Head 5 (Phân tích sắc thái)\u003cbr/\u003ePhát hiện giọng điệu đùa cợt / châm biếm\"]\n    \n    Concat[\"Gộp toàn bộ góc nhìn (Concatenate \u0026 Linear Projection W_O)\u003cbr/\u003e👉 Hiểu trọn vẹn toàn cảnh ngữ nghĩa, ngữ pháp \u0026 cảm xúc của cuộc hội thoại!\"]\n\n    Input --\u003e H1 \u0026 H2 \u0026 H3 \u0026 H4 \u0026 H5 --\u003e Concat\n```\n\n* **Tối ưu hóa Attention trong LLM hiện đại (Kiến thức sát sườn với TensorRT-LLM ở Module 8):**\n  1. **KV Cache (Bộ nhớ đệm Key-Value lúc Inference):** Khi mô hình Decoder sinh token thứ $100$, các vector Key ($K$) và Value ($V$) của $99$ token trước đó hoàn toàn không thay đổi. Thay vì tính lại từ đầu cho cả $99$ token cũ, hệ thống lưu sẵn $K$ và $V$ của các token đã qua vào VRAM gọi là **KV Cache** $\\to$ Giúp tăng tốc độ sinh token lên hàng chục lần!\n  2. **MHA $\\to$ MQA (Multi-Query) $\\to$ GQA (Grouped-Query Attention):** Khi chuỗi dài (ví dụ 128K tokens), bộ nhớ **KV Cache** phình to chiếm hết VRAM. **GQA** (dùng trong **LLaMA-3, Mistral, Nemotron**) cho phép một nhóm nhiều đầu Query (ví dụ 8 Query heads) dùng chung 1 đầu Key và 1 đầu Value, giúp **giảm kích thước KV Cache đi 4–8 lần** mà vẫn giữ nguyên độ thông minh như MHA!\n  3. **FlashAttention:** Thuật toán chia nhỏ (Tiling) ma trận $Q, K, V$ để tính toán trọn vẹn ngay bên trong bộ nhớ đệm siêu tốc **SRAM (Shared Memory)** trên chip GPU mà không cần ghi ma trận trung gian $N \\times N$ ra bộ nhớ HBM chậm hơn, giúp tăng tốc độ huấn luyện và suy luận lên gấp nhiều lần.\n\n---\n\n### 3.6. Chiến lược Giải mã \u0026 Các Tham số Điều khiển Sinh văn bản (Decoding \u0026 Sampling Parameters)\nỞ Bước 5 của Pipeline, sau khi lớp Softmax tính ra xác suất cho toàn bộ từ điển, làm sao mô hình chọn ra từ tiếp theo?\n* **Các chiến lược chọn từ cơ bản:**\n  * **Greedy Decoding (Giải mã tham lam):** Luôn chọn đúng 1 token có xác suất cao nhất ở mỗi bước ($\\arg\\max P(w_t)$). Nhanh, nhất quán nhưng dễ bị lặp câu từ máy móc.\n  * **Beam Search (Tìm kiếm chùm):** Duy trì đồng thời $B$ chuỗi ứng viên (Beams) tốt nhất ở mỗi bước rồi chọn chuỗi có tổng xác suất cả câu cao nhất (Rất hay dùng trong dịch máy hoặc tóm tắt cố định).\n  * **Stochastic Sampling (Lấy mẫu ngẫu nhiên có kiểm soát):** Điều khiển qua **3 siêu tham số suy luận (`Temperature`, `Top-K`, `Top-P`)** dưới đây:\n\n| Tham số | Bản chất Toán học \u0026 Cơ chế | Khi giá trị THẤP | Khi giá trị CAO |\n| :--- | :--- | :--- | :--- |\n| **1. Temperature ($T$)** | Chia điểm thô (logits $z_i$) cho $T$ trước khi đưa vào hàm Softmax: $$P_i = \\frac{\\exp(z_i / T)}{\\sum \\exp(z_j / T)}$$ Điều chỉnh \"độ nhọn\" hay \"độ phẳng\" của phân phối xác suất. | **$T \\to 0$ (VD: $0.0 - 0.2$):** Làm nhọn phân phối; từ có xác suất cao nhất chiếm gần 100% (khi $T=0$ tương đương Greedy Decoding). Đầu ra **chính xác, nhất quán, có tính quyết định (Deterministic)** $\\to$ *Dùng cho sinh Code, SQL, trích xuất JSON, Toán học, Hỏi đáp RAG*. | **$T \\ge 0.8 - 1.2$:** Làm phẳng phân phối; các từ xác suất thấp hơn cũng có cơ hội được chọn. Đầu ra **đa dạng, sáng tạo bay bổng** nhưng nếu quá cao ($T \u003e 1.5$) sẽ sinh văn bản lộn xộn và ảo giác $\\to$ *Dùng cho viết thơ, sáng tác truyện, Brainstorming*. |\n| **2. Top-K Sampling** | Cắt cứng theo **số lượng ứng viên**: Sắp xếp các token theo xác suất giảm dần, chỉ giữ lại đúng **$K$ token đứng đầu**, loại bỏ toàn bộ phần đuôi còn lại rồi chuẩn hóa lại xác suất để lấy mẫu. | **$K = 1$:** Chính là Greedy Decoding (chỉ lấy 1 từ cao điểm nhất). | **$K = 40$ hoặc $50$:** Cho phép chọn trong 40–50 từ hợp lý nhất, cắt bỏ phần đuôi dài (long tail) chứa các từ hoàn toàn vô nghĩa. *(Hạn chế: $K$ cố định nên không thích ứng được khi phân phối quá nhọn hoặc quá phẳng).* |\n| **3. Top-P (Nucleus Sampling)** | Cắt động theo **tổng xác suất tích lũy (Cumulative Probability)**: Sắp xếp các từ từ cao xuống thấp và cộng dồn xác suất cho đến khi chạm ngưỡng $P$ thì dừng lại (tập hạt nhân - Nucleus). | **$P = 0.1$ (10%):** Chỉ xét nhóm hạt nhân cực nhỏ các từ chắc chắn nhất. | **$P = 0.90$ (90%):** Tự động co giãn thông minh số lượng từ ứng viên — nếu mô hình rất chắc chắn (`P(\"cat\") = 0.92`), tập ứng viên tự thu hẹp chỉ còn 1 từ; nếu câu mở có nhiều hướng đi, nó tự mở rộng ra 50 từ để giữ sự tự nhiên! |\n\n*(Ngoài ra còn có **Frequency Penalty** phạt các từ đã xuất hiện nhiều lần để chống lặp từ, và **Presence Penalty** khuyến khích mô hình chuyển sang chủ đề mới).*\n\n---\n\n## 4. Phân loại 3 Biến thể Kiến trúc Transformer \u0026 Mô hình Mixture of Experts (MoE)\n\n### 4.1. Ba biến thể kiến trúc Transformer (CỰC KỲ QUAN TRỌNG!)\nTừ bài báo Transformer gốc năm 2017 (vốn gồm cả khối Encoder bên trái và khối Decoder bên phải để dịch máy), giới công nghệ đã tách và phát triển thành **3 nhánh kiến trúc chuyên biệt**:\n\n```mermaid\nflowchart TD\n    Trans[\"Kiến trúc Transformer Gốc (Vaswani et al., 2017)\"]\n    \n    subgraph E_Only[\"1. Encoder-Only (Hiểu \u0026 Phân tích - NLU)\"]\n        E_Desc[\"📖 Học giả đọc sách trong thư viện\u003cbr/\u003eChú ý 2 chiều (Bidirectional Self-Attention)\u003cbr/\u003eNhìn cả trái \u0026 phải cùng lúc để hiểu sâu ngữ nghĩa\"]\n        E_Models[\"Mô hình: BERT, RoBERTa, DeBERTa, DistilBERT, Nomic-Embed\"]\n        E_Tasks[\"Tác vụ: Phân loại cảm xúc (Sentiment Analysis),\u003cbr/\u003eLọc Spam, Trích xuất thực thể (NER),\u003cbr/\u003eTạo Vector Embedding \u0026 Reranker cho RAG\"]\n        E_Desc --\u003e E_Models --\u003e E_Tasks\n    end\n\n    subgraph D_Only[\"2. Decoder-Only (Sinh văn bản \u0026 Hội thoại - NLG)\"]\n        D_Desc[\"✍️ Nhà biên kịch viết truyện nối tiếp\u003cbr/\u003eChú ý 1 chiều có mặt nạ (Masked Causal Self-Attention)\u003cbr/\u003eDự đoán từ tiếp theo liên tục (Autoregressive)\"]\n        D_Models[\"Mô hình: GPT-3/4, LLaMA 3, Claude, Mistral, Nemotron\"]\n        D_Tasks[\"Tác vụ: Sinh văn bản mở, Chatbot hội thoại đa năng,\u003cbr/\u003eTrợ lý viết Code, Suy luận logic, AI Agents\"]\n        E_Desc ~~~ D_Desc\n        D_Desc --\u003e D_Models --\u003e D_Tasks\n    end\n\n    subgraph ED_Both[\"3. Encoder-Decoder (Biến đổi chuỗi sang chuỗi - Seq2Seq)\"]\n        ED_Desc[\"🌐 Dịch giả đội 2 chiếc mũ\u003cbr/\u003eEncoder đọc hiểu trọn vẹn chuỗi nguồn (2 chiều)\u003cbr/\u003eDecoder sinh ra chuỗi đích mới (1 chiều + Cross-Attention)\"]\n        ED_Models[\"Mô hình: T5, Flan-T5, BART, mBART, NLLB, Whisper\"]\n        ED_Tasks[\"Tác vụ: Dịch máy đa ngôn ngữ (Machine Translation),\u003cbr/\u003eTóm tắt văn bản dài thành ngắn (Text Summarization)\"]\n        ED_Desc --\u003e ED_Models --\u003e ED_Tasks\n    end\n\n    Trans --\u003e E_Only\n    Trans --\u003e D_Only\n    Trans --\u003e ED_Both\n```\n\n### Bảng so sánh tổng hợp 3 biến thể Transformer (Học thuộc lòng trước khi thi!)\n| Loại kiến trúc | Ẩn dụ thực tế | Cơ chế Huấn luyện \u0026 Attention cốt lõi | Mô hình tiêu biểu | Tác vụ tối ưu nhất (Use Cases) |\n| :--- | :--- | :--- | :--- | :--- |\n| **1. Encoder-only (Autoencoding)** | **Học giả thông thái ngồi thư viện:** Đọc hết cả cuốn sách một cách im lặng, ghi nhớ sâu sắc toàn bộ ngữ cảnh trước-sau, sẵn sàng trả lời câu hỏi phân tích. | **Masked Language Modeling (MLM) + Bidirectional Attention:** Che ngẫu nhiên ~15% từ trong câu (`[MASK]`) và nhìn ngữ cảnh từ **cả 2 phía trái và phải** cùng lúc để đoán từ bị che. | **BERT**, RoBERTa, DeBERTa, ELECTRA, DistilBERT | **Hiểu ngôn ngữ (NLU):** Phân loại cảm xúc (Sentiment Analysis), lọc email Spam, trích xuất thực thể (**NER**), tạo Vector Embedding cho Semantic Search/RAG. |\n| **2. Decoder-only (Autoregressive)** | **Nhà biên kịch / Kể chuyện tài ba:** Nhận một ý tưởng ngắn ban đầu (Prompt), sau đó viết nối tiếp từng từ, từng câu trôi chảy, câu sau dựa vào câu trước. | **Causal Language Modeling (CLM) + Masked Causal Attention:** Chỉ nhìn vào các từ đã xuất hiện **phía trước (bên trái)** để dự đoán từ tiếp theo (che tương lai). | **GPT-3/4**, **LLaMA 3**, Claude, Mistral, **NVIDIA Nemotron** | **Sinh ngôn ngữ (NLG):** Sinh văn bản mở, Chatbot hội thoại đa năng, trợ lý lập trình viết code, suy luận đa bước. |\n| **3. Encoder-Decoder (Seq2Seq)** | **Người dịch thuật mang hai chiếc mũ:** Buổi sáng đội mũ học giả đọc hiểu trọn vẹn văn bản tiếng Pháp (**Encode**), buổi chiều đội mũ nhà văn chấp bút viết bản dịch tiếng Anh (**Decode**). | **Sequence-to-Sequence + Cross-Attention:** Khối Encoder nén toàn bộ chuỗi đầu vào thành biểu diễn ngữ cảnh; khối Decoder sinh ra chuỗi đầu ra mới tương ứng. | **T5**, **Flan-T5**, **BART**, NLLB | **Biến đổi chuỗi sang chuỗi:** Dịch máy giữa các ngôn ngữ (**Machine Translation**), tóm tắt văn bản dài thành đoạn ngắn (**Summarization**). |\n\n### 4.2. Kiến trúc Chuyên gia Hỗn hợp: Mixture of Experts (MoE)\nCác mô hình lớn hiện đại (như **Mixtral 8x7B, DeepSeek-V3, GPT-4, DBRX**) sử dụng kiến trúc biến thể **Sparse Mixture of Experts (MoE)**:\n* Thay vì dùng 1 khối mạng Feed-Forward (FFN) khổng lồ duy nhất mà mọi token đều phải chạy qua 100% tham số (**Dense Model**), tầng MoE được chia thành nhiều mạng FFN con gọi là các **Chuyên gia (Experts)** (ví dụ 8 chuyên gia: chuyên gia Toán, chuyên gia Code, chuyên gia Văn học...) đứng sau một **Mạng Định tuyến (Router / Gating Network)**.\n* Khi một token đi tới, **Router** chỉ chọn kích hoạt **Top-K chuyên gia phù hợp nhất (ví dụ $K = 2$ trên 8 chuyên gia)** để xử lý token đó!\n* **Lợi ích vàng:** Mô hình có tổng dung lượng tri thức của một mô hình rất lớn (ví dụ Mixtral 8x7B có tổng cộng **47B tham số**), nhưng tốc độ suy luận và chi phí tính toán FLOPs trên mỗi token lại nhẹ và nhanh ngang ngửa một mô hình nhỏ (**chỉ kích hoạt ~13B Active Parameters**)! *(Lưu ý: Dù chỉ kích hoạt 13B tham số lúc tính toán, nhưng toàn bộ 47B tham số vẫn phải được nạp sẵn vào VRAM).*\n\n---\n\n## 5. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 4:**\n\u003e 1. **Bẫy chọn kiến trúc:**\n\u003e    * *Phân tích cảm xúc (Sentiment Analysis)*, *Trích xuất thực thể (NER)*, *Tạo Vector Embedding* $\\to$ Chọn **Encoder-only (BERT)**.\n\u003e    * *Xây dựng Chatbot đối thoại, sinh văn bản mở, viết code* $\\to$ Chọn **Decoder-only (GPT / LLaMA)**.\n\u003e    * *Dịch tài liệu đa ngôn ngữ (Translation)* hoặc *Tóm tắt văn bản (Summarization)* $\\to$ Chọn **Encoder-Decoder (T5 / BART)**.\n\u003e 2. **Bẫy Temperature \u0026 Top-P:**\n\u003e    * Muốn LLM sinh code Python/SQL chuẩn xác, trích xuất dữ liệu nhất quán không bịa đặt ngẫu nhiên $\\to$ Chỉnh **Temperature thấp ($T \\approx 0$)**.\n\u003e    * Phương pháp lấy mẫu nào giới hạn động tập từ ứng viên dựa trên **tổng xác suất tích lũy (cumulative probability threshold)**? $\\to$ Chọn **Top-P (Nucleus Sampling)**.\n\u003e    * Phương pháp lấy mẫu nào cắt cứng đúng **$K$ từ có xác suất cao nhất**? $\\to$ Chọn **Top-K Sampling**.\n\u003e 3. **Bẫy Query, Key, Value ($Q, K, V$):** Trong cơ chế Self-Attention, điểm số chú ý (Attention Weight) giữa hai từ được tính bằng tích vô hướng chuẩn hóa giữa hai vector nào trước khi nhân với Value ($V$)? $\\to$ Giữa **Query ($Q$) và Key ($K$)** chia cho $\\sqrt{d_k}$.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Một lập trình viên đang tích hợp LLM để tự động chuyển đổi câu hỏi tiếng Việt của nhân viên thành câu lệnh truy vấn SQL chạy trên cơ sở dữ liệu kế toán. Để đảm bảo kết quả sinh ra luôn ổn định, chính xác và không có tính ngẫu nhiên, tham số `Temperature` nên được cấu hình như thế nào?\n   * *Đáp án:* Đặt **Temperature ở mức rất thấp (bằng `0` hoặc gần `0`, ví dụ `0.1`)** để làm nhọn phân phối xác suất, buộc mô hình luôn ưu tiên chọn các token có xác suất cao nhất (Deterministic output).\n2. **Câu 2:** Nếu loại bỏ hoàn toàn bước **Positional Encoding** khỏi kiến trúc Transformer, mô hình sẽ gặp phải vấn đề gì?\n   * *Đáp án:* Mô hình sẽ **không thể phân biệt được thứ tự vị trí của các từ trong câu** (coi câu văn như một tập hợp từ không thứ tự - Bag of Words), dẫn đến hiểu sai hoàn toàn ngữ nghĩa khi đổi chỗ chủ ngữ và tân ngữ.\n3. **Câu 3:** Tại sao các bộ Tokenizer hiện đại của LLM (như BPE hoặc WordPiece) lại sử dụng phương pháp **Subword Tokenization** thay vì Whole-word Tokenization?\n   * *Đáp án:* Để giữ kích thước bộ từ điển (Vocabulary) nhỏ gọn trong khi vẫn **xử lý được các từ hiếm, từ ghép phức tạp hoặc từ mới chưa từng gặp mà không bị lỗi Out-of-Vocabulary (OOV)** thông qua việc ghép các mảnh tiền tố, gốc từ và hậu tố.\n4. **Câu 4:** Một công ty truyền thông muốn xây dựng một công cụ tự động phân loại hàng triệu bình luận của độc giả thành 3 nhãn: *Tích cực, Tiêu cực, Trung lập* (Sentiment Analysis), đồng thời trích xuất tên các nhân vật và địa danh được nhắc đến trong bài báo (NER). Biến thể kiến trúc Transformer nào là phù hợp và hiệu quả nhất?\n   * *Đáp án:* **Encoder-only (như BERT, RoBERTa)** vì cơ chế Bidirectional Self-Attention đọc hiểu toàn bộ ngữ cảnh hai chiều trái-phải cùng lúc, tối ưu cho các bài toán hiểu và phân tích ngôn ngữ (NLU).\n5. **Câu 5:** Trong công thức Scaled Dot-Product Attention $\\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$, tại sao tích vô hướng $QK^T$ lại phải được chia cho $\\sqrt{d_k}$ trước khi đưa vào hàm Softmax?\n   * *Đáp án:* Để **ngăn chặn tích vô hướng $QK^T$ phình quá lớn khi số chiều $d_k$ cao**, tránh đẩy hàm Softmax vào vùng bão hòa có đạo hàm cực nhỏ gây ra hiện tượng **triệt tiêu đạo hàm (Vanishing Gradients)**.\n6. **Câu 6:** Một mô hình sử dụng kiến trúc **Mixture of Experts (MoE)** như Mixtral 8x7B có tổng cộng 47 tỷ tham số nhưng tốc độ suy luận lại nhanh tương đương một mô hình 13 tỷ tham số. Cơ chế nào giúp đạt được điều này?\n   * *Đáp án:* Nhờ một **Mạng định tuyến (Router / Gating Network)** chỉ chọn kích hoạt một số ít chuyên gia (**Top-K Experts**, ví dụ 2 trên 8 mạng FFN) cho mỗi token thay vì bắt mọi token phải tính toán qua toàn bộ 100% tham số của mạng.\n"},{"id":"mod05","file":"Module_05_Model_Selection.md","badge":"MODULE 05","shortTitle":"Model Selection \u0026 Metrics","domain":"Experimentation (22%)","weight":"Exp / Data","icon":"🎯","content":"# Module 5: Model Selection (Phương pháp Đánh giá và Lựa chọn Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 5 (Thuộc Domain \"Experimentation - 22%\" \u0026 \"Data Analysis - 14%\"):**\n\u003e Nắm vững **Quy trình 6 bước lựa chọn Foundation Model**; bảng so sánh **SLM vs. LLM** và **Open-Weights vs. Proprietary Models**; các chỉ số hiệu năng suy luận thực tế (**TTFT, ITL/TPOT, Throughput**); cấu trúc chuẩn của một **Model Card** \u0026 các bộ **Benchmark chuẩn (MMLU, HumanEval, GSM8K, TruthfulQA)**; làm chủ **Ma trận Nhầm lẫn (Confusion Matrix: TP, TN, FP, FN)**, khi nào ưu tiên **Precision vs. Recall vs. F1-Score vs. ROC-AUC**, các độ đo Hồi quy (**MAE, MSE, RMSE, $R^2$**); phân biệt chính xác các độ đo ngôn ngữ vàng (**BLEU** cho Dịch máy, **ROUGE** cho Tóm tắt, **BERTScore**, **Cosine Similarity** cho RAG, **RAG Triad**); và các phương pháp kiểm thử **k-Fold Cross-Validation**, **A/B Testing**, **Canary Deployment**.\n\n---\n\n## 1. Khung quy trình 6 bước lựa chọn Foundation Model\n\nKhi đứng trước hàng trăm nghìn mô hình trên Hugging Face hay các API thương mại (OpenAI, Anthropic, NVIDIA NIM), một kỹ sư AI chuyên nghiệp không chọn theo cảm tính mà tuân thủ **Quy trình 6 bước chuẩn**:\n\n```mermaid\nflowchart LR\n    S1[\"1. Define Need\u003cbr/\u003eXác định rõ bài toán,\u003cbr/\u003eSLA độ trễ \u0026 Ngân sách\"]\n    S2[\"2. Shortlist Models\u003cbr/\u003eLọc ra 2-4 ứng viên sáng giá\u003cbr/\u003e(Open-weights vs Proprietary)\"]\n    S3[\"3. Compare Specs\u003cbr/\u003eĐọc Model Card:\u003cbr/\u003eTham số, VRAM, License, Context\"]\n    S4[\"4. Evaluate Metrics\u003cbr/\u003eĐo lường bằng Metric chuẩn:\u003cbr/\u003eBLEU, ROUGE, F1, Cosine Sim\"]\n    S5[\"5. Run Tests\u003cbr/\u003eKiểm thử dữ liệu thực tế:\u003cbr/\u003eCross-Validation / A/B Test\"]\n    S6[\"6. Select Best\u003cbr/\u003eChọn mô hình tối ưu:\u003cbr/\u003eHiệu năng + Chi phí + Độ ổn định\"]\n\n    S1 --\u003e S2 --\u003e S3 --\u003e S4 --\u003e S5 --\u003e S6\n```\n\n### Chi tiết từng bước:\n1. **Define Need (Xác định nhu cầu nghiệp vụ \u0026 Ràng buộc kỹ thuật):**\n   * Làm rõ bài toán cốt lõi cần giải quyết (Sinh văn bản, tóm tắt tài liệu, viết code, trích xuất thực thể, sinh ảnh hay dịch thuật).\n   * Xác định rõ ràng buộc vận hành (**Non-functional requirements**): Yêu cầu độ trễ tối đa bao nhiêu mili-giây (**SLA Latency**), lượng truy cập đồng thời (Concurrency), yêu cầu bảo mật dữ liệu (có được gửi ra Cloud ngoài hay bắt buộc chạy On-premise), và ngân sách phần cứng/API.\n2. **Shortlist Model (Lập danh sách rút gọn):**\n   * Chọn ra từ **2 đến 4 mô hình ứng viên** sáng giá dựa trên bảng xếp hạng cộng đồng, tài liệu hỗ trợ và hình thức phân phối (**Open-Source / Open-Weights** tự host như *LLaMA-3, Mistral, NVIDIA Nemotron* hay **Proprietary / Closed-Source** gọi qua API như *GPT-4o, Claude 3.5*).\n3. **Compare Specs (So sánh thông số kỹ thuật qua Model Card):**\n   * Đọc kỹ **Model Card** để đối chiếu số lượng tham số, độ dài cửa sổ ngữ cảnh (**Context Window**), yêu cầu dung lượng bộ nhớ GPU (**VRAM**), ngôn ngữ hỗ trợ và đặc biệt là **Giấy phép bản quyền thương mại (License: Apache 2.0, MIT hay Non-commercial CC-BY-NC)**.\n4. **Evaluate Model (Đánh giá bằng độ đo kỹ thuật):**\n   * Chấm điểm tự động bằng các bộ chỉ số chuyên dụng tương ứng với từng bài toán (**BLEU** cho dịch thuật, **ROUGE** cho tóm tắt, **Cosine Similarity** cho tìm kiếm ngữ nghĩa, **F1-Score / ROC-AUC** cho phân loại, **Perplexity** cho mô hình ngôn ngữ).\n5. **Run Tests (Thực nghiệm kiểm thử trên dữ liệu thật):**\n   * Chạy thử nghiệm trên chính tập dữ liệu thực tế của doanh nghiệp (Golden Dataset) bằng **k-Fold Cross-Validation** (khi ít dữ liệu) hoặc **A/B Testing / Canary Rollout** (trên môi trường Production).\n6. **Select Best (Chọn mô hình tối ưu nhất - The Golden Trade-off):**\n   * Ra quyết định dựa trên phương trình cân bằng đa mục tiêu (chứ không chỉ chọn mô hình điểm cao nhất mà quá đắt/quá chậm):\n     $$\\text{Giá trị Tối ưu} = \\text{Chất lượng (Accuracy)} + \\text{Tốc độ (Latency/Throughput)} + \\text{Chi phí (TCO)} + \\text{Độ tin cậy \\\u0026 Bảo mật}$$\n\n---\n\n## 2. So sánh chuyên sâu: SLM vs. LLM, Open-Weights vs. Proprietary \u0026 Các Chỉ số Tốc độ Suy luận\n\n### 2.1. Small Language Model (SLM) vs. Large Language Model (LLM)\n\u003e [!TIP]\n\u003e **Góc nhìn Developer:** Không phải bài toán nào cũng vác \"đại bác\" LLM 70B/405B ra bắn! Nếu bạn chỉ cần phân loại ý định (Intent classification), trích xuất JSON đơn giản, kiểm duyệt nội dung hoặc chạy offline trên điện thoại/thiết bị IoT/xe tự hành, một chiếc **SLM** nhỏ gọn sẽ rẻ hơn hàng chục lần và phản hồi trong vài mili-giây.\n\n```mermaid\nflowchart TD\n    subgraph SLM_Box[\"Small Language Model (SLM: \u003c100M - ~8B params)\"]\n        direction LR\n        SLM_Icon[\"📱 Chạy trên Edge / Laptop / 1 GPU nhỏ\u003cbr/\u003e⚡ Độ trễ cực thấp (Low Latency: vài ms)\u003cbr/\u003e🚀 Thông lượng cực cao (High Throughput)\u003cbr/\u003e🎯 Chuyên biệt hóa cho 1 tác vụ hẹp (Task-specific)\u003cbr/\u003e🔒 Bảo mật dữ liệu cục bộ trên thiết bị (On-device Privacy)\"]\n    end\n\n    subgraph LLM_Box[\"Large Language Model (LLM: 10B - Hàng trăm tỷ params)\"]\n        direction LR\n        LLM_Icon[\"🖥️ Đòi hỏi cụm Multi-GPU cao cấp (A100/H100/B200)\u003cbr/\u003e🐢 Độ trễ cao hơn, tốn hàng trăm GB VRAM\u003cbr/\u003e🧠 Đa năng, suy luận logic đa bước phức tạp (Complex Reasoning)\u003cbr/\u003e💰 Chi phí hạ tầng \u0026 điện năng vận hành đắt đỏ\"]\n    end\n```\n\n| Tiêu chí | Small Language Model (SLM) | Large Language Model (LLM) |\n| :--- | :--- | :--- |\n| **Quy mô tham số (Parameters)** | Nhỏ: Dưới 100 triệu đến ~8 tỷ tham số (VD: *BERT ~110M, DistilBERT ~66M, Phi-3 Mini 3.8B, Mistral 7B, LLaMA-3 8B, Nemotron-Mini 4B*). | Khổng lồ: Từ 13 tỷ đến hàng trăm/nghìn tỷ tham số (VD: *LLaMA-3 70B/405B, Nemotron-4 340B, GPT-4, Claude 3.5*). |\n| **Độ trễ (Latency)** | **Rất thấp**, phản hồi tức thì (real-time, lý tưởng cho Voice Assistant, Game NPC, Autocomplete). | **Cao hơn đáng kể** do khối lượng phép nhân ma trận đồ sộ qua hàng chục tầng. |\n| **Thông lượng (Throughput)** | **Rất cao** (xử lý hàng nghìn tokens/giây trên cùng một phần cứng). | **Thấp hơn** (thường phải chia nhỏ mô hình qua nhiều GPU bằng Tensor Parallelism). |\n| **Yêu cầu phần cứng** | Chạy mượt trên CPU, NPU, thiết bị biên (**Edge, Mobile, IoT, Jetson**) hoặc 1 GPU phổ thông. | Đòi hỏi cụm máy chủ nhiều GPU Data Center (**A100, H100, B200**) với dung lượng VRAM cực lớn. |\n| **Tính đa năng (Versatility)** | Thường chuyên biệt hóa cho **một tác vụ hẹp cụ thể (Task-specific)** sau khi fine-tune hoặc chưng cất (Distillation). | Giải quyết **đa tác vụ (General-purpose)**, suy luận logic phức tạp, Zero-shot và Agentic workflows xuất sắc. |\n| **Chi phí vận hành (Cost)** | Rất rẻ cho từng tác vụ đơn lẻ (nhưng cần kiến trúc Model Router nếu quản lý nhiều SLM khác nhau). | Chi phí duy trì cụm server suy luận rất đắt đỏ, nhưng 1 mô hình trung tâm phục vụ được nhiều phòng ban. |\n\n### 2.2. Mô hình Nguồn mở / Trọng số mở (Open-Weights) vs. Mô hình Độc quyền (Proprietary API)\n| Tiêu chí | Open-Weights Models (LLaMA-3, Mistral, DeepSeek, Nemotron) | Proprietary / Closed API Models (GPT-4o, Claude 3.5, Gemini Pro) |\n| :--- | :--- | :--- |\n| **Quyền kiểm soát \u0026 Bảo mật dữ liệu** | **Tuyệt đối (100%):** Tự tải trọng số về triển khai trong nội bộ (On-prem / VPC), dữ liệu không bao giờ rời khỏi công ty. | Dữ liệu phải gửi qua Internet tới máy chủ của nhà cung cấp bên thứ ba (phụ thuộc cam kết Zero Data Retention của hãng). |\n| **Khả năng tùy biến sâu** | Cho phép can thiệp toàn diện: **Full Fine-Tuning, LoRA/QLoRA, Pruning, Quantization (`FP8`/`INT4`)**, sửa kiến trúc. | Bị giới hạn ở Prompt Engineering, RAG hoặc chỉ Fine-tune hộp đen qua giao diện web của nhà cung cấp. |\n| **Chi phí theo quy mô** | Tốn chi phí dựng server GPU ban đầu, nhưng **rẻ hơn rất nhiều khi lưu lượng request lớn và ổn định 24/7**. | Không tốn phí hạ tầng ban đầu (trả tiền theo mỗi 1 triệu tokens Input/Output), nhưng **rất đắt đỏ khi quy mô người dùng tăng vọt**. |\n\n### 2.3. Ba Chỉ số Đo lường Hiệu năng Suy luận LLM trên Production (Inference Latency Metrics)\nKhi triển khai LLM (với TensorRT-LLM / Triton / NIM), đề thi thường hỏi về 3 chỉ số đo tốc độ:\n1. **TTFT (Time To First Token – Thời gian sinh ra token đầu tiên):**\n   * Khoảng thời gian từ lúc User bấm gửi Prompt cho đến khi chữ đầu tiên xuất hiện trên màn hình (Pha **Prefill** — xử lý song song toàn bộ Prompt đầu vào để tạo KV Cache).\n   * *Bản chất phần cứng:* Phụ thuộc vào **năng lực tính toán ma trận của GPU (Compute-bound)** và độ dài của Input Prompt.\n2. **ITL (Inter-Token Latency) / TPOT (Time Per Output Token – Thời gian giữa hai token liên tiếp):**\n   * Tốc độ nhả từng chữ tiếp theo sau khi chữ đầu tiên đã hiện ra (Pha **Decode** tự hồi quy). Để người dùng đọc mượt hơn tốc độ mắt người, TPOT cần đạt khoảng $10 - 30\\text{ ms/token}$.\n   * *Bản chất phần cứng:* Phụ thuộc vào **băng thông bộ nhớ VRAM (Me
