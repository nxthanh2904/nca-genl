tổ chức phải đảm bảo **4 trụ cột đạo đức**, và NVIDIA đã cung cấp chính xác các công nghệ phần cứng/phần mềm tương ứng cho từng trụ cột:\n\n```mermaid\nflowchart TD\n    subgraph Pillars[\"4 Trụ cột Trustworthy AI \u0026 Giải pháp Kỹ thuật NVIDIA Tương ứng\"]\n        direction LR\n        P1[\"1. Transparency (Tính minh bạch)\u003cbr/\u003eGiải thích được bằng ngôn ngữ dễ hiểu\u003cbr/\u003ecách AI đưa ra quyết định \u0026 nguồn gốc dữ liệu\"] ==\u003e S1[\"🔍 Giải pháp:\u003cbr/\u003eData Lineage Tracking, Model Cards\u003cbr/\u003e\u0026 Explainable AI (XAI: SHAP, LIME)\"]\n        \n        P2[\"2. Safety \u0026 Security (An toàn \u0026 Bảo mật)\u003cbr/\u003eHoạt động đúng mục đích thiết kế,\u003cbr/\u003echống tấn công độc hại \u0026 không sinh nội dung hại\"] ==\u003e S2[\"🛡️ Giải pháp:\u003cbr/\u003eNVIDIA NeMo Guardrails (Colang)\u003cbr/\u003e\u0026 Red Teaming (NVIDIA Garak)\"]\n        \n        P3[\"3. Privacy (Quyền riêng tư)\u003cbr/\u003eTuân thủ luật bảo vệ dữ liệu (GDPR, HIPAA),\u003cbr/\u003ekhông làm rò rỉ dữ liệu nhạy cảm/PII\"] ==\u003e S3[\"🔒 Giải pháp Phần cứng:\u003cbr/\u003eNVIDIA Confidential Computing\u003cbr/\u003e(Trên GPU Hopper \u0026 Blackwell) + PII Redaction\"]\n        \n        P4[\"4. Non-discrimination (Không phân biệt đối xử)\u003cbr/\u003eGiảm thiểu thiên vị dữ liệu (Bias),\u003cbr/\u003eđảm bảo công bằng cho mọi nhóm người dùng\"] ==\u003e S4[\"⚖️ Giải pháp:\u003cbr/\u003eĐa dạng hóa dữ liệu (Diverse Datasets),\u003cbr/\u003eData Augmentation \u0026 Re-sampling\"]\n    end\n```\n\n### Bảng đối chiếu 4 Trụ cột Trustworthy AI (Khái niệm đáng ôn theo Blueprint):\n| Trụ cột Trustworthy AI | Ý nghĩa cốt lõi | Giải pháp kỹ thuật tương ứng của NVIDIA |\n| :--- | :--- | :--- |\n| **1. Quyền riêng tư (Privacy)** | Bảo vệ dữ liệu cá nhân/nhạy cảm (GDPR, HIPAA, CCPA) và sở hữu trí tuệ của trọng số mô hình trong lúc đang tính toán (*data in use*). | **NVIDIA Confidential Computing** (Phần cứng GPU **Hopper H100** \u0026 **Blackwell B200**) kết hợp lọc PII trong **NeMo Curator / Guardrails**. |\n| **2. An toàn \u0026 Kiểm soát (Safety \u0026 Security)** | Ngăn chặn prompt độc hại (Jailbreak/Prompt Injection), kiểm soát chủ đề hội thoại và lọc ảo giác đầu ra. | **NVIDIA NeMo Guardrails** (cấu hình bằng ngôn ngữ kịch bản **Colang**) \u0026 quét lỗ hổng bằng **NVIDIA Garak**. |\n| **3. Tính minh bạch (Transparency \u0026 Explainability)** | Giải thích được nguyên nhân ra quyết định cho người dùng cuối/cơ quan quản lý và truy vết nguồn gốc dữ liệu. | **Data Lineage Tracking** (Truy vết dòng chảy dữ liệu), **Model Cards** \u0026 **Explainable AI (XAI)** (như SHAP, LIME, Attention Maps). |\n| **4. Không phân biệt đối xử (Non-discrimination \u0026 Fairness)** | Loại bỏ định kiến giới tính/văn hóa/chủng tộc, cân bằng các nhóm dữ liệu thiểu số trong tập huấn luyện. | Đa dạng hóa tập dữ liệu (**Diverse \u0026 Representative Datasets**) kết hợp **Data Augmentation** (Tăng cường dữ liệu). |\n\n---\n\n## 3. Bảo mật Cấp độ Phần cứng: NVIDIA Confidential Computing\n\n\u003e [!TIP]\n\u003e **Góc nhìn Developer Bảo mật (3 Trạng thái của Dữ liệu):**\n\u003e 1. **Data at Rest (Dữ liệu lưu trên ổ cứng):** Bảo vệ bằng mã hóa lưu trữ (như AES-256).\n\u003e 2. **Data in Transit (Dữ liệu truyền qua mạng):** Bảo vệ bằng mã hóa đường truyền (TLS / HTTPS / IPsec).\n\u003e 3. **Data in Use (Dữ liệu đang nạp vào RAM/VRAM để tính toán):** Trên hạ tầng thông thường, dữ liệu đang xử lý trong bộ nhớ ở dạng rõ (plaintext), tạo ra rủi ro nếu tầng quản trị máy chủ vật lý hoặc hypervisor bị xâm phạm.\n\u003e 👉 **NVIDIA Confidential Computing** bổ sung lớp bảo vệ cho trạng thái thứ ba này: **Tăng khả năng bảo vệ dữ liệu và trọng số mô hình khi đang được xử lý (Data in Use)!**\n\n* **Cơ chế hoạt động kỹ thuật \u0026 Threat Model:**\n  * Xử lý dữ liệu nhạy cảm và trọng số mô hình bên trong môi trường thực thi đáng tin cậy dựa trên phần cứng (**Hardware-based Trusted Execution Environment - TEE**), kết hợp giữa CPU hỗ trợ TEE (như AMD SEV-SNP / Intel TDX / Arm CCA) và **GPU NVIDIA Hopper (H100) / Blackwell (B200)**.\n  * Dữ liệu truyền qua bus PCIe hoặc NVLink (tùy cấu hình multi-GPU TEE) được mã hóa, kèm cơ chế xác thực từ xa (**Remote Attestation**) giúp xác minh cấu hình phần cứng/firmware trước khi cấp khóa.\n  * **Lưu ý giới hạn \u0026 Threat Model:** NVIDIA Confidential Computing giúp giảm thiểu rủi ro truy cập trái phép từ phía hạ tầng bên dưới (như host OS/hypervisor hoặc quản trị viên hạ tầng không được ủy quyền) đối với **data in use**. Tuy nhiên, **phạm vi bảo vệ phụ thuộc vào threat model, cấu hình phần cứng/phần mềm, quy trình quản lý khóa (key management) và attestation**. Nó **không thay thế** cho kiểm soát truy cập ứng dụng (access controls), thiết kế phần mềm an toàn, lọc đầu vào/đầu ra (Guardrails), ghi nhật ký kiểm toán (audit logging), quản lý lỗ hổng bảo mật hay đảm bảo chống lại mọi cuộc tấn công ở tầng ứng dụng/API.\n\n---\n\n## 4. Rào chắn Bảo vệ Ứng dụng LLM: NVIDIA NeMo Guardrails \u0026 ngôn ngữ Colang\n\n**NVIDIA NeMo Guardrails** là bộ công cụ mã nguồn mở đóng vai trò như một lớp **\"Rào chắn an toàn khả trình (Programmable AI Guardrails)\"** nằm giữa Người dùng, các Công cụ ngoài và Mô hình LLM, được định nghĩa thông qua ngôn ngữ mô hình hóa luồng hội thoại **Colang (Conversational Modeling Language)**.\n\n### 4.1. Năm loại Rào chắn (5 Types of Programmable Rails) trong NeMo Guardrails\nTheo tài liệu chính thức của NVIDIA ([NeMo Guardrails — Rail Types](https://docs.nvidia.com/nemo/guardrails/latest/about-nemo-guardrails-library/rail-types)), NeMo Guardrails hỗ trợ **5 loại chốt chặn (Rails)** xuyên suốt vòng đời một request:\n\n```mermaid\nflowchart LR\n    User[\"Người dùng\u003cbr/\u003e(User Input)\"]\n    \n    subgraph Guardrails[\"NVIDIA NeMo Guardrails (5 Chốt chặn An toàn cấu hình bằng ngôn ngữ Colang)\"]\n        direction LR\n        R1[\"1. Input Rails\u003cbr/\u003e• Chặn Jailbreak \u0026 Direct Prompt Injection\u003cbr/\u003e• Lọc ngôn từ độc hại (Toxicity)\u003cbr/\u003e• Ẩn PII đầu vào\"]\n        \n        R2[\"2. Dialog Rails\u003cbr/\u003e• Kiểm soát chủ đề (Topical Rails)\u003cbr/\u003e• Chặn bàn luận chính trị, đối thủ cạnh tranh\u003cbr/\u003e• Định hướng luồng hội thoại chuẩn\"]\n        \n        R3[\"3. Retrieval Rails\u003cbr/\u003e• Kiểm tra các Chunks lấy từ Vector DB\u003cbr/\u003e• Chống Indirect Prompt Injection từ tài liệu ngoài\u003cbr/\u003e• Lọc dữ liệu vượt quyền truy cập\"]\n        \n        LLM[\"Mô hình LLM Chính\u003cbr/\u003e(Core LLM)\"]\n        \n        R4[\"4. Execution Rails\u003cbr/\u003e• Kiểm tra tham số an toàn trước khi cho LLM\u003cbr/\u003egọi Tool / API / SQL bên ngoài\"]\n        \n        R5[\"5. Output Rails\u003cbr/\u003e• Fact-checking chống Ảo giác (Hallucination)\u003cbr/\u003e• Kiểm duyệt độ an toàn câu trả lời\u003cbr/\u003e• Chống rò rỉ PII / Bản quyền đầu ra\"]\n        \n        R1 --\u003e R2 --\u003e R3 --\u003e LLM --\u003e R4 --\u003e R5\n    end\n\n    SafeAns[\"Câu trả lời An toàn\u003cbr/\u003ehiển thị cho User\"]\n    Block[\"Từ chối lịch sự theo kịch bản\u003cbr/\u003e(Blocked / Standard Refusal)\"]\n\n    User --\u003e R1\n    R1 \u0026 R2 \u0026 R3 \u0026 R4 \u0026 R5 -.-\u003e|\"Vi phạm rào chắn!\"| Block\n    R5 --\u003e SafeAns\n```\n\n### 4.2. Kỹ thuật Tối ưu hóa Chi phí \u0026 Độ trễ bằng Embedding Classifier (Cực kỳ hay hỏi thi!)\n* **Bài toán thực tế trong thiết kế Guardrails:**\n  * *Cách 1 (Dùng bộ lọc từ khóa tĩnh - Keyword/Regex Filter):* Chạy rất nhanh nhưng quá ngây thơ. Nếu bạn chặn từ khóa `\"crime\"` (tội ác) hay `\"steal\"` (ăn cắp), kẻ xấu chỉ cần dùng từ đồng nghĩa hoặc nói vòng vo như `\"He committed a felony\"` (Anh ta phạm trọng tội) là vượt qua bộ lọc dễ dàng!\n  * *Cách 2 (Dùng một LLM lớn khác để đọc và kiểm duyệt mọi tin nhắn):* Hiểu ngữ nghĩa rất sâu nhưng **chi phí gọi API tăng gấp đôi** và **độ trễ (Latency) tăng thêm hàng trăm mili-giây** cho mỗi lượt chat!\n* **Giải pháp thông minh kết hợp ưu điểm của cả hai – Embedding Classifier (Vector Similarity Filter):**\n\n```mermaid\nflowchart LR\n    Q[\"Câu hỏi của User:\u003cbr/\u003e\u0027He committed a felony\u0027\"]\n    Emb[\"Mô hình Embedding nhỏ gọn\u003cbr/\u003eChuyển câu hỏi thành Vector\"]\n    VDB[\"Kho Vector Mẫu Không an toàn / Lạc đề\u003cbr/\u003e(Canonical Unsafe / Off-topic Forms trong Colang)\"]\n    Cos[\"Đo độ tương đồng ngữ nghĩa\u003cbr/\u003e(Cosine Similarity / k-NN)\"]\n    \n    Pass[\"Điểm tương đồng với mẫu cấm THẤP\u003cbr/\u003e👉 Cho đi thẳng tới LLM chính\u003cbr/\u003e(Độ trễ chỉ vài ms, không tốn phí gọi LLM kiểm duyệt!)\"]\n    Reject[\"Gần với Vector cấm (\u0027crime\u0027, \u0027illegal act\u0027)\u003cbr/\u003e👉 Chặn ngay lập tức hoặc\u003cbr/\u003echuyển qua tầng kiểm duyệt sâu\"]\n\n    Q --\u003e Emb --\u003e Cos\n    VDB --\u003e Cos\n    Cos --\u003e|\"An toàn\"| Pass\n    Cos --\u003e|\"Nguy hiểm / Lạc đề\"| Reject\n```\n\n* **Tại sao Embedding Classifier là đáp án vàng trong đề thi NCA-GENL?**\n  1. **Hiểu sâu Ngữ nghĩa (Semantic Understanding):** Vì hoạt động trong không gian Vector Embedding, các câu dùng từ đồng nghĩa như `\"committed a felony\"` và `\"committed a crime\"` có vector nằm sát cạnh nhau (Cosine Similarity rất cao) $\\to$ **Tóm gọn cả những biến thể diễn đạt không chứa từ khóa gốc**!\n  2. **Siêu nhanh \u0026 Siêu rẻ (Low Latency \u0026 Low Cost):** Phép nhúng câu văn ngắn và tính tích vô hướng Cosine chỉ tốn vài mili-giây và một phần cực nhỏ tài nguyên tính toán so với việc chạy suy luận một mô hình LLM hàng chục tỷ tham số.\n\n---\n\n## 5. Các Phương pháp Kỹ thuật Quản trị AI (XAI, Data Lineage, Red Teaming) \u0026 Khung Pháp lý\n\n### 5.1. Explainable AI (XAI - AI Có thể Giải thích được)\nĐối với các lĩnh vực nhạy cảm như Ngân hàng (từ chối cho vay), Y tế (chẩn đoán bệnh) hay Bảo hiểm, pháp luật không cho phép mô hình hoạt động như một \"Hộp đen (Black Box)\" phán quyết mà không nêu lý do. Kỹ sư sử dụng các công cụ **XAI**:\n* **SHAP (SHapley Additive exPlanations):** Dựa trên Lý thuyết Trò chơi (Game Theory), tính toán chính xác mỗi biến đặc trưng đầu vào (ví dụ: *Thu nhập, Lịch sử trả chậm, Độ tuổi*) đã đóng góp bao nhiêu phần trăm điểm cộng/trừ vào quyết định cuối cùng của mô hình.\n* **LIME (Local Interpretable Model-agnostic Explanations):** Xấp xỉ mô hình phức tạp quanh một điểm dự đoán cụ thể bằng một mô hình tuyến tính đơn giản dễ hiểu để giải thích cục bộ.\n* **Attention Visualization \u0026 Saliency Maps:** Tô màu nhiệt (Heatmap) lên những từ ngữ trong văn bản hoặc vùng điểm ảnh trên phim X-quang mà mô hình tập trung chú ý nhất khi đưa ra kết luận.\n\n### 5.2. Data Lineage, Red Teaming (`Garak`), Data Augmentation \u0026 Accountability\n1. **Data Lineage Tracking (Theo vết nguồn gốc và dòng chảy dữ liệu):**\n   * Ghi nhật ký xuyên suốt từ lúc một mẫu dữ liệu được thu thập từ nguồn nào, giấy phép bản quyền gì, ai đã chỉnh sửa, đi qua những bước lọc/làm sạch/biến đổi nào cho đến khi nạp vào huấn luyện mô hình phiên bản mấy.\n   * *Vai trò:* Bắt buộc để **kiểm toán pháp lý (Auditing)**, gỡ bỏ dữ liệu theo quyền được lãng quên (GDPR Right to be Forgotten), chẩn đoán nhanh nguồn gốc lỗi khi mô hình bị thiên vị và đảm bảo tính minh bạch (**Transparency**).\n2. **Red Teaming (Tấn công mô phỏng chủ động) \u0026 Công cụ `NVIDIA Garak`:**\n   * Đội ngũ chuyên gia bảo mật (hoặc bộ công cụ quét lỗ hổng LLM tự động mã nguồn mở **NVIDIA Garak** - *Generative AI Red-teaming \u0026 Assessment Kit*) chủ động đóng vai **kẻ tấn công (Adversary)**, bắn hàng chục nghìn câu lệnh lắt léo, độc hại, bẻ khóa (Jailbreak, Prompt Injection, sinh mã độc, kích động thù địch) vào hệ thống AI nhằm tìm ra và vá các lỗ hổng hành vi **TRƯỚC KHI** sản phẩm được phát hành ra công chúng.\n3. **Data Augmentation (Tăng cường dữ liệu) chống Phân biệt đối xử:**\n   * Tạo thêm dữ liệu huấn luyện nhân tạo đa dạng từ tập dữ liệu gốc (đối với ảnh: xoay, lật, đổi độ sáng; đối với văn bản: thay thế từ đồng nghĩa, dịch ngược - Back translation, hoặc sinh dữ liệu tổng hợp cân bằng giới tính/văn hóa) để bù đắp cho các nhóm thiểu số bị thiếu hụt (**giảm Unintended Bias / đảm bảo Non-discrimination**) và chống Overfitting.\n4. **Accountability (Trách nhiệm giải trình) \u0026 Các Khung Quản trị Quốc tế:**\n   * **Accountability:** Thiết lập cơ chế quản trị quy định rõ tổ chức, ban lãnh đạo và kỹ sư con người phải chịu trách nhiệm pháp lý và đạo đức đối với các quyết định và hậu quả do hệ thống AI gây ra (AI không phải là pháp nhân chịu trách nhiệm thay con người!).\n   * **NIST AI RMF (AI Risk Management Framework của Hoa Kỳ):** Khung quản trị rủi ro AI gồm 4 chức năng cốt lõi: **Govern (Quản trị) – Map (Nhận diện ngữ cảnh) – Measure (Đo lường đánh giá) – Manage (Quản lý kiểm soát)**.\n   * **EU AI Act (Đạo luật AI của Liên minh Châu Âu):** Phân loại hệ thống AI theo **4 tầng rủi ro** (*Unacceptable Risk* - Cấm tuyệt đối như chấm điểm công dân; *High Risk* - Kiểm định nghiêm ngặt như Y tế, Tuyển dụng, Giao thông; *Limited Risk* - Yêu cầu minh bạch thông báo cho người dùng biết đang chat với AI/Deepfake; *Minimal Risk*).\n\n---\n\n## 6. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 9:**\n\u003e 1. **Bẫy Confidential Computing vs. NeMo Guardrails:**\n\u003e    * Bảo vệ **dữ liệu nhạy cảm và trọng số mô hình trong bộ nhớ phần cứng GPU (Hardware Enclave / TEE) khi đang tính toán trên Cloud (Privacy)** $\\to$ Chọn **NVIDIA Confidential Computing (Hopper/Blackwell)**.\n\u003e    * Kiểm soát **đầu vào/đầu ra và luồng hội thoại của ứng dụng LLM bằng ngôn ngữ Colang, chặn chủ đề cấm và chống ảo giác/Jailbreak (Safety)** $\\to$ Chọn **NVIDIA NeMo Guardrails**.\n\u003e 2. **Bẫy Embedding Classifier vs. Keyword Filter vs. LLM Filter:** Tại sao dùng Embedding Classifier để lọc đầu vào lại tối ưu? $\\to$ Vì nó **nắm bắt được sự tương đồng về ngữ nghĩa (semantic similarity)** của các câu dùng từ đồng nghĩa (vượt trội hơn lọc từ khóa tĩnh) mà **không tốn chi phí và độ trễ cao** như khi gọi thêm một LLM lớn.\n\u003e 3. **Bẫy Direct vs. Indirect Prompt Injection:** Người dùng gõ lệnh ghi đè thẳng vào ô chat $\\to$ **Direct Prompt Injection**. Kẻ xấu giấu lệnh độc hại trong trang web/email/PDF bên ngoài để lừa hệ thống RAG/Agent đọc trúng $\\to$ **Indirect Prompt Injection**.\n\u003e 4. **Bẫy Data Lineage vs. Red Teaming:** Truy vết lịch sử nguồn gốc và biến đổi dữ liệu phục vụ kiểm toán minh bạch $\\to$ **Data Lineage Tracking**. Chủ động đóng giả kẻ tấn công để tìm lỗ hổng mô hình trước khi phát hành $\\to$ **Red Teaming (`Garak`)**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Một tổ chức tài chính muốn huấn luyện và chạy suy luận mô hình AI trên đám mây công cộng (Public Cloud) nhưng yêu cầu dữ liệu khách hàng phải được mã hóa và cách ly trong môi trường thực thi tin cậy cấp phần cứng (Hardware Enclave) ngay cả khi GPU đang tính toán. Công nghệ nào của NVIDIA đáp ứng yêu cầu này?\n   * *Đáp án:* **NVIDIA Confidential Computing** (trên kiến trúc GPU NVIDIA Hopper hoặc Blackwell).\n2. **Câu 2:** Kẻ tấn công giấu một đoạn lệnh điều khiển độc hại bên trong một trang web bên ngoài; khi trợ lý AI của người dùng truy cập và tóm tắt trang web đó, trợ lý AI đã vô tình thực thi đoạn lệnh của kẻ tấn công. Hình thức tấn công này gọi là gì?\n   * *Đáp án:* **Indirect Prompt Injection (Tiêm câu lệnh gián tiếp)**.\n3. **Câu 3:** Một bệnh viện phát hiện mô hình AI chẩn đoán bệnh da liễu của họ đạt độ chính xác 95% trên bệnh nhân có làn da sáng màu nhưng chỉ đạt 60% trên bệnh nhân có làn da sẫm màu do tập dữ liệu huấn luyện ban đầu có tới 92% là ảnh da sáng màu. Đây là loại thiên vị gì và cách khắc phục kỹ thuật nào phù hợp nhất?\n   * *Đáp án:* Đây là **Representation / Sampling Bias (Thiên vị đại diện / lấy mẫu dữ liệu)**. Cách khắc phục là thu thập bổ sung dữ liệu đa dạng (**Diverse Datasets**) kết hợp kỹ thuật **Data Augmentation (Tăng cường dữ liệu)** cho nhóm thiểu số để đảm bảo nguyên tắc **Non-discrimination**.\n4. **Câu 4:** Trong **NVIDIA NeMo Guardrails**, ngôn ngữ kịch bản chuyên dụng nào được các kỹ sư sử dụng để định nghĩa các luồng hội thoại mẫu và thiết lập các rào chắn kiểm soát chủ đề (Topical \u0026 Safety Rails)?\n   * *Đáp án:* Ngôn ngữ **Colang (Conversational Modeling Language)**.\n5. **Câu 5:** Một công ty kiểm toán yêu cầu doanh nghiệp phải chứng minh được toàn bộ các tập dữ liệu dùng để huấn luyện mô hình LLM được lấy từ đâu, có vi phạm bản quyền hay không và đã trải qua những bước làm sạch nào. Quy trình kỹ thuật nào giúp đáp ứng yêu cầu minh bạch (Transparency) này?\n   * *Đáp án:* **Data Lineage Tracking (Theo vết nguồn gốc và dòng chảy dữ liệu)**.\n6. **Câu 6:** Trước khi ra mắt chatbot chăm sóc khách hàng ra công chúng, một nhóm kỹ sư bảo mật sử dụng công cụ **NVIDIA Garak** để tự động gửi hàng nghìn câu lệnh lắt léo nhằm cố gắng ép chatbot nói ra thông tin mật hoặc phát ngôn độc hại. Hoạt động này được gọi là gì?\n   * *Đáp án:* **Red Teaming (Kiểm thử tấn công mô phỏng chủ động)**.\n"},{"id":"mod10","file":"Module_10_Additional_Topics.md","badge":"MODULE 10","shortTitle":"Deep Learning, Diffusion \u0026 HF","domain":"Core AI \u0026 SW Dev","weight":"Core \u0026 SW","icon":"🔬","content":"# Module 10: Additional Technical Topics (Các Chủ đề Kỹ thuật Bổ trợ Quan trọng)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 10 (Thuộc Domain \"Core ML \u0026 AI Knowledge - 30%\" \u0026 \"Software Development - 24%\"):**\n\u003e Nắm vững giải phẫu một Nơ-ron và vòng lặp toán học **Forward Propagation $\\to$ Loss Function (MSE vs. Cross-Entropy) $\\to$ Backpropagation \u0026 Optimizers (SGD, Adam, AdamW)**; hiểu sâu hiện tượng **Vanishing Gradients vs. Exploding Gradients** qua phép ẩn dụ Trò chơi truyền tin và cách khắc phục bằng hàm kích hoạt **ReLU / GELU / SwiGLU** cùng **Skip/Residual Connections**; phân biệt **ReLU vs. Leaky ReLU vs. Sigmoid vs. Tanh vs. Softmax**; hiểu sự khác nhau giữa **Layer Normalization (LayerNorm / RMSNorm) vs. Batch Normalization** và vai trò của **Dropout**; nắm chắc 2 pha của **Diffusion Models (Forward vs. Reverse Diffusion)**, **Latent Diffusion (VAE + U-Net/DiT + CLIP)** và tham số **CFG Scale**; cùng các khái niệm **Vision Transformer (ViT)**, **NER (Named Entity Recognition)**, **Extractive vs. Abstractive Summarization**, **RAD (Rapid Application Development)** và hệ sinh thái **Hugging Face (`transformers`, `datasets`, `peft`, `safetensors`)**.\n\n---\n\n## 1. Cơ chế Toán học Huấn luyện Mạng Nơ-ron \u0026 Cấu tạo một Nơ-ron\n\n### 1.1. Giải phẫu bên trong 1 Nơ-ron Nhân tạo (Artificial Neuron / Perceptron)\nLấy cảm hứng từ tế bào thần kinh sinh học trong não người (có sợi nhánh Dendrites nhận tín hiệu, thân tế bào Soma tổng hợp, và sợi trục Axon phát xung điện qua khớp thần kinh Synapse), mỗi nơ-ron nhân tạo hoạt động như một hàm toán học gồm **2 bộ phận nối tiếp nhau**:\n\n```mermaid\nflowchart LR\n    X1[\"Đầu vào x₁ × Trọng số w₁\"]\n    X2[\"Đầu vào x₂ × Trọng số w₂\"]\n    X3[\"Đầu vào x₃ × Trọng số w₃\"]\n    Bias[\"Độ lệch b (Bias)\"]\n\n    Calc[\"1. Calculation Engine (Tổng Tuyến tính)\u003cbr/\u003ez = (w₁x₁ + w₂x₂ + w₃x₃) + b = W·X + b\"]\n    \n    Act[\"2. Decision Engine (Activation Function - Hàm Kích hoạt Phi tuyến)\u003cbr/\u003ea = f(z) (Ví dụ: ReLU, GELU, SwiGLU, Sigmoid)\u003cbr/\u003eQuyết định nơ-ron có \u0027bật sáng\u0027 (fire) và truyền tín hiệu đi tiếp hay không!\"]\n\n    Out[\"Đầu ra a truyền sang\u003cbr/\u003ecác nơ-ron tầng tiếp theo\"]\n\n    X1 \u0026 X2 \u0026 X3 \u0026 Bias --\u003e Calc ==\u003e Act ==\u003e Out\n```\n\n* **Vai trò của Trọng số ($w_i$ - Weights) và Độ lệch ($b$ - Bias):**\n  * **Weights ($w_i$):** Quyết định **mức độ quan trọng (cường độ ảnh hưởng)** của từng đặc trưng đầu vào $x_i$ (nếu $w_i \u003e 0$ là kích thích, $w_i \u003c 0$ là ức chế, $w_i = 0$ là bỏ qua hoàn toàn đặc trưng đó).\n  * **Bias ($b$):** Hằng số dịch chuyển ngưỡng kích hoạt (giúp đường thẳng $z = wx + b$ không bị ép phải đi qua gốc tọa độ $(0,0)$).\n* **Câu hỏi bản chất: Tại sao cần có Hàm kích hoạt phi tuyến (Non-linear Activation Function)?**\n  * Nếu bỏ hàm kích hoạt phi tuyến đi (hoặc chỉ dùng hàm tuyến tính $f(z) = z$), thì dù có xếp chồng nhiều tầng tuyến tính liên tiếp nhau, tích của các phép nhân ma trận tuyến tính $W_{N}(\\dots(W_2(W_1 x + b_1) + b_2)\\dots)$ theo đại số tuyến tính vẫn **rút gọn thành một phép biến đổi tuyến tính duy nhất ($y = W_{\\text{total}}x + b_{\\text{total}}$ — tương đương mạng 1 lớp không có tầng ẩn)**!\n  * Chính các **Hàm kích hoạt phi tuyến (Non-linearities)** mới giúp mạng nơ-ron sâu có khả năng biểu diễn các mối quan hệ phi tuyến phức tạp (**Định lý Xấp xỉ Vạn năng - Universal Approximation Theorem**) như nhận diện hình ảnh, giọng nói hay hiểu ngôn ngữ tự nhiên.\n\n---\n\n### 1.2. Bốn thành phần trong Vòng lặp Huấn luyện (The 4-Step Training Loop)\nMọi quá trình huấn luyện mạng nơ-ron trong PyTorch/TensorFlow đều lặp đi lặp lại 4 bước toán học sau cho mỗi Mini-batch:\n\n```mermaid\nflowchart LR\n    Step1[\"Bước 1: Forward Propagation\u003cbr/\u003e(Lan truyền xuôi)\u003cbr/\u003eĐưa dữ liệu X đi qua các tầng\u003cbr/\u003etính ra dự đoán ŷ\"]\n    \n    Step2[\"Bước 2: Loss Calculation\u003cbr/\u003e(Tính Hàm mất mát)\u003cbr/\u003eSo sánh dự đoán ŷ với nhãn thật y\u003cbr/\u003eđể đo sai số L(y, ŷ)\"]\n    \n    Step3[\"Bước 3: Backpropagation\u003cbr/\u003e(Lan truyền ngược)\u003cbr/\u003eÁp dụng Chain Rule tính đạo hàm\u003cbr/\u003eGradient ∂L/∂W từ cuối về đầu mạng\"]\n    \n    Step4[\"Bước 4: Optimizer Step\u003cbr/\u003e(Cập nhật Trọng số - AdamW)\u003cbr/\u003eW_new = W_old - η · (∂L/∂W)\u003cbr/\u003eBước xuống đồi để giảm Loss!\"]\n\n    Step1 ==\u003e Step2 ==\u003e Step3 ==\u003e Step4\n    Step4 -.-\u003e|\"Qua Mini-batch tiếp theo\"| Step1\n```\n\n1. **Forward Propagation (Lan truyền xuôi):** Dữ liệu đầu vào $X$ đi xuôi từ tầng Input qua các tầng Hidden đến tầng Output để sinh ra **kết quả dự đoán ($\\hat{y}$)**.\n2. **Loss Function (Hàm mất mát / Hàm mục tiêu):** Đo lường khoảng cách sai số giữa dự đoán của mô hình ($\\hat{y}$) và nhãn thực tế đúng (**Ground Truth $y$**).\n   * *Bài toán Hồi quy (Regression - dự đoán số liên tục):* Dùng **MSE (Mean Squared Error)**: $L = \\frac{1}{n}\\sum (y - \\hat{y})^2$ hoặc **MAE (L1 Loss)**.\n   * *Bài toán Phân loại nhị phân (Binary Classification):* Dùng **Binary Cross-Entropy Loss (Log Loss)**.\n   * *Bài toán Phân loại đa lớp \u0026 Dự đoán token tiếp theo trong LLM:* Dùng **Categorical Cross-Entropy Loss** (Negative Log-Likelihood của token đúng).\n3. **Backpropagation (Lan truyền ngược):** Áp dụng quy tắc đạo hàm hàm hợp (**Chain Rule**) trong giải tích để truyền ngược tín hiệu sai số từ tầng Output về lại từng tầng ẩn phía trước, tính toán chính xác vector đạo hàm riêng (**Gradients** $\\nabla_W L = \\frac{\\partial L}{\\partial W}$) cho từng trọng số trong mạng.\n4. **Optimizer (Thuật toán tối ưu hóa – SGD, Momentum, Adam, AdamW):** Sử dụng giá trị Gradient vừa tính được từ Backpropagation cùng với **Learning Rate ($\\eta$)** để thực sự bước xuống đồi cập nhật trọng số:\n   $$W_{t+1} = W_t - \\eta \\cdot \\nabla L(W_t)$$\n   * **SGD (Stochastic Gradient Descent):** Bước xuống đồi với tốc độ học cố định cho mọi tham số; dễ bị dao động ở các hẻm núi hẹp.\n   * **Adam (Adaptive Moment Estimation) \u0026 AdamW (Adam with Decoupled Weight Decay):** **Bộ tối ưu hóa tiêu chuẩn vàng cho mọi mô hình Transformer và LLM hiện đại!** Nó lưu trữ cả trung bình trượt của đạo hàm bậc 1 (**Momentum** - giữ quán tính hướng đi) và đạo hàm bậc 2 (**Adaptive Variance** - tự động chia nhỏ bước nhảy cho những tham số biến động mạnh và tăng bước nhảy cho tham số thưa), kết hợp điều chuẩn trọng số **Weight Decay (L2)** chống Overfitting.\n\n---\n\n## 2. Vấn đề Triệt tiêu \u0026 Bùng nổ Đạo hàm (Vanishing \u0026 Exploding Gradients) và Các Hàm Kích hoạt\n\n### 2.1. Hiện tượng Vanishing Gradients (Triệt tiêu đạo hàm) vs. Exploding Gradients (Bùng nổ đạo hàm)\nKhi mạng nơ-ron có rất nhiều tầng sâu (ví dụ 50 – 100 tầng), trong quá trình **Backpropagation**, đạo hàm tại tầng đầu tiên (Layer 1) được tính bằng **tích nhân liên tiếp (Chain Rule)** của các đạo hàm từ tầng cuối cùng ngược về tầng đầu:\n$$\\frac{\\partial L}{\\partial W_1} = \\frac{\\partial L}{\\partial a_N} \\times \\frac{\\partial a_N}{\\partial a_{N-1}} \\times \\dots \\times \\frac{\\partial a_2}{\\partial a_1} \\times \\frac{\\partial a_1}{\\partial W_1}$$\n\n* **Vanishing Gradients (Triệt tiêu đạo hàm):**\n  * Nếu mỗi tầng sử dụng hàm kích hoạt **Sigmoid** (vốn có đạo hàm cực đại chỉ bằng **$0.25$**, và ở hai đầu bão hòa đạo hàm gần bằng $0$), thì sau khi nhân liên tiếp qua 50 tầng:\n    $$(0.25)^{50} \\approx 8 \\times 10^{-31} \\to \\mathbf{0}$$\n  * **Phép ẩn dụ Trò chơi Truyền tin (Whispering Game / Telephone Game Analogy):**\n    Giống như 100 người xếp thành một hàng dọc chơi trò truyền tin thì thầm. Người đứng cuối hàng (Output layer) nói rất rõ sai số ở đâu cho người thứ 99, nhưng qua mỗi người âm lượng lại giảm đi 4 lần. Đến khi truyền tới những người đứng đầu hàng (Early layers), âm thanh đã **tắt ngấm hoàn toàn (tiến về 0)** — những người đầu hàng không nghe thấy gì nên **các tầng đầu tiên ngừng học hoàn toàn ($W_{\\text{new}} = W_{\\text{old}} - 0$)**!\n* **Exploding Gradients (Bùng nổ đạo hàm):**\n  * Ngược lại, nếu các ma trận trọng số có giá trị lớn hơn $1$ (ví dụ $2.0$), sau khi nhân liên tiếp 50 tầng: $2^{50} \\approx 1.12 \\times 10^{15} \\to \\infty$ (`NaN`), khiến bước cập nhật trọng số văng khỏi quỹ đạo và phá hỏng mô hình ngay lập tức!\n\n```mermaid\nflowchart RL\n    Out[\"Tầng Cuối (Output Layer)\u003cbr/\u003e📢 Sai số rất rõ ràng\u003cbr/\u003eGradient = 1.0\"]\n    L50[\"Tầng Giữa (Hidden Layer 50)\u003cbr/\u003e🔉 Tín hiệu yếu dần\u003cbr/\u003eGradient = 0.001\"]\n    L1[\"Tầng Đầu (Hidden Layer 1)\u003cbr/\u003e🔇 Tín hiệu tắt ngấm (Vanished!)\u003cbr/\u003eGradient ≈ 0.00000001\u003cbr/\u003e👉 Trọng số các tầng đầu đóng băng!\"]\n\n    Out ==\u003e|\"Backpropagation qua hàm Sigmoid\"| L50 ==\u003e|\"Nhân liên tiếp đạo hàm ≤ 0.25\"| L1\n```\n\n### 2.2. Bảng Tổng hợp Giải pháp Khắc phục Vanishing vs. Exploding Gradients (Hay hỏi thi!)\n| Vấn đề Đạo hàm | Giải pháp Kỹ thuật Khắc phục Triệt để | Cơ chế Toán học |\n| :--- | :--- | :--- |\n| **1. Vanishing Gradients (Đạo hàm tiến về $0$)** | • **Đổi hàm kích hoạt sang họ `ReLU` (`ReLU`, `Leaky ReLU`, `GELU`, `SwiGLU`)**.\u003cbr/\u003e• **Sử dụng Kết nối tắt: `Skip Connections / Residual Connections` ($y = F(x) + x$)**.\u003cbr/\u003e• Dùng cổng nhớ LSTM/GRU hoặc đổi hẳn sang **Transformer**. | • Đạo hàm của `ReLU` với mọi số dương luôn bằng đúng hằng số **$1$** ($1 \\times 1 \\times \\dots \\times 1 = 1$), không bị suy hao!\u003cbr/\u003e• Đường nối tắt $+ x$ tạo ra đạo hàm bằng $1$ truyền thẳng từ tầng cuối về tầng đầu như đường cao tốc không trạm thu phí. |\n| **2. Exploding Gradients (Đạo hàm vọt lên $\\infty$ / `NaN`)** | • **Kỹ thuật Cắt ngưỡng Đạo hàm: `Gradient Clipping`**.\u003cbr/\u003e• **Chuẩn hóa Tầng: `Layer Normalization (LayerNorm)` / `BatchNorm`**.\u003cbr/\u003e• Khởi tạo trọng số chuẩn (**Xavier / He Initialization**) \u0026 Giảm Learning Rate / thêm **Weight Decay**. | • **Gradient Clipping:** Nếu độ dài vector đạo hàm $\\|\\nabla L\\| \u003e \\text{threshold}$ (ví dụ $1.0$), tự động thu nhỏ vector đạo hàm về đúng bằng $1.0$ trước khi cập nhật.\u003cbr/\u003e• **LayerNorm:** Giữ các giá trị kích hoạt luôn nằm gọn quanh trung bình $0$, phương sai $1$. |\n\n---\n\n### 2.3. Bảng So sánh Toàn diện Các Hàm Kích hoạt (Activation Functions) trong Deep Learning \u0026 LLM\nTrong đề thi NCA-GENL, bạn cần phân biệt rõ khi nào dùng hàm kích hoạt nào:\n\n| Hàm kích hoạt | Công thức \u0026 Đồ thị | Miền giá trị đầu ra | Ưu điểm, Nhược điểm \u0026 Vị trí Sử dụng Chuẩn |\n| :--- | :--- | :---: | :--- |\n| **1. ReLU (Rectified Linear Unit)** | $$f(x) = \\max(0, x)$$ *(Nếu $x \u003c 0 \\to 0$; nếu $x \u003e 0 \\to x$)* | $[0, +\\infty)$ | • **Ưu:** Tính toán siêu nhanh trên GPU (chỉ là phép so sánh), **chống Vanishing Gradient tuyệt vời** cho miền dương (đạo hàm = $1$).\u003cbr/\u003e• **Nhược:** Hiện tượng *\"Dying ReLU\"* (nếu nơ-ron rơi vào vùng âm liên tục thì đạo hàm = $0$).\u003cbr/\u003e• **Vị trí:** Mặc định cho **các Tầng ẩn (Hidden Layers)** của CNN và MLP. |\n| **2. Leaky ReLU / GELU / SwiGLU** | • Leaky ReLU: $\\max(0.01x, x)$\u003cbr/\u003e• **GELU / SwiGLU**: Biến thể mượt của ReLU | $(-\\infty, +\\infty)$ | • Khắc phục hiện tượng *Dying ReLU* bằng cách cho phép một lượng nhỏ đạo hàm ở miền âm.\u003cbr/\u003e• **GELU** và **SwiGLU** là **hàm kích hoạt chuẩn bên trong khối FFN của mọi LLM hiện đại** (GPT-4, BERT, LLaMA-3, Mistral)! |\n| **3. Sigmoid (Logistic)** | $$\\sigma(x) = \\frac{1}{1 + e^{-x}}$$ *(Đường cong chữ S)* | $(0, 1)$ | • **Nhược:** Tính hàm mũ $e^{-x}$ chậm, đầu ra không đối xứng qua $0$, **gây Vanishing Gradient nặng nề nếu đặt ở tầng ẩn**.\u003cbr/\u003e• **Vị trí:** Chỉ dùng ở **Tầng đầu ra (Output Layer) cho bài toán Phân loại Nhị phân (Binary Classification)** để biểu diễn xác suất Đúng/Sai từ $0$ đến $1$. |\n| **4. Tanh (Hyperbolic Tangent)** | $$\\tanh(x) = \\frac{e^x - e^{-x}}{e^x + e^{-x}}$$ | $(-1, 1)$ | • Đối xứng qua tâm $0$ (Zero-centered) nên tốt hơn Sigmoid, dùng trong các cổng của LSTM, nhưng vẫn bị Vanishing Gradient ở hai đầu bão hòa. |\n| **5. Softmax** | $$\\text{softmax}(z_i) = \\frac{e^{z_i}}{\\sum_{j=1}^K e^{z_j}}$$ | $(0, 1)$ và $\\sum P_i = 1.0$ | • Biến một vector điểm số thô (**Logits**) thành một **Phân phối xác suất chuẩn** (tổng xác suất các lớp bằng $1.0$).\u003cbr/\u003e• **Vị trí:** Thường đặt ở **Tầng đầu ra (Output Layer) của bài toán Phân loại Đa lớp (Multi-class)**, đầu ra dự đoán từ vựng của **LLM** và bên trong công thức **Self-Attention**! |\n\n---\n\n## 3. Kỹ thuật Chuẩn hóa Tầng (LayerNorm vs. BatchNorm) \u0026 Chống Học vẹt (Dropout)\n\n### 3.1. Layer Normalization (LayerNorm / RMSNorm) vs. Batch Normalization (BatchNorm)\n* **Vấn đề kỹ thuật (Internal Covariate Shift):** Khi dữ liệu đi qua hàng chục tầng nhân ma trận trong mạng sâu, phân phối của các con số kích hoạt (activations) bị xô lệch liên tục — có tầng vọt lên hàng triệu, có tầng tụt xuống cực nhỏ, làm quá trình huấn luyện rất khó hội tụ.\n* **Bản chất của Layer Normalization (Chuẩn hóa Tầng):** Quy chuẩn hóa đầu ra của tất cả các đặc trưng bên trong **cùng một mẫu dữ liệu đơn lẻ tại một tầng** về phân phối chuẩn có **Trung bình bằng $0$ ($\\mu = 0$)** và **Độ lệch chuẩn bằng $1$ ($\\sigma = 1$)** (hầu hết các giá trị nằm gọn trong dải an toàn từ **$-3$ đến $+3$**).\n* **Phép ẩn dụ Điểm thi Đại học (School Exam Z-Score Analogy):**\n  Ba học sinh nộp điểm từ 3 trường có thang điểm khác nhau (Trường A chấm thang $50$, Trường B chấm thang $100$, Trường C chấm thang $200$). Nếu cộng gộp điểm thô sẽ gây sai lệch hoàn toàn. Quy đổi toàn bộ điểm số về **thang điểm chuẩn Z-Score ($\\mu=0, \\sigma=1$)** giúp so sánh công bằng và giữ cho mọi khối **Transformer** hội tụ ổn định.\n* **Phân biệt nhanh BatchNorm vs. LayerNorm (Hay hỏi nâng cao):**\n  * **Batch Normalization (BatchNorm):** Chuẩn hóa dọc theo từng cột đặc trưng **qua tất cả các mẫu trong cùng một Mini-batch** $\\to$ Phụ thuộc vào kích thước Batch Size, rất phổ biến trong **Mạng thị giác CNN (ResNet)**.\n  * **Layer Normalization (LayerNorm) \u0026 RMSNorm:** Chuẩn hóa ngang theo các chiều ẩn của **từng token độc lập** mà không phụ thuộc vào Batch Size hay độ dài câu $\\to$ **Tiêu chuẩn rất phổ biến cho các kiến trúc Chuỗi / NLP / Transformer / LLM**!\n\n### 3.2. Kỹ thuật Dropout (Chống Overfitting)\n* **Cơ chế hoạt động:** Trong suốt quá trình **Training (Huấn luyện)**, ở mỗi bước lặp, lớp **Dropout** sẽ **ngẫu nhiên tắt (gán giá trị bằng $0$) một tỷ lệ $p\\%$ các nơ-ron** trong tầng (ví dụ `Dropout rate p = 0.1` hoặc `0.2`, tức tắt ngẫu nhiên 10–20% nơ-ron).\n* **Phép ẩn dụ Đội bóng / Công ty:** Nếu trong một nhóm làm việc có 1 ngôi sao quá giỏi, các thành viên khác sẽ ỷ lại ngồi chơi. Nếu mỗi ngày quản lý ngẫu nhiên cho 20% nhân viên nghỉ phép, tất cả các nhân viên còn lại bắt buộc phải tự rèn luyện kỹ năng đa năng để gánh vác công việc!\n* **Tác dụng:** Ngăn chặn hiện tượng các nơ-ron phụ thuộc đồng bộ mù quáng vào nhau (**Co-adaptation**) để học thuộc lòng nhiễu của tập Train, buộc mạng nơ-ron học các biểu diễn đặc trưng phân tán và vững chắc hơn $\\to$ **Giảm thiểu Overfitting cực kỳ hiệu quả!**\n* **Lưu ý quan trọng khi kiểm thử và suy luận:** **Dropout thường chỉ kích hoạt trong lúc `Training` (`model.train()`)**; khi chuyển sang chạy **Suy luận / Đánh giá `Inference / Evaluation` (`model.eval()`), cần tắt Dropout** để sử dụng toàn bộ các nơ-ron của mạng nhằm cho ra dự đoán ổn định và nhất quán (trừ trường hợp đặc biệt khi chủ đích dùng kỹ thuật *Monte Carlo Dropout* để ước lượng độ bất định).\n\n---\n\n## 4. Thuật toán Khuếch tán Sinh ảnh/Video: Diffusion Models, Latent Diffusion \u0026 Vision Transformer (ViT)\n\n### 4.1. Quy trình 2 Pha đối nghịch nhau của Diffusion Models (Cần nhớ rõ!):\n**Diffusion Models (Mô hình Khuếch tán)** là kiến trúc cốt lõi đứng đằng sau các hệ thống tạo sinh hình ảnh, nghệ thuật và video như **Stable Diffusion, Midjourney, DALL-E 3, OpenAI Sora, NVIDIA Edify / Cosmos**.\n\n```mermaid\nflowchart TD\n    subgraph P1[\"PHA 1: FORWARD DIFFUSION (Khuếch tán Xuôi - Diễn ra trong lúc HUẤN LUYỆN)\"]\n        direction LR\n        Img0[\"🐱 Bức ảnh gốc sắc nét x₀\u003cbr/\u003e(Step t = 0)\"]\n        Img1[\"🌫️ Ảnh hơi mờ nhiễu x₅₀\u003cbr/\u003e(Step t = 50)\"]\n        ImgT[\"📺 Màn hình nhiễu hạt 100% x_T\u003cbr/\u003e(Pure Gaussian Noise - Step t = 1000)\"]\n        \n        Img0 ==\u003e|\"Cộng dần nhiễu Gaussian nhỏ q(x_t | x_{t-1})\"| Img1 ==\u003e|\"Phá hủy cấu trúc ảnh\"| ImgT\n    end\n\n    subgraph P2[\"PHA 2: REVERSE DIFFUSION (Khuếch tán Ngược - Diễn ra trong lúc SUY LUẬN / TẠO ẢNH)\"]\n        direction LR\n        Noise[\"📺 Khung hình nhiễu ngẫu nhiên x_T\u003cbr/\u003e+ Text Prompt: \u0027Một chú mèo đội mũ phi hành gia\u0027\"]\n        Denoise[\"🎨 Mạng nơ-ron (U-Net / DiT) dự đoán lượng nhiễu ε_θ\u003cbr/\u003evà trừ bỏ từng lớp nhiễu nhỏ qua từng bước\"]\n        NewImg[\"🚀🐱 Bức ảnh mới nguyên bản x₀,\u003cbr/\u003esắc nét \u0026 khớp hoàn hảo với Prompt!\"]\n        \n        Noise ==\u003e|\"Khử nhiễu có định hướng (Guided Denoising)\"| Denoise ==\u003e|\"Hoàn tất sau 20-50 bước\"| NewImg\n    end\n```\n\n1. **Forward Diffusion Process (Khuếch tán xuôi – Pha Huấn luyện):** Bắt đầu từ một bức ảnh thật sắc nét ($x_0$), hệ thống **cộng thêm từng lượng nhỏ nhiễu chuẩn Gaussian (Gaussian Noise)** qua $T$ bước thời gian liên tiếp (ví dụ $T = 1000$) cho đến khi bức ảnh gốc bị phá hủy hoàn toàn, trở thành một màn hình tivi mất sóng nhiễu hạt trắng xóa ($x_T \\sim \\mathcal{N}(0, \\mathbf{I})$).\n2. **Reverse Diffusion Process (Khuếch tán ngược / Denoising – Pha Suy luận tạo ảnh mới):** Bắt đầu từ một khung hình nhiễu ngẫu nhiên hoàn toàn ($x_T$), dưới sự dẫn dắt của câu lệnh **Text Prompt** (thông qua cơ chế Cross-Attention), mạng nơ-ron dự đoán chính xác phần nhiễu ở mỗi bước và **bóc tách/khử bỏ từng lớp nhiễu nhỏ** lặp đi lặp lại ($x_T \\to x_{T-1} \\to \\dots \\to x_0$) cho đến khi lộ ra một bức ảnh mới hoàn toàn, sắc nét và đúng như mô tả!\n\n### 4.2. Giải phẫu Kiến trúc Latent Diffusion Models (Stable Diffusion) \u0026 Tham số CFG Scale\nNếu chạy quá trình khử nhiễu 50 bước trực tiếp trên ma trận điểm ảnh phân giải cao $1024 \\times 1024 \\times 3$ (**Pixel Space**), khối lượng tính toán sẽ cực kỳ khổng lồ và chậm chạp. **Latent Diffusion Model (LDM)** giải quyết bài toán này bằng sự phối hợp của **3 thành phần cốt lõi**:\n\n```mermaid\nflowchart LR\n    Prompt[\"Text Prompt:\u003cbr/\u003e\u0027A cyberpunk city in the rain\u0027\"]\n    CLIP[\"1. Text Encoder (CLIP / T5)\u003cbr/\u003eChuyển Prompt thành\u003cbr/\u003eText Conditioning Vectors\"]\n    \n    LatentNoise[\"Nhiễu ngẫu nhiên nhỏ gọn\u003cbr/\u003etrong Không gian Tiềm ẩn\u003cbr/\u003e(Latent Space: 64 × 64)\"]\n    UNet[\"2. Denoising Network (U-Net / DiT)\u003cbr/\u003eKhử nhiễu lặp 20-50 bước trong Latent Space\u003cbr/\u003e(Nhận hướng dẫn từ CLIP qua Cross-Attention)\"]\n    CleanLatent[\"Biểu diễn Latent sạch\u003cbr/\u003eđã khử hết nhiễu\"]\n    \n    VAE[\"3. VAE Decoder\u003cbr/\u003e(Variational Autoencoder)\u003cbr/\u003eGiải nén từ Latent Space (64×64)\u003cbr/\u003era Pixel Space phân giải cao!\"]\n    FinalImg[\"🖼️ Bức ảnh 1024 × 1024\u003cbr/\u003ehoàn chỉnh!\"]\n\n    Prompt --\u003e CLIP --\u003e|\"Cross-Attention (CFG Scale)\"| UNet\n    LatentNoise --\u003e UNet --\u003e CleanLatent --\u003e VAE --\u003e FinalImg\n```\n\n1. **VAE (Variational Autoencoder):** Bộ **VAE Encoder** nén bức ảnh từ không gian điểm ảnh lớn (Pixel Space) xuống một **Không gian tiềm ẩn (Latent Space)** nhỏ gọn hơn 48 lần (nhưng vẫn giữ nguyên mọi đặc trưng cấu trúc) để huấn luyện; và sau khi khử nhiễu xong, **VAE Decoder** phóng đại ngược vector Latent đó ra bức ảnh độ phân giải cao hoàn chỉnh.\n2. **U-Net hoặc DiT (Diffusion Transformer):** Trái tim thực hiện việc dự đoán và khử nhiễu từng bước ngay bên trong không gian Latent nhỏ gọn. *(Các mô hình thế hệ mới nhất như **Sora, Flux, Stable Diffusion 3** thay thế mạng tích chập U-Net bằng kiến trúc **DiT - Diffusion Transformer** để mở rộng quy mô tốt hơn).*\n3. **CLIP (Contrastive Language-Image Pre-training - Bộ mã hóa văn bản):** Mô hình đa phương thức (do OpenAI giới thiệu) được huấn luyện trên 400 triệu cặp `(Ảnh, Chú thích)` để căn chỉnh văn bản và hình ảnh vào cùng một không gian vector. Trong Diffusion, **CLIP Text Encoder** biến câu Prompt của người dùng thành vector ngữ nghĩa rồi tiêm vào mạng U-Net/DiT qua tầng **Cross-Attention** để dẫn đường cho việc khử nhiễu.\n   * **Tham số `CFG Scale` (Classifier-Free Guidance Scale):** Điều chỉnh mức độ mô hình \"nghe lời\" câu lệnh Text Prompt:\n     * *CFG thấp ($1 - 3$):* Mô hình tự do sáng tạo nhưng dễ bỏ sót chi tiết trong Prompt.\n     * *CFG cân bằng ($7 - 9$):* Bám sát mô tả của Prompt và ảnh đẹp tự nhiên.\n     * *CFG quá cao ($\u003e 15$):* Ép bám sát Prompt thái quá làm ảnh bị cháy sáng và vỡ màu.\n4. **Vision Transformer (ViT):** Cách áp dụng trực tiếp kiến trúc Transformer vào Thị giác máy tính — cắt bức ảnh thành một lưới các **ô vuông nhỏ cố định (Image Patches, ví dụ $16 \\times 16$ pixels)**, trải phẳng mỗi ô vuông thành một vector rồi coi mỗi ô vuông đó giống hệt như **1 Token từ vựng** đưa vào Transformer Encoder!\n\n---\n\n## 5. Các Tác vụ NLP Cốt lõi (NER, Summarization), Phương pháp RAD \u0026 Hệ sinh thái Hugging Face\n\n### 5.1. Named Entity Recognition (NER - Nhận diện Thực thể Định danh) \u0026 Các Tác vụ NLP\n* **NER là gì?** Là kỹ thuật NLP tự động quét qua văn bản phi cấu trúc để xác định ranh giới và phân loại các từ/cụm từ quan trọng vào các nhóm **Thực thể định danh có cấu trúc (Predefined Categories)**: **Tên người (`PER`), Tổ chức/Công ty (`ORG`), Địa điểm (`LOC`), Ngày giờ (`DATE/TIME`), Tiền tệ (`MONEY`), Mã bệnh/Thuốc (`MEDICAL`)**.\n\n```mermaid\nflowchart LR\n    RawText[\"Câu nói tự nhiên (Unstructured Text):\u003cbr/\u003e\u0027Hãy lên lịch họp với Alex tại Favorite Cafe vào 5 giờ chiều ngày 22/10/2026\u0027\"]\n    \n    NER_Model[\"Mô hình NER\u003cbr/\u003e(Ví dụ: BERT Encoder Token Classification)\"]\n    \n    JSON_Out[\"Dữ liệu có cấu trúc (Structured JSON):\u003cbr/\u003e{\u003cbr/\u003e  action: \u0027schedule_meeting\u0027,\u003cbr/\u003e  person: \u0027Alex\u0027,\u003cbr/\u003e  location: \u0027Favorite Cafe\u0027,\u003cbr/\u003e  time: \u002717:00\u0027,\u003cbr/\u003e  date: \u00272026-10-22\u0027\u003cbr/\u003e}\"]\n\n    RawText ==\u003e NER_Model ==\u003e JSON_Out\n```\n\n* **Phân biệt 2 phương pháp Tóm tắt văn bản (Text Summarization - Hay hỏi trong đề thi):**\n  1. **Extractive Summarization (Tóm tắt Trích xuất):** Giống như dùng bút dạ quang **gạch chân và trích nguyên văn các câu quan trọng nhất** có sẵn trong bài viết gốc ghép lại (không tự viết thêm từ mới; thường dùng các mô hình Encoder như BERT).\n  2. **Abstractive Summarization (Tóm tắt Trừu tượng / Diễn giải):** Giống như con người đọc hiểu toàn bộ văn bản rồi **tự dùng ngôn từ mới của mình để viết lại bản tóm tắt ngắn gọn, mượt mà** (sử dụng các mô hình **Encoder-Decoder như T5, BART** hoặc **Decoder-only LLM**).\n\n---\n\n### 5.2. Phương pháp Phát triển Phần mềm RAD \u0026 Hệ sinh thái Thư viện Hugging Face\n1. **RAD (Rapid Application Development - Phát triển Ứng dụng Nhanh):**\n   * Là phương pháp luận kỹ thuật phần mềm (Software Engineering Methodology) ưu tiên việc **xây dựng nhanh nguyên mẫu hoạt động được (Rapid Prototyping)**, phát hành thử nghiệm sớm và **lặp đi lặp lại liên tục dựa trên phản hồi trực tiếp của người dùng (Iterative User Feedback)** thay vì mất hàng tháng trời viết tài liệu thiết kế cứng nhắc từ đầu (như mô hình Thác nước - Waterfall).\n   * *Tại sao RAD cực kỳ quan trọng trong đề thi NCA-GENL?* Vì các dự án Generative AI mang tính thực nghiệm rất cao (không biết trước Prompt nào hay mô hình nào sẽ hiệu quả nhất trên dữ liệu thật), nên áp dụng **RAD** (kết hợp các công cụ dựng UI nhanh như *Gradio, Streamlit* và microservice *NVIDIA NIM*) giúp đội ngũ AI kiểm chứng ý tưởng (PoC) chỉ trong vài ngày!\n2. **Hệ sinh thái Thư viện `Hugging Face` (Tiêu chuẩn công nghiệp cho Developer AI):**\n   * **`transformers`:** Thư viện Python cốt lõi cung cấp API thống nhất (`AutoTokenizer`, `AutoModelForCausalLM`, `pipeline`) để tải và chạy hàng trăm nghìn mô hình Pre-trained (NLP, Vision, Audio, Multimodal), tương thích mượt mà với cả **PyTorch** và **TensorFlow**.\n   * **`datasets`:** Thư viện tải và xử lý các tập dữ liệu lớn siêu tốc dựa trên định dạng bộ nhớ Apache Arrow (Memory-mapping không làm tràn RAM).\n   * **`tokenizers`:** Thư viện thực thi Subword Tokenization (BPE, WordPiece) được viết bằng ngôn ngữ **Rust** siêu nhanh.\n   * **`peft` \u0026 `trl`:** Thư viện chuẩn để gắn LoRA/QLoRA (`peft`) và huấn luyện SFT / DPO / RLHF (`trl` - Transformer Reinforcement Learning).\n   * **`safetensors`:** Định dạng lưu trữ trọng số mô hình mới an toàn và nạp nhanh (Zero-copy), thay thế cho định dạng `.bin` / `pickle` cũ của Python vốn tiềm ẩn nguy cơ bị chèn mã độc thực thi tự động (**Arbitrary Code Execution**).\n\n### Minh họa Code Python sử dụng `Hugging Face transformers` trong 5 dòng code:\n```python\nfrom transformers import pipeline\n\n# 1. Tác vụ Phân tích cảm xúc (Tự động tải mô hình Encoder-only như DistilBERT)\nclassifier = pipeline(\"sentiment-analysis\")\nprint(classifier(\"NVIDIA TensorRT-LLM speeds up inference dramatically!\"))\n# Kết quả: [{\u0027label\u0027: \u0027POSITIVE\u0027, \u0027score\u0027: 0.9998}]\n\n# 2. Tác vụ Trích xuất thực thể định danh (NER)\nner_tagger = pipeline(\"ner\", grouped_entities=True)\nprint(ner_tagger(\"Jensen Huang founded NVIDIA in Santa Clara.\"))\n# Kết quả: [{\u0027entity_group\u0027: \u0027PER\u0027, \u0027word\u0027: \u0027Jensen Huang\u0027}, {\u0027entity_group\u0027: \u0027ORG\u0027, \u0027word\u0027: \u0027NVIDIA\u0027}, {\u0027entity_group\u0027: \u0027LOC\u0027, \u0027word\u0027: \u0027Santa Clara\u0027}]\n```\n\n---\n\n## 6. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 10:**\n\u003e 1. **Bẫy ReLU vs. Sigmoid vs. Softmax:**\n\u003e    * Dùng ở **Hidden Layers** để tính toán nhanh và **chống Vanishing Gradients** $\\to$ **ReLU** (hoặc **GELU / SwiGLU**).\n\u003e    * Ép đầu ra về khoảng **$(0, 1)$** và dùng ở **Output Layer cho phân loại nhị phân** $\\to$ **Sigmoid**.\n\u003e    * Chuyển vector điểm số Logits thành **phân phối xác suất có tổng bằng $1.0$** ở Output Layer của LLM hoặc trong Self-Attention $\\to$ **Softmax**.\n\u003e 2. **Bẫy Diffusion:** Pha nào **thêm nhiễu Gaussian (adds noise)** vào ảnh gốc trong lúc huấn luyện? $\\to$ **Forward Diffusion**. Pha nào **khử nhiễu từng bước (removes noise / denoising)** từ màn hình nhiễu ngẫu nhiên để tạo ra bức ảnh mới lúc suy luận? $\\to$ **Reverse Diffusion**.\n\u003e 3. **Bẫy LayerNorm vs. Dropout:** Chuẩn hóa đầu ra của mỗi tầng về trung bình $0$, độ lệch chuẩn $1$ để giữ ổn định huấn luyện Transformer $\\to$ **Layer Normalization**. Tắt ngẫu nhiên một tỷ lệ nơ-ron trong lúc train để chống Overfitting $\\to$ **Dropout** (và nhớ tắt Dropout khi chạy Inference!).\n\u003e 4. **Bẫy Loss Function vs. Backpropagation vs. Optimizer:** Đo độ lệch sai số $\\to$ **Loss Function**. Truyền ngược sai số tính đạo hàm Gradient $\\to$ **Backpropagation**. Dùng Gradient cập nhật trọng số $\\to$ **Optimizer (Adam/AdamW/SGD)**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Tại sao các mạng nơ-ron sâu hiện đại ưu tiên sử dụng hàm kích hoạt **ReLU (hoặc GELU)** ở các tầng ẩn thay vì hàm **Sigmoid**?\n   * *Đáp án:* Vì ReLU tính toán cực kỳ nhanh và giữ đạo hàm bằng hằng số $1$ cho các giá trị dương, giúp **ngăn chặn hiện tượng triệt tiêu đạo hàm (Vanishing Gradients)** khi lan truyền ngược qua nhiều tầng sâu (trong khi Sigmoid có đạo hàm tối đa chỉ $0.25$ khiến tín hiệu đạo hàm bị nhân nhỏ dần về $0$).\n2. **Câu 2:** Phương pháp phát triển phần mềm nào ưu tiên việc dựng nhanh nguyên mẫu (rapid prototyping) và thu thập phản hồi của người dùng lặp đi lặp lại liên tục, rất phù hợp cho giai đoạn thử nghiệm các ứng dụng Generative AI?\n   * *Đáp án:* **RAD (Rapid Application Development)**.\n3. **Câu 3:** Trong kiến trúc **Latent Diffusion Model (như Stable Diffusion)**, thành phần nào chịu trách nhiệm nén bức ảnh từ không gian điểm ảnh lớn (Pixel Space) xuống không gian tiềm ẩn nhỏ gọn (Latent Space) và giải mã ngược lại thành bức ảnh hoàn chỉnh sau khi đã khử nhiễu?\n   * *Đáp án:* **VAE (Variational Autoencoder)**.\n4. **Câu 4:** Một kỹ sư đang xây dựng hệ thống tự động đọc hàng nghìn hợp đồng thương mại để bóc tách chính xác Tên công ty, Tên người đại diện, Địa chỉ trụ sở và Ngày ký kết vào bảng cơ sở dữ liệu. Đây là bài toán NLP gì?\n   * *Đáp án:* **NER (Named Entity Recognition - Nhận diện thực thể định danh)**.\n5. **Câu 5:** Trong quá trình huấn luyện mạng Transformer sâu, ngoài việc sử dụng hàm kích hoạt phù hợp, thành phần kiến trúc nào tạo ra một \"đường nối tắt\" cộng trực tiếp đầu vào $x$ vào đầu ra của tầng con ($x + \\text{SubLayer}(x)$) để giúp đạo hàm truyền thẳng về các tầng đầu mà không bị suy giảm?\n   * *Đáp án:* **Skip Connections / Residual Connections (Kết nối tắt / Kết nối dư)**.\n6. **Câu 6:** Khi chuyển một mô hình mạng nơ-ron từ chế độ Huấn luyện (`Training`) sang chế độ Suy luận thực tế (`Inference / Evaluation`), lớp **Dropout** phải được xử lý như thế nào?\n   * *Đáp án:* Lớp **Dropout phải được vô hiệu hóa (tắt đi)** để toàn bộ 100% các nơ-ron trong mạng đều tham gia tính toán, đảm bảo kết quả dự đoán đạt độ chính xác cao nhất và nhất quán.\n"},{"id":"mod11","file":"Module_11_Experiment_Design_and_Data_Visualization.md","badge":"MODULE 11","shortTitle":"Experiment Design, Data Vis \u0026 Leakage","domain":"Exp (22%) \u0026 Data (14%)","weight":"36%","icon":"📐","content":"# Module 11: Experiment Design, Data Analysis \u0026 Visualization (Thiết kế Thực nghiệm, Phân tích \u0026 Trực quan hóa Dữ liệu)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn tập NCA-GENL ở Module 11 (Bổ sung chuyên sâu cho 2 Miền trọng số lớn: \"Experimentation - 22%\" \u0026 \"Data Analysis \u0026 Visualization - 14%\"):**\n\u003e Nắm vững các nguyên tắc **Thiết kế thực nghiệm khoa học (Experiment Design)**: giả thuyết ($H_0, H_1$), biến độc lập/phụ thuộc/gây nhiễu, nhóm đối chứng (Control vs. Treatment), mô hình cơ sở (Baseline), ngẫu nhiên hóa, phân tầng (Stratification), nghiên cứu cắt bỏ (**Ablation Study**), tinh chỉnh siêu tham số và **tính tái lập (Reproducibility)**; làm chủ **Phân tích \u0026 Trực quan hóa dữ liệu (Data Analysis \u0026 Visualization)**: thống kê mô tả (Mean vs. Median, IQR, Percentiles), cơ chế khuyết dữ liệu (MCAR, MAR, MNAR), cách chọn và đọc hiểu biểu đồ (**Histogram, Box Plot, Scatter Plot, Confusion Matrix, ROC vs. PR Curve**), phân biệt **Tương quan vs. Nhân quả (Correlation vs. Causation)**; và nắm vững các quy tắc **Phòng chống Rò rỉ Dữ liệu (Data Leakage Prevention)** trong tiền xử lý, Cross-Validation, SMOTE, chia tách theo thời gian (Temporal Split) và đánh giá LLM.\n\n---\n\n## 1. Thiết kế Thực nghiệm Khoa học trong AI/ML \u0026 LLM (Experiment Design)\n\nTrong kỳ thi NCA-GENL, miền **Experimentation (22%)** kiểm tra xem kỹ sư có biết cách thiết lập một thí nghiệm công bằng, có kiểm soát và có khả năng tái lập để chứng minh một thay đổi kỹ thuật (ví dụ: đổi Prompt, thêm Reranker, hay fine-tune bằng LoRA) thực sự mang lại hiệu quả hay không.\n\n### 1.1. Các Thành phần Cốt lõi của một Thực nghiệm Có kiểm soát (Controlled Experiment)\n\n```mermaid\nflowchart LR\n    H[\"1. Giả thuyết (Hypothesis)\u003cbr/\u003e• H₀ (Null): Thay đổi không tạo khác biệt\u003cbr/\u003e• H₁ (Alternative): Prompt/Model mới cải thiện F1/Faithfulness\"]\n    \n    Vars[\"2. Kiểm soát Biến số\u003cbr/\u003e• Biến độc lập (Independent): Thứ ta chủ động thay đổi\u003cbr/\u003e• Biến phụ thuộc (Dependent): Metric đo lường đầu ra\u003cbr/\u003e• Biến hằng định (Controlled): Giữ cố định để tránh nhiễu\"]\n    \n    Split[\"3. Chia nhóm \u0026 Baseline\u003cbr/\u003e• Control Group / Baseline (Hệ thống hiện tại)\u003cbr/\u003e• Treatment Group (Hệ thống áp dụng thay đổi)\u003cbr/\u003e• Randomization \u0026 Stratification\"]\n    \n    Eval[\"4. Phân tích \u0026 Kết luận\u003cbr/\u003e• Kiểm định ý nghĩa thống kê \u0026 Khoảng tin cậy\u003cbr/\u003e• Đánh giá ý nghĩa thực tiễn (Latency, Cost)\u003cbr/\u003e• Đảm bảo tính tái lập (Reproducibility)\"]\n\n    H ==\u003e Vars ==\u003e Split ==\u003e Eval\n```\n\n| Khái niệm Thực nghiệm | Bản chất Kỹ thuật | Ví dụ Thực tế trong Dự án LLM / RAG |\n| :--- | :--- | :--- |\n| **1. Null Hypothesis ($H_0$) vs. Alternative Hypothesis ($H_1$)** | • **$H_0$ (Giả thuyết không):** Không có sự khác biệt thực sự giữa phương pháp mới và phương pháp cũ (mọi chênh lệch nhỏ quan sát được chỉ do ngẫu nhiên mẫu).\u003cbr/\u003e• **$H_1$ (Giả thuyết đối):** Phương pháp mới tạo ra sự cải thiện có ý nghĩa so với phương pháp cũ. | • $H_0$: Thêm Cross-Encoder Reranker không làm thay đổi điểm `Recall@3` so với chỉ dùng Vector Search.\u003cbr/\u003e• $H_1$: Thêm Cross-Encoder Reranker làm tăng `Recall@3` trên tập kiểm thử. |\n| **2. Independent Variable (Biến độc lập / Yếu tố can thiệp)** | Biến số mà người làm thí nghiệm **chủ động thay đổi** giữa các lần chạy để kiểm tra tác động của nó. *(Nguyên tắc vàng: Thay đổi từng yếu tố một - One factor at a time hoặc theo thiết kế ma trận).* | Loại Prompt Template (Zero-shot vs. Few-shot CoT), kích thước Chunk (`256` vs. `512` tokens), hoặc bậc hạng `r` của LoRA (`8` vs. `32`). |\n| **3. Dependent Variable (Biến phụ thuộc / Độ đo kết quả)** | Chỉ số đầu ra được **đo lường** để đánh giá hiệu quả của biến độc lập. | Điểm `F1-Score`, `ROUGE-L`, `Faithfulness`, độ trễ `TTFT (ms)`, hoặc tỷ lệ người dùng bấm *Thumbs-up*. |\n| **4. Confounding Variables (Biến gây nhiễu / Biến ngoại lai)** | Các yếu tố khác **vô tình thay đổi cùng lúc** với biến độc lập, làm ta không biết kết quả tốt lên là nhờ biến độc lập hay do biến gây nhiễu! | Khi so sánh **Prompt A** và **Prompt B**, kỹ sư lại vô tình chạy Prompt A trên `LLaMA-3 8B (temperature=0.7)` và chạy Prompt B trên `LLaMA-3 70B (temperature=0.0)` $\\to$ **Kích thước model và temperature là biến gây nhiễu làm hỏng kết luận thí nghiệm!** |\n| **5. Baseline \u0026 Control Group (Mô hình cơ sở \u0026 Nhóm đối chứng)** | Điểm mốc tham chiếu ban đầu (thường là hệ thống đang chạy hiện tại, một quy tắc heuristic đơn giản, hoặc mô hình Zero-shot chưa tinh chỉnh) để so sánh với nhóm thử nghiệm (**Treatment Group**). | Trước khi đầu tư 2 tuần Fine-tune LLM, phải đo điểm của **Zero-shot / Few-shot Prompt Baseline** trên cùng tập Test Set. |\n\n---\n\n### 1.2. Tình huống Thực tiễn: Làm sao để So sánh Công bằng 2 Prompt hoặc 2 Mô hình LLM?\n\u003e [!TIP]\n\u003e **Tình huống thường gặp trong thiết kế thí nghiệm LLM:**\n\u003e Giả sử một kỹ sư muốn kiểm chứng xem **Prompt Template B (có hướng dẫn Chain-of-Thought)** có giúp trích xuất thông tin hợp đồng chính xác hơn **Prompt Template A (Zero-shot)** hay không. Để kết luận sự khác biệt quan sát được thực sự là do Prompt, kỹ sư phải **giữ cố định (hold constant) hoặc ghi nhận đầy đủ** các điều kiện sau:\n\u003e 1. **Cùng một phiên bản mô hình (Exact Model Checkpoint/Version):** Ví dụ cùng chạy trên `meta/llama-3.1-8b-instruct` (cùng mức lượng tử hóa `BF16` hoặc `FP8`).\n\u003e 2. **Cùng một bộ dữ liệu kiểm thử (Identical Evaluation Dataset):** Chạy trên cùng tập câu hỏi/hợp đồng đại diện (có phân tầng theo độ khó/loại hợp đồng).\n\u003e 3. **Cùng bộ tham số giải mã (Decoding Parameters):** Giữ nguyên `temperature`, `top_p`, `max_tokens`, `seed`.\n\u003e 4. **Cùng tiêu chí và công cụ chấm điểm (Evaluation Rubric / Judge):** Dùng cùng một hàm đo (`Exact Match`, `F1`) hoặc cùng một phiên bản LLM-as-a-Judge với rubric chấm điểm ẩn danh (Blind evaluation).\n\n---\n\n### 1.3. Ablation Study (Nghiên cứu Cắt bỏ Thành phần) \u0026 Tinh chỉnh Siêu tham số\n1. **Ablation Study (Nghiên cứu cắt bỏ):**\n   * Khi một hệ thống AI phức tạp gồm nhiều mô-đun ghép lại (ví dụ: `Hybrid Search` + `Chunk Overlap 15%` + `Cross-Encoder Reranker` + `Few-shot Prompt`), làm sao biết thành phần nào thực sự đóng góp vào độ chính xác và thành phần nào chỉ làm tăng độ trễ vô ích?\n   * **Cách thực hiện:** Kỹ sư **loại bỏ (hoặc tắt) từng thành phần một** trong khi giữ nguyên phần còn lại, rồi đo lại sự sụt giảm của Metric:\n     * *Full System:* `Recall@5 = 91%`, `Latency = 420 ms`.\n     * *Bỏ Reranker:* `Recall@5` tụt xuống `76%` $\\to$ Chứng tỏ Reranker đóng góp rất lớn (+15%).\n     * *Bỏ BM25 (chỉ dùng Dense Vector):* `Recall@5` tụt xuống `83%` $\\to$ Hybrid Search đóng góp +8%.\n2. **Chiến lược Tìm kiếm Siêu tham số (Hyperparameter Tuning Strategies):**\n   * **Grid Search (Tìm kiếm lưới vét cạn):** Thử tất cả mọi tổ hợp có thể trên một lưới giá trị định sẵn (ví dụ 4 mức Learning Rate $\\times$ 3 mức Batch Size $\\times$ 3 mức Weight Decay = 36 lần chạy). *Nhược điểm:* Bùng nổ tổ hợp khi số siêu tham số lớn.\n   * **Random Search (Tìm kiếm ngẫu nhiên):** Lấy mẫu ngẫu nhiên các tổ hợp siêu tham số trong không gian tìm kiếm. Thường hiệu quả hơn Grid Search trong cùng một ngân sách tính toán khi chỉ có một vài siêu tham số (như Learning Rate) ảnh hưởng mạnh nhất đến kết quả.\n   * **Bayesian Optimization (Tối ưu hóa Bayes - ví dụ Optuna, Ray Tune):** Xây dựng mô hình xác suất dự đoán vùng siêu tham số hứa hẹn dựa trên kết quả của các lần chạy trước để chọn cấu hình thử nghiệm tiếp theo thông minh hơn.\n3. **Diễn giải Kết quả Thực nghiệm (Statistical vs. Practical Significance):**\n   * **Ý nghĩa thống kê (Statistical Significance):** Liệu mức tăng `+0.8%` F1-Score có lớn hơn sai số ngẫu nhiên của phép lấy mẫu không (kiểm tra qua độ lệch chuẩn giữa các folds, khoảng tin cậy 95% - Confidence Interval, hoặc kiểm định giả thuyết như *Paired Bootstrap / McNemar\u0027s test*)?\n   * **Ý nghĩa thực tiễn (Practical / Engineering Significance):** Nếu Mô hình B tăng `+0.3%` độ chính xác so với Mô hình A nhưng làm độ trễ `TPOT` tăng gấp 4 lần và chi phí GPU tăng gấp 3 lần, thì xét về mặt kỹ thuật hệ thống, Mô hình A vẫn có thể là lựa chọn tối ưu hơn.\n\n---\n\n### 1.4. Tính Tái lập trong Thực nghiệm Học sâu (Reproducibility)\nMột thí nghiệm khoa học chỉ có giá trị khi người khác (hoặc chính bạn sau 3 tháng) chạy lại cùng đoạn code trên cùng dữ liệu và thu được kết quả nhất quán (Tham khảo: [PyTorch Reproducibility Guidance](https://docs.pytorch.org/docs/stable/notes/randomness.html)):\n* **Các nguồn gây ngẫu nhiên cần kiểm soát:** Khởi tạo trọng số ngẫu nhiên (Weight initialization), thứ tự xáo trộn dữ liệu (DataLoader shuffling), lớp Dropout, lấy mẫu sinh token (`temperature \u003e 0`), và các phép cộng dấu phẩy động bất định (non-deterministic atomic operations) trong một số CUDA kernels.\n* **Thực hành chuẩn trong Python / PyTorch:**\n\n```python\nimport os\nimport random\nimport numpy as np\nimport torch\n\ndef set_reproducible_seed(seed: int = 42) -\u003e None:\n    os.environ[\"PYTHONHASHSEED\"] = str(seed)\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n    # Bật chế độ thuật toán xác định (lưu ý: có thể làm giảm nhẹ tốc độ trên một số CUDA ops)\n    torch.backends.cudnn.deterministic = True\n    torch.backends.cudnn.benchmark = False\n    torch.use_deterministic_algorithms(True, warn_only=True)\n```\n\n---\n\n## 2. Phân tích \u0026 Trực quan hóa Dữ liệu (Data Analysis \u0026 Visualization)\n\nMiền **Data Analysis \u0026 Visualization (14%)** yêu cầu kỹ sư hiểu rõ đặc tính thống kê của tập dữ liệu, chọn đúng loại biểu đồ cho từng câu hỏi phân tích và tránh các ngộ nhận thống kê.\n\n### 2.1. Thống kê Mô tả (Descriptive Statistics) \u0026 Khi nào dùng Mean vs. Median?\n| Đại lượng thống kê | Công thức / Định nghĩa | Khi nào sử dụng \u0026 Lưu ý thực chiến |\n| :--- | :--- | :--- |\n| **1. Mean (Trung bình cộng)** | $$\\mu = \\frac{1}{n}\\sum_{i=1}^n x_i$$ | Phù hợp khi dữ liệu có **phân phối đối xứng / phân phối chuẩn (Normal Distribution)** và không có điểm dị biệt lớn. \u003cbr/\u003e⚠️ **Nhược điểm:** Rất nhạy cảm với **Outliers (Điểm ngoại lai)** (VD: 9 khách hàng thu nhập 15 triệu, 1 tỷ phú thu nhập 1.000 tỷ $\\to$ Mean bị kéo vọt lên ~100 tỷ, không còn đại diện cho nhóm khách hàng!). |\n| **2. Median (Trung vị - Phân vị thứ 50 / $P_{50}$)** | Giá trị nằm ở chính giữa khi sắp xếp dữ liệu theo thứ tự tăng dần | **Thước đo xu hướng trung tâm bền vững (Robust) trước Outliers và phân phối lệch (Skewed Distributions)**! Luôn dùng Median (kèm $P_{90}, P_{95}, P_{99}$) khi báo cáo **Thu nhập, Giá nhà, Độ dài văn bản token, hoặc Độ trễ API (Latency)**. |\n| **3. Variance ($\\sigma^2$) \u0026 Standard Deviation ($\\sigma$ - Độ lệch chuẩn)** | $$\\sigma = \\sqrt{\\frac{1}{n}\\sum_{i=1}^n (x_i - \\mu)^2}$$ | Đo mức độ phân tán của dữ liệu quanh giá trị Mean (cùng đơn vị đo với dữ liệu gốc). Đi cặp với **Mean** cho phân phối chuẩn. |\n| **4. IQR (Interquartile Range - Khoảng tứ phân vị)** | $$\\text{IQR} = Q_3 (P_{75}) - Q_1 (P_{25})$$ | Độ rộng của 50% dữ liệu nằm ở phần giữa. Đi cặp với **Median** để mô tả mức độ phân tán trên dữ liệu bị lệch và dùng để xác định ngưỡng Outliers ($\u003c Q_1 - 1.5\\text{ IQR}$ hoặc $\u003e Q_3 + 1.5\\text{ IQR}$). |\n\n### 2.2. Ba Cơ chế Khuyết thiếu Dữ liệu (Missing Data Mechanisms)\nTrước khi quyết định xóa dòng (`dropna`) hay điền khuyết (`Imputation`), cần hiểu tại sao dữ liệu bị khuyết:\n1. **MCAR (Missing Completely at Random - Khuyết hoàn toàn ngẫu nhiên):** Việc một giá trị bị thiếu hoàn toàn độc lập với mọi biến số (ví dụ: mẫu xét nghiệm bị rơi vỡ ngẫu nhiên trong phòng thí nghiệm). Xóa dòng ít gây chệch (bias) nhưng làm giảm cỡ mẫu.\n2. **MAR (Missing at Random - Khuyết ngẫu nhiên có điều kiện):** Xác suất bị khuyết phụ thuộc vào các biến **đã quan sát được** khác (ví dụ: nhân viên trẻ tuổi thường ít điền mục \"Số năm kinh nghiệm quản lý\" hơn nhân viên lớn tuổi). Có thể điền khuyết hiệu quả dựa trên các cột liên quan (k-NN Imputer / Iterative Imputer).\n3. **MNAR (Missing Not at Random - Khuyết không ngẫu nhiên / Có chủ đích):** Xác suất bị khuyết phụ thuộc trực tiếp vào **chính giá trị đang bị giấu đi** (ví dụ: người có thu nhập cực cao hoặc nợ xấu thường cố tình bỏ trống ô \"Thu nhập\" / \"Dư nợ\"). Nếu chỉ xóa dòng hoặc điền Mean đơn giản sẽ gây **sai lệch chọn mẫu (Selection Bias)** nghiêm trọng; thường nên tạo thêm một cột cờ nhị phân (`is_income_missing = 1`) để mô hình biết việc bỏ trống đó mang thông tin!\n\n---\n\n### 2.3. Hướng dẫn Chọn và Đọc hiểu Biểu đồ (Data Visualization Taxonomy)\n\n```mermaid\nflowchart TD\n    Goal[\"Mục tiêu Phân tích \u0026 Trực quan hóa Dữ liệu\"]\n    \n    subgraph G1[\"1. Phân phối của 1 Biến số (Univariate Distribution)\"]\n        H[\"📊 Histogram / KDE Plot:\u003cbr/\u003eXem hình dáng phân phối (Chuẩn, Lệch phải/trái, Đa đỉnh)\u003cbr/\u003eKiểm tra phân bố độ dài Token của tập Prompt\"]\n        B[\"📦 Box Plot / Violin Plot:\u003cbr/\u003eTóm tắt 5 thông số (Min, Q1, Median, Q3, Max)\u003cbr/\u003eSo sánh phân phối \u0026 phát hiện Outliers giữa nhiều nhóm\"]\n    end\n\n    subgraph G2[\"2. Mối quan hệ giữa 2 hay nhiều Biến (Bivariate / Multivariate)\"]\n        S[\"📈 Scatter Plot (Biểu đồ phân tán):\u003cbr/\u003eQuan sát tương quan tuyến tính / phi tuyến, cụm dữ liệu\u003cbr/\u003ehoặc trực quan hóa không gian Embedding 2D (PCA/UMAP)\"]\n        HM[\"🟧 Heatmap / Correlation Matrix:\u003cbr/\u003eHiển thị ma trận hệ số tương quan giữa hàng chục biến\u003cbr/\u003ehoặc ma trận trọng số Attention / Confusion Matrix\"]\n    end\n\n    subgraph G3[\"3. Đánh giá Mô hình Phân loại (Model Evaluation Curves)\"]\n        ROC[\"📉 ROC Curve (TPR theo FPR):\u003cbr/\u003eĐánh giá tổng quát qua mọi ngưỡng cắt;\u003cbr/\u003edễ quá lạc quan khi lớp âm tính (TN) quá lớn\"]\n        PR[\"🎯 Precision-Recall (PR) Curve:\u003cbr/\u003eTập trung trực tiếp vào lớp Dương tính (Positive);\u003cbr/\u003ebản đồ chuẩn xác nhất khi dữ liệu mất cân bằng nặng!\"]\n    end\n\n    Goal --\u003e G1 \u0026 G2 \u0026 G3\n```\n\n| Loại Biểu đồ | Dùng để trả lời câu hỏi gì? | Bẫy đọc hiểu biểu đồ cần tránh |\n| :--- | :--- | :--- |\n| **1. Histogram (Biểu đồ tần suất cột liền)** | Biến số liên tục (như độ dài văn bản, độ tuổi, thu nhập) phân bố đối xứng hay bị lệch về một phía (**Right-skewed / Long-tailed**)? Có mấy đỉnh (**Bimodal/Multimodal**)? | Chọn số lượng khoảng chia (`bins`) quá ít làm mất chi tiết đa đỉnh, hoặc quá nhiều làm biểu đồ răng cưa nhiễu. |\n| **2. Box Plot (Biểu đồ hộp \u0026 râu)** | Trung vị (**Median** - vạch giữa hộp), độ phân tán (**IQR** - chiều dài hộp) và các **điểm ngoại lai (Outliers** - các chấm tròn nằm ngoài 2 đầu râu) giữa các nhóm khác nhau như thế nào? | Box Plot không hiển thị rõ được nếu dữ liệu bên trong hộp có 2 đỉnh tách biệt (khi đó nên dùng kèm **Violin Plot** hoặc **Histogram**). |\n| **3. Scatter Plot (Biểu đồ phân tán XY)** | Hai biến liên tục có tương quan dương, tương quan âm, quan hệ phi tuyến (hình parabol/logarit) hay tách thành các cụm rời nhau? | **Correlation $\\neq$ Causation:** Thấy hai biến tăng cùng nhau trên Scatter Plot không chứng minh biến X là nguyên nhân gây ra biến Y! |\n| **4. ROC Curve vs. Precision-Recall (PR) Curve** | Khi thay đổi ngưỡng xác suất (Classification Threshold từ $0.0 \\to 1.0$), sự đánh đổi giữa khả năng bắt trúng và báo động giả diễn ra như thế nào? | Trên tập dữ liệu **cực kỳ mất cân bằng** (ví dụ: 99% Negative, 1% Positive), vì mẫu số $TN$ trong $\\text{FPR} = \\frac{FP}{FP+TN}$ quá khổng lồ nên FPR vẫn rất nhỏ ngay cả khi có hàng nghìn báo động giả ($FP$). Khi đó, **PR Curve (Precision vs. Recall)** phản ánh hiệu năng thực tế trên lớp hiếm trung thực hơn nhiều so với ROC Curve! |\n\n---\n\n### 2.4. Ngộ nhận Thống kê: Tương quan vs. Nhân quả \u0026 Nghịch lý Simpson\n1. **Tương quan không đồng nghĩa với Nhân quả (Correlation Does Not Imply Causation):**\n   * *Ví dụ kinh điển:* Dữ liệu thống kê cho thấy doanh số bán kem ($X$) có hệ số tương quan dương rất mạnh ($r = 0.85$) với số vụ cháy rừng hoặc đuối nước ($Y$). Tuy nhiên, ăn kem không gây cháy rừng! Cả hai đều bị chi phối bởi một **biến gây nhiễu thứ ba (Confounding variable $Z$)** là **Nhiệt độ mùa hè nắng nóng**.\n   * Muốn kết luận **Nhân quả (Causality)**, không thể chỉ nhìn hệ số tương quan thụ động mà cần thực hiện **Thực nghiệm có đối chứng ngẫu nhiên (Randomized Controlled Trial / A/B Testing)** hoặc phân tích nhân quả có kiểm soát biến gây nhiễu.\n2. **Nghịch lý Simpson (Simpson\u0027s Paradox) \u0026 Lỗi gộp trung bình (Aggregation Fallacy):**\n   * Một xu hướng xuất hiện khi gộp chung toàn bộ dữ liệu có thể **biến mất hoặc đảo chiều hoàn toàn** khi ta tách dữ liệu ra theo từng nhóm con (Subgroups / Slices)!\n   * *Ứng dụng trong đánh giá AI:* Một mô hình LLM có điểm trung bình toàn cục tăng nhẹ từ `82%` lên `83%`, nhưng khi phân tách theo ngôn ngữ (Slice-based evaluation), độ chính xác trên tiếng Anh tăng `+3%` trong khi độ chính xác trên tiếng Việt tụt `-15%`! Do đó, luôn phải phân tích kết quả theo **từng lát cắt dữ liệu quan trọng (Data Slices / Subpopulations)**.\n\n---\n\n## 3. Phòng chống Rò rỉ Dữ liệu \u0026 Quy trình Tiền xử lý Chuẩn (Data Leakage Prevention)\n\n**Data Leakage (Rò rỉ dữ liệu)** xảy ra khi thông tin từ tập Validation/Test hoặc thông tin từ tương lai (mà mô hình không thể biết tại thời điểm dự đoán thực tế) vô tình lọt vào quá trình huấn luyện hoặc chọn đặc trưng. Hệ quả là mô hình đạt điểm cực cao trong lúc thử nghiệm nhưng thất bại nặng nề khi đưa lên Production (Tham khảo: [scikit-learn Common Pitfalls](https://scikit-learn.org/stable/common_pitfalls.html)).\n\n### 3.1. Bốn Tình huống Rò rỉ Dữ liệu Phổ biến nhất và Cách Khắc phục\n\n```mermaid\nflowchart TD\n    subgraph Wrong[\"❌ CÁCH LÀM SAI (Gây Data Leakage - Điểm Test ảo)\"]\n        W1[\"1. Gọi scaler.fit_transform(X_all) hoặc PCA/TF-IDF\u003cbr/\u003etrên TOÀN BỘ dữ liệu trước khi chia Train/Test\"]\n        W2[\"2. Chạy SMOTE (Oversampling) trên toàn bộ dữ liệu\u003cbr/\u003erồi mới chia k-Fold Cross-Validation\"]\n        W3[\"3. Chia ngẫu nhiên (Random Split) cho dữ liệu Chuỗi thời gian\u003cbr/\u003e(Dùng giá cổ phiếu ngày mai để train đoán ngày hôm qua!)\"]\n        \n        W1 --\u003e W2 --\u003e W3\n    end\n\n    subgraph Right[\"✅ CÁCH LÀM CHUẨN (Chống Data Leakage đúng quy trình)\"]\n        R1[\"1. Chia tách Train / Val / Test TRƯỚC TIÊN\u003cbr/\u003e(Dùng Time-based Split cho thời gian, Group Split cho thực thể)\"]\n        R2[\"2. Chỉ gọi scaler.fit(X_train) trên tập Train;\u003cbr/\u003eáp dụng scaler.transform(X_val) và scaler.transform(X_test)\"]\n        R3[\"3. Đặt Imputer, Scaler, SMOTE và Model vào trong 1 Pipeline\u003cbr/\u003eđể mỗi Fold trong Cross-Validation tự fit độc lập!\"]\n        \n        R1 --\u003e R2 --\u003e R3\n    end\n```\n\n| Lỗi Data Leakage thường gặp | Tại sao lại gây rò rỉ thông tin? | Quy tắc chuẩn để phòng tránh |\n| :--- | :--- | :--- |\n| **1. Tiền xử lý trước khi chia tách (Preprocessing before Splitting)** | Nếu tính Mean/Std (`StandardScaler`), Min/Max, điền khuyết (`Imputer`), chọn đặc trưng hay `TfidfVectorizer` trên toàn bộ dataset trước khi split, phân phối của tập Test đã bị trộn vào tham số của tập Train. | **Split trước, Fit sau:** Chỉ gọi `.fit()` (hoặc `.fit_transform()`) trên `X_train`; với `X_val` và `X_test` chỉ được gọi **`.transform()`**. |\n| **2. Áp dụng SMOTE trước Cross-Validation** | Nếu nhân bản hoặc nội suy mẫu bằng SMOTE trước khi chia k-Fold, các điểm dữ liệu tổng hợp (nội suy trực tiếp từ điểm gốc) sẽ nằm ở cả Train Fold và Validation Fold $\\to$ Mô hình chỉ việc nhớ điểm láng giềng sát vách! | Chỉ áp dụng SMOTE **bên trong tập huấn luyện của từng Fold** (sử dụng `imblearn.pipeline.Pipeline`), giữ nguyên phân phối gốc của Validation/Test Fold. |\n| **3. Chia ngẫu nhiên trên dữ liệu Chuỗi thời gian hoặc Nhóm thực thể (Temporal \u0026 Group Leakage)** | • Với chuỗi thời gian (Time-series / Logs): Random split cho phép mô hình học các sự kiện ở tháng 12 để dự đoán tháng 6.\u003cbr/\u003e• Với dữ liệu y tế/khách hàng: Cùng 1 bệnh nhân có 10 ảnh X-quang nằm ở cả Train và Test $\\to$ Mô hình nhớ giải phẫu riêng của bệnh nhân đó thay vì học triệu chứng bệnh. | • Dùng **Time-based Split (`TimeSeriesSplit`)**: Tập Train luôn nằm ở quá khứ ($t \u003c T_0$), tập Test nằm ở tương lai ($t \\ge T_0$).\u003cbr/\u003e• Dùng **Group Split (`GroupKFold`)**: Đảm bảo mọi mẫu của cùng một `user_id` / `patient_id` chỉ nằm trọn ở Train hoặc chỉ nằm ở Test. |\n| **4. Rò rỉ đặc trưng tương lai (Target / Future Feature Leakage) \u0026 Nhiễm bẩn Benchmark LLM** | • Đưa cột `\"ngày thanh toán thực tế\"` vào làm đặc trưng để dự đoán `\"khách có trả nợ đúng hạn không\"`.\u003cbr/\u003e• Tập dữ liệu Pre-training của LLM vô tình chứa sẵn các câu hỏi và đáp án của bộ đề thi MMLU/GSM8K (**Train-Test Contamination**). | • Loại bỏ mọi cột đặc trưng được sinh ra *sau* thời điểm ra quyết định.\u003cbr/\u003e• Thực hiện **Exact \u0026 Fuzzy Deduplication (n-gram / MinHash decontamination)** giữa tập dữ liệu huấn luyện và các bộ Benchmark kiểm thử. |\n\n### 3.2. Minh họa Code Python Chuẩn Chống Data Leakage với `scikit-learn Pipeline`\n```python\nfrom sklearn.model_selection import StratifiedKFold, cross_val_score, train_test_split\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.pipeline import Pipeline\n\n# 1. Tách riêng tập Test Set ngay từ đầu trước mọi bước xử lý\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.2, stratify=y, random_state=42\n)\n\n# 2. Đóng gói toàn bộ bước tiền xử lý và mô hình vào Pipeline\n# Khi chạy Cross-Validation, Pipeline đảm bảo Imputer và Scaler CHỈ .fit() trên phần Train của mỗi Fold!\nclf_pipeline = Pipeline([\n    (\"imputer\", SimpleImputer(strategy=\"median\")),\n    (\"scaler\", StandardScaler()),\n    (\"classifier\", LogisticRegression(class_weight=\"balanced\", random_state=42))\n])\n\ncv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\ncv_f1_scores = cross_val_score(clf_pipeline, X_train, y_train, cv=cv, scoring=\"f1\")\n\n# 3. Huấn luyện trên toàn bộ X_train và đánh giá cuối cùng trên X_test\nclf_pipeline.fit(X_train, y_train)\ntest_predictions = clf_pipeline.predict(X_test)\n```\n\n---\n\n## 4. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm cần lưu ý ở Module 11:**\n\u003e 1. **Kiểm soát biến trong thí nghiệm (Controlled Experiments):** Khi muốn đánh giá tác động của một thay đổi (như Prompt mới, mô hình Embedding mới), phải giữ cố định các biến khác (model version, decoding parameters, test set, rubric) để tránh **Confounding Variables**.\n\u003e 2. **Ablation Study:** Gỡ bỏ từng thành phần của hệ thống phức tạp để đo lường đóng góp thực tế của mỗi thành phần vào hiệu năng tổng thể.\n\u003e 3. **Mean vs. Median \u0026 ROC vs. PR Curve:** Dùng **Median \u0026 IQR** khi dữ liệu lệch (skewed) hoặc có **Outliers**. Dùng **Precision-Recall (PR) Curve** khi đánh giá lớp dương tính cực kỳ hiếm.\n\u003e 4. **Phòng chống Data Leakage:** Luôn chia tách dữ liệu trước, chỉ `fit` bộ tiền xử lý và áp dụng `SMOTE` trên tập huấn luyện (training split/fold).\n\n### Câu hỏi luyện tập minh họa (Mini Quiz):\n1. **Câu 1:** Một kỹ sư muốn kiểm nghiệm xem việc chuyển từ kỹ thuật Zero-shot Prompting sang Few-shot Prompting có giúp cải thiện độ chính xác phân loại ticket hỗ trợ khách hàng hay không. Trong khi thử nghiệm, kỹ sư chạy Zero-shot trên mô hình 8B với `temperature=0.7` và chạy Few-shot trên mô hình 70B với `temperature=0.0`. Thiết kế thí nghiệm này mắc lỗi phương pháp luận gì?\n   * *Đáp án:* Mắc lỗi **Biến gây nhiễu (Confounding Variables)** do thay đổi đồng thời nhiều yếu tố (cả kích thước mô hình, tham số `temperature` và kỹ thuật Prompting). Để thí nghiệm hợp lệ, phải giữ cố định mô hình, tham số giải mã và tập dữ liệu kiểm thử, chỉ thay đổi duy nhất Prompt.\n2. **Câu 2:** Khi phân tích độ trễ phản hồi (Latency) của một dịch vụ suy luận LLM, kỹ sư nhận thấy 95% request phản hồi trong khoảng `150–300 ms`, nhưng có 5% request phức tạp kéo dài tới `8.000 ms` (phân phối lệch phải mạnh / có Outliers). Đại lượng thống kê và biểu đồ nào phù hợp nhất để báo cáo xu hướng trung tâm và sự phân tán của độ trễ?\n   * *Đáp án:* Sử dụng **Trung vị (Median / $P_{50}$)** kết hợp các phân vị cao (**$P_{95}, P_{99}$** và **IQR**) thay vì chỉ dùng Mean, đồng thời trực quan hóa bằng **Histogram** hoặc **Box Plot**.\n3. **Câu 3:** Một nhà khoa học dữ liệu chuẩn hóa toàn bộ tập dữ liệu bằng `StandardScaler().fit_transform(X)` và tạo thêm mẫu thiểu số bằng `SMOTE().fit_resample(X, y)`, sau đó mới dùng `train_test_split` để chia ra tập Train và tập Test. Tại sao điểm số trên tập Test thu được lại cao bất thường nhưng mô hình chạy thực tế lại kém?\n   * *Đáp án:* Do lỗi **Rò rỉ dữ liệu (Data Leakage)** — thông tin thống kê và các điểm nội suy của tập Test đã bị trộn lẫn vào quá trình huấn luyện. Quy trình đúng là phải chia tách Train/Test trước, sau đó chỉ `fit` bộ chuẩn hóa và chỉ chạy `SMOTE` riêng trên tập Train.\n4. **Câu 4:** Một hệ thống RAG mới được bổ sung đồng thời 3 cải tiến: *Semantic Chunking*, *Hybrid Search (BM25 + Vector)* và *Cross-Encoder Reranker*. Để biết chính xác mỗi thành phần đóng góp bao nhiêu % vào mức tăng điểm `Recall@5` và làm tăng bao nhiêu mili-giây độ trễ, kỹ sư nên thực hiện phương pháp thực nghiệm nào?\n   * *Đáp án:* Thực hiện **Nghiên cứu cắt bỏ (Ablation Study)** — lần lượt tắt từng thành phần một so với cấu hình đầy đủ và đo lường sự thay đổi của các chỉ số trên cùng tập kiểm thử.\n5. **Câu 5:** Khi đánh giá một mô hình phát hiện sự cố phần cứng hiếm gặp (chỉ chiếm `0.05%` tổng số bản ghi log), đường cong ROC-AUC đạt tới `0.98` nhưng đội ngũ vận hành lại nhận được quá nhiều cảnh báo giả (False Positives). Biểu đồ nào giúp phản ánh rõ hơn sự đánh đổi giữa tỷ lệ cảnh báo đúng và độ bao phủ trên lớp hiếm này?\n   * *Đáp án:* **Đường cong Precision-Recall (PR Curve / PR-AUC)** vì nó tập trung trực tiếp vào lớp Positive mà không bị làm mờ bởi số lượng True Negatives ($TN$) khổng lồ như FPR trong đường cong ROC.\n6. **Câu 6:** Một ngân hàng muốn huấn luyện mô hình dự đoán giao dịch gian lận cho tháng tới dựa trên dữ liệu lịch sử giao dịch từ tháng 1 đến tháng 10. Phương pháp chia tách dữ liệu nào phù hợp nhất để đánh giá khả năng dự báo thực tế và tránh rò rỉ thông tin từ tương lai?\n   * *Đáp án:* **Chia tách theo thời gian (Time-based / Temporal Split)** — dùng dữ liệu các tháng trước (ví dụ tháng 1–8) làm tập Train, tháng 9 làm Validation và tháng 10 làm tập Test, không dùng Random Split xáo trộn thời gian.\n"},{"id":"exam","file":"NCA_GENL_Exam_Guide_and_Tips.md","badge":"ĐỀ THI \u0026 MẸO","shortTitle":"Chiến thuật \u0026 Đề Luyện Tập (30 + 50 Câu)","domain":"All 5 Domains","weight":"Mock Exam","icon":"🏆","content":"# NVIDIA Certified Associate (NCA-GENL): Cẩm nang Ôn thi, Bảng Tổng hợp \u0026 Đề Luyện Tập Thực Chiến (30 Câu + 50 Câu Định Giờ)\n\n\u003e [!IMPORTANT]\n\u003e Tài liệu này là **\"Bản đồ Tác chiến Giờ chót (Last-Minute Master Cheat Sheet)\"** kết hợp với **10 Bảng Phản xạ Nhanh**, **Bộ 30 Câu Hỏi Luyện Tập Nhanh (30-Question NCA-GENL Practice Test - Short Mock Exam)** và **Đề Thi Thử Định Giờ 50 Câu Theo Tỷ Trọng Blueprint (50-Question Timed Practice Exam - 60 Minutes)** bám sát cấu trúc [Official NVIDIA NCA-GENL Study Guide](https://www.nvidia.com/content/dam/en-zz/Solutions/training/certification/Associate-Generative-AI-LLMs-Study-Guide.pdf).\n\n---\n\n## 1. Cấu trúc Kỳ thi, Chiến thuật Phân bổ Thời gian \u0026 5 Miền Kiến thức Chính thức\n\n\u003e [!NOTE]\n\u003e **Lưu ý về thông số số lượng câu hỏi trên trang chứng chỉ NVIDIA:** Trang [NVIDIA Generative AI LLMs Associate Certification](https://www.nvidia.com/en-us/learn/certification/generative-ai-llm-associate/) hiện hiển thị **50 câu hỏi** ở bảng tóm tắt tổng quan đầu trang (*50 questions / 60 minutes*) và ghi **50–60 câu hỏi trắc nghiệm** ở phần mô tả chi tiết phía dưới (*includes 50-60 multiple-choice questions to be completed in 60 minutes*). Hãy luyện tốc độ phân bổ thời gian khoảng **1 phút / câu** để chủ động trong cả hai trường hợp.\n\n```mermaid\nflowchart LR\n    subgraph Exam[\"Thông số Kỳ thi NCA-GENL\"]\n        direction TB\n        I1[\"📋 Số lượng câu hỏi: 50 câu (bảng tổng quan) / 50–60 câu trắc nghiệm (mô tả chi tiết)\"]\n        I2[\"⏱️ Thời gian làm bài: 60 phút (~1 phút / câu) | Thi trực tuyến có giám thị (Online Proctored)\"]\n        I3[\"💵 Lệ phí thi: $125 USD | Ngôn ngữ: Tiếng Anh | Hiệu lực: 2 năm kể từ ngày cấp\"]\n        I4[\"🎯 Điểm cộng/trừ: Không trừ điểm câu sai (Không bỏ trống bất kỳ câu nào)\"]\n    end\n\n    subgraph Blueprint[\"5 Miền Kiến thức Chính thức (Official Blueprint Domains)\"]\n        direction TB\n        D1[\"1. Core Machine Learning \u0026 AI Knowledge: 30% (~15-18 câu)\u003cbr/\u003e(ML/DL, PCA/K-Means, Transformer, Attention Q/K/V, Tokenization, Diffusion, Activations)\"]\n        D2[\"2. Software Development: 24% (~12-14 câu)\u003cbr/\u003e(Python APIs, Hugging Face, RAG Pipeline, NVIDIA NeMo, TensorRT-LLM, Triton, NIM, ONNX)\"]\n        D3[\"3. Experimentation: 22% (~11-13 câu)\u003cbr/\u003e(Hypothesis/A-B/Ablation, Prompting, LoRA/QLoRA, Temp/Top-P, BLEU/ROUGE/F1/PPL, CV)\"]\n        D4[\"4. Data Analysis \u0026 Visualization: 14% (~7-8 câu)\u003cbr/\u003e(EDA, Outliers/IQR, Missing Data, Charts, Imbalanced Data, Data Leakage, RAPIDS, Drift)\"]\n        D5[\"5. Trustworthy AI: 10% (~5-6 câu)\u003cbr/\u003e(Hallucination, Bias, Prompt Injection, NeMo Guardrails/Colang, Confidential Computing, XAI)\"]\n    end\n\n    Exam ==\u003e Blueprint\n```\n\n### Chiến thuật Làm bài trong 60 Phút (Exam-Day Strategy):\n1. **Quy tắc 45 Giây (Pass 1):** Đọc câu hỏi từ dưới lên (đọc câu hỏi cuối cùng trước khi đọc đoạn văn tình huống dài) để bắt từ khóa. Câu nào nhận diện được ngay qua **10 Bảng Phản Xạ Nhanh** dưới đây $\\to$ Chọn ngay trong 30–45 giây.\n2. **Đánh dấu Cờ (Flag for Review - Pass 2):** Nếu gặp câu hỏi tình huống dài hoặc phân vân giữa 2 đáp án quá 60 giây, hãy chọn tạm đáp án có cơ sở kỹ thuật tốt nhất, bấm **Flag** và đi tiếp ngay để đảm bảo hoàn thành toàn bộ đề thi. Dành 10–15 phút cuối quay lại giải quyết các câu gắn cờ.\n3. **Mẹo loại trừ Đáp án Nhiễu (Distractors) thường gặp:**\n   * Đáp án nào nói *\"Triton là phần cứng GPU\"* hoặc *\"Triton dùng để huấn luyện mô hình\"* $\\to$ **Loại ngay** (Triton là phần mềm máy chủ suy luận).\n   * Đáp án nào chỉ dựa vào *\"Accuracy\"* cho bài toán dữ liệu mất cân bằng nghiêm trọng (như gian lận 1%, bệnh hiếm 2%) $\\to$ **Loại ngay** (hãy xét **Recall, Precision, F1-Score, PR-AUC** theo chi phí FP/FN).\n   * Đáp án nào chọn *\"Full Fine-Tuning\"* hoặc *\"Training from Scratch\"* khi doanh nghiệp chỉ cần tra cứu tài liệu nội bộ cập nhật thường xuyên với ngân sách thấp và cần trích dẫn nguồn $\\to$ **Ưu tiên chọn RAG!**\n\n---\n\n## 2. Mười Bảng Phản Xạ Nhanh (\"Nhìn Từ Khóa – Chọn Đáp Án Chuẩn Kỹ Thuật\")\n\n### Bảng 1: Chọn Kiến trúc Transformer \u0026 Mô hình theo Bài toán (Module 4)\n| Từ khóa bài toán trong đề thi | Kiến trúc phù hợp | Mô hình đại diện | Cơ chế cốt lõi |\n| :--- | :--- | :--- | :--- |\n| Phân loại văn bản, Phân tích cảm xúc (Sentiment), Lọc Spam, Trích xuất thực thể (**NER**), Tạo Vector Embedding \u0026 Reranker | **Encoder-only (Autoencoding)** | **BERT**, RoBERTa, DeBERTa, DistilBERT | Đọc hiểu ngữ cảnh **2 chiều (Bidirectional Self-Attention)** / Masked Language Modeling (MLM) |\n| Sinh văn bản mở, Chatbot hội thoại, Trợ lý viết Code, Suy luận logic đa bước, AI Agents | **Decoder-only (Autoregressive)** | **GPT-4**, **LLaMA 3**, Claude, Mistral, **Nemotron** | Dự đoán từ tiếp theo **1 chiều từ trái sang phải (Masked Causal Self-Attention)** |\n| **Dịch máy** giữa các ngôn ngữ (Translation), **Tóm tắt** văn bản dài thành ngắn (Abstractive Summarization) | **Encoder-Decoder (Seq2Seq)** | **T5**, **Flan-T5**, BART, mBART, NLLB | Encoder đọc hiểu toàn bộ chuỗi nguồn $\\to$ Decoder sinh chuỗi đích mới qua **Cross-Attention** |\n| Mô hình có tổng số tham số rất lớn nhưng chỉ kích hoạt một phần nhỏ tham số trên mỗi token để suy luận nhanh | **Mixture of Experts (MoE)** | **Mixtral 8x7B**, DeepSeek, GPT-4 | Mạng **Router / Gating Network** chọn kích hoạt **Top-K Experts (FFN)** cho từng token |\n\n### Bảng 2: Chọn Độ đo Đánh giá (Evaluation Metrics) theo Tác vụ (Module 5, 6 \u0026 7)\n| Tác vụ AI cần đánh giá | Độ đo (Metric) chuẩn xác | Bản chất kỹ thuật cần nhớ |\n| :--- | :--- | :--- |\n| **Dịch máy (Machine Translation)** | **BLEU** | Thiên về **Precision** (Đếm tỷ lệ cụm từ n-grams trùng khớp chính xác với bản dịch mẫu). |\n| **Tóm tắt văn bản (Text Summarization)** | **ROUGE** (ROUGE-1, ROUGE-2, ROUGE-L) | Thi
