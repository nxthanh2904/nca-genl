ng trực tiếp một vector tạo bởi các hàm lượng giác $\\sin$ và $\\cos$ có tần số sóng khác nhau vào Word Embedding: $\\text{Input} = \\text{WordEmbedding}(x) + \\text{PositionalEncoding}(pos)$.\n    2. **RoPE (Rotary Position Embedding - Chuẩn hiện đại trên LLaMA, Mistral, Nemotron):** Thay vì cộng vector vị trí, **RoPE xoay (rotate) trực tiếp vector Query ($Q$) và Key ($K$) một góc tỷ lệ với vị trí của chúng trong mặt phẳng phức**, giúp Attention tự nhiên phụ thuộc vào **khoảng cách tương đối (Relative Distance)** giữa hai từ và mở rộng cửa sổ ngữ cảnh (Context Window) lên tới 128K – 1M tokens dễ dàng!\n\n---\n\n### 3.3. Cơ chế Self-Attention (Tự chú ý) và Bộ ba Vector Query ($Q$), Key ($K$), Value ($V$)\n* **Phép ẩn dụ:** Self-Attention hoạt động giống như một **chiếc bút dạ quang thần kỳ (Magical Highlighter)** rà soát toàn bộ câu văn ngay lập tức. Khi xử lý đại từ `\"it\"` trong hai câu kinh điển sau:\n  * Câu A: *\"The **animal** didn\u0027t cross the street because **it** was too **tired**.\"* $\\to$ Điểm Attention của `\"it\"` tập trung mạnh nhất vào **`\"animal\"`** (vì con vật mới biết mệt!).\n  * Câu B: *\"The animal didn\u0027t cross the **street** because **it** was too **wide**.\"* $\\to$ Điểm Attention của `\"it\"` tự động chuyển sang tập trung mạnh nhất vào **`\"street\"`** (vì con đường mới rộng!).\n\n#### Giải mã Toán học $Q, K, V$ theo góc nhìn Developer (Rất hay hỏi trong đề thi!):\nĐể tính toán sự liên kết giữa các từ, mỗi vector đầu vào $X$ của một token sẽ được nhân với 3 ma trận trọng số học được ($W_Q, W_K, W_V$) để sinh ra **3 vector đóng 3 vai trò khác nhau** (giống hệt như khi bạn tìm kiếm video trên YouTube hoặc truy vấn Hash Map / Database):\n\n```mermaid\nflowchart LR\n    Token[\"Vector của mỗi Token\u003cbr/\u003e(Embedding + Positional)\"]\n    \n    Q[\"1. Vector QUERY (Q = X·W_Q)\u003cbr/\u003e🔍 \u0027Câu truy vấn tìm kiếm\u0027\u003cbr/\u003eToken hiện tại đang cần tìm kiếm\u003cbr/\u003ethông tin ngữ cảnh gì từ các từ khác?\"]\n    \n    K[\"2. Vector KEY (K = X·W_K)\u003cbr/\u003e🏷️ \u0027Nhãn / Tiêu đề chỉ mục\u0027\u003cbr/\u003eToken này đang nắm giữ loại thông tin\u003cbr/\u003engữ pháp/ngữ nghĩa gì để chào mời?\"]\n    \n    V[\"3. Vector VALUE (V = X·W_V)\u003cbr/\u003e📦 \u0027Nội dung thực sự\u0027\u003cbr/\u003eThông tin ngữ nghĩa thực chất sẽ được\u003cbr/\u003etrích xuất nếu Query khớp với Key!\"]\n\n    Dot[\"Bước 1: Nhân vô hướng Q · Kᵀ\u003cbr/\u003e(Đo độ tương đồng giữa Query của từ i và Key của mọi từ j)\u003cbr/\u003eChia cho √dₖ rồi qua hàm Softmax -\u003e Ra Trọng số Attention (Tổng = 1.0)\"]\n    \n    Out[\"Bước 2: Nhân Trọng số Attention với V\u003cbr/\u003e👉 Vector đầu ra là tổng có trọng số của các Value,\u003cbr/\u003eđã ngấm trọn vẹn ngữ cảnh cả câu!\"]\n\n    Token --\u003e Q \u0026 K \u0026 V\n    Q \u0026 K --\u003e Dot\n    Dot \u0026 V --\u003e Out\n```\n\n* **Công thức Scaled Dot-Product Attention kinh điển (Cần hiểu từng thành phần):**\n  $$\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$$\n  1. **$QK^T$ (MatMul 1):** Nhân tích vô hướng giữa vector Query của từng từ với vector Key của tất cả các từ trong câu để tạo ra **Ma trận Điểm Tương đồng (Attention Scores Matrix)** kích thước $N \\times N$ (với $N$ là số lượng token trong chuỗi).\n  2. **Chia cho $\\sqrt{d_k}$ (Scale):** Tại sao phải chia cho căn bậc hai số chiều của vector Key? Vì khi số chiều $d_k$ lớn (ví dụ $d_k = 64$ hay $128$), tổng tích vô hướng $QK^T$ sẽ có phương sai rất lớn, đẩy hàm $\\text{softmax}$ vào vùng bão hòa cực đoan (một số bằng $1$, các số khác bằng $0$), làm đạo hàm tiến về $0$ (**Vanishing Gradients**). Chia cho $\\sqrt{d_k}$ giúp giữ phương sai bằng $1$ để đạo hàm luôn mượt mà!\n  3. **$\\text{softmax}(\\cdot)$:** Chuyển hóa điểm số thô thành phân phối xác suất (**Attention Weights**) nằm trong khoảng $[0, 1]$ và tổng trên mỗi hàng bằng đúng $1.0$.\n  4. **Nhân với $V$ (MatMul 2):** Nhân ma trận trọng số xác suất vừa tìm được với ma trận **Value ($V$)** để gom thông tin ngữ nghĩa về cho từng token.\n\n### 3.4. Phân biệt 3 Cơ chế Attention: Bidirectional Self-Attention vs. Masked Causal Attention vs. Cross-Attention\nĐề thi rất hay hỏi sự khác nhau về cách hoạt động của Attention trong Encoder và Decoder:\n1. **Bidirectional Self-Attention (Dùng trong khối Encoder như BERT):** Mọi token ở vị trí $i$ được phép nhìn thấy **toàn bộ các token ở cả phía trước ($\u003c i$) và phía sau ($\u003e i$)** trong câu.\n2. **Masked / Causal Self-Attention (Dùng trong khối Decoder như GPT, LLaMA):** Vì nhiệm vụ của Decoder là dự đoán từ tiếp theo nên khi đang ở vị trí thứ $i$, nó **tuyệt đối không được phép \"ăn gian\" nhìn trộm các từ ở tương lai ($\u003e i$)**. Kỹ thuật thực hiện: Cộng một ma trận mặt nạ tam giác trên chứa giá trị **$-\\infty$ (Negative Infinity Mask)** vào $QK^T$ trước khi qua hàm Softmax (vì $e^{-\\infty} = 0$), ép toàn bộ trọng số chú ý về tương lai bằng $0$!\n3. **Cross-Attention (Encoder-Decoder Attention - Dùng trong mô hình Seq2Seq như T5, BART hoặc tiêm Text Prompt vào U-Net của Stable Diffusion):**\n   * Vector **Query ($Q$)** được lấy từ **khối Decoder** (hoặc ảnh đang khử nhiễu).\n   * Còn vector **Key ($K$)** và **Value ($V$)** được lấy từ đầu ra của **khối Encoder** (hoặc văn bản gốc)! Giúp Decoder vừa viết câu dịch vừa đối chiếu sang toàn bộ câu gốc ở Encoder.\n\n---\n\n### 3.5. Multi-Head Attention (MHA), KV Cache, GQA và FlashAttention\n* **Multi-Head Attention (MHA - Chú ý đa đầu):**\n  Một câu văn tự nhiên luôn chứa đựng nhiều tầng thông tin cùng lúc (ngữ pháp chủ-vị, quan hệ sở hữu, thời gian, cảm xúc). Thay vì chỉ tính Attention 1 lần trên toàn bộ số chiều, **Multi-Head Attention** chia nhỏ vector thành $h$ \"đầu chú ý\" (**Attention Heads**, ví dụ 32 heads) chạy song song và độc lập với nhau trên các không gian con khác nhau, sau đó nối (`Concat`) lại:\n\n```mermaid\nflowchart TD\n    Input[\"Tin nhắn trong Nhóm Chat lập kế hoạch Sinh nhật bất ngờ\"]\n    \n    H1[\"🕵️ Head 1 (Thám tử bí mật)\u003cbr/\u003eChú ý ngày giờ \u0026 lời dặn giữ bí mật\"]\n    H2[\"🍕 Head 2 (Chuyên gia ẩm thực)\u003cbr/\u003eChú ý \u0027pizza\u0027 \u0026 \u0027bánh kem sô-cô-la\u0027\"]\n    H3[\"🎈 Head 3 (Chuyên gia trang trí)\u003cbr/\u003eChú ý \u0027bong bóng\u0027, \u0027pháo kim tuyến\u0027, màu \u0027vàng-đen\u0027\"]\n    H4[\"🎵 Head 4 (Phụ trách âm nhạc)\u003cbr/\u003eChú ý \u0027nhạc thập niên 90\u0027, \u0027Spice Girls\u0027\"]\n    H5[\"😏 Head 5 (Phân tích sắc thái)\u003cbr/\u003ePhát hiện giọng điệu đùa cợt / châm biếm\"]\n    \n    Concat[\"Gộp toàn bộ góc nhìn (Concatenate \u0026 Linear Projection W_O)\u003cbr/\u003e👉 Hiểu trọn vẹn toàn cảnh ngữ nghĩa, ngữ pháp \u0026 cảm xúc của cuộc hội thoại!\"]\n\n    Input --\u003e H1 \u0026 H2 \u0026 H3 \u0026 H4 \u0026 H5 --\u003e Concat\n```\n\n* **Tối ưu hóa Attention trong LLM hiện đại (Kiến thức sát sườn với TensorRT-LLM ở Module 8):**\n  1. **KV Cache (Bộ nhớ đệm Key-Value lúc Inference):** Khi mô hình Decoder sinh token thứ $100$, các vector Key ($K$) và Value ($V$) của $99$ token trước đó hoàn toàn không thay đổi. Thay vì tính lại từ đầu cho cả $99$ token cũ, hệ thống lưu sẵn $K$ và $V$ của các token đã qua vào VRAM gọi là **KV Cache** $\\to$ Giúp tăng tốc độ sinh token lên hàng chục lần!\n  2. **MHA $\\to$ MQA (Multi-Query) $\\to$ GQA (Grouped-Query Attention):** Khi chuỗi dài (ví dụ 128K tokens), bộ nhớ **KV Cache** phình to chiếm hết VRAM. **GQA** (dùng trong **LLaMA-3, Mistral, Nemotron**) cho phép một nhóm nhiều đầu Query (ví dụ 8 Query heads) dùng chung 1 đầu Key và 1 đầu Value, giúp **giảm kích thước KV Cache đi 4–8 lần** mà vẫn giữ nguyên độ thông minh như MHA!\n  3. **FlashAttention:** Thuật toán chia nhỏ (Tiling) ma trận $Q, K, V$ để tính toán trọn vẹn ngay bên trong bộ nhớ đệm siêu tốc **SRAM (Shared Memory)** trên chip GPU mà không cần ghi ma trận trung gian $N \\times N$ ra bộ nhớ HBM chậm hơn, giúp tăng tốc độ huấn luyện và suy luận lên gấp nhiều lần.\n\n---\n\n### 3.6. Chiến lược Giải mã \u0026 Các Tham số Điều khiển Sinh văn bản (Decoding \u0026 Sampling Parameters)\nỞ Bước 5 của Pipeline, sau khi lớp Softmax tính ra xác suất cho toàn bộ từ điển, làm sao mô hình chọn ra từ tiếp theo?\n* **Các chiến lược chọn từ cơ bản:**\n  * **Greedy Decoding (Giải mã tham lam):** Luôn chọn đúng 1 token có xác suất cao nhất ở mỗi bước ($\\arg\\max P(w_t)$). Nhanh, nhất quán nhưng dễ bị lặp câu từ máy móc.\n  * **Beam Search (Tìm kiếm chùm):** Duy trì đồng thời $B$ chuỗi ứng viên (Beams) tốt nhất ở mỗi bước rồi chọn chuỗi có tổng xác suất cả câu cao nhất (Rất hay dùng trong dịch máy hoặc tóm tắt cố định).\n  * **Stochastic Sampling (Lấy mẫu ngẫu nhiên có kiểm soát):** Điều khiển qua **3 siêu tham số suy luận (`Temperature`, `Top-K`, `Top-P`)** dưới đây:\n\n| Tham số | Bản chất Toán học \u0026 Cơ chế | Khi giá trị THẤP | Khi giá trị CAO |\n| :--- | :--- | :--- | :--- |\n| **1. Temperature ($T$)** | Chia điểm thô (logits $z_i$) cho $T$ trước khi đưa vào hàm Softmax: $$P_i = \\frac{\\exp(z_i / T)}{\\sum \\exp(z_j / T)}$$ Điều chỉnh \"độ nhọn\" hay \"độ phẳng\" của phân phối xác suất token. | **$T \\to 0$ (VD: $0.0 - 0.2$):** Làm nhọn phân phối; giảm độ đa dạng khi lấy mẫu. Nhiều API quy ước `temperature=0` là **greedy decoding** (chọn token có logit cao nhất). Thường ưu tiên cho *sinh Code, SQL, trích xuất JSON, Hỏi đáp RAG* khi cần giảm tính ngẫu nhiên của bước sampling. | **$T \\ge 0.8 - 1.2$:** Làm phẳng phân phối; các từ xác suất thấp hơn có thêm cơ hội được chọn. Đầu ra **đa dạng, giàu tính biến thiên hơn**, nhưng nếu đặt quá cao ($T \u003e 1.5$) dễ sinh văn bản rời rạc và tăng nguy cơ ảo giác $\\to$ *Thường dùng cho viết sáng tạo, Brainstorming*. |\n| **2. Top-K Sampling** | Cắt theo **số lượng ứng viên cố định**: Sắp xếp các token theo xác suất giảm dần, chỉ giữ lại **$K$ token đứng đầu**, loại bỏ phần đuôi còn lại rồi chuẩn hóa lại xác suất để lấy mẫu. | **$K = 1$:** Tương đương Greedy Decoding (chỉ lấy 1 từ có xác suất cao nhất). | **$K = 40$ hoặc $50$:** Cho phép chọn trong 40–50 từ hợp lý nhất, cắt bỏ phần đuôi dài (long tail) chứa các từ xác suất rất thấp. *(Hạn chế: $K$ cố định nên kém linh hoạt khi phân phối quá nhọn hoặc quá phẳng).* |\n| **3. Top-P (Nucleus Sampling)** | Cắt động theo **tổng xác suất tích lũy (Cumulative Probability)**: Sắp xếp các từ từ cao xuống thấp và cộng dồn xác suất cho đến khi chạm ngưỡng $P$ thì dừng lại (tập hạt nhân - Nucleus). | **$P = 0.1$ (10%):** Chỉ xét nhóm hạt nhân nhỏ các từ có xác suất cao nhất. | **$P = 0.90$ (90%):** Tự động co giãn số lượng từ ứng viên theo ngữ cảnh — nếu mô hình rất tự tin (`P(\"cat\") = 0.92`), tập ứng viên thu hẹp; nếu câu mở có nhiều hướng đi, tập ứng viên tự mở rộng để giữ sự tự nhiên. |\n\n\u003e [!WARNING]\n\u003e **Lưu ý quan trọng về `temperature = 0` và tính tái lập (Reproducibility):**\n\u003e Temperature chỉ điều chỉnh độ đa dạng của phân phối xác suất khi chọn token (**sampling diversity**), **không phải là bảo chứng cho tính đúng sự thật (truthfulness) hay độ chính xác nghiệp vụ**. Ngay cả khi đặt `temperature=0` (greedy decoding), **không đảm bảo đầu ra luôn đúng sự thật, an toàn hay giống hệt 100% giữa mọi lần chạy** (do khác biệt về floating-point non-determinism trên GPU, dynamic batching, phần cứng/backend hoặc phiên bản model). Khi ứng dụng LLM để sinh Code, SQL hoặc JSON trong sản xuất, lập trình viên phải kết hợp **schema validation** (như Pydantic/JSON Schema), **kiểm thử tự động (unit tests)**, **phân quyền tối thiểu (least-privilege DB permissions)** và các bước xác minh độc lập (Tham khảo: [PyTorch Reproducibility Notes](https://docs.pytorch.org/docs/stable/notes/randomness.html)).\n\n*(Ngoài ra còn có **Frequency Penalty** phạt các từ đã xuất hiện nhiều lần để chống lặp từ, và **Presence Penalty** khuyến khích mô hình chuyển sang chủ đề mới).*\n\n---\n\n## 4. Phân loại 3 Biến thể Kiến trúc Transformer \u0026 Mô hình Mixture of Experts (MoE)\n\n### 4.1. Ba biến thể kiến trúc Transformer (CỰC KỲ QUAN TRỌNG!)\nTừ bài báo Transformer gốc năm 2017 (vốn gồm cả khối Encoder bên trái và khối Decoder bên phải để dịch máy), giới công nghệ đã tách và phát triển thành **3 nhánh kiến trúc chuyên biệt**:\n\n```mermaid\nflowchart TD\n    Trans[\"Kiến trúc Transformer Gốc (Vaswani et al., 2017)\"]\n    \n    subgraph E_Only[\"1. Encoder-Only (Hiểu \u0026 Phân tích - NLU)\"]\n        E_Desc[\"📖 Học giả đọc sách trong thư viện\u003cbr/\u003eChú ý 2 chiều (Bidirectional Self-Attention)\u003cbr/\u003eNhìn cả trái \u0026 phải cùng lúc để hiểu sâu ngữ nghĩa\"]\n        E_Models[\"Mô hình: BERT, RoBERTa, DeBERTa, DistilBERT, Nomic-Embed\"]\n        E_Tasks[\"Tác vụ: Phân loại cảm xúc (Sentiment Analysis),\u003cbr/\u003eLọc Spam, Trích xuất thực thể (NER),\u003cbr/\u003eTạo Vector Embedding \u0026 Reranker cho RAG\"]\n        E_Desc --\u003e E_Models --\u003e E_Tasks\n    end\n\n    subgraph D_Only[\"2. Decoder-Only (Sinh văn bản \u0026 Hội thoại - NLG)\"]\n        D_Desc[\"✍️ Nhà biên kịch viết truyện nối tiếp\u003cbr/\u003eChú ý 1 chiều có mặt nạ (Masked Causal Self-Attention)\u003cbr/\u003eDự đoán từ tiếp theo liên tục (Autoregressive)\"]\n        D_Models[\"Mô hình: GPT-3/4, LLaMA 3, Claude, Mistral, Nemotron\"]\n        D_Tasks[\"Tác vụ: Sinh văn bản mở, Chatbot hội thoại đa năng,\u003cbr/\u003eTrợ lý viết Code, Suy luận logic, AI Agents\"]\n        E_Desc ~~~ D_Desc\n        D_Desc --\u003e D_Models --\u003e D_Tasks\n    end\n\n    subgraph ED_Both[\"3. Encoder-Decoder (Biến đổi chuỗi sang chuỗi - Seq2Seq)\"]\n        ED_Desc[\"🌐 Dịch giả đội 2 chiếc mũ\u003cbr/\u003eEncoder đọc hiểu trọn vẹn chuỗi nguồn (2 chiều)\u003cbr/\u003eDecoder sinh ra chuỗi đích mới (1 chiều + Cross-Attention)\"]\n        ED_Models[\"Mô hình: T5, Flan-T5, BART, mBART, NLLB, Whisper\"]\n        ED_Tasks[\"Tác vụ: Dịch máy đa ngôn ngữ (Machine Translation),\u003cbr/\u003eTóm tắt văn bản dài thành ngắn (Text Summarization)\"]\n        ED_Desc --\u003e ED_Models --\u003e ED_Tasks\n    end\n\n    Trans --\u003e E_Only\n    Trans --\u003e D_Only\n    Trans --\u003e ED_Both\n```\n\n### Bảng so sánh tổng hợp 3 biến thể Transformer (Học thuộc lòng trước khi thi!)\n| Loại kiến trúc | Ẩn dụ thực tế | Cơ chế Huấn luyện \u0026 Attention cốt lõi | Mô hình tiêu biểu | Tác vụ tối ưu nhất (Use Cases) |\n| :--- | :--- | :--- | :--- | :--- |\n| **1. Encoder-only (Autoencoding)** | **Học giả thông thái ngồi thư viện:** Đọc hết cả cuốn sách một cách im lặng, ghi nhớ sâu sắc toàn bộ ngữ cảnh trước-sau, sẵn sàng trả lời câu hỏi phân tích. | **Masked Language Modeling (MLM) + Bidirectional Attention:** Che ngẫu nhiên ~15% từ trong câu (`[MASK]`) và nhìn ngữ cảnh từ **cả 2 phía trái và phải** cùng lúc để đoán từ bị che. | **BERT**, RoBERTa, DeBERTa, ELECTRA, DistilBERT | **Hiểu ngôn ngữ (NLU):** Phân loại cảm xúc (Sentiment Analysis), lọc email Spam, trích xuất thực thể (**NER**), tạo Vector Embedding cho Semantic Search/RAG. |\n| **2. Decoder-only (Autoregressive)** | **Nhà biên kịch / Kể chuyện tài ba:** Nhận một ý tưởng ngắn ban đầu (Prompt), sau đó viết nối tiếp từng từ, từng câu trôi chảy, câu sau dựa vào câu trước. | **Causal Language Modeling (CLM) + Masked Causal Attention:** Chỉ nhìn vào các từ đã xuất hiện **phía trước (bên trái)** để dự đoán từ tiếp theo (che tương lai). | **GPT-3/4**, **LLaMA 3**, Claude, Mistral, **NVIDIA Nemotron** | **Sinh ngôn ngữ (NLG):** Sinh văn bản mở, Chatbot hội thoại đa năng, trợ lý lập trình viết code, suy luận đa bước. |\n| **3. Encoder-Decoder (Seq2Seq)** | **Người dịch thuật mang hai chiếc mũ:** Buổi sáng đội mũ học giả đọc hiểu trọn vẹn văn bản tiếng Pháp (**Encode**), buổi chiều đội mũ nhà văn chấp bút viết bản dịch tiếng Anh (**Decode**). | **Sequence-to-Sequence + Cross-Attention:** Khối Encoder nén toàn bộ chuỗi đầu vào thành biểu diễn ngữ cảnh; khối Decoder sinh ra chuỗi đầu ra mới tương ứng. | **T5**, **Flan-T5**, **BART**, NLLB | **Biến đổi chuỗi sang chuỗi:** Dịch máy giữa các ngôn ngữ (**Machine Translation**), tóm tắt văn bản dài thành đoạn ngắn (**Summarization**). |\n\n### 4.2. Kiến trúc Chuyên gia Hỗn hợp: Mixture of Experts (MoE)\nCác mô hình lớn hiện đại (như **Mixtral 8x7B, DeepSeek-V3, GPT-4, DBRX**) sử dụng kiến trúc biến thể **Sparse Mixture of Experts (MoE)**:\n* Thay vì dùng 1 khối mạng Feed-Forward (FFN) khổng lồ duy nhất mà mọi token đều phải chạy qua 100% tham số (**Dense Model**), tầng MoE được chia thành nhiều mạng FFN con gọi là các **Chuyên gia (Experts)** (ví dụ 8 chuyên gia: chuyên gia Toán, chuyên gia Code, chuyên gia Văn học...) đứng sau một **Mạng Định tuyến (Router / Gating Network)**.\n* Khi một token đi tới, **Router** chỉ chọn kích hoạt **Top-K chuyên gia phù hợp nhất (ví dụ $K = 2$ trên 8 chuyên gia)** để xử lý token đó!\n* **Lợi ích vàng:** Mô hình có tổng dung lượng tri thức của một mô hình rất lớn (ví dụ Mixtral 8x7B có tổng cộng **47B tham số**), nhưng tốc độ suy luận và chi phí tính toán FLOPs trên mỗi token lại nhẹ và nhanh ngang ngửa một mô hình nhỏ (**chỉ kích hoạt ~13B Active Parameters**)! *(Lưu ý: Dù chỉ kích hoạt 13B tham số lúc tính toán, nhưng toàn bộ 47B tham số vẫn phải được nạp sẵn vào VRAM).*\n\n---\n\n## 5. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm cần lưu ý ở Module 4:**\n\u003e 1. **Lựa chọn kiến trúc theo tác vụ:**\n\u003e    * *Phân tích cảm xúc (Sentiment Analysis)*, *Trích xuất thực thể (NER)*, *Tạo Vector Embedding* $\\to$ Thường ưu tiên **Encoder-only (BERT)**.\n\u003e    * *Xây dựng Chatbot đối thoại, sinh văn bản mở, viết code* $\\to$ Thường ưu tiên **Decoder-only (GPT / LLaMA)**.\n\u003e    * *Dịch tài liệu đa ngôn ngữ (Translation)* hoặc *Tóm tắt văn bản (Summarization)* $\\to$ Thường ưu tiên **Encoder-Decoder (T5 / BART)** (hoặc Decoder-only hiện đại tùy yêu cầu hệ thống).\n\u003e 2. **Lưu ý về Temperature \u0026 Top-P:**\n\u003e    * Khi cần giảm tính ngẫu nhiên trong lúc lấy mẫu cho các tác vụ có cấu trúc (như sinh code Python/SQL, trích xuất JSON) $\\to$ Thường chỉnh **Temperature thấp ($T \\approx 0$)**, đồng thời kết hợp kiểm tra cú pháp/schema và kiểm thử đầu ra.\n\u003e    * Phương pháp lấy mẫu nào giới hạn động tập từ ứng viên dựa trên **tổng xác suất tích lũy (cumulative probability threshold)**? $\\to$ Chọn **Top-P (Nucleus Sampling)**.\n\u003e    * Phương pháp lấy mẫu nào cắt theo số lượng cố định **$K$ từ có xác suất cao nhất**? $\\to$ Chọn **Top-K Sampling**.\n\u003e 3. **Lưu ý Query, Key, Value ($Q, K, V$):** Trong cơ chế Self-Attention, điểm số chú ý (Attention Weight) giữa hai từ được tính bằng tích vô hướng chuẩn hóa giữa hai vector nào trước khi nhân với Value ($V$)? $\\to$ Giữa **Query ($Q$) và Key ($K$)** chia cho $\\sqrt{d_k}$.\n\n### Câu hỏi luyện tập minh họa (Mini Quiz):\n1. **Câu 1:** Một lập trình viên đang tích hợp LLM để chuyển đổi câu hỏi tiếng Việt của nhân viên thành câu lệnh truy vấn SQL. Để giảm độ đa dạng ngẫu nhiên khi lấy mẫu token (sampling diversity), tham số `Temperature` thường được cấu hình như thế nào, và cần lưu ý gì thêm khi đưa vào vận hành?\n   * *Đáp án:* Đặt **Temperature ở mức thấp (gần `0` hoặc bằng `0` cho greedy decoding)** để làm nhọn phân phối xác suất, ưu tiên các token có xác suất cao nhất. Tuy nhiên, vì `temperature=0` không tự động đảm bảo câu lệnh SQL luôn đúng sự thật, an toàn hay tái lập tuyệt đối trên mọi backend, lập trình viên cần kết hợp thêm bước kiểm tra schema, giới hạn quyền truy cập DB (read-only) và kiểm thử thực thi.\n2. **Câu 2:** Nếu loại bỏ hoàn toàn bước **Positional Encoding** khỏi kiến trúc Transformer (không có thông tin vị trí hay causal mask), cơ chế Self-Attention sẽ gặp phải hạn chế gì?\n   * *Đáp án:* Phép toán Self-Attention sẽ **mất khả năng phân biệt thứ tự vị trí của các từ trong câu** (tính chất bất biến hoán vị - coi câu văn như một tập hợp từ không thứ tự), dẫn đến không phân biệt được sự khác nhau về ngữ nghĩa khi đổi chỗ chủ ngữ và tân ngữ.\n3. **Câu 3:** Tại sao các bộ Tokenizer hiện đại của LLM (như BPE hoặc WordPiece) lại sử dụng phương pháp **Subword Tokenization** thay vì Whole-word Tokenization?\n   * *Đáp án:* Để giữ kích thước bộ từ điển (Vocabulary) hợp lý trong khi **giảm đáng kể vấn đề Out-of-Vocabulary (OOV)** đối với các từ hiếm, từ ghép phức tạp hoặc từ mới thông qua việc tách và ghép các mảnh từ con (và có thể kết hợp byte-level fallback để bao phủ rộng hơn tùy thiết kế tokenizer).\n4. **Câu 4:** Một công ty truyền thông muốn xây dựng một công cụ tự động phân loại hàng triệu bình luận của độc giả thành 3 nhãn: *Tích cực, Tiêu cực, Trung lập* (Sentiment Analysis), đồng thời trích xuất tên các nhân vật và địa danh được nhắc đến trong bài báo (NER). Biến thể kiến trúc Transformer nào là phù hợp và hiệu quả về mặt chi phí tính toán nhất?\n   * *Đáp án:* **Encoder-only (như BERT, RoBERTa)** vì cơ chế Bidirectional Self-Attention đọc hiểu ngữ cảnh hai chiều trái-phải cùng lúc, rất hiệu quả cho các bài toán hiểu và phân tích ngôn ngữ (NLU).\n5. **Câu 5:** Trong công thức Scaled Dot-Product Attention $\\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$, tại sao tích vô hướng $QK^T$ lại được chia cho $\\sqrt{d_k}$ trước khi đưa vào hàm Softmax?\n   * *Đáp án:* Để **giữ phương sai của tích vô hướng $QK^T$ không phình quá lớn khi số chiều $d_k$ cao**, tránh đẩy hàm Softmax vào vùng bão hòa có đạo hàm rất nhỏ gây ra hiện tượng **triệt tiêu đạo hàm (Vanishing Gradients)**.\n6. **Câu 6:** Một mô hình sử dụng kiến trúc **Mixture of Experts (MoE)** như Mixtral 8x7B có tổng cộng khoảng 47 tỷ tham số nhưng chi phí tính toán FLOPs trên mỗi token lại tương đương một mô hình ~13 tỷ tham số. Cơ chế nào giúp đạt được điều này?\n   * *Đáp án:* Nhờ một **Mạng định tuyến (Router / Gating Network)** chỉ chọn kích hoạt một số ít chuyên gia (**Top-K Experts**, ví dụ 2 trên 8 mạng FFN) cho mỗi token thay vì tính toán qua toàn bộ các mạng FFN của mô hình.\n"},{"id":"mod05","file":"Module_05_Model_Selection.md","badge":"MODULE 05","shortTitle":"Model Selection \u0026 Evaluation","domain":"Experimentation (22%)","weight":"Exp \u0026 Data","icon":"🎯","content":"# Module 5: Model Selection (Phương pháp Đánh giá và Lựa chọn Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn thi NCA-GENL ở Module 5 (Thuộc Domain \"Experimentation - 22%\" \u0026 \"Data Analysis - 14%\"):**\n\u003e Nắm vững **Quy trình 6 bước lựa chọn Foundation Model**; bảng so sánh **SLM vs. LLM** và **Open-Weights vs. Proprietary Models**; các chỉ số hiệu năng suy luận thực tế (**TTFT, ITL/TPOT, Throughput**); cấu trúc chuẩn của một **Model Card** \u0026 các bộ **Benchmark chuẩn (MMLU, HumanEval, GSM8K, TruthfulQA)**; làm chủ **Ma trận Nhầm lẫn (Confusion Matrix: TP, TN, FP, FN)**, khi nào ưu tiên **Precision vs. Recall vs. F1-Score vs. ROC-AUC**, các độ đo Hồi quy (**MAE, MSE, RMSE, $R^2$**); phân biệt chính xác các độ đo ngôn ngữ vàng (**BLEU** cho Dịch máy, **ROUGE** cho Tóm tắt, **BERTScore**, **Cosine Similarity** cho RAG, **RAG Triad**); và các phương pháp kiểm thử **k-Fold Cross-Validation**, **A/B Testing**, **Canary Deployment**.\n\n---\n\n## 1. Khung quy trình 6 bước lựa chọn Foundation Model\n\nKhi đứng trước hàng trăm nghìn mô hình trên Hugging Face hay các API thương mại (OpenAI, Anthropic, NVIDIA NIM), một kỹ sư AI chuyên nghiệp không chọn theo cảm tính mà tuân thủ **Quy trình 6 bước chuẩn**:\n\n```mermaid\nflowchart LR\n    S1[\"1. Define Need\u003cbr/\u003eXác định rõ bài toán,\u003cbr/\u003eSLA độ trễ \u0026 Ngân sách\"]\n    S2[\"2. Shortlist Models\u003cbr/\u003eLọc ra 2-4 ứng viên sáng giá\u003cbr/\u003e(Open-weights vs Proprietary)\"]\n    S3[\"3. Compare Specs\u003cbr/\u003eĐọc Model Card:\u003cbr/\u003eTham số, VRAM, License, Context\"]\n    S4[\"4. Evaluate Metrics\u003cbr/\u003eĐo lường bằng Metric chuẩn:\u003cbr/\u003eBLEU, ROUGE, F1, Cosine Sim\"]\n    S5[\"5. Run Tests\u003cbr/\u003eKiểm thử dữ liệu thực tế:\u003cbr/\u003eCross-Validation / A/B Test\"]\n    S6[\"6. Select Best\u003cbr/\u003eChọn mô hình tối ưu:\u003cbr/\u003eHiệu năng + Chi phí + Độ ổn định\"]\n\n    S1 --\u003e S2 --\u003e S3 --\u003e S4 --\u003e S5 --\u003e S6\n```\n\n### Chi tiết từng bước:\n1. **Define Need (Xác định nhu cầu nghiệp vụ \u0026 Ràng buộc kỹ thuật):**\n   * Làm rõ bài toán cốt lõi cần giải quyết (Sinh văn bản, tóm tắt tài liệu, viết code, trích xuất thực thể, sinh ảnh hay dịch thuật).\n   * Xác định rõ ràng buộc vận hành (**Non-functional requirements**): Yêu cầu độ trễ tối đa bao nhiêu mili-giây (**SLA Latency**), lượng truy cập đồng thời (Concurrency), yêu cầu bảo mật dữ liệu (có được gửi ra Cloud ngoài hay bắt buộc chạy On-premise), và ngân sách phần cứng/API.\n2. **Shortlist Model (Lập danh sách rút gọn):**\n   * Chọn ra từ **2 đến 4 mô hình ứng viên** sáng giá dựa trên bảng xếp hạng cộng đồng, tài liệu hỗ trợ và hình thức phân phối (**Open-Source / Open-Weights** tự host như *LLaMA-3, Mistral, NVIDIA Nemotron* hay **Proprietary / Closed-Source** gọi qua API như *GPT-4o, Claude 3.5*).\n3. **Compare Specs (So sánh thông số kỹ thuật qua Model Card):**\n   * Đọc kỹ **Model Card** để đối chiếu số lượng tham số, độ dài cửa sổ ngữ cảnh (**Context Window**), yêu cầu dung lượng bộ nhớ GPU (**VRAM**), ngôn ngữ hỗ trợ và đặc biệt là **Giấy phép bản quyền thương mại (License: Apache 2.0, MIT hay Non-commercial CC-BY-NC)**.\n4. **Evaluate Model (Đánh giá bằng độ đo kỹ thuật):**\n   * Chấm điểm tự động bằng các bộ chỉ số chuyên dụng tương ứng với từng bài toán (**BLEU** cho dịch thuật, **ROUGE** cho tóm tắt, **Cosine Similarity** cho tìm kiếm ngữ nghĩa, **F1-Score / ROC-AUC** cho phân loại, **Perplexity** cho mô hình ngôn ngữ).\n5. **Run Tests (Thực nghiệm kiểm thử trên dữ liệu thật):**\n   * Chạy thử nghiệm trên chính tập dữ liệu thực tế của doanh nghiệp (Golden Dataset) bằng **k-Fold Cross-Validation** (khi ít dữ liệu) hoặc **A/B Testing / Canary Rollout** (trên môi trường Production).\n6. **Select Best (Chọn mô hình tối ưu nhất - The Golden Trade-off):**\n   * Ra quyết định dựa trên phương trình cân bằng đa mục tiêu (chứ không chỉ chọn mô hình điểm cao nhất mà quá đắt/quá chậm):\n     $$\\text{Giá trị Tối ưu} = \\text{Chất lượng (Accuracy)} + \\text{Tốc độ (Latency/Throughput)} + \\text{Chi phí (TCO)} + \\text{Độ tin cậy \\\u0026 Bảo mật}$$\n\n---\n\n## 2. So sánh chuyên sâu: SLM vs. LLM, Open-Weights vs. Proprietary \u0026 Các Chỉ số Tốc độ Suy luận\n\n### 2.1. Small Language Model (SLM) vs. Large Language Model (LLM)\n\u003e [!TIP]\n\u003e **Góc nhìn Developer:** Không phải bài toán nào cũng vác \"đại bác\" LLM 70B/405B ra bắn! Nếu bạn chỉ cần phân loại ý định (Intent classification), trích xuất JSON đơn giản, kiểm duyệt nội dung hoặc chạy offline trên điện thoại/thiết bị IoT/xe tự hành, một chiếc **SLM** nhỏ gọn sẽ rẻ hơn hàng chục lần và phản hồi trong vài mili-giây.\n\n```mermaid\nflowchart TD\n    subgraph SLM_Box[\"Small Language Model (SLM: \u003c100M - ~8B params)\"]\n        direction LR\n        SLM_Icon[\"📱 Chạy trên Edge / Laptop / 1 GPU nhỏ\u003cbr/\u003e⚡ Độ trễ cực thấp (Low Latency: vài ms)\u003cbr/\u003e🚀 Thông lượng cực cao (High Throughput)\u003cbr/\u003e🎯 Chuyên biệt hóa cho 1 tác vụ hẹp (Task-specific)\u003cbr/\u003e🔒 Bảo mật dữ liệu cục bộ trên thiết bị (On-device Privacy)\"]\n    end\n\n    subgraph LLM_Box[\"Large Language Model (LLM: 10B - Hàng trăm tỷ params)\"]\n        direction LR\n        LLM_Icon[\"🖥️ Đòi hỏi cụm Multi-GPU cao cấp (A100/H100/B200)\u003cbr/\u003e🐢 Độ trễ cao hơn, tốn hàng trăm GB VRAM\u003cbr/\u003e🧠 Đa năng, suy luận logic đa bước phức tạp (Complex Reasoning)\u003cbr/\u003e💰 Chi phí hạ tầng \u0026 điện năng vận hành đắt đỏ\"]\n    end\n```\n\n| Tiêu chí | Small Language Model (SLM) | Large Language Model (LLM) |\n| :--- | :--- | :--- |\n| **Quy mô tham số (Parameters)** | Nhỏ: Dưới 100 triệu đến ~8 tỷ tham số (VD: *BERT ~110M, DistilBERT ~66M, Phi-3 Mini 3.8B, Mistral 7B, LLaMA-3 8B, Nemotron-Mini 4B*). | Khổng lồ: Từ 13 tỷ đến hàng trăm/nghìn tỷ tham số (VD: *LLaMA-3 70B/405B, Nemotron-4 340B, GPT-4, Claude 3.5*). |\n| **Độ trễ (Latency)** | **Rất thấp**, phản hồi tức thì (real-time, lý tưởng cho Voice Assistant, Game NPC, Autocomplete). | **Cao hơn đáng kể** do khối lượng phép nhân ma trận đồ sộ qua hàng chục tầng. |\n| **Thông lượng (Throughput)** | **Rất cao** (xử lý hàng nghìn tokens/giây trên cùng một phần cứng). | **Thấp hơn** (thường phải chia nhỏ mô hình qua nhiều GPU bằng Tensor Parallelism). |\n| **Yêu cầu phần cứng** | Chạy mượt trên CPU, NPU, thiết bị biên (**Edge, Mobile, IoT, Jetson**) hoặc 1 GPU phổ thông. | Đòi hỏi cụm máy chủ nhiều GPU Data Center (**A100, H100, B200**) với dung lượng VRAM cực lớn. |\n| **Tính đa năng (Versatility)** | Thường chuyên biệt hóa cho **một tác vụ hẹp cụ thể (Task-specific)** sau khi fine-tune hoặc chưng cất (Distillation). | Giải quyết **đa tác vụ (General-purpose)**, suy luận logic phức tạp, Zero-shot và Agentic workflows xuất sắc. |\n| **Chi phí vận hành (Cost)** | Rất rẻ cho từng tác vụ đơn lẻ (nhưng cần kiến trúc Model Router nếu quản lý nhiều SLM khác nhau). | Chi phí duy trì cụm server suy luận rất đắt đỏ, nhưng 1 mô hình trung tâm phục vụ được nhiều phòng ban. |\n\n### 2.2. Mô hình Nguồn mở / Trọng số mở (Open-Weights) vs. Mô hình Độc quyền (Proprietary API)\n| Tiêu chí | Open-Weights Models (LLaMA-3, Mistral, DeepSeek, Nemotron) | Proprietary / Closed API Models (GPT-4o, Claude 3.5, Gemini Pro) |\n| :--- | :--- | :--- |\n| **Quyền kiểm soát \u0026 Bảo mật dữ liệu** | **Kiểm soát cao:** Có thể tải trọng số về triển khai trong hạ tầng nội bộ (On-prem / VPC) kèm chính sách bảo mật mạng và kiểm soát truy cập của tổ chức. | Dữ liệu được gửi qua mạng tới dịch vụ của nhà cung cấp bên thứ ba (cần đánh giá hợp đồng bảo mật, chính sách lưu trữ dữ liệu và tuân thủ của hãng). |\n| **Khả năng tùy biến sâu** | Cho phép can thiệp toàn diện: **Full Fine-Tuning, LoRA/QLoRA, Pruning, Quantization (`FP8`/`INT4`)**, sửa kiến trúc. | Bị giới hạn ở Prompt Engineering, RAG hoặc chỉ Fine-tune hộp đen qua giao diện web của nhà cung cấp. |\n| **Chi phí theo quy mô** | Tốn chi phí dựng server GPU ban đầu, nhưng **rẻ hơn rất nhiều khi lưu lượng request lớn và ổn định 24/7**. | Không tốn phí hạ tầng ban đầu (trả tiền theo mỗi 1 triệu tokens Input/Output), nhưng **rất đắt đỏ khi quy mô người dùng tăng vọt**. |\n\n### 2.3. Ba Chỉ số Đo lường Hiệu năng Suy luận LLM trên Production (Inference Latency Metrics)\nKhi triển khai LLM (với TensorRT-LLM / Triton / NIM), đề thi thường hỏi về 3 chỉ số đo tốc độ:\n1. **TTFT (Time To First Token – Thời gian sinh ra token đầu tiên):**\n   * Khoảng thời gian từ lúc User bấm gửi Prompt cho đến khi chữ đầu tiên xuất hiện trên màn hình (Pha **Prefill** — xử lý song song toàn bộ Prompt đầu vào để tạo KV Cache).\n   * *Bản chất phần cứng:* Phụ thuộc vào **năng lực tính toán ma trận của GPU (Compute-bound)** và độ dài của Input Prompt.\n2. **ITL (Inter-Token Latency) / TPOT (Time Per Output Token – Thời gian giữa hai token liên tiếp):**\n   * Tốc độ nhả từng chữ tiếp theo sau khi chữ đầu tiên đã hiện ra (Pha **Decode** tự hồi quy). Để người dùng đọc mượt hơn tốc độ mắt người, TPOT cần đạt khoảng $10 - 30\\text{ ms/token}$.\n   * *Bản chất phần cứng:* Phụ thuộc vào **băng thông bộ nhớ VRAM (Memory-bandwidth bound)** vì mỗi lần sinh 1 token mới lại phải đọc toàn bộ trọng số mô hình và KV Cache từ HBM lên nhân tính toán!\n3. **Throughput (Thông lượng tổng thể – Tokens/second hoặc Requests/second):**\n   * Tổng số lượng token mà máy chủ phục vụ được cho **tất cả người dùng đồng thời** trong 1 giây (Tối ưu hóa bằng *In-flight Batching / Dynamic Batching*).\n\n---\n\n## 3. Khái niệm Model Card \u0026 Các Bộ Benchmark Đánh giá LLM Chuẩn Quốc tế\n\n### 3.1. Model Card (Hồ sơ Lý lịch Mô hình)\n* **Model Card là gì?** Là tài liệu tiêu chuẩn kỹ thuật (do Google đề xuất và trở thành chuẩn thực hành phổ biến trên **Hugging Face** cũng như **NVIDIA NGC Catalog**) đi kèm mỗi mô hình AI nhằm cung cấp thông tin minh bạch, toàn diện và có thể kiểm chứng về năng lực cũng như giới hạn của mô hình đó.\n* **6 mục cốt lõi thường có trong một Model Card tiêu chuẩn (Cần nhớ kỹ cho kỳ thi):**\n  1. **Model Overview (Tổng quan mô hình):** Tên mô hình, phiên bản, tổ chức phát triển, ngày phát hành, loại kiến trúc nền tảng (ví dụ: *Transformer Decoder-only*) và **Giấy phép bản quyền (License: Apache 2.0, MIT, Llama Community License hay Non-commercial)**.\n  2. **Intended Use \u0026 Out-of-Scope Use (Mục đích sử dụng \u0026 Trường hợp cấm):** Các bài toán được thiết kế để sử dụng (ví dụ: trợ lý tóm tắt văn bản tiếng Anh) và các trường hợp **nghiêm cấm/ngoài phạm vi (Out-of-scope / Misuse)** (ví dụ: không được dùng để kê đơn thuốc y khoa tự động hay tư vấn pháp lý sinh tử).\n  3. **Training Data (Dữ liệu huấn luyện):** Nguồn gốc dữ liệu huấn luyện, phương pháp lọc/làm sạch, kích thước kho ngữ liệu (bao nhiêu nghìn tỷ token), phân bố ngôn ngữ và **Mốc thời gian ngắt tri thức (Knowledge Cutoff)**.\n  4. **Model Architecture \u0026 Compute Requirements (Kiến trúc \u0026 Yêu cầu phần cứng):** Số lượng tham số, số tầng (layers), số đầu chú ý (attention heads), độ dài cửa sổ ngữ cảnh (**Context Window**), định dạng số học (`BF16`/`FP8`) và lượng VRAM tối thiểu để chạy.\n  5. **Evaluation \u0026 Performance Metrics (Kết quả đánh giá chuẩn):** Bảng điểm định lượng thực tế trên các bộ benchmark công khai (MMLU, HumanEval, GSM8K, BLEU, ROUGE, F1-score...).\n  6. **Limitations, Ethical Considerations \u0026 Bias (Hạn chế, Đạo đức \u0026 Thiên vị):** Các điểm yếu đã biết, tỷ lệ sinh ảo giác (hallucination), các rủi ro thiên vị văn hóa/giới tính/chủng tộc và khuyến nghị đặt rào chắn an toàn (Guardrails).\n\n### 3.2. Các Bộ Benchmark Tiêu chuẩn để So sánh các LLM (Hay xuất hiện trong Model Card)\n| Tên Bộ Benchmark | Đo lường năng lực gì của LLM? | Ví dụ nội dung bài thi của Benchmark |\n| :--- | :--- | :--- |\n| **1. MMLU (Massive Multitask Language Understanding)** | **Kiến thức tổng quát \u0026 Học thuật đa lĩnh vực:** Bộ 57 môn thi trắc nghiệm từ cấp 3 đến đại học/chuyên gia (Toán, Lý, Hóa, Y sinh, Luật, Lịch sử, Kinh tế). | Các câu hỏi trắc nghiệm 4 lựa chọn A/B/C/D trải rộng mọi ngành khoa học. |\n| **2. HumanEval \u0026 MBPP** | **Năng lực Lập trình \u0026 Sinh mã nguồn (Coding):** Khả năng viết hàm Python từ chuỗi mô tả Docstring và vượt qua các Unit Tests tự động (chỉ số `pass@1`). | Cho đề bài thuật toán và kiểm tra xem code AI sinh ra chạy có đúng 100% test cases không. |\n| **3. GSM8K \u0026 MATH** | **Suy luận Toán học đa bước (Mathematical Reasoning):** Giải các bài toán đố cấp 2 (GSM8K - 8.500 bài) và toán thi Olympic (MATH). | Bài toán đố đòi hỏi 4–8 bước lập luận cộng trừ nhân chia liên tiếp (Chain-of-Thought). |\n| **4. TruthfulQA \u0026 HaluEval** | **Độ trung thực \u0026 Chống ảo giác (Truthfulness \u0026 Hallucination):** Kiểm tra xem mô hình có bị lừa bởi những tin đồn/ngộ nhận phổ biến của con người hay không. | Hỏi các câu dễ gây ngộ nhận để xem mô hình nói sự thật khoa học hay bịa chuyện theo đám đông. |\n| **5. MT-Bench \u0026 Chatbot Arena (LMSYS)** | **Chất lượng Hội thoại đa lượt \u0026 Đánh giá ngang hàng:** Dùng **LLM-as-a-Judge (GPT-4 chấm điểm)** hoặc người thật bình chọn mù (Blind A/B testing tính điểm **Elo**). | So sánh trực tiếp 2 mô hình ẩn danh qua các cuộc hội thoại phức tạp nhiều lượt. |\n\n---\n\n## 4. Các Độ đo Đánh giá Chuyên sâu (Evaluation Metrics)\n\n### 4.1. Bộ Độ đo cho Bài toán Phân loại: Confusion Matrix, Precision, Recall, F1, PR-AUC \u0026 ROC-AUC\nKhi đánh giá mô hình phân loại (ví dụ: Phát hiện email Spam, Phát hiện giao dịch gian lận, Chẩn đoán bệnh, Kiểm duyệt nội dung độc hại), ta lập **Ma trận Nhầm lẫn (Confusion Matrix)** gồm 4 ô:\n\n```mermaid\nflowchart TD\n    subgraph CM[\"Ma trận Nhầm lẫn (Confusion Matrix)\"]\n        direction LR\n        subgraph Pred_Pos[\"Mô hình Dự đoán: DƯƠNG TÍNH (Positive / Có bệnh / Spam)\"]\n            TP[\"✅ TP (True Positive - Dương tính thật)\u003cbr/\u003eThực tế: Dương tính | Mô hình đoán: Dương tính\u003cbr/\u003e(Bắt trúng Spam / Bắt trúng kẻ gian!)\"]\n            FP[\"❌ FP (False Positive - Dương tính giả / Lỗi Loại I)\u003cbr/\u003eThực tế: Âm tính | Mô hình đoán nhầm: Dương tính\u003cbr/\u003e(Báo động giả: Xóa nhầm email hợp đồng của sếp vào thùng rác!)\"]\n        end\n        subgraph Pred_Neg[\"Mô hình Dự đoán: ÂM TÍNH (Negative / Bình thường)\"]\n            FN[\"🚨 FN (False Negative - Âm tính giả / Lỗi Loại II)\u003cbr/\u003eThực tế: Dương tính | Mô hình đoán nhầm: Âm tính\u003cbr/\u003e(Bỏ lọt tội phạm / Bỏ sót bệnh nhân ung thư!)\"]\n            TN[\"✅ TN (True Negative - Âm tính thật)\u003cbr/\u003eThực tế: Âm tính | Mô hình đoán: Âm tính\u003cbr/\u003e(Email thường cho vào hộp thư đến bình thường)\"]\n        end\n    end\n```\n\n| Độ đo (Metric) | Công thức Toán học | Ý nghĩa trực quan \u0026 Khi nào nên ưu tiên? |\n| :--- | :--- | :--- |\n| **1. Accuracy (Độ chính xác tổng thể)** | $$\\frac{TP + TN}{TP + TN + FP + FN}$$ | Tỷ lệ đoán đúng trên tổng số mẫu. \u003cbr/\u003e⚠️ **CẢNH BÁO:** Phù hợp khi các lớp dữ liệu cân bằng và chi phí lỗi tương đương. **Thường dễ đánh lừa trên dữ liệu mất cân bằng (Imbalanced Data)** (VD: 99% bình thường, 1% gian lận $\\to$ một mô hình đơn giản đoán tất cả là bình thường vẫn đạt Accuracy 99%!). |\n| **2. Precision (Độ chuẩn xác / Độ tin cậy dương tính)** | $$\\frac{TP}{TP + FP}$$ | *\"Trong tất cả những trường hợp mô hình dự đoán là Dương tính, có bao nhiêu % là Dương tính thật?\"* \u003cbr/\u003e👉 **Ưu tiên khi chi phí của False Positive (FP - Bắt nhầm / Báo động giả) cao:** Ví dụ **Lọc Email Spam**, **Khóa tài khoản người dùng tự động**, **Gợi ý video an toàn cho trẻ em** (tránh tự động xóa nhầm email hợp đồng quan trọng của khách hàng). |\n| **3. Recall (Độ bao phủ / Độ nhạy - Sensitivity / TPR)** | $$\\frac{TP}{TP + FN}$$ | *\"Trong tất cả các ca Dương tính thực tế, mô hình phát hiện được bao nhiêu %?\"* \u003cbr/\u003e👉 **Ưu tiên khi chi phí của False Negative (FN - Bỏ sót positive) gây hậu quả nghiêm trọng:** Ví dụ **Sàng lọc bệnh hiểm nghèo**, **Phát hiện giao dịch gian lận/rửa tiền**, **Phát hiện xâm nhập mạng** (thường ưu tiên tối đa hóa Recall trong giới hạn khối lượng cảnh báo giả FP có thể xử lý được). |\n| **4. F1-Score (Điểm cân bằng Precision–Recall)** | $$2 \\times \\frac{\\text{Precision} \\times \\text{Recall}}{\\text{Precision} + \\text{Recall}}$$ | Trung bình điều hòa (Harmonic Mean) giữa Precision và Recall (chỉ cao khi cả Precision và Recall đều cao). \u003cbr/\u003e👉 **Hữu ích khi cần cân bằng giữa Precision và Recall tại một ngưỡng phân loại (threshold)** trên dữ liệu mất cân bằng. Tuy nhiên, không phải mọi bài toán mất cân bằng đều chọn F1 một cách máy móc — cần chọn metric theo **chi phí nghiệp vụ của FP và FN** (hoặc dùng $F_\\beta$-score khi muốn đặt trọng số thiên về Recall hay Precision). |\n| **5. PR-AUC \u0026 ROC-AUC (Đánh giá qua nhiều ngưỡng cắt)** | • **ROC-AUC:** Diện tích dưới đường cong **TPR (Recall)** theo **FPR ($\\frac{FP}{FP+TN}$)**\u003cbr/\u003e• **PR-AUC:** Diện tích dưới đường cong **Precision – Recall** | • **PR-AUC (Precision-Recall AUC):** Đặc biệt hữu ích khi đánh giá lớp **positive rất hiếm** qua nhiều ngưỡng xác suất (thresholds).\u003cbr/\u003e• **ROC-AUC:** Đo khả năng xếp hạng phân tách hai lớp (ngẫu nhiên = $0.5$, lý tưởng = $1.0$), nhưng khi số lượng Negative ($TN$) quá áp đảo so với Positive, FPR = $\\frac{FP}{FP+TN}$ có thể giữ ở mức rất nhỏ khiến ROC-AUC trông quá lạc quan. |\n\n---\n\n### 4.2. Bộ Độ đo cho Bài toán Hồi quy (Regression Metrics: Dự đoán số liên tục)\nKhi mô hình dự đoán giá nhà, nhiệt độ, doanh số, đề thi có thể hỏi về 4 chỉ số sau:\n1. **MAE (Mean Absolute Error):** Trung bình trị tuyệt đối sai số $\\frac{1}{n}\\sum |y_i - \\hat{y}_i|$. Dễ hiểu, cùng đơn vị với biến mục tiêu, **ít bị ảnh hưởng bởi các điểm dị biệt (Outliers)**.\n2. **MSE (Mean Squared Error) \u0026 RMSE (Root MSE):** Trung bình bình phương sai số $\\frac{1}{n}\\sum (y_i - \\hat{y}_i)^2$ (và căn bậc hai của nó). Vì bình phương sai số nên **phạt cực nặng các lỗi dự đoán sai lệch lớn (Outliers)**.\n3. **$R^2$ (R-Squared / Coefficient of Determination):** Cho biết mô hình giải thích được bao nhiêu % sự biến thiên của dữ liệu (gần $1.0$ là mô hình khớp hoàn hảo).\n\n---\n\n### 4.3. Các Độ đo cho Bài toán Ngôn ngữ \u0026 GenAI: BLEU, ROUGE, BERTScore, Cosine Similarity \u0026 RAG Triad\n\n```mermaid\nflowchart TD\n    Metrics[\"Các Độ đo Đánh giá Ngôn ngữ \u0026 GenAI Cốt lõi\"]\n    \n    subgraph M1[\"1. BLEU (Bilingual Evaluation Understudy)\"]\n        B1[\"🎯 Bài toán: DỊCH MÁY (Machine Translation)\"]\n        B2[\"🔍 Bản chất: Thiên về Độ chuẩn xác (PRECISION-oriented)\u003cbr/\u003eĐếm tỷ lệ cụm từ (1-gram đến 4-gram) trong bản dịch AI\u003cbr/\u003exuất hiện trùng khớp trong bản dịch mẫu của người (kèm Brevity Penalty)\"]\n        B3[\"📏 Thang điểm: 0.0 đến 1.0 (hoặc 0 - 100; Càng cao càng tốt)\"]\n        B1 --\u003e B2 --\u003e B3\n    end\n\n    subgraph M2[\"2. ROUGE (Recall-Oriented Understudy for Gisting Evaluation)\"]\n        R1[\"🎯 Bài toán: TÓM TẮT VĂN BẢN (Text Summarization)\"]\n        R2[\"🔍 Bản chất: Thiên về Độ bao phủ (RECALL-oriented)\u003cbr/\u003eKiểm tra bản tóm tắt của AI có nhặt đủ các từ/ý chính\u003cbr/\u003exuất hiện trong bản tóm tắt chuẩn của người hay không\"]\n        R3[\"📏 Biến thể: ROUGE-1 (từ đơn), ROUGE-2 (cặp từ), ROUGE-L (chuỗi con chung dài nhất LCS)\"]\n        R1 --\u003e R2 --\u003e R3\n    end\n\n    subgraph M3[\"3. Sentence-Level Cosine Similarity (Tương đồng Vector Cấp Câu/Đoạn)\"]\n        C1[\"🎯 Bài toán: Tìm kiếm Vector (Semantic Retrieval) \u0026 So sánh độ gần cấp câu/đoạn\"]\n        C2[\"🔍 Bản chất: Nén toàn bộ câu/đoạn thành 1 vector đại diện duy nhất\u003cbr/\u003erồi tính cô-sin góc giữa 2 vector câu (Lưu ý: KHÔNG trực tiếp đảm bảo câu trả lời RAG đúng sự thật!)\"]\n        C3[\"📏 Thang điểm: -1.0 đến 1.0 (1.0 = Hai vector cùng hướng)\"]\n        C1 --\u003e C2 --\u003e C3\n    end\n\n    subgraph M4[\"4. BERTScore (So khớp Contextual Embeddings Cấp Token)\"]\n        BS1[\"🎯 Bài toán: Đánh giá chất lượng văn bản sinh ra (Generation Evaluation) nhạy ngữ nghĩa\"]\n        BS2[\"🔍 Bản chất: Giữ nguyên vector ngữ cảnh của TỪNG TOKEN trong câu mẫu \u0026 câu AI,\u003cbr/\u003eso khớp cực đại từng cặp token (greedy matching) để tính Precision, Recall và F1\"]\n        BS3[\"📏 Đầu ra: P_BERT, R_BERT, F_BERT (có thể kèm trọng số IDF)\"]\n        BS1 --\u003e BS2 --\u003e BS3\n    end\n\n    Metrics --\u003e M1 \u0026 M2 \u0026 M3 \u0026 M4\n```\n\n1. **BLEU (Bilingual Evaluation Understudy) $\\to$ DỊCH MÁY (Machine Translation):**\n   * *Gợi ý nhớ:* **B**ilingual (Song ngữ) = **Dịch thuật**!\n   * *Bản chất:* **Precision-oriented** (kèm hệ số phạt *Brevity Penalty* nếu máy dịch câu quá ngắn). Đếm xem câu máy dịch có bao nhiêu n-gram xuất hiện trùng khớp trong bản dịch tham chiếu.\n2. **ROUGE (Recall-Oriented Understudy for Gisting Evaluation) $\\to$ TÓM TẮT (Summarization):**\n   * *Gợi ý nhớ:* **R**ecall-Oriented ... for **Gisting** (Gist = Ý chính / Tóm tắt)!\n   * *Bản chất:* **Recall-oriented**. Kiểm tra bài tóm tắt của AI có bao phủ được các từ/cụm từ trong bản tóm tắt tham chiếu hay không:\n     * **ROUGE-1:** Độ trùng khớp từng từ đơn (Unigrams).\n     * **ROUGE-2:** Độ trùng khớp từng cặp 2 từ liên tiếp (Bigrams).\n     * **ROUGE-L:** Dựa trên **Chuỗi con chung dài nhất (Longest Common Subsequence - LCS)** để đánh giá cấu trúc mạch câu mà không đòi hỏi các từ phải đứng sát cạnh nhau.\n3. **Hạn chế của BLEU \u0026 ROUGE và Sự khác biệt giữa `Sentence Embedding Cosine Similarity` vs. `BERTScore`:**\n   * Vì BLEU và ROUGE chỉ **đếm sự trùng khớp mặt chữ (Exact lexical / n-gram overlap)**, nên nếu đáp án mẫu là *\"Chiếc xe hơi chạy rất nhanh\"* mà AI viết là *\"Chiếc ô tô di chuyển với tốc độ cao\"*, điểm BLEU/ROUGE sẽ rất thấp dù hai câu tương đương về nghĩa. Để đánh giá tương đồng ngữ nghĩa bằng biểu diễn vector, cần **phân biệt rõ hai phương pháp khác nhau** sau đây:\n   * **Phương pháp A – `Sentence-level Embedding Cosine Similarity` (So sánh Vector cấp câu/đoạn văn):**\n     * Sử dụng mô hình Sentence/Document Embedding (như Bi-Encoder, Sentence-BERT, `NV-Embed`) để gộp (pooling) toàn bộ câu hoặc đoạn văn thành **một vector đại diện duy nhất** ($\\mathbf{u}$ và $\\mathbf{v}$), sau đó tính cô-sin góc giữa hai vector cấp câu đó:\n       $$\\text{Cosine Similarity}(\\mathbf{u}, \\mathbf{v}) = \\cos(\\theta) = \\frac{\\mathbf{u} \\cdot \\mathbf{v}}{\\|\\mathbf{u}\\| \\|\\mathbf{v}\\|}$$\n     * *Ứng dụng chính:* Tìm kiếm tài liệu tương đồng tốc độ cao trong cơ sở dữ liệu Vector (Semantic Search / Dense Retrieval trong RAG), phân cụm văn bản hoặc lọc câu hỏi tương tự.\n   * **Phương pháp B – `BERTScore` (So khớp Contextual Embeddings ở cấp độ Token — Zhang et al., ICLR 2020):**\n     * Khác với việc nén cả câu thành một vector đơn lẻ, **BERTScore** đưa câu tham chiếu $x = \\langle x_1, \\dots, x_k \\rangle$ và câu ứng viên của AI $\\hat{x} = \\langle \\hat{x}_1, \\dots, \\hat{x}_m \\rangle$ qua mô hình ngôn ngữ (như BERT/RoBERTa/DeBERTa) để lấy chuỗi **contextual token embeddings** cho **từng token** $\\langle \\mathbf{x}_1, \\dots, \\mathbf{x}_k \\rangle$ và $\\langle \\hat{\\mathbf{x}}_1, \\dots, \\hat{\\mathbf{x}}_m \\rangle$ (đã chuẩn hóa độ dài $L_2$).\n     * Tiếp theo, BERTScore tính độ tương đồng cosine giữa mọi cặp token $\\mathbf{x}_i^\\top \\hat{\\mathbf{x}}_j$, thực hiện **so khớp cực đại (greedy matching)** từ từng token trong câu này sang token gần nghĩa nhất ở câu kia để tính **Precision ($P_{\\text{BERT}}$), Recall ($R_{\\text{BERT}}$) và F1 ($F_{\\text{BERT}}$)** (có thể nhân thêm trọng số độ hiếm của từ theo IDF):\n       $$R_{\\text{BERT}} = \\frac{1}{|x|} \\sum_{\\mathbf{x}_i \\in x} \\max_{\\hat{\\mathbf{x}}_j \\in \\hat{x}} \\mathbf{x}_i^\\top \\hat{\\mathbf{x}}_j, \\qquad P_{\\text{BERT}} = \\frac{1}{|\\hat{x}|} \\sum_{\\hat{\\mathbf{x}}_j \\in \\hat{x}} \\max_{\\mathbf{x}_i \\in x} \\mathbf{x}_i^\\top \\hat{\\mathbf{x}}_j, \\qquad F_{\\text{BERT}} = 2 \\frac{P_{\\text{BERT}} \\cdot R_{\\text{BERT}}}{P_{\\text{BERT}} + R_{\\text{BERT}}}$$\n     * *Điểm khác biệt cốt lõi cần nhớ:* **Sentence embedding cosine similarity** so sánh **hai vector đại diện cho toàn bộ câu/đoạn**, trong khi **BERTScore** so khớp các **contextual embeddings ở cấp token** rồi tổng hợp thành **Precision, Recall và F1**.\n4. **Đánh giá toàn diện hệ thống RAG (Retrieval + Grounding + Answer + System Metrics):**\n   \u003e [!IMPORTANT]\n   \u003e **Lưu ý quan trọng:** `Cosine Similarity` chỉ đo độ tương đồng giữa các vector embedding (thường dùng trong bước tìm kiếm vector của RAG); nó **không trực tiếp đánh giá độ chính xác hay tính trung thực của câu trả lời cuối cùng**.\n   \n   Với một hệ thống RAG hoàn chỉnh, cần **phân tách evaluation** thành 4 nhóm rõ ràng:\n   * **Retrieval Metrics (Chất lượng truy xuất tài liệu):** **`Recall@k`** (tỷ lệ tài liệu đúng nằm trong top-$k$ kết quả lấy ra), **`Precision@k`**, **`MRR` (Mean Reciprocal Rank)** và **`nDCG` (Normalized Discounted Cumulative Gain - có xét thứ tự xếp hạng)**.\n   * **Grounding / Faithfulness (Tính trung thực với ngữ cảnh - Chống Hallucination):** Câu trả lời của LLM có được hỗ trợ trực tiếp bởi các đoạn văn (context chunks) vừa truy xuất được không, hay mô hình tự suy diễn/bịa thêm thông tin ngoài ngữ cảnh?\n   * **Answer Quality (Correctness \u0026 Relevance):** Câu trả lời cuối cùng có giải quyết đúng trọng tâm câu hỏi của người dùng (**Answer Relevance**) và khớp với đáp án chuẩn (**Answer Correctness** khi có ground truth) hay không?\n   * **System \u0026 Operational Metrics:** Độ trễ (**Latency: TTFT, TPOT, End-to-end latency**), thông lượng (**Throughput**) và chi phí (**Cost per query**).\n\n---\n\n## 5. Phương pháp Kiểm thử Thực tế: Cross-Validation, A/B Testing \u0026 Canary Deployment\n\n### 5.1. Chia tập dữ liệu (Train / Validation / Test Split) \u0026 k-Fold Cross-Validation\n* **Ba tập dữ liệu tách biệt trong huấn luyện:**\n  1. **Training Set (~70–80%):** Dùng để mô hình học và cập nhật trọng số (Backpropagation).\n  2. **Validation Set / Dev Set (~10–15%):** Dùng để chấm điểm sau mỗi Epoch nhằm **tinh chỉnh siêu tham số (Hyperparameter Tuning)**, chọn kiến trúc và kích hoạt **Early Stopping** (dừng sớm chống Overfitting).\n  3. **Test Set / Holdout Set (~10–15%):** Giữ độc lập, **chỉ sử dụng ở bước đánh giá cuối cùng** để báo cáo hiệu năng khách quan. *(Nếu để dữ liệu Test lọt vào tập Train, chuẩn hóa/fit bộ tiền xử lý trên toàn bộ dữ liệu trước khi chia, hoặc dùng tập Test để chỉnh tham số sẽ gây lỗi **Data Leakage / Rò rỉ dữ liệu**!).*\n* **k-Fold Cross-Validation (Kiểm định chéo k-Fold):**\n  * *Khi nào sử dụng?* Khi doanh nghiệp có **tập dữ liệu giới hạn / nhỏ (Limited dataset)** và muốn đánh giá khả năng tổng quát hóa của mô hình một cách đáng tin cậy hơn so với chỉ một lần chia Train/Validation ngẫu nhiên. *(Nếu dữ liệu mất cân bằng nhãn, nên dùng **Stratified k-Fold** để giữ tỷ lệ các nhãn nhất quán ở mọi Fold).*\n\n```mermaid\nflowchart TD\n    subgraph CV[\"Minh họa 5-Fold Cross-Validation (Mỗi Fold lần lượt đóng vai trò làm Validation đúng 1 lần)\"]\n        L1[\"Lần lặp 1: [Validation: Fold 1] | [Train: Fold 2 + Fold 3 + Fold 4 + Fold 5] -\u003e Điểm E1\"]\n        L2[\"Lần lặp 2: [Validation: Fold 2] | [Train: Fold 1 + Fold 3 + Fold 4 + Fold 5] -\u003e Điểm E2\"]\n        L3[\"Lần lặp 3: [Validation: Fold 3] | [Train: Fold 1 + Fold 2 + Fold 4 + Fold 5] -\u003e Điểm E3\"]\n        L4[\"Lần lặp 4: [Validation: Fold 4] | [Train: Fold 1 + Fold 2 + Fold 3 + Fold 5] -\u003e Điểm E4\"]\n        L5[\"Lần lặp 5: [Validation: Fold 5] | [Train: Fold 1 + Fold 2 + Fold 3 + Fold 4] -\u003e Điểm E5\"]\n        Avg[\"👉 Kết quả đánh giá cuối cùng = Trung bình cộng (E1 + E2 + E3 + E4 + E5) / 5 (± Độ lệch chuẩn)\"]\n        \n        L1 --\u003e L2 --\u003e L3 --\u003e L4 --\u003e L5 --\u003e Avg\n    end\n```\n\n### 5.2. Kiểm thử trên môi trường Production: A/B Testing, Canary Rollout \u0026 Shadow Deployment\n1. **A/B Testing:**\n   * Giải quyết bài toán đánh đổi **Explore (Khám phá mô hình mới)** vs. **Exploit (Khai thác mô hình hiện tại)**: Chia ngẫu nhiên lưu lượng người dùng thật (ví dụ 50% vào **Model A - Control** và 50% vào **Model B - Treatment**) chạy song song trong cùng điều kiện thời gian thực để đo lường chỉ số mục tiêu (CTR, tỷ lệ chuyển đổi, mức độ hài lòng) và kiểm định ý nghĩa thống kê.\n2. **Canary Deployment (Triển khai Chim hoàng yến):**\n   * Ban đầu chỉ điều hướng một lượng nhỏ người dùng thật (ví dụ **1% – 5% traffic**) sang mô hình mới để theo dõi lỗi hệ thống, độ trễ và phản hồi; nếu ổn định mới tăng dần lên 25% $\\to$ 50% $\\to$ 100%.\n3. **Shadow Deployment (Triển khai Bóng râm / Dark Launch):**\n   * Mọi request của người dùng vẫn do mô hình hiện tại trả lời, nhưng hệ thống âm thầm nhân bản (mirror) request đó gửi song song cho mô hình mới chạy ngầm để ghi log so sánh kết quả mà **không ảnh hưởng trực tiếp tới kết quả trả về cho người dùng cuối**.\n\n---\n\n## 6. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm cần lưu ý ở Module 5:**\n\u003e 1. **Ghép cặp Metric Ngôn ngữ \u0026 RAG:**\n\u003e    * Dịch thuật (Machine Translation) $\\leftrightarrow$ **BLEU** (Precision-oriented trên n-gram).\n\u003e    * Tóm tắt (Text Summarization) $\\leftrightarrow$ **ROUGE** (Recall-oriented trên n-gram/LCS).\n\u003e    * Độ tương đồng giữa hai vector đại diện cả câu/đoạn (Sentence/Chunk Vector Similarity) $\\leftrightarrow$ **Cosine Similarity**.\n\u003e    * Đánh giá tương đồng ngữ nghĩa văn bản sinh ra bằng so khớp contextual embeddings ở **cấp độ token** (tính Precision, Recall, F1) $\\leftrightarrow$ **BERTScore**.\n\u003e    * Đánh giá hệ thống **RAG đầu-cuối (End-to-end RAG)**: Phải kết hợp **Retrieval metrics** (`Recall@k`, `MRR`, `nDCG`), **Faithfulness/Grounding** và **Answer Correctness/Relevance** (không chỉ nhìn vào Cosine Similarity).\n\u003e 2. **Lưu ý Imbalanced Data (Dữ liệu mất cân bằng):** Khi tập dữ liệu có 98% nhãn A và chỉ 2% nhãn B, độ đo **Accuracy** dễ gây hiểu lầm. Hãy chọn metric theo **chi phí của False Positives (FP) và False Negatives (FN)**:\n\u003e    * Khi bỏ sót ca dương tính (**False Negative**) gây hậu quả nghiêm trọng (sàng lọc bệnh, phát hiện gian lận/xâm nhập) $\\to$ Ưu tiên **Recall** (trong ngưỡng FP chấp nhận được).\n\u003e    * Khi báo động giả (**False Positive**) gây tốn kém lớn (lọc Spam xóa nhầm email quan trọng, khóa nhầm tài khoản) $\\to$ Ưu tiên **Precision**.\n\u003e    * Khi cần cân bằng giữa Precision và Recall $\\to$ Dùng **F1-Score** (hoặc **PR-AUC** khi đánh giá lớp dương tính hiếm qua nhiều ngưỡng).\n\u003e 3. **Lưu ý SLM vs. LLM:** Chạy trên thiết bị biên (Edge/Mobile/IoT), yêu cầu độ trễ thấp (Low latency), thông lượng cao cho một tác vụ chuyên biệt $\\to$ Thường ưu tiên **SLM (Small Language Model)**.\n\n### Câu hỏi luyện tập minh họa (Mini Quiz):\n1. **Câu 1:** Một ngân hàng huấn luyện mô hình phát hiện rửa tiền trên tập dữ liệu gồm 99.9% giao dịch hợp pháp và 0.1% giao dịch rửa tiền. Mô hình đạt Accuracy 99.9% nhưng không bắt được bất kỳ giao dịch rửa tiền nào trên thực tế. Những độ đo nào phù hợp hơn Accuracy để đánh giá mô hình này?\n   * *Đáp án:* **Recall** (để đo tỷ lệ phát hiện trúng các giao dịch rửa tiền thực tế, giảm False Negatives), kết hợp với **Precision / F1-Score** hoặc **PR-AUC** để kiểm soát tỷ lệ cảnh báo giả ở mức đội vận hành có thể xử lý được.\n2. **Câu 2:** Một kỹ sư AI đang xây dựng hệ thống tự động tóm tắt các biên bản cuộc họp dài 10 trang thành 5 gạch đầu dòng ngắn gọn. Độ đo (Metric) truyền thống nào phù hợp để đánh giá mức độ bao phủ các từ/cụm từ quan trọng so với bản tóm tắt tham chiếu?\n   * *Đáp án:* **ROUGE (Recall-Oriented Understudy for Gisting Evaluation)**.\n3. **Câu 3:** Một hãng sản xuất ô tô muốn tích hợp mô hình ngôn ngữ vào chip xử lý trên xe hơi để nhận diện giọng nói điều khiển điều hòa và bản đồ ngay cả khi xe đi vào vùng mất sóng Internet, với yêu cầu phản hồi dưới 50 mili-giây. Họ nên lựa chọn **SLM** hay **LLM**?\n   * *Đáp án:* **SLM (Small Language Model)** vì có kích thước nhỏ gọn, chạy trực tiếp được trên phần cứng biên (Edge hardware) không cần kết nối Cloud và đáp ứng yêu cầu độ trễ thấp (Low latency).\n4. **Câu 4:** Khi đọc hồ sơ của một mô hình mã nguồn mở trên Hugging Face hoặc NVIDIA NGC để kiểm tra xem mô hình đó có cho phép sử dụng cho mục đích thương mại hay không, được huấn luyện trên dữ liệu gì và có những rủi ro thiên vị nào đã biết, kỹ sư cần tra cứu tài liệu nào?\n   * *Đáp án:* **Model Card**.\n5. **Câu 5:** Một công ty y tế chỉ thu thập được một tập dữ liệu nhỏ gồm 1.000 bệnh án đã gắn nhãn (với tỷ lệ bệnh hiếm là 8%). Để đánh giá khả năng tổng quát hóa của mô hình phân loại một cách tin cậy mà không phụ thuộc vào một lần chia Train/Validation duy nhất, kỹ thuật kiểm thử nào nên được áp dụng?\n   * *Đáp án:* **Stratified k-Fold Cross-Validation** (giúp tận dụng toàn bộ các fold để kiểm định và giữ nguyên tỷ lệ 8% lớp bệnh hiếm trong mỗi fold).\n6. **Câu 6:** Trong hệ thống lọc email rác (Spam Filter), người dùng phàn nàn rằng nhiều email công việc quan trọng của đối tác bị hệ thống tự động đưa vào thư mục Spam (lỗi **False Positive** cao). Kỹ sư cần điều chỉnh ngưỡng phân loại của mô hình để ưu tiên cải thiện chỉ số nào?\n   * *Đáp án:* Ưu tiên cải thiện **Precision (Độ chuẩn xác)** — nhằm giảm thiểu số lượng False Positives ($FP$).\n"},{"id":"mod06","file":"Module_06_Model_Customization.md","badge":"MODULE 06","shortTitle":"Model Customization (Prompt, RAG, PEFT)","domain":"SW Dev \u0026 Exp (46%)","weight":"SW \u0026 Exp","icon":"🛠️","content":"# Module 6: Model Customization (Phương pháp Tùy biến Mô hình)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn tập NCA-GENL ở Module 6 (Thuộc Domain \"Software Development - 24%\" \u0026 \"Experimentation - 22%\"):**\n\u003e Hiểu rõ **3 lý do doanh nghiệp cần tùy biến Foundation Model**; nắm vững thứ tự **4 cấp độ tùy biến tăng dần về chi phí và độ phức tạp** (`Prompt Engineering` $\\to$ `RAG` $\\to$ `Transfer Learning / Fine-Tuning` $\\to$ `Training from Scratch`) cùng **Ma trận Quyết định chọn giải pháp**; phân biệt các kỹ thuật **Prompting (Zero-shot, One-shot, Few-shot, CoT, Self-Consistency, ReAct, System Prompt)**; nắm chắc luồng hoạt động, **đánh giá và gỡ lỗi (troubleshooting) hệ thống RAG** (Chunking + Overlap, Bi-Encoder Embedding, Vector DB HNSW/IVF, Hybrid Search BM25 + Vector, Cross-Encoder Reranking, `Recall@k`/`MRR`/`nDCG`, Faithfulness, ACLs); hiểu cơ chế toán học của **PEFT (LoRA, QLoRA, Adapter, Prompt/Prefix Tuning)**, hiện tượng **Catastrophic Forgetting**, **Knowledge Distillation**, và các mẫu **tích hợp LLM bằng Python cho Software Developer**.\n\n---\n\n## 1. Tại sao doanh nghiệp cần tùy biến mô hình?\n\nCác mô hình nền tảng (Foundation Models như GPT-4 hay LLaMA-3 gốc) sở hữu kiến thức tổng quát cho đến thời điểm cắt dữ liệu (**Knowledge Cutoff**). Doanh nghiệp thường cần tùy biến (Customize) mô hình vì **3 lý do chính**:\n1. **Thích ứng với ngôn ngữ và thuật ngữ chuyên ngành (Domain-specific Jargon \u0026 Vocabulary):** Ví dụ trong Y khoa (tên biệt dược, mã bệnh ICD-10, bệnh án lâm sàng), Luật pháp, Viễn thông hay Tài chính ngân hàng.\n2. **Nâng cao hiệu năng cho tác vụ và định dạng đặc thù (Task-specific Performance \u0026 Formatting):** Đảm bảo mô hình trả về đúng cấu trúc JSON Schema nghiêm ngặt của hệ thống, sinh câu truy vấn SQL chính xác theo schema cơ sở dữ liệu công ty, hoặc tuân thủ đúng văn phong chăm sóc khách hàng của thương hiệu.\n3. **Cải thiện mức độ nhận thức ngữ cảnh nội bộ \u0026 Dữ liệu thời gian thực (Internal Context \u0026 Fresh Data Awareness):** Tích hợp các chính sách nhân sự, bảng giá tồn kho thay đổi từng phút, tài liệu bảo hành sản phẩm mới ra mắt, hoặc tài liệu mật nội bộ mà mô hình công khai chưa từng được học.\n\n---\n\n## 2. Bốn Cấp độ Tùy biến Mô hình (Spectrum of Model Customization) \u0026 Ma trận Quyết định\n\nTrong kỳ thi NCA-GENL, bạn cần nhớ nguyên tắc vàng của kiến trúc sư AI: **Luôn ưu tiên đi từ giải pháp đơn giản, nhanh và rẻ tiền nhất (bên trái) sang giải pháp phức tạp, đắt đỏ nhất (bên phải)!**\n\n```mermaid\nflowchart LR\n    L1[\"Cấp độ 1:\u003cbr/\u003ePROMPT ENGINEERING\u003cbr/\u003e💰 Chi phí: Rất thấp (~0$)\u003cbr/\u003e⏱️ Thời gian: Vài phút/giờ\u003cbr/\u003e🔧 Thay đổi Weights: KHÔNG\u003cbr/\u003e🎯 Tối ưu câu lệnh đầu vào\"]\n    \n    L2[\"Cấp độ 2:\u003cbr/\u003eRAG (Retrieval-Augmented)\u003cbr/\u003e💰 Chi phí: Trung bình thấp\u003cbr/\u003e⏱️ Thời gian: Vài ngày\u003cbr/\u003e🔧 Thay đổi Weights: KHÔNG\u003cbr/\u003e🎯 Kết nối dữ liệu nội bộ động\"]\n    \n    L3[\"Cấp độ 3:\u003cbr/\u003eTRANSFER LEARNING / FINE-TUNING\u003cbr/\u003e💰 Chi phí: Cao\u003cbr/\u003e⏱️ Thời gian: Vài ngày - tuần\u003cbr/\u003e🔧 Thay đổi Weights: CÓ\u003cbr/\u003e🎯 Học văn phong, kỹ năng \u0026 định dạng\"]\n    \n    L4[\"Cấp độ 4:\u003cbr/\u003eTRAINING FROM SCRATCH\u003cbr/\u003e💰 Chi phí: Cực kỳ đắt đỏ (Triệu $)\u003cbr/\u003e⏱️ Thời gian: Hàng tháng trời\u003cbr/\u003e🔧 Thay đổi Weights: Huấn luyện mới 100%\u003cbr/\u003e🎯 Ngôn ngữ/Miền dữ liệu mới hoàn toàn\"]\n\n    L1 ==\u003e|\"Tăng dần Chi phí GPU, Thời gian, Lượng dữ liệu \u0026 Độ phức tạp\"| L2 ==\u003e L3 ==\u003e L4\n```\n\n### Bảng Ma trận Quyết định: Khi nào dùng Prompting vs. RAG vs. Fine-Tuning? (CỰC KỲ QUAN TRỌNG!)\nĐề thi rất hay đưa ra một kịch bản doanh nghiệp và hỏi bạn nên chọn phương pháp nào. Hãy đối chiếu bảng sau:\n\n| Tiêu chí so sánh | 1. Prompt Engineering | 2. RAG (Retrieval-Augmented Generation) | 3. Fine-Tuning (PEFT / LoRA / SFT) | 4. Training from Scratch |\n| :--- | :--- | :--- | :--- | :--- |\n| **Có cập nhật Trọng số (Weights) của LLM không?** | **KHÔNG** | **KHÔNG** | **CÓ** (Cập nhật Adapter LoRA hoặc toàn bộ Weights) | **CÓ** (Khởi tạo và học mới 100% từ con số 0) |\n| **Giải quyết bài toán gì tốt nhất?** | Định hướng nhanh hành vi, định dạng đầu ra hoặc suy luận logic ngay trong cửa sổ ngữ cảnh. | Bổ sung **tri thức sự kiện mới (External Facts), dữ liệu nội bộ thay đổi liên tục**, giảm ảo giác và cần **trích dẫn nguồn (Citations)**. | Dạy mô hình **hành vi mới, văn phong/giọng điệu đặc thù, cấu trúc đầu ra phức tạp cố định**, hoặc ngôn ngữ chuyên ngành sâu. | Xây dựng mô hình nền tảng cho một ngôn ngữ hoàn toàn mới hoặc dữ liệu khoa học đặc biệt (DNA/Protein/Khí hậu) chưa có Base Model. |\n| **Tần suất dữ liệu thay đổi** | Tức thì theo từng câu lệnh. | **Thay đổi liên tục theo từng giây/phút** (chỉ cần cập nhật Vector DB, không cần train lại model!). | Dữ liệu tĩnh, ít thay đổi (mỗi lần muốn nạp quy luật mới phải chạy lại job Fine-tune). | Dữ liệu nền tảng tĩnh (cố định tại thời điểm Knowledge Cutoff). |\n| **Nguy cơ Ảo giác (Hallucination)** | Trung bình – Cao nếu hỏi kiến thức ngoài luồng. | **Thấp nhất** (vì câu trả lời bị neo chặt vào đoạn văn bản truy xuất được). | Trung bình (Fine-tuning dạy *cách trả lời* tốt hơn là dạy *nhớ chính xác sự kiện mới*). | Phụ thuộc chất lượng dữ liệu gốc. |\n| **Dữ liệu cần thiết** | 0 đến vài ví dụ mẫu (Few-shot). | Kho tài liệu thô (PDF, Wiki, Word, SQL) không cần gắn nhãn. | Hàng nghìn đến hàng trăm nghìn cặp `(Instruction, Ideal Response)` đã gắn nhãn sạch. | Hàng nghìn tỷ (Trillions) tokens dữ liệu thô + Cụm hàng nghìn GPU. |\n\n\u003e [!TIP]\n\u003e **Góc nhìn Thực chiến:** Trong các hệ thống AI doanh nghiệp hiện đại, **RAG và Fine-Tuning KHÔNG loại trừ nhau mà thường được KẾT HỢP (RAG + Fine-Tuning)**! Ví dụ: Dùng **LoRA Fine-Tuning** để dạy mô hình hiểu thuật ngữ y khoa và xuất báo cáo chuẩn bệnh viện, đồng thời kết nối **RAG** để tra cứu hồ sơ bệnh án mới nhất của từng bệnh nhân theo thời gian thực.\n\n---\n\n## 3. Cấp độ 1: Prompt Engineering (Kỹ nghệ Câu lệnh)\n\n* **Bản chất:** Là phương pháp thiết kế, cấu trúc và tối ưu hóa câu lệnh đầu vào (Input Prompt) bằng ngôn ngữ tự nhiên để dẫn dắt LLM sinh ra kết quả mong muốn thông qua cơ chế **In-Context Learning (Học trong ngữ cảnh)** mà **hoàn toàn KHÔNG làm thay đổi bất kỳ trọng số (weights) nào của mô hình**.\n\n### 3.1. Bảng phân biệt 7 kỹ thuật Prompting cốt lõi (Rất hay hỏi trong đề thi):\n| Kỹ thuật Prompting | Định nghĩa \u0026 Cách nhận diện | Ví dụ minh họa thực tế | Khi nào nên dùng? |\n| :--- | :--- | :--- | :--- |\n| **1. Zero-shot Prompting** | Đặt câu hỏi hoặc giao nhiệm vụ **trực tiếp mà không kèm theo bất kỳ ví dụ mẫu nào**. | *\"Phân loại cảm xúc câu sau thành Tích cực hoặc Tiêu cực: \u0027Bộ phim này hay ngoài mong đợi.\u0027 $\\to$ Đáp án:\"* | Các tác vụ phổ thông, đơn giản mà LLM đã hiểu rõ bản chất từ lúc Pre-train/SFT. |\n| **2. One-shot Prompting** | Cung cấp **đúng 1 ví dụ mẫu hoàn chỉnh (1 cặp Input-Output)** trước khi đưa ra câu hỏi chính. | *\"Ví dụ: \u0027Giao hàng chậm\u0027 -\u003e Tiêu cực. Hãy phân loại: \u0027Đóng gói rất kỹ\u0027 -\u003e ?\"* | Khi muốn mô hình bắt chước chính xác một định dạng đầu ra đơn giản mà không tốn nhiều token. |\n| **3. Few-shot Prompting** | Cung cấp từ **2 đến $N$ ví dụ mẫu đa dạng** ngay trong prompt để dạy mô hình quy luật ánh xạ tại chỗ (**In-context learning**). | Đưa 3–5 ví dụ chuyển đổi câu nói tự nhiên thành mã JSON chuẩn của công ty trước khi yêu cầu xử lý câu mới. | Khi tác vụ có định dạng đặc thù hoặc cần phân biệt các trường hợp biên phức tạp mà chưa muốn fine-tune. |\n| **4. Chain-of-Thought (CoT)** | Yêu cầu mô hình **trình bày rõ từng bước lập luận trung gian** trước khi chốt đáp án cuối cùng (*\"Let\u0027s think step by step\"*). | *\"Lan có 5 quả táo, mua thêm 2 túi mỗi túi 3 quả... Hãy suy nghĩ từng bước một trước khi đưa ra kết quả.\"* | Cực kỳ hiệu quả cho bài toán **Toán học, Logic, Lập trình và Suy luận đa bước** (kết hợpได้ với cả Zero-shot CoT và Few-shot CoT). |\n| **5. Self-Consistency** | Mở rộng của CoT: Cho mô hình sinh ra **nhiều luồng suy luận CoT độc lập khác nhau** (với Temperature \u003e 0), sau đó lấy **biểu quyết đa số (Majority Vote)** cho đáp án cuối cùng. | Sinh 5 cách giải cho cùng 1 bài toán phức tạp; nếu 4/5 cách đều ra đáp số `42`, chọn `42`. | Khi bài toán suy luận cực khó, một luồng CoT đơn lẻ vẫn có nguy cơ tính nhầm ở bước giữa. |\n| **6. ReAct (Reason + Act)** | Mô hình lặp đi lặp lại chu trình: **Suy nghĩ (`Thought`) $\\to$ Gọi công cụ bên ngoài (`Action`: Search API, SQL, Calculator) $\\to$ Quan sát kết quả (`Observation`)** cho đến khi giải xong bài toán. | *\"Thought: Cần tìm giá cổ phiếu NVDA hôm nay -\u003e Action: gọi YahooFinance API -\u003e Observation: \\$140 -\u003e Answer...\"* | Nền tảng cốt lõi để xây dựng **AI Agents \u0026 Tool Calling / Function Calling**. |\n| **7. System Prompt (Role / Persona)** | Câu lệnh nền định nghĩa **vai trò (Persona), quy tắc ứng xử, giới hạn bảo mật và định dạng đầu ra** của toàn bộ cuộc hội thoại. | *\"Bạn là trợ lý tài chính của ngân hàng X. Chỉ trả lời bằng tiếng Việt lịch sự về lãi suất, từ chối mọi câu hỏi chính trị...\"* | Định hình hành vi tổng thể của ứng dụng; có **độ ưu tiên cao hơn User Prompt** để giữ nhất quán và chống bẻ khóa. |\n\n---\n\n## 4. Cấp độ 2: Retrieval-Augmented Generation (RAG - Sinh văn bản Tăng cường Truy xuất)\n\n* **Bản chất của RAG:** Giống như cho sinh viên đi thi dưới hình thức **\"Thi mở sách (Open-Book Exam)\"**. Thay vì bắt mô hình học thuộc lòng mọi tài liệu nội bộ vào trọng số (Parametric Memory), hệ thống sẽ **tự động tra cứu đúng đoạn tài liệu liên quan nhất từ kho lưu trữ ngoài (Non-parametric Memory / Vector Database) rồi đính kèm trực tiếp vào Prompt** để LLM đọc và tổng hợp câu trả lời!\n\n### 4.1. Sơ đồ Kiến trúc \u0026 Quy trình 2 Pha của Hệ thống RAG Doanh nghiệp (Chuẩn NVIDIA NeMo Retriever)\n\n```mermaid\nflowchart TD\n    subgraph Offline[\"PHA 1: OFFLINE DATA INGESTION \u0026 INDEXING (Chuẩn bị \u0026 Lập chỉ mục tri thức)\"]\n        direction LR\n        Docs[\"Tài liệu Doanh nghiệp\u003cbr/\u003e(PDF, Word, Wiki, HTML, SQL)\"] --\u003e|1. Parsing \u0026 Cleaning| Clean[\"Văn bản \u0026 Bảng biểu\u003cbr/\u003eđã làm sạch\"]\n        Clean --\u003e|\"2. Chunking\u003cbr/\u003e(Cắt đoạn + Chunk Overlap)\"| Chunks[\"Các đoạn văn nhỏ\u003cbr/\u003e(Semantic Chunks)\"]\n        Chunks --\u003e|\"3. Embedding Model\u003cbr/\u003e(Bi-Encoder: NeMo Retriever)\"| Vecs[\"Dense Vectors\u003cbr/\u003e(VD: 1024 chiều)\"]\n        Vecs --\u003e|\"4. Indexing (HNSW / IVF)\"| VDB[(\"Vector Database\u003cbr/\u003e(Milvus / cuVS, FAISS, Pinecone)\")]\n    end\n\n    subgraph Online[\"PHA 2: ONLINE RETRIEVAL, RERANKING \u0026 GENERATION (Khi User đặt câu hỏi)\"]\n        direction LR\n        User[\"Câu hỏi của User\u003cbr/\u003e(User Query)\"] --\u003e|\"1. Nhúng bằng CÙNG\u003cbr/\u003eEmbedding Model\"| QVec[\"Query Vector\"]\n        QVec \u003c--\u003e|\"2a. Hybrid Search (Vector Cosine + BM25)\u003cbr/\u003eLấy nhanh Top-25 Chunks ứng viên\"| VDB\n        VDB --\u003e|\"2b. Reranker (Cross-Encoder)\u003cbr/\u003eChấm điểm ngữ cảnh sâu chọn Top-3 chuẩn nhất\"| Aug[\"3. Prompt Augmentation\u003cbr/\u003eGộp: System Prompt + Top-3 Chunks + User Query\"]\n        Aug --\u003e|\"4. Generation\"| LLM[\"Mô hình LLM\u003cbr/\u003e(Temperature thấp ~ 0.1)\"]\n        LLM --\u003e Ans[\"Câu trả lời chính xác\u003cbr/\u003e+ Trích dẫn nguồn (Citations)\"]\n    end\n```\n\n### 4.2. Giải phẫu các thành phần kỹ thuật quan trọng trong RAG:\n1. **Chiến lược Chunking \u0026 Chunk Overlap (Cắt nhỏ tài liệu):**\n   * *Tại sao cần Chunking?*\n     1. Tránh vượt quá giới hạn **Cửa sổ ngữ cảnh (Context Window)** và giảm hiện tượng **\"Lost in the Middle\"** (LLM thường khai thác thông tin ở phần đầu và phần cuối prompt tốt hơn phần chìm ở giữa một văn bản rất dài).\n     2. Tăng **độ tập trung ngữ nghĩa của Vector Embedding (Retrieval Precision)**: Nếu nhúng cả cuốn sách 200 trang thành 1 vector duy nhất, ý nghĩa của từng chi tiết sẽ bị trung bình hóa và pha loãng; cắt thành từng đoạn nhỏ (ví dụ `256 - 512 tokens`) giúp vector đại diện rõ nét cho từng ý cụ thể.\n     3. Giảm độ trễ (**TTFT**) và tiết kiệm chi phí token mỗi lần gọi LLM.\n   * *Tại sao thường dùng **Chunk Overlap** (Gối đầu khoảng 10–20%, ví dụ chunk 500 tokens gối đầu 50 tokens)?* Để **bảo toàn ngữ cảnh liên tục tại vị trí vết cắt**, tránh việc một câu văn hoặc ý tưởng quan trọng bị cắt đôi nằm nửa ở cuối Chunk 1, nửa ở đầu Chunk 2 làm mất ngữ cảnh.\n2. **Cơ sở dữ liệu Vector (Vector Databases) \u0026 Thuật toán tìm kiếm ANN:**\n   * Lưu trữ hàng triệu/tỷ vector nhúng cùng với dữ liệu gốc và **Metadata** (tên file, số trang, ngày tạo, quyền truy cập phòng ban RBAC).\n   * Thay vì quét cạn từng vector một (Brute-force Flat Search chậm trên tập lớn), các Vector DB (như **Milvus được tăng tốc bằng NVIDIA cuVS/RAFT, FAISS, Pinecone, Weaviate, Qdrant**) sử dụng các thuật toán **ANN (Approximate Nearest Neighbors)** như **HNSW (Hierarchical Navigable Small World - đồ thị phân tầng)** hoặc **IVF (Inverted File Index - phân cụm tâm)** để tìm ra Top-K vector gần nhất theo **Cosine Similarity / Inner Product / L2** trong vài mili-giây.\n3. **Hybrid Search (Tìm kiếm Lai) \u0026 Reranking (Sắp xếp lại bằng Cross-Encoder):**\n   * **Hybrid Search = Dense Retrieval (Vector Embedding hiểu ngữ nghĩa) + Sparse Retrieval (BM25 / TF-IDF khớp chính xác mã sản phẩm, số hiệu hợp đồng, tên riêng)**: Kết hợp thế mạnh của cả hai để hạn chế bỏ sót tài liệu.\n   * **Bi-Encoder (Embedding Model) vs. Cross-Encoder (Reranker Model):**\n     * *Bước 1 (Bi-Encoder):* Nhúng độc lập câu hỏi và tài liệu để quét nhanh qua hàng triệu bản ghi trong Vector DB, lọc ra **Top-25 đến Top-50 ứng viên**.\n     * *Bước 2 (Cross-Encoder Reranker - ví dụ trong **NVIDIA NeMo Retriever**):* Đưa đồng thời từng cặp `(Câu hỏi + Chunk ứng viên)` vào mạng Transformer Cross-Encoder để tính Self-Attention chéo giữa các từ của câu hỏi và tài liệu, chấm điểm mức độ liên quan sâu rồi lọc lấy **Top-3 đến Top-5 đoạn phù hợp nhất** đưa vào LLM.\n\n### 4.3. Đánh giá, Gỡ lỗi (Troubleshooting) và Vận hành An toàn Hệ thống RAG\nĐể đánh giá và vận hành RAG trong thực tế sản xuất, kỹ sư cần tách bạch rõ bộ chỉ số của **khâu Truy xuất (Retrieval)** và **khâu Sinh câu trả lời (Generation)**:\n\n| Nhóm đánh giá / Vận hành | Các chỉ số \u0026 Cơ chế cốt lõi | Triệu chứng lỗi thường gặp \u0026 Cách khắc phục (Troubleshooting) |\n| :--- | :--- | :--- |\n| **1. Chất lượng Truy xuất (Retrieval Evaluation)** | • **`Recall@k`:** Tỷ lệ tài liệu liên quan thực sự xuất hiện trong Top-$k$ chunks lấy ra.\u003cbr/\u003e• **`Precision@k`:** Tỷ lệ chunks trong Top-$k$ thực sự hữu ích.\u003cbr/\u003e• **`MRR` (Mean Reciprocal Rank):** Đánh giá vị trí xuất hiện đầu tiên của tài liệu đúng ($\\frac{1}{\\text{rank}}$).\u003cbr/\u003e• **`nDCG@k`:** Đánh giá chất lượng thứ tự xếp hạng có trọng số vị trí. | • **Lỗi:** `Recall@k` thấp (không tìm thấy đoạn văn có đáp án).\u003cbr/\u003e• **Nguyên nhân \u0026 Cách sửa:**\u003cbr/\u003e  1. *Chunking sai:* Cắt mất tiêu đề/bảng biểu $\\to$ Dùng Semantic/Hierarchical chunking, thêm tiêu đề cha vào metadata mỗi chunk.\u003cbr/\u003e  2. *Embedding mismatch:* Dùng khác model khi index và khi query, hoặc thiếu từ khóa chuyên ngành $\\to$ Kết hợp **Hybrid Search (BM25 + Dense Vector)**.\u003cbr/\u003e  3. *Metadata filter quá chặt:* Lọc nhầm ngày/danh mục làm rỗng kết quả $\\to$ Kiểm tra lại logic pre-filtering. |\n| **2. Chất lượng Câu trả lời \u0026 Chống Ảo giác (Answer \u0026 Grounding)** | • **Faithfulness / Groundedness:** Câu trả lời có được hỗ trợ hoàn toàn bởi các chunks truy xuất không?\u003cbr/\u003e• **Answer Relevance:** Câu trả lời có đi đúng trọng tâm câu hỏi không?\u003cbr/\u003e• **Answer Correctness \u0026 Citation Accuracy:** Độ chính xác so với ground truth và trích dẫn đúng nguồn. | • **Lỗi:** Retrieval lấy đúng tài liệu (`Recall@k` cao) nhưng LLM vẫn trả lời sai hoặc bịa đặt.\u003cbr/\u003e• **Nguyên nhân \u0026 Cách sửa:**\u003cbr/\u003e  1. *Reranker cắt nhầm:* Top-25 có đáp án nhưng Reranker đẩy xuống dưới Top-3 $\\to$ Tăng $k$ hoặc tinh chỉnh Reranker.\u003cbr/\u003e  2. *Nhiễu ngữ cảnh / Lost in the Middle:* Đưa quá nhiều chunks rác vào prompt $\\to$ Giữ Top-3..5 chunks chất lượng cao nhất.\u003cbr/\u003e  3. *Stale sources:* Tài liệu cũ xung đột tài liệu mới $\\to$ Lọc theo timestamp/version mới nhất. |\n| **3. Bảo mật \u0026 Vận hành (Operational \u0026 Security)** | • **Access Control (RBAC / Document ACLs).**\u003cbr/\u003e• **Chống Indirect Prompt Injection.**\u003cbr/\u003e• **Ngân sách Latency (TTFT/TPOT) \u0026 Cost.** | • **Phân quyền truy cập:** Phải lọc quyền người dùng (**ACL metadata filter**) **ngay tại bước Retrieval** trước khi đưa chunks vào LLM (không để nhân viên thường truy xuất được bảng lương CEO).\u003cbr/\u003e• **Indirect Prompt Injection:** Dùng **Retrieval Rails (NeMo Guardrails)** và phân tách rõ thẻ dữ liệu `\u003ccontext\u003e` với chỉ thị hệ thống. |\n\n---\n\n## 5. Cấp độ 3: Transfer Learning, Fine-Tuning (LoRA/QLoRA) \u0026 Knowledge Distillation\n\n* **Bản chất của Transfer Learning (Học chuyển giao):** Tái sử dụng một mô hình đã được huấn luyện sẵn trên tập dữ liệu lớn (**Pre-trained Model**) làm điểm xuất phát, sau đó tinh chỉnh tiếp để thích ứng với tác vụ hoặc miền dữ liệu chuyên sâu của doanh nghiệp.\n* **Phép ẩn dụ Lái xe (Driving Analogy):** Một người **đã biết lái xe ô tô con thành thạo** khi chuyển sang **học lái xe tải hạng nặng** sẽ học nhanh hơn nhiều so với người chưa từng cầm vô lăng bao giờ (vì họ đã nắm sẵn luật giao thông, cách nhìn gương, cảm giác chân ga/phanh)!\n* **Lợi ích cốt lõi:** Tiết kiệm đáng kể thời gian và chi phí tính toán GPU, cần ít dữ liệu gắn nhãn hơn so với huấn luyện từ đầu (Training from scratch).\n\n```mermaid\nflowchart TD\n    TL[\"Các phương pháp Transfer Learning \u0026 Tối ưu Mô hình\"]\n    \n    subgraph FT[\"1. Fine-Tuning (Tinh chỉnh Trọng số)\"]\n        FullFT[\"Full Fine-Tuning:\u003cbr/\u003eMở khóa \u0026 cập nhật toàn bộ trọng số của mô hình gốc\u003cbr/\u003e(Tốn nhiều VRAM \u0026 dễ gặp nguy cơ Catastrophic Forgetting)\"]\n        PEFT[\"PEFT (LoRA, QLoRA, P-Tuning, Adapters):\u003cbr/\u003eChỉ điều chỉnh một phần nhỏ tham số hoặc thêm tham số phụ trợ,\u003cbr/\u003egiữ đóng băng phần lớn trọng số base model\u003cbr/\u003e(Giảm mạnh VRAM cần thiết \u0026 hạn chế quên tri thức gốc)\"]\n    end\n\n    subgraph KD[\"2. Knowledge Distillation (Chưng cất Tri thức)\"]\n        Teacher[\"👨‍🏫 Teacher Model (Mô hình Thầy giáo):\u003cbr/\u003eMô hình LLM lớn (VD: 70B / 340B), năng lực cao nhưng nặng nề\"]\n        Student[\"🧑‍🎓 Student Model (Mô hình Học sinh):\u003cbr/\u003eMô hình SLM nhỏ gọn (VD: 3B / 8B), học bắt chước phân phối xác suất (Soft Labels)\u003cbr/\u003ehoặc học trên dữ liệu tổng hợp từ Thầy\u003cbr/\u003e👉 Nhỏ gọn hơn, chạy nhanh trên Edge/Mobile!\"]\n        Teacher ==\u003e|\"Truyền dạy tri thức (Distillation)\"| Student\n    end\n\n    TL --\u003e FT \u0026 KD\n```\n\n### 5.1. Làm rõ chuyên sâu: Full Fine-Tuning vs. Họ các kỹ thuật PEFT (Parameter-Efficient Fine-Tuning)\n1. **Hai rào cản lớn của Full Fine-Tuning:**\n   * **Chi phí bộ nhớ VRAM lớn:** Để cập nhật toàn bộ 70 tỷ tham số của LLaMA-3 70B ở chuẩn 16-bit, ngoài `~140 GB` lưu trọng số (Weights), GPU còn phải lưu `~140 GB` cho đạo hàm (Gradients) và hàng trăm GB cho trạng thái bộ tối ưu hóa (Optimizer States của AdamW) + Activations $\\to$ Đòi hỏi cụm nhiều GPU dung lượng lớn!\n   * **Hiện tượng Catastrophic Forgetting (Quên thảm khốc):** Khi cập nhật trực tiếp toàn bộ trọng số gốc trên một tập dữ liệu nhỏ/hẹp của công ty, mô hình có nguy cơ làm suy giảm các kỹ năng ngôn ngữ và lập luận tổng quát đã học ở giai đoạn Pre-training.\n2. **Giải pháp PEFT – Tinh chỉnh hiệu quả tham số (Tham khảo: [Hugging Face PEFT Documentation](https://huggingface.co/docs/peft/index)):**\n   * **Bản chất của PEFT:** PEFT là họ kỹ thuật **chỉ điều chỉnh một phần nhỏ tham số hoặc thêm các tham số phụ trợ (adapters / soft prompts)** để giảm chi phí bộ nhớ và tính toán khi fine-tuning. Với cấu hình **LoRA điển hình**, trọng số base model được đóng băng và chỉ các low-rank adapters được huấn luyện. **Lưu ý:** Tỷ lệ tham số huấn luyện (`trainable parameters %`) **phụ thuộc vào kiến trúc model, bậc hạng `r` (rank), danh sách các tầng đích (`target_modules`)**, và không mặc định dưới 1% cho mọi cấu hình PEFT (một số thiết lập PEFT/LoRA có thể mở khóa thêm `bias`, tầng `embed_tokens` hoặc `lm_head` qua tham số `modules_to_save`).\n   * **LoRA (Low-Rank Adaptation):**\n     * *Cơ chế toán học:* Thay vì cập nhật trực tiếp toàn bộ ma trận trọng số gốc $W_0$ (kích thước $d \\times k$), **LoRA đóng băng $W_0$ (`requires_grad = False`)** và gắn song song hai ma trận phân rã hạng thấp (**Low-rank decomposition matrices**) là $A$ (kích thước $r \\times k$) và $B$ (kích thước $d \\times r$) với bậc hạng $r \\ll \\min(d, k)$ (ví dụ $r = 8, 16, 32$):\n       $$h = W_0 x + \\Delta W x = W_0 x + \\frac{\\alpha}{r} (B \\cdot A) x$$\n       *(Khi khởi tạo, ma trận $A$ thường lấy mẫu ngẫu nhiên Gaussian còn ma trận $B$ khởi tạo bằng $0$ để tại bước đầu tiên $\\Delta W = 0$, giữ nguyên hành vi mô hình gốc).*\n     * *Hiệu quả bộ nhớ:* Ví dụ với một ma trận $4096 \\times 4096$ ($16.77\\text{ triệu}$ tham số) và $r = 8$, số tham số của cặp $(A, B)$ tại tầng đó chỉ là $(4096 \\times 8) + (8 \\times 4096) = 65.536$ tham số. Nhờ không phải lưu Optimizer States cho $W_0$, lượng VRAM huấn luyện giảm mạnh và hạn chế *Catastrophic Forgetting*.\n     * *Gộp trọng số khi suy luận (Mergeable Weights):* Sau khi train xong, có thể cộng gộp $W_{\\text{merged}} = W_0 + \\frac{\\alpha}{r} B A$ để suy luận không phát sinh thêm độ trễ, hoặc giữ rời để phục vụ **Multi-LoRA Serving** trên Triton/NIM (1 Base Model trong VRAM phục vụ nhiều bộ Adapter LoRA khác nhau).\n   * **QLoRA (Quantized LoRA):**\n     * Giúp fine-tune LLM trên phần cứng giới hạn VRAM: **Lượng tử hóa mô hình gốc đã đóng băng $W_0$ xuống định dạng 4-bit (`NF4` - NormalFloat4)** kết hợp *Double Quantization* và *Paged Optimizers*, trong khi vẫn gắn và huấn luyện các thanh Adapter LoRA ở độ chính xác `BF16`/`FP16`.\n   * **Các kỹ thuật PEFT khác (hỗ trợ trong Hugging Face PEFT \u0026 NVIDIA NeMo Customizer):**\n     * **Prompt Tuning / P-Tuning:** Đóng băng base model, chỉ học thêm một chuỗi các vector liên tục (**Learnable Soft Prompt / Virtual Tokens**) gắn vào đầu chuỗi đầu vào.\n     * **Prefix Tuning:** Gắn thêm các vector tiền tố học được vào các tầng Key và Value của khối Attention.\n     * **Adapter Tuning:** Chèn thêm các lớp mạng bottleneck nhỏ nối tiếp vào bên trong từng khối Transformer.\n\n```mermaid\nflowchart LR\n    subgraph LoRA_Diagram[\"Cơ chế Toán học của LoRA (Low-Rank Adaptation)\"]\n        direction BT\n        Input_X[\"Đầu vào x\u003cbr/\u003e(d = 4096)\"]\n        \n        Frozen_W[\"❄️ Trọng số gốc W₀ (4096 × 4096)\u003cbr/\u003eĐóng băng (Frozen)\u003cbr/\u003e(Ở QLoRA: Nén W₀ xuống chuẩn 4-bit NF4)\"]\n        \n        Mat_A[\"🔥 Ma trận A (4096 × r)\u003cbr/\u003eGiảm chiều xuống rank r\"]\n        Mat_B[\"🔥 Ma trận B (r × 4096)\u003cbr/\u003eKhôi phục chiều lên 4096\"]\n        \n        Sum((\"Cộng (+)\u003cbr/\u003eh = W₀x + (α/r)B·A·x\"))\n        Output_H[\"Đầu ra h\u003cbr/\u003e(d = 4096)\"]\n\n        Input_X --\u003e Frozen_W --\u003e Sum\n        Input_X --\u003e Mat_A --\u003e|\"Nút cổ chai hạng thấp (rank r)\u003cbr/\u003eChỉ cập nhật A và B (tỷ lệ params tùy r \u0026 target_modules)\"| Mat_B --\u003e Sum\n        Sum --\u003e Output_H\n    end\n```\n\n### 5.2. Knowledge Distillation (Chưng cất tri thức) \u0026 Đánh giá sau Fine-Tuning\n* **Knowledge Distillation:** Quá trình chuyển giao tri thức từ một mô hình lớn, phức tạp (**Teacher Model**, ví dụ LLaMA-3 70B/405B) sang một mô hình nhỏ gọn hơn (**Student Model**, ví dụ SLM 3B/8B).\n  * Thay vì chỉ học trên nhãn cứng (Hard labels 0 hoặc 1), Student Model học cách bắt chước **phân phối xác suất đầu ra (Soft Labels / Logits)** hoặc học trên tập dữ liệu tổng hợp (**Synthetic Data**) do Teacher Model sinh ra $\\to$ Giúp thu được mô hình nhỏ gọn hơn, giảm chi phí và độ trễ khi chạy trên thiết bị biên (Edge/Mobile) hoặc sản xuất.\n* **Đánh giá mô hình sau khi Fine-Tuning:** Cần theo dõi **Validation Set Loss / Task Metrics** (trên tập kiểm định chưa từng thấy trong lúc train) để đánh giá khả n
