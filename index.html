àm tại tầng đầu tiên (Layer 1) được tính bằng **tích nhân liên tiếp (Chain Rule)** của các đạo hàm từ tầng cuối cùng ngược về tầng đầu:\n$$\\frac{\\partial L}{\\partial W_1} = \\frac{\\partial L}{\\partial a_N} \\times \\frac{\\partial a_N}{\\partial a_{N-1}} \\times \\dots \\times \\frac{\\partial a_2}{\\partial a_1} \\times \\frac{\\partial a_1}{\\partial W_1}$$\n\n* **Vanishing Gradients (Triệt tiêu đạo hàm):**\n  * Nếu mỗi tầng sử dụng hàm kích hoạt **Sigmoid** (vốn có đạo hàm cực đại chỉ bằng **$0.25$**, và ở hai đầu bão hòa đạo hàm gần bằng $0$), thì sau khi nhân liên tiếp qua 50 tầng:\n    $$(0.25)^{50} \\approx 8 \\times 10^{-31} \\to \\mathbf{0}$$\n  * **Phép ẩn dụ Trò chơi Truyền tin (Whispering Game / Telephone Game Analogy):**\n    Giống như 100 người xếp thành một hàng dọc chơi trò truyền tin thì thầm. Người đứng cuối hàng (Output layer) nói rất rõ sai số ở đâu cho người thứ 99, nhưng qua mỗi người âm lượng lại giảm đi 4 lần. Đến khi truyền tới những người đứng đầu hàng (Early layers), âm thanh đã **tắt ngấm hoàn toàn (tiến về 0)** — những người đầu hàng không nghe thấy gì nên **các tầng đầu tiên ngừng học hoàn toàn ($W_{\\text{new}} = W_{\\text{old}} - 0$)**!\n* **Exploding Gradients (Bùng nổ đạo hàm):**\n  * Ngược lại, nếu các ma trận trọng số có giá trị lớn hơn $1$ (ví dụ $2.0$), sau khi nhân liên tiếp 50 tầng: $2^{50} \\approx 1.12 \\times 10^{15} \\to \\infty$ (`NaN`), khiến bước cập nhật trọng số văng khỏi quỹ đạo và phá hỏng mô hình ngay lập tức!\n\n```mermaid\nflowchart RL\n    Out[\"Tầng Cuối (Output Layer)\u003cbr/\u003e📢 Sai số rất rõ ràng\u003cbr/\u003eGradient = 1.0\"]\n    L50[\"Tầng Giữa (Hidden Layer 50)\u003cbr/\u003e🔉 Tín hiệu yếu dần\u003cbr/\u003eGradient = 0.001\"]\n    L1[\"Tầng Đầu (Hidden Layer 1)\u003cbr/\u003e🔇 Tín hiệu tắt ngấm (Vanished!)\u003cbr/\u003eGradient ≈ 0.00000001\u003cbr/\u003e👉 Trọng số các tầng đầu đóng băng!\"]\n\n    Out ==\u003e|\"Backpropagation qua hàm Sigmoid\"| L50 ==\u003e|\"Nhân liên tiếp đạo hàm ≤ 0.25\"| L1\n```\n\n### 2.2. Bảng Tổng hợp Giải pháp Khắc phục Vanishing vs. Exploding Gradients (Hay hỏi thi!)\n| Vấn đề Đạo hàm | Giải pháp Kỹ thuật Khắc phục Triệt để | Cơ chế Toán học |\n| :--- | :--- | :--- |\n| **1. Vanishing Gradients (Đạo hàm tiến về $0$)** | • **Đổi hàm kích hoạt sang họ `ReLU` (`ReLU`, `Leaky ReLU`, `GELU`, `SwiGLU`)**.\u003cbr/\u003e• **Sử dụng Kết nối tắt: `Skip Connections / Residual Connections` ($y = F(x) + x$)**.\u003cbr/\u003e• Dùng cổng nhớ LSTM/GRU hoặc đổi hẳn sang **Transformer**. | • Đạo hàm của `ReLU` với mọi số dương luôn bằng đúng hằng số **$1$** ($1 \\times 1 \\times \\dots \\times 1 = 1$), không bị suy hao!\u003cbr/\u003e• Đường nối tắt $+ x$ tạo ra đạo hàm bằng $1$ truyền thẳng từ tầng cuối về tầng đầu như đường cao tốc không trạm thu phí. |\n| **2. Exploding Gradients (Đạo hàm vọt lên $\\infty$ / `NaN`)** | • **Kỹ thuật Cắt ngưỡng Đạo hàm: `Gradient Clipping`**.\u003cbr/\u003e• **Chuẩn hóa Tầng: `Layer Normalization (LayerNorm)` / `BatchNorm`**.\u003cbr/\u003e• Khởi tạo trọng số chuẩn (**Xavier / He Initialization**) \u0026 Giảm Learning Rate / thêm **Weight Decay**. | • **Gradient Clipping:** Nếu độ dài vector đạo hàm $\\|\\nabla L\\| \u003e \\text{threshold}$ (ví dụ $1.0$), tự động thu nhỏ vector đạo hàm về đúng bằng $1.0$ trước khi cập nhật.\u003cbr/\u003e• **LayerNorm:** Giữ các giá trị kích hoạt luôn nằm gọn quanh trung bình $0$, phương sai $1$. |\n\n---\n\n### 2.3. Bảng So sánh Toàn diện Các Hàm Kích hoạt (Activation Functions) trong Deep Learning \u0026 LLM\nTrong đề thi NCA-GENL, bạn cần phân biệt rõ khi nào dùng hàm kích hoạt nào:\n\n| Hàm kích hoạt | Công thức \u0026 Đồ thị | Miền giá trị đầu ra | Ưu điểm, Nhược điểm \u0026 Vị trí Sử dụng Chuẩn |\n| :--- | :--- | :---: | :--- |\n| **1. ReLU (Rectified Linear Unit)** | $$f(x) = \\max(0, x)$$ *(Nếu $x \u003c 0 \\to 0$; nếu $x \u003e 0 \\to x$)* | $[0, +\\infty)$ | • **Ưu:** Tính toán siêu nhanh trên GPU (chỉ là phép so sánh), **chống Vanishing Gradient tuyệt vời** cho miền dương (đạo hàm = $1$).\u003cbr/\u003e• **Nhược:** Hiện tượng *\"Dying ReLU\"* (nếu nơ-ron rơi vào vùng âm liên tục thì đạo hàm = $0$).\u003cbr/\u003e• **Vị trí:** Mặc định cho **các Tầng ẩn (Hidden Layers)** của CNN và MLP. |\n| **2. Leaky ReLU / GELU / SwiGLU** | • Leaky ReLU: $\\max(0.01x, x)$\u003cbr/\u003e• **GELU / SwiGLU**: Biến thể mượt của ReLU | $(-\\infty, +\\infty)$ | • Khắc phục hiện tượng *Dying ReLU* bằng cách cho phép một lượng nhỏ đạo hàm ở miền âm.\u003cbr/\u003e• **GELU** và **SwiGLU** là **hàm kích hoạt chuẩn bên trong khối FFN của mọi LLM hiện đại** (GPT-4, BERT, LLaMA-3, Mistral)! |\n| **3. Sigmoid (Logistic)** | $$\\sigma(x) = \\frac{1}{1 + e^{-x}}$$ *(Đường cong chữ S)* | $(0, 1)$ | • **Nhược:** Tính hàm mũ $e^{-x}$ chậm, đầu ra không đối xứng qua $0$, **gây Vanishing Gradient nặng nề nếu đặt ở tầng ẩn**.\u003cbr/\u003e• **Vị trí:** Chỉ dùng ở **Tầng đầu ra (Output Layer) cho bài toán Phân loại Nhị phân (Binary Classification)** để biểu diễn xác suất Đúng/Sai từ $0$ đến $1$. |\n| **4. Tanh (Hyperbolic Tangent)** | $$\\tanh(x) = \\frac{e^x - e^{-x}}{e^x + e^{-x}}$$ | $(-1, 1)$ | • Đối xứng qua tâm $0$ (Zero-centered) nên tốt hơn Sigmoid, dùng trong các cổng của LSTM, nhưng vẫn bị Vanishing Gradient ở hai đầu bão hòa. |\n| **5. Softmax** | $$\\text{softmax}(z_i) = \\frac{e^{z_i}}{\\sum_{j=1}^K e^{z_j}}$$ | $(0, 1)$ và $\\sum P_i = 1.0$ | • Biến một vector điểm số thô (**Logits**) thành một **Phân phối xác suất chuẩn** (tổng xác suất các lớp bằng $1.0$).\u003cbr/\u003e• **Vị trí:** Thường đặt ở **Tầng đầu ra (Output Layer) của bài toán Phân loại Đa lớp (Multi-class)**, đầu ra dự đoán từ vựng của **LLM** và bên trong công thức **Self-Attention**! |\n\n---\n\n## 3. Kỹ thuật Chuẩn hóa Tầng (LayerNorm vs. BatchNorm) \u0026 Chống Học vẹt (Dropout)\n\n### 3.1. Layer Normalization (LayerNorm / RMSNorm) vs. Batch Normalization (BatchNorm)\n* **Vấn đề kỹ thuật (Internal Covariate Shift):** Khi dữ liệu đi qua hàng chục tầng nhân ma trận trong mạng sâu, phân phối của các con số kích hoạt (activations) bị xô lệch liên tục — có tầng vọt lên hàng triệu, có tầng tụt xuống cực nhỏ, làm quá trình huấn luyện rất khó hội tụ.\n* **Bản chất của Layer Normalization (Chuẩn hóa Tầng):** Quy chuẩn hóa đầu ra của tất cả các đặc trưng bên trong **cùng một mẫu dữ liệu đơn lẻ tại một tầng** về phân phối chuẩn có **Trung bình bằng $0$ ($\\mu = 0$)** và **Độ lệch chuẩn bằng $1$ ($\\sigma = 1$)** (hầu hết các giá trị nằm gọn trong dải an toàn từ **$-3$ đến $+3$**).\n* **Phép ẩn dụ Điểm thi Đại học (School Exam Z-Score Analogy):**\n  Ba học sinh nộp điểm từ 3 trường có thang điểm khác nhau (Trường A chấm thang $50$, Trường B chấm thang $100$, Trường C chấm thang $200$). Nếu cộng gộp điểm thô sẽ gây sai lệch hoàn toàn. Quy đổi toàn bộ điểm số về **thang điểm chuẩn Z-Score ($\\mu=0, \\sigma=1$)** giúp so sánh công bằng và giữ cho mọi khối **Transformer** hội tụ ổn định.\n* **Phân biệt nhanh BatchNorm vs. LayerNorm (Hay hỏi nâng cao):**\n  * **Batch Normalization (BatchNorm):** Chuẩn hóa dọc theo từng cột đặc trưng **qua tất cả các mẫu trong cùng một Mini-batch** $\\to$ Phụ thuộc vào kích thước Batch Size, rất phổ biến trong **Mạng thị giác CNN (ResNet)**.\n  * **Layer Normalization (LayerNorm) \u0026 RMSNorm:** Chuẩn hóa ngang theo các chiều ẩn của **từng token độc lập** mà không phụ thuộc vào Batch Size hay độ dài câu $\\to$ **Tiêu chuẩn rất phổ biến cho các kiến trúc Chuỗi / NLP / Transformer / LLM**!\n\n### 3.2. Kỹ thuật Dropout (Chống Overfitting)\n* **Cơ chế hoạt động:** Trong suốt quá trình **Training (Huấn luyện)**, ở mỗi bước lặp, lớp **Dropout** sẽ **ngẫu nhiên tắt (gán giá trị bằng $0$) một tỷ lệ $p\\%$ các nơ-ron** trong tầng (ví dụ `Dropout rate p = 0.1` hoặc `0.2`, tức tắt ngẫu nhiên 10–20% nơ-ron).\n* **Phép ẩn dụ Đội bóng / Công ty:** Nếu trong một nhóm làm việc có 1 ngôi sao quá giỏi, các thành viên khác sẽ ỷ lại ngồi chơi. Nếu mỗi ngày quản lý ngẫu nhiên cho 20% nhân viên nghỉ phép, tất cả các nhân viên còn lại bắt buộc phải tự rèn luyện kỹ năng đa năng để gánh vác công việc!\n* **Tác dụng:** Ngăn chặn hiện tượng các nơ-ron phụ thuộc đồng bộ mù quáng vào nhau (**Co-adaptation**) để học thuộc lòng nhiễu của tập Train, buộc mạng nơ-ron học các biểu diễn đặc trưng phân tán và vững chắc hơn $\\to$ **Giảm thiểu Overfitting cực kỳ hiệu quả!**\n* **Lưu ý quan trọng khi kiểm thử và suy luận:** **Dropout thường chỉ kích hoạt trong lúc `Training` (`model.train()`)**; khi chuyển sang chạy **Suy luận / Đánh giá `Inference / Evaluation` (`model.eval()`), cần tắt Dropout** để sử dụng toàn bộ các nơ-ron của mạng nhằm cho ra dự đoán ổn định và nhất quán (trừ trường hợp đặc biệt khi chủ đích dùng kỹ thuật *Monte Carlo Dropout* để ước lượng độ bất định).\n\n---\n\n## 4. Thuật toán Khuếch tán Sinh ảnh/Video: Diffusion Models, Latent Diffusion \u0026 Vision Transformer (ViT)\n\n### 4.1. Quy trình 2 Pha đối nghịch nhau của Diffusion Models (Cần nhớ rõ!):\n**Diffusion Models (Mô hình Khuếch tán)** là kiến trúc cốt lõi đứng đằng sau các hệ thống tạo sinh hình ảnh, nghệ thuật và video như **Stable Diffusion, Midjourney, DALL-E 3, OpenAI Sora, NVIDIA Edify / Cosmos**.\n\n```mermaid\nflowchart TD\n    subgraph P1[\"PHA 1: FORWARD DIFFUSION (Khuếch tán Xuôi - Diễn ra trong lúc HUẤN LUYỆN)\"]\n        direction LR\n        Img0[\"🐱 Bức ảnh gốc sắc nét x₀\u003cbr/\u003e(Step t = 0)\"]\n        Img1[\"🌫️ Ảnh hơi mờ nhiễu x₅₀\u003cbr/\u003e(Step t = 50)\"]\n        ImgT[\"📺 Màn hình nhiễu hạt 100% x_T\u003cbr/\u003e(Pure Gaussian Noise - Step t = 1000)\"]\n        \n        Img0 ==\u003e|\"Cộng dần nhiễu Gaussian nhỏ q(x_t | x_{t-1})\"| Img1 ==\u003e|\"Phá hủy cấu trúc ảnh\"| ImgT\n    end\n\n    subgraph P2[\"PHA 2: REVERSE DIFFUSION (Khuếch tán Ngược - Diễn ra trong lúc SUY LUẬN / TẠO ẢNH)\"]\n        direction LR\n        Noise[\"📺 Khung hình nhiễu ngẫu nhiên x_T\u003cbr/\u003e+ Text Prompt: \u0027Một chú mèo đội mũ phi hành gia\u0027\"]\n        Denoise[\"🎨 Mạng nơ-ron (U-Net / DiT) dự đoán lượng nhiễu ε_θ\u003cbr/\u003evà trừ bỏ từng lớp nhiễu nhỏ qua từng bước\"]\n        NewImg[\"🚀🐱 Bức ảnh mới nguyên bản x₀,\u003cbr/\u003esắc nét \u0026 khớp hoàn hảo với Prompt!\"]\n        \n        Noise ==\u003e|\"Khử nhiễu có định hướng (Guided Denoising)\"| Denoise ==\u003e|\"Hoàn tất sau 20-50 bước\"| NewImg\n    end\n```\n\n1. **Forward Diffusion Process (Khuếch tán xuôi – Pha Huấn luyện):** Bắt đầu từ một bức ảnh thật sắc nét ($x_0$), hệ thống **cộng thêm từng lượng nhỏ nhiễu chuẩn Gaussian (Gaussian Noise)** qua $T$ bước thời gian liên tiếp (ví dụ $T = 1000$) cho đến khi bức ảnh gốc bị phá hủy hoàn toàn, trở thành một màn hình tivi mất sóng nhiễu hạt trắng xóa ($x_T \\sim \\mathcal{N}(0, \\mathbf{I})$).\n2. **Reverse Diffusion Process (Khuếch tán ngược / Denoising – Pha Suy luận tạo ảnh mới):** Bắt đầu từ một khung hình nhiễu ngẫu nhiên hoàn toàn ($x_T$), dưới sự dẫn dắt của câu lệnh **Text Prompt** (thông qua cơ chế Cross-Attention), mạng nơ-ron dự đoán chính xác phần nhiễu ở mỗi bước và **bóc tách/khử bỏ từng lớp nhiễu nhỏ** lặp đi lặp lại ($x_T \\to x_{T-1} \\to \\dots \\to x_0$) cho đến khi lộ ra một bức ảnh mới hoàn toàn, sắc nét và đúng như mô tả!\n\n### 4.2. Giải phẫu Kiến trúc Latent Diffusion Models (Stable Diffusion) \u0026 Tham số CFG Scale\nNếu chạy quá trình khử nhiễu 50 bước trực tiếp trên ma trận điểm ảnh phân giải cao $1024 \\times 1024 \\times 3$ (**Pixel Space**), khối lượng tính toán sẽ cực kỳ khổng lồ và chậm chạp. **Latent Diffusion Model (LDM)** giải quyết bài toán này bằng sự phối hợp của **3 thành phần cốt lõi**:\n\n```mermaid\nflowchart LR\n    Prompt[\"Text Prompt:\u003cbr/\u003e\u0027A cyberpunk city in the rain\u0027\"]\n    CLIP[\"1. Text Encoder (CLIP / T5)\u003cbr/\u003eChuyển Prompt thành\u003cbr/\u003eText Conditioning Vectors\"]\n    \n    LatentNoise[\"Nhiễu ngẫu nhiên nhỏ gọn\u003cbr/\u003etrong Không gian Tiềm ẩn\u003cbr/\u003e(Latent Space: 64 × 64)\"]\n    UNet[\"2. Denoising Network (U-Net / DiT)\u003cbr/\u003eKhử nhiễu lặp 20-50 bước trong Latent Space\u003cbr/\u003e(Nhận hướng dẫn từ CLIP qua Cross-Attention)\"]\n    CleanLatent[\"Biểu diễn Latent sạch\u003cbr/\u003eđã khử hết nhiễu\"]\n    \n    VAE[\"3. VAE Decoder\u003cbr/\u003e(Variational Autoencoder)\u003cbr/\u003eGiải nén từ Latent Space (64×64)\u003cbr/\u003era Pixel Space phân giải cao!\"]\n    FinalImg[\"🖼️ Bức ảnh 1024 × 1024\u003cbr/\u003ehoàn chỉnh!\"]\n\n    Prompt --\u003e CLIP --\u003e|\"Cross-Attention (CFG Scale)\"| UNet\n    LatentNoise --\u003e UNet --\u003e CleanLatent --\u003e VAE --\u003e FinalImg\n```\n\n1. **VAE (Variational Autoencoder):** Bộ **VAE Encoder** nén bức ảnh từ không gian điểm ảnh lớn (Pixel Space) xuống một **Không gian tiềm ẩn (Latent Space)** nhỏ gọn hơn 48 lần (nhưng vẫn giữ nguyên mọi đặc trưng cấu trúc) để huấn luyện; và sau khi khử nhiễu xong, **VAE Decoder** phóng đại ngược vector Latent đó ra bức ảnh độ phân giải cao hoàn chỉnh.\n2. **U-Net hoặc DiT (Diffusion Transformer):** Trái tim thực hiện việc dự đoán và khử nhiễu từng bước ngay bên trong không gian Latent nhỏ gọn. *(Các mô hình thế hệ mới nhất như **Sora, Flux, Stable Diffusion 3** thay thế mạng tích chập U-Net bằng kiến trúc **DiT - Diffusion Transformer** để mở rộng quy mô tốt hơn).*\n3. **CLIP (Contrastive Language-Image Pre-training - Bộ mã hóa văn bản):** Mô hình đa phương thức (do OpenAI giới thiệu) được huấn luyện trên 400 triệu cặp `(Ảnh, Chú thích)` để căn chỉnh văn bản và hình ảnh vào cùng một không gian vector. Trong Diffusion, **CLIP Text Encoder** biến câu Prompt của người dùng thành vector ngữ nghĩa rồi tiêm vào mạng U-Net/DiT qua tầng **Cross-Attention** để dẫn đường cho việc khử nhiễu.\n   * **Tham số `CFG Scale` (Classifier-Free Guidance Scale):** Điều chỉnh mức độ mô hình \"nghe lời\" câu lệnh Text Prompt:\n     * *CFG thấp ($1 - 3$):* Mô hình tự do sáng tạo nhưng dễ bỏ sót chi tiết trong Prompt.\n     * *CFG cân bằng ($7 - 9$):* Bám sát mô tả của Prompt và ảnh đẹp tự nhiên.\n     * *CFG quá cao ($\u003e 15$):* Ép bám sát Prompt thái quá làm ảnh bị cháy sáng và vỡ màu.\n4. **Vision Transformer (ViT):** Cách áp dụng trực tiếp kiến trúc Transformer vào Thị giác máy tính — cắt bức ảnh thành một lưới các **ô vuông nhỏ cố định (Image Patches, ví dụ $16 \\times 16$ pixels)**, trải phẳng mỗi ô vuông thành một vector rồi coi mỗi ô vuông đó giống hệt như **1 Token từ vựng** đưa vào Transformer Encoder!\n\n---\n\n## 5. Các Tác vụ NLP Cốt lõi (NER, Summarization), Phương pháp RAD \u0026 Hệ sinh thái Hugging Face\n\n### 5.1. Named Entity Recognition (NER - Nhận diện Thực thể Định danh) \u0026 Các Tác vụ NLP\n* **NER là gì?** Là kỹ thuật NLP tự động quét qua văn bản phi cấu trúc để xác định ranh giới và phân loại các từ/cụm từ quan trọng vào các nhóm **Thực thể định danh có cấu trúc (Predefined Categories)**: **Tên người (`PER`), Tổ chức/Công ty (`ORG`), Địa điểm (`LOC`), Ngày giờ (`DATE/TIME`), Tiền tệ (`MONEY`), Mã bệnh/Thuốc (`MEDICAL`)**.\n\n```mermaid\nflowchart LR\n    RawText[\"Câu nói tự nhiên (Unstructured Text):\u003cbr/\u003e\u0027Hãy lên lịch họp với Alex tại Favorite Cafe vào 5 giờ chiều ngày 22/10/2026\u0027\"]\n    \n    NER_Model[\"Mô hình NER\u003cbr/\u003e(Ví dụ: BERT Encoder Token Classification)\"]\n    \n    JSON_Out[\"Dữ liệu có cấu trúc (Structured JSON):\u003cbr/\u003e{\u003cbr/\u003e  action: \u0027schedule_meeting\u0027,\u003cbr/\u003e  person: \u0027Alex\u0027,\u003cbr/\u003e  location: \u0027Favorite Cafe\u0027,\u003cbr/\u003e  time: \u002717:00\u0027,\u003cbr/\u003e  date: \u00272026-10-22\u0027\u003cbr/\u003e}\"]\n\n    RawText ==\u003e NER_Model ==\u003e JSON_Out\n```\n\n* **Phân biệt 2 phương pháp Tóm tắt văn bản (Text Summarization - Hay hỏi trong đề thi):**\n  1. **Extractive Summarization (Tóm tắt Trích xuất):** Giống như dùng bút dạ quang **gạch chân và trích nguyên văn các câu quan trọng nhất** có sẵn trong bài viết gốc ghép lại (không tự viết thêm từ mới; thường dùng các mô hình Encoder như BERT).\n  2. **Abstractive Summarization (Tóm tắt Trừu tượng / Diễn giải):** Giống như con người đọc hiểu toàn bộ văn bản rồi **tự dùng ngôn từ mới của mình để viết lại bản tóm tắt ngắn gọn, mượt mà** (sử dụng các mô hình **Encoder-Decoder như T5, BART** hoặc **Decoder-only LLM**).\n\n---\n\n### 5.2. Phương pháp Phát triển Phần mềm RAD \u0026 Hệ sinh thái Thư viện Hugging Face\n1. **RAD (Rapid Application Development - Phát triển Ứng dụng Nhanh):**\n   * Là phương pháp luận kỹ thuật phần mềm (Software Engineering Methodology) ưu tiên việc **xây dựng nhanh nguyên mẫu hoạt động được (Rapid Prototyping)**, phát hành thử nghiệm sớm và **lặp đi lặp lại liên tục dựa trên phản hồi trực tiếp của người dùng (Iterative User Feedback)** thay vì mất hàng tháng trời viết tài liệu thiết kế cứng nhắc từ đầu (như mô hình Thác nước - Waterfall).\n   * *Tại sao RAD cực kỳ quan trọng trong đề thi NCA-GENL?* Vì các dự án Generative AI mang tính thực nghiệm rất cao (không biết trước Prompt nào hay mô hình nào sẽ hiệu quả nhất trên dữ liệu thật), nên áp dụng **RAD** (kết hợp các công cụ dựng UI nhanh như *Gradio, Streamlit* và microservice *NVIDIA NIM*) giúp đội ngũ AI kiểm chứng ý tưởng (PoC) chỉ trong vài ngày!\n2. **Hệ sinh thái Thư viện `Hugging Face` (Tiêu chuẩn công nghiệp cho Developer AI):**\n   * **`transformers`:** Thư viện Python cốt lõi cung cấp API thống nhất (`AutoTokenizer`, `AutoModelForCausalLM`, `pipeline`) để tải và chạy hàng trăm nghìn mô hình Pre-trained (NLP, Vision, Audio, Multimodal), tương thích mượt mà với cả **PyTorch** và **TensorFlow**.\n   * **`datasets`:** Thư viện tải và xử lý các tập dữ liệu lớn siêu tốc dựa trên định dạng bộ nhớ Apache Arrow (Memory-mapping không làm tràn RAM).\n   * **`tokenizers`:** Thư viện thực thi Subword Tokenization (BPE, WordPiece) được viết bằng ngôn ngữ **Rust** siêu nhanh.\n   * **`peft` \u0026 `trl`:** Thư viện chuẩn để gắn LoRA/QLoRA (`peft`) và huấn luyện SFT / DPO / RLHF (`trl` - Transformer Reinforcement Learning).\n   * **`safetensors`:** Định dạng lưu trữ trọng số mô hình mới an toàn và nạp nhanh (Zero-copy), thay thế cho định dạng `.bin` / `pickle` cũ của Python vốn tiềm ẩn nguy cơ bị chèn mã độc thực thi tự động (**Arbitrary Code Execution**).\n\n### Minh họa Code Python sử dụng `Hugging Face transformers` trong 5 dòng code:\n```python\nfrom transformers import pipeline\n\n# 1. Tác vụ Phân tích cảm xúc (Tự động tải mô hình Encoder-only như DistilBERT)\nclassifier = pipeline(\"sentiment-analysis\")\nprint(classifier(\"NVIDIA TensorRT-LLM speeds up inference dramatically!\"))\n# Kết quả: [{\u0027label\u0027: \u0027POSITIVE\u0027, \u0027score\u0027: 0.9998}]\n\n# 2. Tác vụ Trích xuất thực thể định danh (NER)\nner_tagger = pipeline(\"ner\", grouped_entities=True)\nprint(ner_tagger(\"Jensen Huang founded NVIDIA in Santa Clara.\"))\n# Kết quả: [{\u0027entity_group\u0027: \u0027PER\u0027, \u0027word\u0027: \u0027Jensen Huang\u0027}, {\u0027entity_group\u0027: \u0027ORG\u0027, \u0027word\u0027: \u0027NVIDIA\u0027}, {\u0027entity_group\u0027: \u0027LOC\u0027, \u0027word\u0027: \u0027Santa Clara\u0027}]\n```\n\n---\n\n## 6. Bẫy đề thi NCA-GENL \u0026 Câu hỏi Thực chiến (Exam Traps \u0026 Mini Quiz)\n\n\u003e [!WARNING]\n\u003e **Các bẫy kinh điển trong đề thi Module 10:**\n\u003e 1. **Bẫy ReLU vs. Sigmoid vs. Softmax:**\n\u003e    * Dùng ở **Hidden Layers** để tính toán nhanh và **chống Vanishing Gradients** $\\to$ **ReLU** (hoặc **GELU / SwiGLU**).\n\u003e    * Ép đầu ra về khoảng **$(0, 1)$** và dùng ở **Output Layer cho phân loại nhị phân** $\\to$ **Sigmoid**.\n\u003e    * Chuyển vector điểm số Logits thành **phân phối xác suất có tổng bằng $1.0$** ở Output Layer của LLM hoặc trong Self-Attention $\\to$ **Softmax**.\n\u003e 2. **Bẫy Diffusion:** Pha nào **thêm nhiễu Gaussian (adds noise)** vào ảnh gốc trong lúc huấn luyện? $\\to$ **Forward Diffusion**. Pha nào **khử nhiễu từng bước (removes noise / denoising)** từ màn hình nhiễu ngẫu nhiên để tạo ra bức ảnh mới lúc suy luận? $\\to$ **Reverse Diffusion**.\n\u003e 3. **Bẫy LayerNorm vs. Dropout:** Chuẩn hóa đầu ra của mỗi tầng về trung bình $0$, độ lệch chuẩn $1$ để giữ ổn định huấn luyện Transformer $\\to$ **Layer Normalization**. Tắt ngẫu nhiên một tỷ lệ nơ-ron trong lúc train để chống Overfitting $\\to$ **Dropout** (và nhớ tắt Dropout khi chạy Inference!).\n\u003e 4. **Bẫy Loss Function vs. Backpropagation vs. Optimizer:** Đo độ lệch sai số $\\to$ **Loss Function**. Truyền ngược sai số tính đạo hàm Gradient $\\to$ **Backpropagation**. Dùng Gradient cập nhật trọng số $\\to$ **Optimizer (Adam/AdamW/SGD)**.\n\n### Câu hỏi tự kiểm tra (Mini Quiz):\n1. **Câu 1:** Tại sao các mạng nơ-ron sâu hiện đại ưu tiên sử dụng hàm kích hoạt **ReLU (hoặc GELU)** ở các tầng ẩn thay vì hàm **Sigmoid**?\n   * *Đáp án:* Vì ReLU tính toán cực kỳ nhanh và giữ đạo hàm bằng hằng số $1$ cho các giá trị dương, giúp **ngăn chặn hiện tượng triệt tiêu đạo hàm (Vanishing Gradients)** khi lan truyền ngược qua nhiều tầng sâu (trong khi Sigmoid có đạo hàm tối đa chỉ $0.25$ khiến tín hiệu đạo hàm bị nhân nhỏ dần về $0$).\n2. **Câu 2:** Phương pháp phát triển phần mềm nào ưu tiên việc dựng nhanh nguyên mẫu (rapid prototyping) và thu thập phản hồi của người dùng lặp đi lặp lại liên tục, rất phù hợp cho giai đoạn thử nghiệm các ứng dụng Generative AI?\n   * *Đáp án:* **RAD (Rapid Application Development)**.\n3. **Câu 3:** Trong kiến trúc **Latent Diffusion Model (như Stable Diffusion)**, thành phần nào chịu trách nhiệm nén bức ảnh từ không gian điểm ảnh lớn (Pixel Space) xuống không gian tiềm ẩn nhỏ gọn (Latent Space) và giải mã ngược lại thành bức ảnh hoàn chỉnh sau khi đã khử nhiễu?\n   * *Đáp án:* **VAE (Variational Autoencoder)**.\n4. **Câu 4:** Một kỹ sư đang xây dựng hệ thống tự động đọc hàng nghìn hợp đồng thương mại để bóc tách chính xác Tên công ty, Tên người đại diện, Địa chỉ trụ sở và Ngày ký kết vào bảng cơ sở dữ liệu. Đây là bài toán NLP gì?\n   * *Đáp án:* **NER (Named Entity Recognition - Nhận diện thực thể định danh)**.\n5. **Câu 5:** Trong quá trình huấn luyện mạng Transformer sâu, ngoài việc sử dụng hàm kích hoạt phù hợp, thành phần kiến trúc nào tạo ra một \"đường nối tắt\" cộng trực tiếp đầu vào $x$ vào đầu ra của tầng con ($x + \\text{SubLayer}(x)$) để giúp đạo hàm truyền thẳng về các tầng đầu mà không bị suy giảm?\n   * *Đáp án:* **Skip Connections / Residual Connections (Kết nối tắt / Kết nối dư)**.\n6. **Câu 6:** Khi chuyển một mô hình mạng nơ-ron từ chế độ Huấn luyện (`Training`) sang chế độ Suy luận thực tế (`Inference / Evaluation`), lớp **Dropout** phải được xử lý như thế nào?\n   * *Đáp án:* Lớp **Dropout phải được vô hiệu hóa (tắt đi)** để toàn bộ 100% các nơ-ron trong mạng đều tham gia tính toán, đảm bảo kết quả dự đoán đạt độ chính xác cao nhất và nhất quán.\n"},{"id":"mod11","file":"Module_11_Experiment_Design_and_Data_Visualization.md","badge":"MODULE 11","shortTitle":"Experiment Design, Data Vis \u0026 Leakage","domain":"Exp (22%) \u0026 Data (14%)","weight":"36%","icon":"📐","content":"# Module 11: Experiment Design, Data Analysis \u0026 Visualization (Thiết kế Thực nghiệm, Phân tích \u0026 Trực quan hóa Dữ liệu)\n\n\u003e [!IMPORTANT]\n\u003e **Trọng tâm ôn tập NCA-GENL ở Module 11 (Bổ sung chuyên sâu cho 2 Miền trọng số lớn: \"Experimentation - 22%\" \u0026 \"Data Analysis \u0026 Visualization - 14%\"):**\n\u003e Nắm vững các nguyên tắc **Thiết kế thực nghiệm khoa học (Experiment Design)**: giả thuyết ($H_0, H_1$), biến độc lập/phụ thuộc/gây nhiễu, nhóm đối chứng (Control vs. Treatment), mô hình cơ sở (Baseline), ngẫu nhiên hóa, phân tầng (Stratification), nghiên cứu cắt bỏ (**Ablation Study**), tinh chỉnh siêu tham số và **tính tái lập (Reproducibility)**; làm chủ **Phân tích \u0026 Trực quan hóa dữ liệu (Data Analysis \u0026 Visualization)**: thống kê mô tả (Mean vs. Median, IQR, Percentiles), cơ chế khuyết dữ liệu (MCAR, MAR, MNAR), cách chọn và đọc hiểu biểu đồ (**Histogram, Box Plot, Scatter Plot, Confusion Matrix, ROC vs. PR Curve**), phân biệt **Tương quan vs. Nhân quả (Correlation vs. Causation)**; và nắm vững các quy tắc **Phòng chống Rò rỉ Dữ liệu (Data Leakage Prevention)** trong tiền xử lý, Cross-Validation, SMOTE, chia tách theo thời gian (Temporal Split) và đánh giá LLM.\n\n---\n\n## 1. Thiết kế Thực nghiệm Khoa học trong AI/ML \u0026 LLM (Experiment Design)\n\nTrong kỳ thi NCA-GENL, miền **Experimentation (22%)** kiểm tra xem kỹ sư có biết cách thiết lập một thí nghiệm công bằng, có kiểm soát và có khả năng tái lập để chứng minh một thay đổi kỹ thuật (ví dụ: đổi Prompt, thêm Reranker, hay fine-tune bằng LoRA) thực sự mang lại hiệu quả hay không.\n\n### 1.1. Các Thành phần Cốt lõi của một Thực nghiệm Có kiểm soát (Controlled Experiment)\n\n```mermaid\nflowchart LR\n    H[\"1. Giả thuyết (Hypothesis)\u003cbr/\u003e• H₀ (Null): Thay đổi không tạo khác biệt\u003cbr/\u003e• H₁ (Alternative): Prompt/Model mới cải thiện F1/Faithfulness\"]\n    \n    Vars[\"2. Kiểm soát Biến số\u003cbr/\u003e• Biến độc lập (Independent): Thứ ta chủ động thay đổi\u003cbr/\u003e• Biến phụ thuộc (Dependent): Metric đo lường đầu ra\u003cbr/\u003e• Biến hằng định (Controlled): Giữ cố định để tránh nhiễu\"]\n    \n    Split[\"3. Chia nhóm \u0026 Baseline\u003cbr/\u003e• Control Group / Baseline (Hệ thống hiện tại)\u003cbr/\u003e• Treatment Group (Hệ thống áp dụng thay đổi)\u003cbr/\u003e• Randomization \u0026 Stratification\"]\n    \n    Eval[\"4. Phân tích \u0026 Kết luận\u003cbr/\u003e• Kiểm định ý nghĩa thống kê \u0026 Khoảng tin cậy\u003cbr/\u003e• Đánh giá ý nghĩa thực tiễn (Latency, Cost)\u003cbr/\u003e• Đảm bảo tính tái lập (Reproducibility)\"]\n\n    H ==\u003e Vars ==\u003e Split ==\u003e Eval\n```\n\n| Khái niệm Thực nghiệm | Bản chất Kỹ thuật | Ví dụ Thực tế trong Dự án LLM / RAG |\n| :--- | :--- | :--- |\n| **1. Null Hypothesis ($H_0$) vs. Alternative Hypothesis ($H_1$)** | • **$H_0$ (Giả thuyết không):** Không có sự khác biệt thực sự giữa phương pháp mới và phương pháp cũ (mọi chênh lệch nhỏ quan sát được chỉ do ngẫu nhiên mẫu).\u003cbr/\u003e• **$H_1$ (Giả thuyết đối):** Phương pháp mới tạo ra sự cải thiện có ý nghĩa so với phương pháp cũ. | • $H_0$: Thêm Cross-Encoder Reranker không làm thay đổi điểm `Recall@3` so với chỉ dùng Vector Search.\u003cbr/\u003e• $H_1$: Thêm Cross-Encoder Reranker làm tăng `Recall@3` trên tập kiểm thử. |\n| **2. Independent Variable (Biến độc lập / Yếu tố can thiệp)** | Biến số mà người làm thí nghiệm **chủ động thay đổi** giữa các lần chạy để kiểm tra tác động của nó. *(Nguyên tắc vàng: Thay đổi từng yếu tố một - One factor at a time hoặc theo thiết kế ma trận).* | Loại Prompt Template (Zero-shot vs. Few-shot CoT), kích thước Chunk (`256` vs. `512` tokens), hoặc bậc hạng `r` của LoRA (`8` vs. `32`). |\n| **3. Dependent Variable (Biến phụ thuộc / Độ đo kết quả)** | Chỉ số đầu ra được **đo lường** để đánh giá hiệu quả của biến độc lập. | Điểm `F1-Score`, `ROUGE-L`, `Faithfulness`, độ trễ `TTFT (ms)`, hoặc tỷ lệ người dùng bấm *Thumbs-up*. |\n| **4. Confounding Variables (Biến gây nhiễu / Biến ngoại lai)** | Các yếu tố khác **vô tình thay đổi cùng lúc** với biến độc lập, làm ta không biết kết quả tốt lên là nhờ biến độc lập hay do biến gây nhiễu! | Khi so sánh **Prompt A** và **Prompt B**, kỹ sư lại vô tình chạy Prompt A trên `LLaMA-3 8B (temperature=0.7)` và chạy Prompt B trên `LLaMA-3 70B (temperature=0.0)` $\\to$ **Kích thước model và temperature là biến gây nhiễu làm hỏng kết luận thí nghiệm!** |\n| **5. Baseline \u0026 Control Group (Mô hình cơ sở \u0026 Nhóm đối chứng)** | Điểm mốc tham chiếu ban đầu (thường là hệ thống đang chạy hiện tại, một quy tắc heuristic đơn giản, hoặc mô hình Zero-shot chưa tinh chỉnh) để so sánh với nhóm thử nghiệm (**Treatment Group**). | Trước khi đầu tư 2 tuần Fine-tune LLM, phải đo điểm của **Zero-shot / Few-shot Prompt Baseline** trên cùng tập Test Set. |\n\n---\n\n### 1.2. Tình huống Thực tiễn: Làm sao để So sánh Công bằng 2 Prompt hoặc 2 Mô hình LLM?\n\u003e [!TIP]\n\u003e **Tình huống thường gặp trong thiết kế thí nghiệm LLM:**\n\u003e Giả sử một kỹ sư muốn kiểm chứng xem **Prompt Template B (có hướng dẫn Chain-of-Thought)** có giúp trích xuất thông tin hợp đồng chính xác hơn **Prompt Template A (Zero-shot)** hay không. Để kết luận sự khác biệt quan sát được thực sự là do Prompt, kỹ sư phải **giữ cố định (hold constant) hoặc ghi nhận đầy đủ** các điều kiện sau:\n\u003e 1. **Cùng một phiên bản mô hình (Exact Model Checkpoint/Version):** Ví dụ cùng chạy trên `meta/llama-3.1-8b-instruct` (cùng mức lượng tử hóa `BF16` hoặc `FP8`).\n\u003e 2. **Cùng một bộ dữ liệu kiểm thử (Identical Evaluation Dataset):** Chạy trên cùng tập câu hỏi/hợp đồng đại diện (có phân tầng theo độ khó/loại hợp đồng).\n\u003e 3. **Cùng bộ tham số giải mã (Decoding Parameters):** Giữ nguyên `temperature`, `top_p`, `max_tokens`, `seed`.\n\u003e 4. **Cùng tiêu chí và công cụ chấm điểm (Evaluation Rubric / Judge):** Dùng cùng một hàm đo (`Exact Match`, `F1`) hoặc cùng một phiên bản LLM-as-a-Judge với rubric chấm điểm ẩn danh (Blind evaluation).\n\n---\n\n### 1.3. Ablation Study (Nghiên cứu Cắt bỏ Thành phần) \u0026 Tinh chỉnh Siêu tham số\n1. **Ablation Study (Nghiên cứu cắt bỏ):**\n   * Khi một hệ thống AI phức tạp gồm nhiều mô-đun ghép lại (ví dụ: `Hybrid Search` + `Chunk Overlap 15%` + `Cross-Encoder Reranker` + `Few-shot Prompt`), làm sao biết thành phần nào thực sự đóng góp vào độ chính xác và thành phần nào chỉ làm tăng độ trễ vô ích?\n   * **Cách thực hiện:** Kỹ sư **loại bỏ (hoặc tắt) từng thành phần một** trong khi giữ nguyên phần còn lại, rồi đo lại sự sụt giảm của Metric:\n     * *Full System:* `Recall@5 = 91%`, `Latency = 420 ms`.\n     * *Bỏ Reranker:* `Recall@5` tụt xuống `76%` $\\to$ Chứng tỏ Reranker đóng góp rất lớn (+15%).\n     * *Bỏ BM25 (chỉ dùng Dense Vector):* `Recall@5` tụt xuống `83%` $\\to$ Hybrid Search đóng góp +8%.\n2. **Chiến lược Tìm kiếm Siêu tham số (Hyperparameter Tuning Strategies):**\n   * **Grid Search (Tìm kiếm lưới vét cạn):** Thử tất cả mọi tổ hợp có thể trên một lưới giá trị định sẵn (ví dụ 4 mức Learning Rate $\\times$ 3 mức Batch Size $\\times$ 3 mức Weight Decay = 36 lần chạy). *Nhược điểm:* Bùng nổ tổ hợp khi số siêu tham số lớn.\n   * **Random Search (Tìm kiếm ngẫu nhiên):** Lấy mẫu ngẫu nhiên các tổ hợp siêu tham số trong không gian tìm kiếm. Thường hiệu quả hơn Grid Search trong cùng một ngân sách tính toán khi chỉ có một vài siêu tham số (như Learning Rate) ảnh hưởng mạnh nhất đến kết quả.\n   * **Bayesian Optimization (Tối ưu hóa Bayes - ví dụ Optuna, Ray Tune):** Xây dựng mô hình xác suất dự đoán vùng siêu tham số hứa hẹn dựa trên kết quả của các lần chạy trước để chọn cấu hình thử nghiệm tiếp theo thông minh hơn.\n3. **Diễn giải Kết quả Thực nghiệm (Statistical vs. Practical Significance):**\n   * **Ý nghĩa thống kê (Statistical Significance):** Liệu mức tăng `+0.8%` F1-Score có lớn hơn sai số ngẫu nhiên của phép lấy mẫu không (kiểm tra qua độ lệch chuẩn giữa các folds, khoảng tin cậy 95% - Confidence Interval, hoặc kiểm định giả thuyết như *Paired Bootstrap / McNemar\u0027s test*)?\n   * **Ý nghĩa thực tiễn (Practical / Engineering Significance):** Nếu Mô hình B tăng `+0.3%` độ chính xác so với Mô hình A nhưng làm độ trễ `TPOT` tăng gấp 4 lần và chi phí GPU tăng gấp 3 lần, thì xét về mặt kỹ thuật hệ thống, Mô hình A vẫn có thể là lựa chọn tối ưu hơn.\n\n---\n\n### 1.4. Tính Tái lập trong Thực nghiệm Học sâu (Reproducibility)\nMột thí nghiệm khoa học chỉ có giá trị khi người khác (hoặc chính bạn sau 3 tháng) chạy lại cùng đoạn code trên cùng dữ liệu và thu được kết quả nhất quán (Tham khảo: [PyTorch Reproducibility Guidance](https://docs.pytorch.org/docs/stable/notes/randomness.html)):\n* **Các nguồn gây ngẫu nhiên cần kiểm soát:** Khởi tạo trọng số ngẫu nhiên (Weight initialization), thứ tự xáo trộn dữ liệu (DataLoader shuffling), lớp Dropout, lấy mẫu sinh token (`temperature \u003e 0`), và các phép cộng dấu phẩy động bất định (non-deterministic atomic operations) trong một số CUDA kernels.\n* **Thực hành chuẩn trong Python / PyTorch:**\n\n```python\nimport os\nimport random\nimport numpy as np\nimport torch\n\ndef set_reproducible_seed(seed: int = 42) -\u003e None:\n    os.environ[\"PYTHONHASHSEED\"] = str(seed)\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n    # Bật chế độ thuật toán xác định (lưu ý: có thể làm giảm nhẹ tốc độ trên một số CUDA ops)\n    torch.backends.cudnn.deterministic = True\n    torch.backends.cudnn.benchmark = False\n    torch.use_deterministic_algorithms(True, warn_only=True)\n```\n\n---\n\n## 2. Phân tích \u0026 Trực quan hóa Dữ liệu (Data Analysis \u0026 Visualization)\n\nMiền **Data Analysis \u0026 Visualization (14%)** yêu cầu kỹ sư hiểu rõ đặc tính thống kê của tập dữ liệu, chọn đúng loại biểu đồ cho từng câu hỏi phân tích và tránh các ngộ nhận thống kê.\n\n### 2.1. Thống kê Mô tả (Descriptive Statistics) \u0026 Khi nào dùng Mean vs. Median?\n| Đại lượng thống kê | Công thức / Định nghĩa | Khi nào sử dụng \u0026 Lưu ý thực chiến |\n| :--- | :--- | :--- |\n| **1. Mean (Trung bình cộng)** | $$\\mu = \\frac{1}{n}\\sum_{i=1}^n x_i$$ | Phù hợp khi dữ liệu có **phân phối đối xứng / phân phối chuẩn (Normal Distribution)** và không có điểm dị biệt lớn. \u003cbr/\u003e⚠️ **Nhược điểm:** Rất nhạy cảm với **Outliers (Điểm ngoại lai)** (VD: 9 khách hàng thu nhập 15 triệu, 1 tỷ phú thu nhập 1.000 tỷ $\\to$ Mean bị kéo vọt lên ~100 tỷ, không còn đại diện cho nhóm khách hàng!). |\n| **2. Median (Trung vị - Phân vị thứ 50 / $P_{50}$)** | Giá trị nằm ở chính giữa khi sắp xếp dữ liệu theo thứ tự tăng dần | **Thước đo xu hướng trung tâm bền vững (Robust) trước Outliers và phân phối lệch (Skewed Distributions)**! Luôn dùng Median (kèm $P_{90}, P_{95}, P_{99}$) khi báo cáo **Thu nhập, Giá nhà, Độ dài văn bản token, hoặc Độ trễ API (Latency)**. |\n| **3. Variance ($\\sigma^2$) \u0026 Standard Deviation ($\\sigma$ - Độ lệch chuẩn)** | $$\\sigma = \\sqrt{\\frac{1}{n}\\sum_{i=1}^n (x_i - \\mu)^2}$$ | Đo mức độ phân tán của dữ liệu quanh giá trị Mean (cùng đơn vị đo với dữ liệu gốc). Đi cặp với **Mean** cho phân phối chuẩn. |\n| **4. IQR (Interquartile Range - Khoảng tứ phân vị)** | $$\\text{IQR} = Q_3 (P_{75}) - Q_1 (P_{25})$$ | Độ rộng của 50% dữ liệu nằm ở phần giữa. Đi cặp với **Median** để mô tả mức độ phân tán trên dữ liệu bị lệch và dùng để xác định ngưỡng Outliers ($\u003c Q_1 - 1.5\\text{ IQR}$ hoặc $\u003e Q_3 + 1.5\\text{ IQR}$). |\n\n### 2.2. Ba Cơ chế Khuyết thiếu Dữ liệu (Missing Data Mechanisms)\nTrước khi quyết định xóa dòng (`dropna`) hay điền khuyết (`Imputation`), cần hiểu tại sao dữ liệu bị khuyết:\n1. **MCAR (Missing Completely at Random - Khuyết hoàn toàn ngẫu nhiên):** Việc một giá trị bị thiếu hoàn toàn độc lập với mọi biến số (ví dụ: mẫu xét nghiệm bị rơi vỡ ngẫu nhiên trong phòng thí nghiệm). Xóa dòng ít gây chệch (bias) nhưng làm giảm cỡ mẫu.\n2. **MAR (Missing at Random - Khuyết ngẫu nhiên có điều kiện):** Xác suất bị khuyết phụ thuộc vào các biến **đã quan sát được** khác (ví dụ: nhân viên trẻ tuổi thường ít điền mục \"Số năm kinh nghiệm quản lý\" hơn nhân viên lớn tuổi). Có thể điền khuyết hiệu quả dựa trên các cột liên quan (k-NN Imputer / Iterative Imputer).\n3. **MNAR (Missing Not at Random - Khuyết không ngẫu nhiên / Có chủ đích):** Xác suất bị khuyết phụ thuộc trực tiếp vào **chính giá trị đang bị giấu đi** (ví dụ: người có thu nhập cực cao hoặc nợ xấu thường cố tình bỏ trống ô \"Thu nhập\" / \"Dư nợ\"). Nếu chỉ xóa dòng hoặc điền Mean đơn giản sẽ gây **sai lệch chọn mẫu (Selection Bias)** nghiêm trọng; thường nên tạo thêm một cột cờ nhị phân (`is_income_missing = 1`) để mô hình biết việc bỏ trống đó mang thông tin!\n\n---\n\n### 2.3. Hướng dẫn Chọn và Đọc hiểu Biểu đồ (Data Visualization Taxonomy)\n\n```mermaid\nflowchart TD\n    Goal[\"Mục tiêu Phân tích \u0026 Trực quan hóa Dữ liệu\"]\n    \n    subgraph G1[\"1. Phân phối của 1 Biến số (Univariate Distribution)\"]\n        H[\"📊 Histogram / KDE Plot:\u003cbr/\u003eXem hình dáng phân phối (Chuẩn, Lệch phải/trái, Đa đỉnh)\u003cbr/\u003eKiểm tra phân bố độ dài Token của tập Prompt\"]\n        B[\"📦 Box Plot / Violin Plot:\u003cbr/\u003eTóm tắt 5 thông số (Min, Q1, Median, Q3, Max)\u003cbr/\u003eSo sánh phân phối \u0026 phát hiện Outliers giữa nhiều nhóm\"]\n    end\n\n    subgraph G2[\"2. Mối quan hệ giữa 2 hay nhiều Biến (Bivariate / Multivariate)\"]\n        S[\"📈 Scatter Plot (Biểu đồ phân tán):\u003cbr/\u003eQuan sát tương quan tuyến tính / phi tuyến, cụm dữ liệu\u003cbr/\u003ehoặc trực quan hóa không gian Embedding 2D (PCA/UMAP)\"]\n        HM[\"🟧 Heatmap / Correlation Matrix:\u003cbr/\u003eHiển thị ma trận hệ số tương quan giữa hàng chục biến\u003cbr/\u003ehoặc ma trận trọng số Attention / Confusion Matrix\"]\n    end\n\n    subgraph G3[\"3. Đánh giá Mô hình Phân loại (Model Evaluation Curves)\"]\n        ROC[\"📉 ROC Curve (TPR theo FPR):\u003cbr/\u003eĐánh giá tổng quát qua mọi ngưỡng cắt;\u003cbr/\u003edễ quá lạc quan khi lớp âm tính (TN) quá lớn\"]\n        PR[\"🎯 Precision-Recall (PR) Curve:\u003cbr/\u003eTập trung trực tiếp vào lớp Dương tính (Positive);\u003cbr/\u003ebản đồ chuẩn xác nhất khi dữ liệu mất cân bằng nặng!\"]\n    end\n\n    Goal --\u003e G1 \u0026 G2 \u0026 G3\n```\n\n| Loại Biểu đồ | Dùng để trả lời câu hỏi gì? | Bẫy đọc hiểu biểu đồ cần tránh |\n| :--- | :--- | :--- |\n| **1. Histogram (Biểu đồ tần suất cột liền)** | Biến số liên tục (như độ dài văn bản, độ tuổi, thu nhập) phân bố đối xứng hay bị lệch về một phía (**Right-skewed / Long-tailed**)? Có mấy đỉnh (**Bimodal/Multimodal**)? | Chọn số lượng khoảng chia (`bins`) quá ít làm mất chi tiết đa đỉnh, hoặc quá nhiều làm biểu đồ răng cưa nhiễu. |\n| **2. Box Plot (Biểu đồ hộp \u0026 râu)** | Trung vị (**Median** - vạch giữa hộp), độ phân tán (**IQR** - chiều dài hộp) và các **điểm ngoại lai (Outliers** - các chấm tròn nằm ngoài 2 đầu râu) giữa các nhóm khác nhau như thế nào? | Box Plot không hiển thị rõ được nếu dữ liệu bên trong hộp có 2 đỉnh tách biệt (khi đó nên dùng kèm **Violin Plot** hoặc **Histogram**). |\n| **3. Scatter Plot (Biểu đồ phân tán XY)** | Hai biến liên tục có tương quan dương, tương quan âm, quan hệ phi tuyến (hình parabol/logarit) hay tách thành các cụm rời nhau? | **Correlation $\\neq$ Causation:** Thấy hai biến tăng cùng nhau trên Scatter Plot không chứng minh biến X là nguyên nhân gây ra biến Y! |\n| **4. ROC Curve vs. Precision-Recall (PR) Curve** | Khi thay đổi ngưỡng xác suất (Classification Threshold từ $0.0 \\to 1.0$), sự đánh đổi giữa khả năng bắt trúng và báo động giả diễn ra như thế nào? | Trên tập dữ liệu **cực kỳ mất cân bằng** (ví dụ: 99% Negative, 1% Positive), vì mẫu số $TN$ trong $\\text{FPR} = \\frac{FP}{FP+TN}$ quá khổng lồ nên FPR vẫn rất nhỏ ngay cả khi có hàng nghìn báo động giả ($FP$). Khi đó, **PR Curve (Precision vs. Recall)** phản ánh hiệu năng thực tế trên lớp hiếm trung thực hơn nhiều so với ROC Curve! |\n\n---\n\n### 2.4. Ngộ nhận Thống kê: Tương quan vs. Nhân quả \u0026 Nghịch lý Simpson\n1. **Tương quan không đồng nghĩa với Nhân quả (Correlation Does Not Imply Causation):**\n   * *Ví dụ kinh điển:* Dữ liệu thống kê cho thấy doanh số bán kem ($X$) có hệ số tương quan dương rất mạnh ($r = 0.85$) với số vụ cháy rừng hoặc đuối nước ($Y$). Tuy nhiên, ăn kem không gây cháy rừng! Cả hai đều bị chi phối bởi một **biến gây nhiễu thứ ba (Confounding variable $Z$)** là **Nhiệt độ mùa hè nắng nóng**.\n   * Muốn kết luận **Nhân quả (Causality)**, không thể chỉ nhìn hệ số tương quan thụ động mà cần thực hiện **Thực nghiệm có đối chứng ngẫu nhiên (Randomized Controlled Trial / A/B Testing)** hoặc phân tích nhân quả có kiểm soát biến gây nhiễu.\n2. **Nghịch lý Simpson (Simpson\u0027s Paradox) \u0026 Lỗi gộp trung bình (Aggregation Fallacy):**\n   * Một xu hướng xuất hiện khi gộp chung toàn bộ dữ liệu có thể **biến mất hoặc đảo chiều hoàn toàn** khi ta tách dữ liệu ra theo từng nhóm con (Subgroups / Slices)!\n   * *Ứng dụng trong đánh giá AI:* Một mô hình LLM có điểm trung bình toàn cục tăng nhẹ từ `82%` lên `83%`, nhưng khi phân tách theo ngôn ngữ (Slice-based evaluation), độ chính xác trên tiếng Anh tăng `+3%` trong khi độ chính xác trên tiếng Việt tụt `-15%`! Do đó, luôn phải phân tích kết quả theo **từng lát cắt dữ liệu quan trọng (Data Slices / Subpopulations)**.\n\n---\n\n## 3. Phòng chống Rò rỉ Dữ liệu \u0026 Quy trình Tiền xử lý Chuẩn (Data Leakage Prevention)\n\n**Data Leakage (Rò rỉ dữ liệu)** xảy ra khi thông tin từ tập Validation/Test hoặc thông tin từ tương lai (mà mô hình không thể biết tại thời điểm dự đoán thực tế) vô tình lọt vào quá trình huấn luyện hoặc chọn đặc trưng. Hệ quả là mô hình đạt điểm cực cao trong lúc thử nghiệm nhưng thất bại nặng nề khi đưa lên Production (Tham khảo: [scikit-learn Common Pitfalls](https://scikit-learn.org/stable/common_pitfalls.html)).\n\n### 3.1. Bốn Tình huống Rò rỉ Dữ liệu Phổ biến nhất và Cách Khắc phục\n\n```mermaid\nflowchart TD\n    subgraph Wrong[\"❌ CÁCH LÀM SAI (Gây Data Leakage - Điểm Test ảo)\"]\n        W1[\"1. Gọi scaler.fit_transform(X_all) hoặc PCA/TF-IDF\u003cbr/\u003etrên TOÀN BỘ dữ liệu trước khi chia Train/Test\"]\n        W2[\"2. Chạy SMOTE (Oversampling) trên toàn bộ dữ liệu\u003cbr/\u003erồi mới chia k-Fold Cross-Validation\"]\n        W3[\"3. Chia ngẫu nhiên (Random Split) cho dữ liệu Chuỗi thời gian\u003cbr/\u003e(Dùng giá cổ phiếu ngày mai để train đoán ngày hôm qua!)\"]\n        \n        W1 --\u003e W2 --\u003e W3\n    end\n\n    subgraph Right[\"✅ CÁCH LÀM CHUẨN (Chống Data Leakage đúng quy trình)\"]\n        R1[\"1. Chia tách Train / Val / Test TRƯỚC TIÊN\u003cbr/\u003e(Dùng Time-based Split cho thời gian, Group Split cho thực thể)\"]\n        R2[\"2. Chỉ gọi scaler.fit(X_train) trên tập Train;\u003cbr/\u003eáp dụng scaler.transform(X_val) và scaler.transform(X_test)\"]\n        R3[\"3. Đặt Imputer, Scaler, SMOTE và Model vào trong 1 Pipeline\u003cbr/\u003eđể mỗi Fold trong Cross-Validation tự fit độc lập!\"]\n        \n        R1 --\u003e R2 --\u003e R3\n    end\n```\n\n| Lỗi Data Leakage thường gặp | Tại sao lại gây rò rỉ thông tin? | Quy tắc chuẩn để phòng tránh |\n| :--- | :--- | :--- |\n| **1. Tiền xử lý trước khi chia tách (Preprocessing before Splitting)** | Nếu tính Mean/Std (`StandardScaler`), Min/Max, điền khuyết (`Imputer`), chọn đặc trưng hay `TfidfVectorizer` trên toàn bộ dataset trước khi split, phân phối của tập Test đã bị trộn vào tham số của tập Train. | **Split trước, Fit sau:** Chỉ gọi `.fit()` (hoặc `.fit_transform()`) trên `X_train`; với `X_val` và `X_test` chỉ được gọi **`.transform()`**. |\n| **2. Áp dụng SMOTE trước Cross-Validation** | Nếu nhân bản hoặc nội suy mẫu bằng SMOTE trước khi chia k-Fold, các điểm dữ liệu tổng hợp (nội suy trực tiếp từ điểm gốc) sẽ nằm ở cả Train Fold và Validation Fold $\\to$ Mô hình chỉ việc nhớ điểm láng giềng sát vách! | Chỉ áp dụng SMOTE **bên trong tập huấn luyện của từng Fold** (sử dụng `imblearn.pipeline.Pipeline`), giữ nguyên phân phối gốc của Validation/Test Fold. |\n| **3. Chia ngẫu nhiên trên dữ liệu Chuỗi thời gian hoặc Nhóm thực thể (Temporal \u0026 Group Leakage)** | • Với chuỗi thời gian (Time-series / Logs): Random split cho phép mô hình học các sự kiện ở tháng 12 để dự đoán tháng 6.\u003cbr/\u003e• Với dữ liệu y tế/khách hàng: Cùng 1 bệnh nhân có 10 ảnh X-quang nằm ở cả Train và Test $\\to$ Mô hình nhớ giải phẫu riêng của bệnh nhân đó thay vì học triệu chứng bệnh. | • Dùng **Time-based Split (`TimeSeriesSplit`)**: Tập Train luôn nằm ở quá khứ ($t \u003c T_0$), tập Test nằm ở tương lai ($t \\ge T_0$).\u003cbr/\u003e• Dùng **Group Split (`GroupKFold`)**: Đảm bảo mọi mẫu của cùng một `user_id` / `patient_id` chỉ nằm trọn ở Train hoặc chỉ nằm ở Test. |\n| **4. Rò rỉ đặc trưng tương lai (Target / Future Feature Leakage) \u0026 Nhiễm bẩn Benchmark LLM** | • Đưa cột `\"ngày thanh toán thực tế\"` vào làm đặc trưng để dự đoán `\"khách có trả nợ đúng hạn không\"`.\u003cbr/\u003e• Tập dữ liệu Pre-training của LLM vô tình chứa sẵn các câu hỏi và đáp án của bộ đề thi MMLU/GSM8K (**Train-Test Contamination**). | • Loại bỏ mọi cột đặc trưng được sinh ra *sau* thời điểm ra quyết định.\u003cbr/\u003e• Thực hiện **Exact \u0026 Fuzzy Deduplication (n-gram / MinHash decontamination)** giữa tập dữ liệu huấn luyện và các bộ Benchmark kiểm thử. |\n\n### 3.2. Minh họa Code Python Chuẩn Chống Data Leakage với `scikit-learn Pipeline`\n```python\nfrom sklearn.model_selection import StratifiedKFold, cross_val_score, train_test_split\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.pipeline import Pipeline\n\n# 1. Tách riêng tập Test Set ngay từ đầu trước mọi bước xử lý\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.2, stratify=y, random_state=42\n)\n\n# 2. Đóng gói toàn bộ bước tiền xử lý và mô hình vào Pipeline\n# Khi chạy Cross-Validation, Pipeline đảm bảo Imputer và Scaler CHỈ .fit() trên phần Train của mỗi Fold!\nclf_pipeline = Pipeline([\n    (\"imputer\", SimpleImputer(strategy=\"median\")),\n    (\"scaler\", StandardScaler()),\n    (\"classifier\", LogisticRegression(class_weight=\"balanced\", random_state=42))\n])\n\ncv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\ncv_f1_scores = cross_val_score(clf_pipeline, X_train, y_train, cv=cv, scoring=\"f1\")\n\n# 3. Huấn luyện trên toàn bộ X_train và đánh giá cuối cùng trên X_test\nclf_pipeline.fit(X_train, y_train)\ntest_predictions = clf_pipeline.predict(X_test)\n```\n\n---\n\n## 4. Lưu ý Ôn tập \u0026 Câu hỏi Luyện tập Minh họa (Review Notes \u0026 Practice Quiz)\n\n\u003e [!WARNING]\n\u003e **Các điểm cần lưu ý ở Module 11:**\n\u003e 1. **Kiểm soát biến trong thí nghiệm (Controlled Experiments):** Khi muốn đánh giá tác động của một thay đổi (như Prompt mới, mô hình Embedding mới), phải giữ cố định các biến khác (model version, decoding parameters, test set, rubric) để tránh **Confounding Variables**.\n\u003e 2. **Ablation Study:** Gỡ bỏ từng thành phần của hệ thống phức tạp để đo lường đóng góp thực tế của mỗi thành phần vào hiệu năng tổng thể.\n\u003e 3. **Mean vs. Median \u0026 ROC vs. PR Curve:** Dùng **Median \u0026 IQR** khi dữ liệu lệch (skewed) hoặc có **Outliers**. Dùng **Precision-Recall (PR) Curve** khi đánh giá lớp dương tính cực kỳ hiếm.\n\u003e 4. **Phòng chống Data Leakage:** Luôn chia tách dữ liệu trước, chỉ `fit` bộ tiền xử lý và áp dụng `SMOTE` trên tập huấn luyện (training split/fold).\n\n### Câu hỏi luyện tập minh họa (Mini Quiz):\n1. **Câu 1:** Một kỹ sư muốn kiểm nghiệm xem việc chuyển từ kỹ thuật Zero-shot Prompting sang Few-shot Prompting có giúp cải thiện độ chính xác phân loại ticket hỗ trợ khách hàng hay không. Trong khi thử nghiệm, kỹ sư chạy Zero-shot trên mô hình 8B với `temperature=0.7` và chạy Few-shot trên mô hình 70B với `temperature=0.0`. Thiết kế thí nghiệm này mắc lỗi phương pháp luận gì?\n   * *Đáp án:* Mắc lỗi **Biến gây nhiễu (Confounding Variables)** do thay đổi đồng thời nhiều yếu tố (cả kích thước mô hình, tham số `temperature` và kỹ thuật Prompting). Để thí nghiệm hợp lệ, phải giữ cố định mô hình, tham số giải mã và tập dữ liệu kiểm thử, chỉ thay đổi duy nhất Prompt.\n2. **Câu 2:** Khi phân tích độ trễ phản hồi (Latency) của một dịch vụ suy luận LLM, kỹ sư nhận thấy 95% request phản hồi trong khoảng `150–300 ms`, nhưng có 5% request phức tạp kéo dài tới `8.000 ms` (phân phối lệch phải mạnh / có Outliers). Đại lượng thống kê và biểu đồ nào phù hợp nhất để báo cáo xu hướng trung tâm và sự phân tán của độ trễ?\n   * *Đáp án:* Sử dụng **Trung vị (Median / $P_{50}$)** kết hợp các phân vị cao (**$P_{95}, P_{99}$** và **IQR**) thay vì chỉ dùng Mean, đồng thời trực quan hóa bằng **Histogram** hoặc **Box Plot**.\n3. **Câu 3:** Một nhà khoa học dữ liệu chuẩn hóa toàn bộ tập dữ liệu bằng `StandardScaler().fit_transform(X)` và tạo thêm mẫu thiểu số bằng `SMOTE().fit_resample(X, y)`, sau đó mới dùng `train_test_split` để chia ra tập Train và tập Test. Tại sao điểm số trên tập Test thu được lại cao bất thường nhưng mô hình chạy thực tế lại kém?\n   * *Đáp án:* Do lỗi **Rò rỉ dữ liệu (Data Leakage)** — thông tin thống kê và các điểm nội suy của tập Test đã bị trộn lẫn vào quá trình huấn luyện. Quy trình đúng là phải chia tách Train/Test trước, sau đó chỉ `fit` bộ chuẩn hóa và chỉ chạy `SMOTE` riêng trên tập Train.\n4. **Câu 4:** Một hệ thống RAG mới được bổ sung đồng thời 3 cải tiến: *Semantic Chunking*, *Hybrid Search (BM25 + Vector)* và *Cross-Encoder Reranker*. Để biết chính xác mỗi thành phần đóng góp bao nhiêu % vào mức tăng điểm `Recall@5` và làm tăng bao nhiêu mili-giây độ trễ, kỹ sư nên thực hiện phương pháp thực nghiệm nào?\n   * *Đáp án:* Thực hiện **Nghiên cứu cắt bỏ (Ablation Study)** — lần lượt tắt từng thành phần một so với cấu hình đầy đủ và đo lường sự thay đổi của các chỉ số trên cùng tập kiểm thử.\n5. **Câu 5:** Khi đánh giá một mô hình phát hiện sự cố phần cứng hiếm gặp (chỉ chiếm `0.05%` tổng số bản ghi log), đường cong ROC-AUC đạt tới `0.98` nhưng đội ngũ vận hành lại nhận được quá nhiều cảnh báo giả (False Positives). Biểu đồ nào giúp phản ánh rõ hơn sự đánh đổi giữa tỷ lệ cảnh báo đúng và độ bao phủ trên lớp hiếm này?\n   * *Đáp án:* **Đường cong Precision-Recall (PR Curve / PR-AUC)** vì nó tập trung trực tiếp vào lớp Positive mà không bị làm mờ bởi số lượng True Negatives ($TN$) khổng lồ như FPR trong đường cong ROC.\n6. **Câu 6:** Một ngân hàng muốn huấn luyện mô hình dự đoán giao dịch gian lận cho tháng tới dựa trên dữ liệu lịch sử giao dịch từ tháng 1 đến tháng 10. Phương pháp chia tách dữ liệu nào phù hợp nhất để đánh giá khả năng dự báo thực tế và tránh rò rỉ thông tin từ tương lai?\n   * *Đáp án:* **Chia tách theo thời gian (Time-based / Temporal Split)** — dùng dữ liệu các tháng trước (ví dụ tháng 1–8) làm tập Train, tháng 9 làm Validation và tháng 10 làm tập Test, không dùng Random Split xáo trộn thời gian.\n"},{"id":"exam","file":"NCA_GENL_Exam_Guide_and_Tips.md","badge":"ĐỀ THI \u0026 MẸO","shortTitle":"Chiến thuật \u0026 Đề Luyện Tập (30 + 50 Câu)","domain":"All 5 Domains","weight":"Mock Exam","icon":"🏆","content":"# NVIDIA Certified Associate (NCA-GENL): Cẩm nang Ôn thi, Bảng Tổng hợp \u0026 Đề Luyện Tập Thực Chiến (30 Câu + 50 Câu Định Giờ)\n\n\u003e [!IMPORTANT]\n\u003e Tài liệu này là **\"Bản đồ Tác chiến Giờ chót (Last-Minute Master Cheat Sheet)\"** kết hợp với **10 Bảng Phản xạ Nhanh**, **Bộ 30 Câu Hỏi Luyện Tập Nhanh (30-Question NCA-GENL Practice Test - Short Mock Exam)** và **Đề Thi Thử Định Giờ 50 Câu Theo Tỷ Trọng Blueprint (50-Question Timed Practice Exam - 60 Minutes)** bám sát cấu trúc [Official NVIDIA NCA-GENL Study Guide](https://www.nvidia.com/content/dam/en-zz/Solutions/training/certification/Associate-Generative-AI-LLMs-Study-Guide.pdf).\n\n---\n\n## 1. Cấu trúc Kỳ thi, Chiến thuật Phân bổ Thời gian \u0026 5 Miền Kiến thức Chính thức\n\n\u003e [!NOTE]\n\u003e **Lưu ý về thông số số lượng câu hỏi trên trang chứng chỉ NVIDIA:** Trang [NVIDIA Generative AI LLMs Associate Certification](https://www.nvidia.com/en-us/learn/certification/generative-ai-llm-associate/) hiện hiển thị **50 câu hỏi** ở bảng tóm tắt tổng quan đầu trang (*50 questions / 60 minutes*) và ghi **50–60 câu hỏi trắc nghiệm** ở phần mô tả chi tiết phía dưới (*includes 50-60 multiple-choice questions to be completed in 60 minutes*). Hãy luyện tốc độ phân bổ thời gian khoảng **1 phút / câu** để chủ động trong cả hai trường hợp.\n\n```mermaid\nflowchart LR\n    subgraph Exam[\"Thông số Kỳ thi NCA-GENL\"]\n        direction TB\n        I1[\"📋 Số lượng câu hỏi: 50 câu (bảng tổng quan) / 50–60 câu trắc nghiệm (mô tả chi tiết)\"]\n        I2[\"⏱️ Thời gian làm bài: 60 phút (~1 phút / câu) | Thi trực tuyến có giám thị (Online Proctored)\"]\n        I3[\"💵 Lệ phí thi: $125 USD | Ngôn ngữ: Tiếng Anh | Hiệu lực: 2 năm kể từ ngày cấp\"]\n        I4[\"🎯 Điểm cộng/trừ: Không trừ điểm câu sai (Không bỏ trống bất kỳ câu nào)\"]\n    end\n\n    subgraph Blueprint[\"5 Miền Kiến thức Chính thức (Official Blueprint Domains)\"]\n        direction TB\n        D1[\"1. Core Machine Learning \u0026 AI Knowledge: 30% (~15-18 câu)\u003cbr/\u003e(ML/DL, PCA/K-Means, Transformer, Attention Q/K/V, Tokenization, Diffusion, Activations)\"]\n        D2[\"2. Software Development: 24% (~12-14 câu)\u003cbr/\u003e(Python APIs, Hugging Face, RAG Pipeline, NVIDIA NeMo, TensorRT-LLM, Triton, NIM, ONNX)\"]\n        D3[\"3. Experimentation: 22% (~11-13 câu)\u003cbr/\u003e(Hypothesis/A-B/Ablation, Prompting, LoRA/QLoRA, Temp/Top-P, BLEU/ROUGE/F1/PPL, CV)\"]\n        D4[\"4. Data Analysis \u0026 Visualization: 14% (~7-8 câu)\u003cbr/\u003e(EDA, Outliers/IQR, Missing Data, Charts, Imbalanced Data, Data Leakage, RAPIDS, Drift)\"]\n        D5[\"5. Trustworthy AI: 10% (~5-6 câu)\u003cbr/\u003e(Hallucination, Bias, Prompt Injection, NeMo Guardrails/Colang, Confidential Computing, XAI)\"]\n    end\n\n    Exam ==\u003e Blueprint\n```\n\n### Chiến thuật Làm bài trong 60 Phút (Exam-Day Strategy):\n1. **Quy tắc 45 Giây (Pass 1):** Đọc câu hỏi từ dưới lên (đọc câu hỏi cuối cùng trước khi đọc đoạn văn tình huống dài) để bắt từ khóa. Câu nào nhận diện được ngay qua **10 Bảng Phản Xạ Nhanh** dưới đây $\\to$ Chọn ngay trong 30–45 giây.\n2. **Đánh dấu Cờ (Flag for Review - Pass 2):** Nếu gặp câu hỏi tình huống dài hoặc phân vân giữa 2 đáp án quá 60 giây, hãy chọn tạm đáp án có cơ sở kỹ thuật tốt nhất, bấm **Flag** và đi tiếp ngay để đảm bảo hoàn thành toàn bộ đề thi. Dành 10–15 phút cuối quay lại giải quyết các câu gắn cờ.\n3. **Mẹo loại trừ Đáp án Nhiễu (Distractors) thường gặp:**\n   * Đáp án nào nói *\"Triton là phần cứng GPU\"* hoặc *\"Triton dùng để huấn luyện mô hình\"* $\\to$ **Loại ngay** (Triton là phần mềm máy chủ suy luận).\n   * Đáp án nào chỉ dựa vào *\"Accuracy\"* cho bài toán dữ liệu mất cân bằng nghiêm trọng (như gian lận 1%, bệnh hiếm 2%) $\\to$ **Loại ngay** (hãy xét **Recall, Precision, F1-Score, PR-AUC** theo chi phí FP/FN).\n   * Đáp án nào chọn *\"Full Fine-Tuning\"* hoặc *\"Training from Scratch\"* khi doanh nghiệp chỉ cần tra cứu tài liệu nội bộ cập nhật thường xuyên với ngân sách thấp và cần trích dẫn nguồn $\\to$ **Ưu tiên chọn RAG!**\n\n---\n\n## 2. Mười Bảng Phản Xạ Nhanh (\"Nhìn Từ Khóa – Chọn Đáp Án Chuẩn Kỹ Thuật\")\n\n### Bảng 1: Chọn Kiến trúc Transformer \u0026 Mô hình theo Bài toán (Module 4)\n| Từ khóa bài toán trong đề thi | Kiến trúc phù hợp | Mô hình đại diện | Cơ chế cốt lõi |\n| :--- | :--- | :--- | :--- |\n| Phân loại văn bản, Phân tích cảm xúc (Sentiment), Lọc Spam, Trích xuất thực thể (**NER**), Tạo Vector Embedding \u0026 Reranker | **Encoder-only (Autoencoding)** | **BERT**, RoBERTa, DeBERTa, DistilBERT | Đọc hiểu ngữ cảnh **2 chiều (Bidirectional Self-Attention)** / Masked Language Modeling (MLM) |\n| Sinh văn bản mở, Chatbot hội thoại, Trợ lý viết Code, Suy luận logic đa bước, AI Agents | **Decoder-only (Autoregressive)** | **GPT-4**, **LLaMA 3**, Claude, Mistral, **Nemotron** | Dự đoán từ tiếp theo **1 chiều từ trái sang phải (Masked Causal Self-Attention)** |\n| **Dịch máy** giữa các ngôn ngữ (Translation), **Tóm tắt** văn bản dài thành ngắn (Abstractive Summarization) | **Encoder-Decoder (Seq2Seq)** | **T5**, **Flan-T5**, BART, mBART, NLLB | Encoder đọc hiểu toàn bộ chuỗi nguồn $\\to$ Decoder sinh chuỗi đích mới qua **Cross-Attention** |\n| Mô hình có tổng số tham số rất lớn nhưng chỉ kích hoạt một phần nhỏ tham số trên mỗi token để suy luận nhanh | **Mixture of Experts (MoE)** | **Mixtral 8x7B**, DeepSeek, GPT-4 | Mạng **Router / Gating Network** chọn kích hoạt **Top-K Experts (FFN)** cho từng token |\n\n### Bảng 2: Chọn Độ đo Đánh giá (Evaluation Metrics) theo Tác vụ (Module 5, 6 \u0026 7)\n| Tác vụ AI cần đánh giá | Độ đo (Metric) chuẩn xác | Bản chất kỹ thuật cần nhớ |\n| :--- | :--- | :--- |\n| **Dịch máy (Machine Translation)** | **BLEU** | Thiên về **Precision** (Đếm tỷ lệ cụm từ n-grams trùng khớp chính xác với bản dịch mẫu). |\n| **Tóm tắt văn bản (Text Summarization)** | **ROUGE** (ROUGE-1, ROUGE-2, ROUGE-L) | Thiên về **Recall** (Đo mức độ bao phủ, tránh bỏ sót các ý chính của văn bản gốc). |\n| **Tương đồng Embedding vs. Đánh giá RAG toàn trình** | **Cosine Similarity** (Vector) + **Recall@k, MRR, nDCG** (Retrieval) + **Faithfulness \u0026 Answer Relevance** (Generation) | **Cosine Similarity** chỉ đo độ gần giữa 2 vector nhúng; đánh giá hệ thống RAG phải đo cả chất lượng truy xuất (`Recall@k`, `MRR`, `nDCG`) lẫn độ trung thực với ngữ cảnh (**Faithfulness/Groundedness**). |\n| **Độ tự tin nội tại của LLM khi đoán từ tiếp theo** | **Perplexity (PPL)** ($= e^{\\text{Loss}}$) | Perplexity **càng thấp (Lower is better)** $\\to$ Mô hình gán xác suất càng cao cho tập văn bản kiểm thử. |\n| **Phân loại trên dữ liệu mất cân bằng (Imbalanced Data)** | **Recall, Precision, F1-Score, PR-AUC** (và **ROC-AUC** kèm lưu ý) | Không dùng **Accuracy** đơn lẻ! Sợ bắt nhầm (Spam/FP cao) $\\to$ ưu tiên **Precision**; Sợ bỏ lọt (Ung thư/Gian lận/FN cao) $\\to$ ưu tiên **Recall**; Cân bằng cả hai $\\to$ **F1-Score / PR-AUC**. |\n| **Hồi quy dự đoán số thực liên tục (Giá nhà, Doanh thu)** | **MSE, RMSE, MAE, $R^2$** | **MSE/RMSE** phạt nặng các điểm sai số lớn (Outliers); **MAE** bền vững với Outliers hơn. |\n| **Đánh giá mô hình trong quá trình Fine-Tuning** | **Validation Set Metrics / Loss** | Đo trên dữ liệu kiểm định độc lập để phát hiện sớm **Overfitting (Học vẹt)**. |\n| **Đánh giá tốc độ phục vụ LLM trên Production** | **TTFT**, **ITL / TPOT**, **Throughput** | **TTFT:** Thời gian ra chữ đầu tiên (Prefill); **TPOT:** Thời gian giữa 2 chữ liên tiếp (Decode). |\n\n### Bảng 3: Chọn Phương pháp Tùy biến Mô hình theo Ràng buộc (Module 3 \u0026 6)\n| Tình huống \u0026 Ràng buộc của Doanh nghiệp | Giải pháp Tùy biến Tối ưu | Có thay đổi Weights không? |\n| :--- | :--- | :--- |\n| Cần định hướng đầu ra nhanh nhất, chi phí thấp, chỉ cung cấp câu lệnh hoặc vài ví dụ mẫu | **Prompt Engineering** (Zero/One/Few-shot, CoT, ReAct, System Prompt) | **Không** |\n| Cần trả lời dựa trên **tài liệu nội bộ cập nhật liên tục**, giảm ảo giác, có **trích dẫn nguồn**, chi phí thấp | **RAG (Retrieval-Augmented Generation)** + Vector DB + Chunking Overlap + Reranker | **Không** |\n| Cần dạy mô hình **thuật ngữ chuyên ngành sâu**, thay đổi hẳn văn phong/cấu trúc đầu ra trên dữ liệu gán nhãn với ít VRAM | **PEFT: LoRA** (Đóng băng mô hình gốc $W_0$, chỉ train ma trận hạng thấp $A \\times B$) | **Có** (Chỉ train một phần nhỏ tham số, thường từ một phần nhỏ của $1\\%$ đến vài $\\%$ tùy `r` và `target_modules`) |\n| Giống LoRA nhưng chỉ có 1 GPU nhỏ, cần **nén thêm mô hình gốc xuống chuẩn 4-bit (`NF4`)** | **QLoRA (Quantized LoRA)** | **Có** (Huấn luyện Adapter trên nền mô hình gốc 4-bit) |\n| Cần căn chỉnh LLM theo sở thích con người (Chosen vs Rejected) **mà không cần huấn luyện Reward Model riêng** | **DPO (Direct Preference Optimization)** (Thay thế gọn nhẹ cho RLHF + PPO) | **Có** |\n| Cần truyền dạy tri thức từ một LLM lớn sang một **SLM nhỏ gọn** để chạy nhanh trên điện thoại/Edge | **Knowledge Distillation** (Mô hình **Teacher $\\to$ Student**) | **Có** (Huấn luyện Student) |\n\n### Bảng 4: Ánh xạ Thư viện CPU sang GPU với NVIDIA RAPIDS (Module 8)\n| Tác vụ Khoa học Dữ liệu | Thư viện CPU | Thư viện GPU NVIDIA RAPIDS |\n| :--- | :--- | :--- |\n| Xử lý bảng dữ liệu **DataFrame** (lọc, ghép nối, nhóm, Regex) | `Pandas` | **`cuDF`** |\n| Tính toán mảng đa chiều \u0026 đại số tuyến tính | `NumPy` | **`cuPy`** |\n| Đọc/Ghi file CSV, Parquet, JSON trực tiếp vào VRAM | `PyArrow` / `Pandas I/O` | **`cuIO`** |\n| Thuật toán Machine Learning cổ điển (K-Means, Random Forest, PCA, Regression) | `Scikit-learn` | **`cuML`** |\n| Phân tích đồ thị mạng lưới quy mô lớn (PageRank, đường đi ngắn nhất) | `NetworkX` | **`cuGraph`** |\n| Tìm kiếm Vector tương đồng tốc độ cao cho Vector DB / RAG | `FAISS (CPU)` / `HNSWLib` | **`cuVS` / `RAFT`** |\n\n### Bảng 5: Phân biệt Bộ Công cụ Phần mềm \u0026 Phần cứng trong Hệ sinh thái NVIDIA (Module 8 \u0026 9)\n| Công cụ NVIDIA | Vai trò cốt lõi cần nhớ | Từ khóa nhận diện trong câu hỏi |\n| :--- | :--- | :--- |\n| **CUDA** | Nền tảng lập trình tính toán song song trên GPU | Cho phép C/C++/Python điều khiển trực tiếp các nhân GPU (Thread/Warp/Block/Grid); hỗ trợ cả bộ nhớ pageable và pinned (page-locked) cho DMA tốc độ cao. |\n| **`nvidia-smi`** | Tiện ích dòng lệnh (CLI) giám sát GPU | Xem GPU Utilization %, VRAM usage (chẩn đoán OOM), nhiệt độ, công suất điện, PID. |\n| **NVIDIA MIG** | Chia 1 GPU vật lý thành tối đa **7 thực thể GPU độc lập** (trên các dòng GPU trung tâm dữ liệu được hỗ trợ như A100/H100/B200) | Cách ly phần cứng (VRAM, Cache, SM) cho nhiều tác vụ nhỏ chạy chung 1 GPU; số lượng và cấu hình phụ thuộc vào từng mã GPU. |\n| **Grace CPU** | CPU máy chủ **72 nhân Arm** của NVIDIA | Kết nối với GPU Hopper/Blackwell qua **NVLink-C2C (900 GB/s)**, bộ nhớ hợp nhất. |\n| **NVIDIA TensorRT / TensorRT-LLM** | SDK/Trình biên dịch \u0026 Tối ưu hóa **Suy luận (Inference Optimizer)** | Gộp tầng (**Layer Fusion**), tối ưu độ chính xác (**FP16/BF16/FP8/INT8/INT4**), **In-flight Batching**, **PagedAttention**. |\n| **ONNX** | Định dạng chuẩn mở trung gian giữa các Framework | Hỗ trợ tính tương thích (**Interoperability**) khi các toán tử/opset được Runtime đích hỗ trợ; cần kiểm thử lại sai số và độ trễ sau khi xuất. |\n| **NVIDIA NeMo** | Framework xây dựng, huấn luyện \u0026 tùy biến **LLM / GenAI** | **Curator** (làm sạch/dedupe data), **Megatron** (train phân tán), **Customizer** (LoRA/SFT/DPO), **Retriever** (RAG), **Evaluator**. |\n| **NVIDIA Triton** | **Phần mềm Máy chủ Suy luận (Inference Server)** | Phục vụ mô hình qua **HTTP/gRPC**, hỗ trợ **đa framework**, chạy cả GPU \u0026 CPU, có **Dynamic Batching** \u0026 **Concurrent Execution**. |\n| **NVIDIA NIM** | **Container Microservices suy luận đóng gói sẵn** | Đóng gói sẵn Model + Engine suy luận tối ưu (như TensorRT-LLM/Triton) + **REST API tương thích chuẩn OpenAI cho các endpoint hỗ trợ**. |\n| **NVIDIA Base Command** | Nền tảng quản trị \u0026 điều phối cụm huấn luyện AI lớn | Lập lịch job (Slurm/K8s), phân bổ tài nguyên GPU, giám sát cụm DGX SuperPOD. |\n| **NVIDIA NGC** | Kho lưu trữ **Docker Containers \u0026 Pre-trained Models** | Tải container đã đóng gói sẵn CUDA, Driver, Framework tối ưu hóa. |\n| **GPU Operator** | Quản lý tự động GPU trên cụm **Kubernetes (K8s)** | Tự động cài Driver, Container Toolkit, Device Plugin cho các node K8s. |\n| **Confidential Computing** | Bảo mật dữ liệu cấp độ **Phần cứng GPU (Hopper/Blackwell)** | Bảo vệ dữ liệu và mô hình đang xử lý (**Data in Use**) trong **Hardware-based TEE** theo mô hình mối đe dọa xác định (kết hợp xác thực từ xa và quản lý khóa). |\n| **NeMo Guardrails** | Bộ lọc rào chắn **An toàn cho ứng dụng LLM (Safety)** | **5 loại Rails (Input/Dialog/Retrieval/Execution/Output)**, ngôn ngữ **Colang**, kết hợp bộ phân loại ngữ nghĩa/Embedding. |\n| **NVIDIA Garak** | Công cụ quét lỗ hổng LLM tự động (**Red Teaming**) | Tự động bắn các câu lệnh tấn công (Prompt Injection, Jailbreak) để kiểm tra độ an toàn của LLM. |\n\n### Bảng 6: Hạ tầng Mạng, Song song hóa \u0026 Lưu trữ trong AI Data Center (Module 1)\n| Thành phần Hạ tầng | Giải pháp Chuẩn cho AI | Lý do chọn |\n| :--- | :--- | :--- |\n| **Kết nối GPU trong cùng 1 máy chủ (Intra-node)** | **NVLink \u0026 NVSwitch** | Băng thông cực đại (900 GB/s – 1.8 TB/s) nối trực tiếp giữa các GPU trong cùng 1 node (phù hợp cho **Tensor Parallelism**). |\n| **Mạng liên kết giữa các máy chủ GPU (Inter-node)** | **InfiniBand (hoặc Spectrum-X) + GPUDirect RDMA** | GPU giữa các máy chủ đọc/ghi trực tiếp vào VRAM của nhau qua mạng, giảm trung gian qua CPU, độ trễ micro-giây. |\n| **Lưu trữ dữ liệu đang Train tốc độ cao** | **Local NVMe SSD + GPUDirect Storage (GDS)** | Đường truyền DMA thẳng từ ổ cứng NVMe/Parallel FS vào VRAM GPU không qua CPU Bounce Buffer. |\n| **Lưu trữ dữ liệu Train dùng chung cho cụm trăm Node** | **Parallel File System** (Lustre, GPFS, WEKA) | Cho phép hàng trăm máy chủ GPU đọc/ghi song song cùng lúc hạn chế nghẽn cổ chai. |\n| **Lưu trữ Code, Scripts, Configs nhẹ** | **NFS (Network File System)** | Chia sẻ file cấu hình và mã nguồn đơn giản qua mạng. |\n| **Lưu trữ Raw Data, Backups, Checkpoints cũ dài hạn** | **Object Storage** (AWS S3, GCS, Ceph) | Dung lượng mở rộng linh hoạt, chi phí lưu trữ Cold Data thấp. |\n\n### Bảng 7: Phân biệt các Định dạng Số học (Numerical Precisions) trong AI (Module 1 \u0026 7)\n| Định dạng | Số Bit | Đặc điểm nhận diện cốt lõi trong đề thi |\n| :--- | :---: | :--- |\n| **`FP32`** | 32-bit | Độ chính xác đơn chuẩn truyền thống (4 bytes/param); tốn nhiều VRAM nhất. |\n| **`TF32`** | 19-bit | Định dạng mặc định trên Tensor Cores (từ Ampere A100) giúp tăng tốc phép nhân ma trận FP32 tự động. |\n| **`FP16`** | 16-bit | Giảm 50% VRAM so với FP32 nhưng chỉ có 5-bit số mũ nên dải giá trị hẹp, dễ bị tràn số dưới/trên (Underflow/Overflow), thường cần Loss Scaling. |\n| **`BF16` (Bfloat16)** | 16-bit | **Rất phổ biến để huấn luyện LLM!** Có **8-bit số mũ giống `FP32`** nên dải động rộng hơn hẳn `FP16`, giảm đáng kể nguy cơ tràn số đạo hàm (dù độ chính xác phần định trị 7-bit thấp hơn `FP16` và các phép cộng tích lũy nhạy cảm vẫn thường giữ ở `FP32`). |\n| **`FP8`** | 8-bit | Được tăng tốc bởi **Transformer Engine** trên GPU **Hopper (H100)** và **Blackwell (B200)**, tăng thông lượng tính toán so với 16-bit. |\n| **`INT8` / `INT4` (`NF4`)** | 8 / 4-bit | Chuẩn **Lượng tử hóa (Quantization)** để giảm dung lượng bộ nhớ (khoảng $4\\times$–$8\\times$ so với `FP32` cho các trọng số được lượng tử hóa) hoặc dùng trong **QLoRA (`NF4`)**. |\n\n### Bảng 8: Chẩn đoán \u0026 Khắc phục Lỗi Huấn luyện Mạng Nơ-ron (Module 2, 7 \u0026 10)\n| Triệu chứng gặp phải khi Train | Chẩn đoán Bệnh | Hướng xử lý chuẩn kỹ thuật |\n| :--- | :--- | :--- |\n| `Training Loss` rất thấp ($\\approx 0$), nhưng `Validation Loss` tăng vọt cao | **Overfitting (Học vẹt / High Variance)** | Thêm dữ liệu, **Data Augmentation**, bật **Dropout**, thêm **L2 Weight Decay**, kích hoạt **Early Stopping**. |\n| Cả `Training Loss` và `Validation Loss` đều rất cao, không giảm | **Underfitting (Học chưa tới / High Bias)** | Tăng dung lượng mô hình (thêm tầng/tham số), huấn luyện thêm **Epochs**, giảm bớt Regularization, bổ sung đặc trưng. |\n| Hàm `Loss` dao động mạnh hoặc biến thành `NaN` ngay đầu buổi train | **Learning Rate quá cao** hoặc **Exploding Gradients** | **Giảm Learning Rate**, dùng **Learning Rate Warmup**, áp dụng **Gradient Clipping** và **Layer Normalization**. |\n| Các tầng đầu tiên của mạng sâu không cập nhật được trọng số (đạo hàm $\\approx 0$) | **Vanishing Gradients (Triệt tiêu đạo hàm)** | Đổi hàm kích hoạt bão hòa (Sigmoid) sang **ReLU / GELU / SwiGLU** và thêm **Skip / Residual Connections ($y = F(x) + x$)**. |\n| Mô hình chạy tốt lúc mới deploy nhưng giảm dần độ chính xác sau 6 tháng | **Data Drift** (đầu vào đổi) hoặc **Concept Drift** (quy luật đổi) | Thiết lập **Continuous Monitoring** và huấn luyện lại định kỳ (**Retraining / Continuous Learning**) trên dữ liệu mới. |\n\n### Bảng 9: Phân loại Thuật toán ML Cổ điển \u0026 Hàm Kích hoạt / Hàm Mất mát (Module 2 \u0026 10)\n| Thành phần / Thuật toán | Phân loại \u0026 Chức năng cần nhớ |\n| :--- | :--- |\n| **PCA (Principal Component Analysis)** | **Unsupervised Learning $\\to$ Giảm chiều dữ liệu (Dimensionality Reduction):** Nén nhiều cột đặc trưng xuống các thành phần chính giữ nhiều phương sai nhất. |\n| **K-Means \u0026 DBSCAN** | **Unsupervised Learning $\\to$ Phân cụm (Clustering):** Chia dữ liệu không nhãn thành các nhóm tương đồng (DBSCAN nhận diện được cụm hình dạng bất kỳ và điểm nhiễu Outlier). |\n| **Linear Regression + MSE Loss** | **Supervised Learning $\\to$ Hồi quy (Regression):** Dự đoán con số thực liên tục (giá nhà, doanh thu). |\n| **Logistic Regression + Sigmoid + Cross-Entropy** | **Supervised Learning $\\to$ Phân loại nhị phân (Binary Classification):** Đầu ra xác suất thuộc lớp $(0, 1)$. |\n| **Random Forest (Bagging)** | Huấn luyện nhiều cây quyết định **song song độc lập** $\\to$ Giảm phương sai (**Reduce Variance / Giảm Overfitting**). |\n| **XGBoost / Gradient Boosting (Boosting)** | Huấn luyện các cây quyết định **nối tiếp tuần tự** (cây sau sửa lỗi cây trước) $\\to$ Giảm độ chệch (**Reduce Bias**). |\n| **ReLU / GELU / SwiGLU** | Hàm kích hoạt đặt ở **Tầng ẩn (Hidden Layers)** giúp tính toán hiệu quả và giảm Vanishing Gradients. |\n| **Softmax + Cross-Entropy Loss** | Đặt ở **Tầng đầu ra (Output Layer)** của phân loại đa lớp và dự đoán phân phối xác suất từ vựng trong **LLM**. |\n\n### Bảng 10: Thiết kế Thực nghiệm, Trực quan hóa Dữ liệu \u0026 Chống Rò rỉ Dữ liệu (Module 11)\n| Chủ đề / Tình huống trong đề thi | Nguyên tắc Kỹ thuật Cốt lõi | Bẫy thường gặp cần tránh |\n| :--- | :--- | :--- |\n| **Kiểm định giả thuyết \u0026 A/B Testing** | Đặt **$H_0$** (không có khác biệt), **$H_1$** (có cải thiện), giữ cố định các biến ngoại lai (**Confounding Variables**), chỉ thay đổi **1 biến độc lập** khi so với **Baseline / Control**. | Thay đổi cùng lúc cả Prompt, Retriever lẫn Model rồi kết luận do Model tốt hơn; hoặc chỉ nhìn $p \u003c 0.05$ mà bỏ qua **Practical Significance** (độ trễ, chi phí). |\n| **Ablation Study (Nghiên cứu loại bỏ)** | Gỡ bỏ từng thành phần một (VD: tắt Reranker, tắt Hybrid Search) để đo đóng góp thực tế của thành phần đó. | Thêm/bớt nhiều mô-đun cùng lúc khiến không biết thành phần nào tạo ra cải thiện. |\n| **Thống kê mô tả khi dữ liệu lệch (Skewed) / có Outliers** | Dùng **Median (Trung vị)** và **IQR ($Q_3 - Q_1$)** cùng biểu đồ **Box Plot** (cận râu chuẩn: $[Q_1 - 1.5 \\times \\text{IQR}, Q_3 + 1.5 \\times \\text{IQR}]$). | Dùng **Mean (Trung bình cộng)** làm đại diện cho độ trễ API hoặc thu nhập khi có vài điểm cực đoan kéo lệch. |\n| **Chọn biểu đồ trực quan hóa** | Phân phối 1 biến: **Histogram**; So sánh trung vị \u0026 Outliers nhiều nhóm: **Box Plot**; Quan hệ 2 biến số: **Scatter Plot**; Ma trận tương quan / Confusion Matrix / Attention: **Heatmap**. | Nhầm lẫn **Correlation (Tương quan)** trên Scatter Plot/Heatmap thành **Causation (Nhân quả)** hoặc bỏ qua **Simpson\u0027s Paradox**. |\n| **Chống Data Leakage trong Tiền xử lý \u0026 Cross-Validation** | Luôn chia **Train / Val / Test TRƯỚC**, sau đó chỉ `.fit()` bộ `StandardScaler` / `Imputer` / `Tokenizer` trên **Train** (hoặc bọc trong `sklearn.pipeline.Pipeline`). | Gọi `scaler.fit_transform(X)` hoặc chạy **SMOTE** trên toàn bộ tập dữ liệu trước khi `train_test_split` / `cross_val_score`. |\n| **Chia dữ liệu Thời gian \u0026 Theo nhóm thực thể** | Chuỗi thời gian $\\to$ **Time-based Split** (`TimeSeriesSplit`); Nhiều mẫu cùng 1 bệnh nhân/user $\\to$ **Group Split** (`GroupKFold`). | Dùng `random_state` chia ngẫu nhiên làm rò rỉ tương lai vào quá khứ hoặc cùng 1 bệnh nhân nằm ở cả Train và Test. |\n\n---\n\n## 3. Bộ 30 Câu Hỏi Luyện Tập Nhanh (30-Question NCA-GENL Practice Test - Short Mock Exam)\n\nHãy tự làm 30 câu hỏi trắc nghiệm luyện tập nhanh dưới đây (bao phủ toàn bộ 5 Miền kiến thức) trước khi chuyển sang **Đề Thi Thử Định Giờ 50 Câu (Mục 4)**:\n\n---\n\n### PHẦN A: CORE MACHINE LEARNING \u0026 AI KNOWLEDGE (30% - Câu 1 đến Câu 9)\n\n#### Câu 1 (Module 1 - AI Infrastructure):\nKhi huấn luyện phân tán một mô hình ngôn ngữ lớn trên cụm 32 máy chủ DGX, công nghệ nào cho phép một GPU trên máy chủ A đọc và ghi trực tiếp vào bộ nhớ VRAM của một GPU trên máy chủ B thông qua mạng InfiniBand mà không cần sự can thiệp của CPU hay System RAM hệ thống?\n* **A.** NVIDIA Container Toolkit\n* **B.** GPUDirect RDMA\n* **C.** Memory Pooling\n* **D.** Network File System (NFS)\n\u003e **Đáp án đúng: B (`GPUDirect RDMA`)**. *Giải thích:* GPUDirect RDMA kết hợp với mạng InfiniBand cho phép truyền dữ liệu trực tiếp từ VRAM của GPU node này sang VRAM của GPU node khác qua mạng mà bỏ qua hoàn toàn CPU và System RAM, hạ độ trễ xuống micro-giây.\n\n#### Câu 2 (Module 1 - Distributed Parallelism):\nMột mô hình LLM có kích thước một tầng đơn lẻ (single layer) quá lớn không thể nằm vừa trong bộ nhớ VRAM của một GPU. Kỹ sư quyết định chia nhỏ các ma trận trọng số bên trong chính tầng đó ra nhiều GPU nằm trong cùng một máy chủ thông qua kết nối NVLink. Chiến lược song song hóa nào đang được sử dụng?\n* **A.** Data Parallelism\n* **B.** Pipeline Parallelism\n* **C.** Tensor Parallelism\n* **D.** k-Fold Parallelism\n\u003e **Đáp án đúng: C (`Tensor Parallelism`)**. *Giải thích:* Tensor Parallelism (Intra-layer parallelism) cắt ma trận trọng số của cùng một tầng chia cho nhiều GPU tính toán song song qua kết nối băng thông cao NVLink. Pipeline Parallelism chia các tầng khác nhau (Inter-layer), còn Data Parallelism chia nhỏ lô dữ liệu.\n\n#### Câu 3 (Module 2 - AI/ML Fundamentals):\nMột nhà khoa học dữ liệu có một tập dữ liệu khách hàng gồm 800 cột đặc trưng (features) không có nhãn và muốn giảm xuống còn 20 cột quan trọng nhất để tăng tốc độ huấn luyện trong khi vẫn giữ lại tối đa lượng thông tin (phương sai) của dữ liệu gốc. Kỹ thuật nào nên được sử dụng?\n* **A.** K-Means Clustering\n* **B.** Logistic Regression\n* **C.** Principal Component Analysis (PCA)\n* **D.** Named Entity Recognition (NER)\n\u003e **Đáp án đúng: C (`PCA`)**. *Giải thích:* PCA là thuật toán học không giám sát chuyên dùng để giảm chiều dữ liệu (Dimensionality Reduction) trong khi bảo toàn phương sai lớn nhất. K-Means dùng để phân cụm các dòng dữ liệu chứ không giảm số cột đặc trưng.\n\n#### Câu 4 (Module 2 - Ensemble Learning):\nĐâu là sự khác biệt chính xác nhất giữa phương pháp **Bagging (như Random Forest)** và **Boosting (như XGBoost)** trong học máy?\n* **A.** Bagging chỉ dùng cho xử lý ảnh, còn Boosting chỉ dùng cho xử lý âm thanh.\n* **B.** Bagging huấn luyện nhiều mô hình song song độc lập trên các tập con ngẫu nhiên để giảm phương sai (Variance), trong khi Boosting huấn luyện các mô hình nối tiếp tuần tự để mô hình sau sửa lỗi cho mô hình trước nhằm giảm độ chệch (Bias).\n* **C.** Bagging là học không giám sát, còn Boosting là học tăng cường.\n* **D.** Bagging không cần dữ liệu có nhãn, còn Boosting bắt buộc phải dùng GPU Blackwell.\n\u003e **Đáp án đúng: B**. *Giải thích:* Random Forest (Bagging) xây các cây độc lập song song rồi lấy phiếu bầu đa số để chống Overfitting (giảm Variance); XGBoost (Boosting) xây các cây nối tiếp nhau sửa sai số dư để giảm Bias.\n\n#### Câu 5 (Module 3 - Generative AI \u0026 LLM):\nTại sao kiến trúc **Transformer** lại có khả năng tận dụng sức mạnh tính toán của GPU tốt hơn rất nhiều so với mạng hồi quy **RNN/LSTM** khi **huấn luyện (training)** trên văn bản dài?\n* **A.** Vì Transformer không sử dụng hàm kích hoạt phi tuyến.\n* **B.** Vì trong quá trình huấn luyện, Transformer loại bỏ sự phụ thuộc tuần tự theo thời gian giữa các bước ẩn của RNN và tính toán trên toàn bộ các vị trí token trong chuỗi song song cùng lúc nhờ cơ chế Self-Attention.\n* **C.** Vì Transformer chỉ chạy trên CPU Grace mà không cần VRAM.\n* **D.** Vì Transformer sử dụng từ điển Whole-word thay vì Subword.\n\u003e **Đáp án đúng: B**. *Giải thích:* RNN phải tính tuần tự trạng thái ẩn bước $t-1$ xong mới tính được bước $t$, gây nghẽn cổ chai trên GPU. Khi **huấn luyện**, Transformer nạp toàn bộ chuỗi đã biết và thực hiện phép nhân ma trận Self-Attention song song qua các vị trí token trên GPU (lưu ý: khi suy luận sinh văn bản tự hồi quy, pha Decode vẫn sinh từng token nối tiếp nhau).\n\n#### Câu 6 (Module 3 - Word Embeddings):\nTrong hai kiến trúc của thuật toán nhúng từ **Word2Vec**, sự khác biệt giữa **CBOW (Continuous Bag of Words)** và **Skip-gram** là gì?\n* **A.** CBOW sử dụng các từ ngữ cảnh xung quanh để dự đoán từ đích ở chính giữa, trong khi Skip-gram sử dụng từ đích ở chính giữa để dự đoán các từ ngữ cảnh xung quanh.\n* **B.** CBOW là mô hình tạo ảnh, còn Skip-gram là mô hình dịch máy.\n* **C.** CBOW sử dụng kiến trúc Transformer, còn Skip-gram sử dụng kiến trúc Diffusion.\n* **D.** Không có sự khác biệt nào giữa hai kiến trúc này.\n\u003e **Đáp án đúng: A**. *Giải thích:* CBOW nhìn ngữ cảnh xung quanh đoán từ trung tâm (nhanh, tốt cho từ phổ biến); Skip-gram nhìn 1 từ trung tâm đoán các từ xung quanh (biểu diễn từ hiếm tốt hơn).\n\n#### Câu 7 (Module 4 - Transformer Architecture):\nTrong cơ chế **Scaled Dot-Product Self-Attention** của Transformer, để tính toán mức độ liên kết ngữ cảnh giữa các từ trong câu, mô hình thực hiện phép nhân tích vô hướng chuẩn hóa giữa hai thành phần nào trước khi đưa qua hàm Softmax và nhân với vector **Value ($V$)**?\n* **A.** Giữa vector Embedding và vector Positional Encoding.\n* **B.** Giữa vector **Query ($Q$)** và chuyển vị của vector **Key ($K^T$)** chia cho $\\sqrt{d_k}$.\n* **C.** Giữa hàm ReLU và hàm Sigmoid.\n* **D.** Giữa trọng số của Encoder và hàm mất mát MSE.\n\u003e **Đáp án đúng: B**. *Giải thích:* Công thức chuẩn là $\\text{Attention}(Q,K,V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$.\n\n#### Câu 8 (Module 10 - Deep Learning Mechanics):\nKhi huấn luyện một mạng nơ-ron sâu với hàng chục tầng ẩn, kỹ thuật nào giúp chuẩn hóa đầu ra của mỗi tầng về phân phối có giá trị trung bình bằng $0$ và độ lệch chuẩn bằng $1$, từ đó giữ cho quá trình huấn luyện kiến trúc Transformer ổn định và hội tụ hiệu quả?\n* **A.** Subword Tokenization\n* **B.** Layer Normalization (LayerNorm)\n* **C.** Reverse Diffusion\n* **D.** Regular Expressions (Regex)\n\u003e **Đáp án đúng: B (`Layer Normalization`)**. *Giải thích:* Layer Normalization quy chuẩn hóa các giá trị kích hoạt trong từng tầng về phân phối chuẩn ($\\mu = 0, \\sigma = 1$), giảm hiện tượng dao động số học cực đoan giữa các tầng trong mạng Transformer.\n\n#### Câu 9 (Module 10 - Diffusion Models):\nTrong kiến trúc mô hình Khuếch tán (**Diffusion Models**) dùng để tạo ảnh từ văn bản (như Stable Diffusion), điều gì diễn ra trong pha **Reverse Diffusion (Khuếch tán ngược)**?\n* **A.** Mô hình bắt đầu từ một bức ảnh thật sắc nét và cộng thêm nhiễu Gaussian cho đến khi ảnh biến thành nhiễu hoàn toàn.\n* **B.** Mô hình bắt đầu từ một khung hình nhiễu ngẫu nhiên hoàn toàn và khử bỏ từng lớp nhiễu nhỏ qua từng bước lặp dưới sự dẫn dắt của Text Prompt để tạo ra bức ảnh mới sắc nét.\n* **C.** Mô hình cắt văn bản thành các mảnh subword bằng thuật toán BPE.\n* **D.** Mô hình chuyển đổi bảng dữ liệu Pandas sang `cuDF`.\n\u003e **Đáp án đúng: B**. *Giải thích:* Forward Diffusion là quá trình cộng thêm nhiễu vào ảnh gốc (lúc train), còn **Reverse Diffusion** là quá trình khử nhiễu từng bước từ màn hình nhiễu ngẫu nhiên để sinh ra bức ảnh mới (lúc inference).\n\n---\n\n### PHẦN B: SOFTWARE DEVELOPMENT (24% - Câu 10 đến Câu 16)\n\n#### Câu 10 (Module 6 - RAG Architecture):\nMột doanh nghiệp thương mại điện tử muốn xây dựng trợ lý AI trả lời cho khách hàng về tình trạng tồn kho và giá khuyến mãi thay đổi theo từng giờ, đồng thời cần đính kèm đường link dẫn nguồn tới trang sản phẩm mà không muốn tốn chi phí huấn luyện lại mô hình. Giải pháp nào tối ưu nhất?\n* **A.** Full Fine-Tuning mô hình mỗi giờ.\n* **B.** Huấn luyện một Foundation Model mới từ đầu (Training from scratch).\n* **C.** Retrieval-Augmented Generation (RAG) kết hợp cơ sở dữ liệu Vector.\n* **D.** Knowledge Distillation từ mô hình nhỏ sang mô hình lớn.\n\u003e **Đáp án đúng: C (`RAG`)**. *Giải thích:* RAG cho phép truy xuất dữ liệu mới nhất theo thời gian thực từ kho dữ liệu bên ngoài để bổ sung vào Prompt mà không cần thay đổi trọng số mô hình, đồng thời giảm ảo giác và cung cấp trích dẫn nguồn rõ ràng.\n\n#### Câu 11 (Module 7 - ONNX vs. TensorRT):\nSự khác biệt cốt lõi giữa chuẩn định dạng **ONNX** và bộ công cụ **NVIDIA TensorRT** trong quy trình triển khai mô hình là gì?\n* **A.** ONNX chỉ chạy trên GPU NVIDIA, còn TensorRT chạy được trên mọi loại CPU.\n* **B.** ONNX tập trung vào khả năng tương thích và trao đổi mô hình (Interoperability) giữa các framework được hỗ trợ, trong khi TensorRT tập trung vào việc tối ưu hóa hiệu năng suy luận (Layer fusion, Kernel auto-tuning, Quantization) chuyên sâu trên GPU NVIDIA.\n* **C.** ONNX dùng để làm sạch dữ liệu văn bản, còn TensorRT dùng để thu thập dữ liệu.\n* **D.** Cả hai đều là phần cứng mạng thay thế cho InfiniBand.\n\u003
